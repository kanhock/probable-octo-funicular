rror":null,"truncated":false},"deep":"Почти весь синтаксис Python — это вызовы протоколов:\n\n| Синтаксис | Метод |\n|---|---|\n| `x in obj` | `__contains__` (иначе перебор через `__iter__`) |\n| `if obj:` | `__bool__`, иначе `__len__` |\n| `hash(obj)`, ключ dict | `__hash__` |\n| `with obj:` | `__enter__` / `__exit__` |\n| `obj.attr` | `__getattribute__` / `__getattr__` |\n| `del obj[k]` | `__delitem__` |\n\nПравило для `__hash__`: равные объекты обязаны иметь равные хеши, а хеш не должен меняться, пока объект лежит в set или dict.","pitfalls":["Хеш, зависящий от изменяемых полей: после изменения объект «теряется» в множестве.","`__bool__`, возвращающий не bool — `TypeError`."],"links":["11-4","18-1","2-6"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","None"],"answer":0,"why":"Без `__contains__` оператор `in` перебирает объект через `__iter__`.","code":"class Box:\n    def __iter__(self):\n        return iter([1, 2, 3])\nprint(2 in Box())"},{"q":"Какое правило обязательно для `__hash__`?","options":["Хеш должен быть уникальным","Равные объекты должны иметь равные хеши","Хеш должен быть положительным","Хеш должен меняться при изменении объекта"],"answer":1,"why":"Иначе dict и set не найдут равный ключ."}]}],"zone":10,"world":{"name":"Пульт синтаксиса","hue":262,"kind":"engine","intro":"Каждая кнопка синтаксиса (`print`, `len`, `[]`, `for`, `==`, `+`, `()`) проводом подключена к dunder-методу.","why":"Зная эти провода, ты сделаешь свои объекты такими же удобными, как встроенные.","spots":{"__str__":[null,"Кнопка `print(obj)` → провод к `__str__`: красивый текст для людей."],"__repr__":[null,"Окно отладчика → `__repr__`: точное описание для программиста."],"__len__":[null,"Кнопка `len(obj)` → `__len__`."],"__getitem__":[null,"Кнопка `obj[k]` → `__getitem__`: достать по ключу или индексу."],"__setitem__":[null,"Кнопка `obj[k] = v` → `__setitem__`: положить по ключу."],"__iter__":[null,"Рычаг `for` → `__iter__`: получить итератор."],"__next__":[null,"Счётчик шагов цикла → `__next__`: следующий элемент или StopIteration."],"__eq__":[null,"Кнопка `==` → `__eq__`."],"__lt__":[null,"Кнопка `<` → `__lt__`. Этого хватает для `sorted()`."],"__add__":[null,"Кнопка `+` → `__add__`."],"__call__":[null,"Кнопка `obj()` → `__call__`: объект можно вызывать как функцию."],"...":["ещё…","Пучок других проводов: `in` → `__contains__`, `if` → `__bool__`, `hash` → `__hash__` и десятки других."]}}},{"title":"Дескрипторы","items":["__get__","__set__","__delete__","property","descriptor protocol"],"intro":"Механизм, который стоит за `property`, методами, `classmethod` и `staticmethod`. Дескриптор — объект в классе, который перехватывает чтение, запись и удаление атрибута.","lessons":[{"title":"Протокол дескрипторов","covers":["descriptor protocol","__get__","__set__","__delete__"],"text":"Если в **классе** лежит объект с методами `__get__`, `__set__` или `__delete__`, он становится **дескриптором**. Теперь обращение `obj.attr` не просто читает значение, а вызывает `Descriptor.__get__(obj, type)`; присваивание `obj.attr = v` — `__set__(obj, v)`; `del obj.attr` — `__delete__(obj)`.\n\nЭто и есть **descriptor protocol**. Ниже дескриптор `Positive` проверяет, что значение положительное, и его можно переиспользовать для разных полей.","code":"class Positive:\n    def __set_name__(self, owner, name):\n        self.name = \"_\" + name\n\n    def __get__(self, obj, objtype=None):\n        return getattr(obj, self.name, 0)\n\n    def __set__(self, obj, value):\n        if value <= 0:\n            raise ValueError(f\"{self.name[1:]} должно быть > 0\")\n        setattr(obj, self.name, value)\n\n    def __delete__(self, obj):\n        print(\"Удаляем\", self.name)\n        delattr(obj, self.name)\n\nclass Product:\n    price = Positive()\n    weight = Positive()\n\np = Product()\np.price = 250\nprint(p.price)\ntry:\n    p.weight = -1\nexcept ValueError as e:\n    print(e)\ndel p.price","key":["Дескриптор — объект в классе с `__get__`/`__s "__set_name__",["r",1]],["__get__",["r",2]],["__set__",["r",3]],["__delete__",["r",4]]]},{"name":"глобальная область","vars":[["Positive",["r",5]]]},{"name":"Product()","vars":[]},{"name":"тело класса Product","vars":[]},{"name":"тело класса Product","vars":[["price",["r",6]]]},{"name":"тело класса Product","vars":[["price",["r",6]],["weight",["r",7]]]},{"name":"__set_name__()","vars":[["self",["r",6]],["owner",["r",8]],["name",["p","'price'"]]]},{"name":"__set_name__()","vars":[["self",["r",7]],["owner",["r",8]],["name",["p","'weight'"]]]},{"name":"глобальная область","vars":[["Positive",["r",5]],["Product",["r",8]]]},{"name":"глобальная область","vars":[["Positive",["r",5]],["Product",["r",8]],["p",["r",9]]]},{"name":"__set__()","vars":[["self",["r",6]],["obj",["r",9]],["value",["p","250"]]]},{"name":"__get__()","vars":[["self",["r",6]],["obj",["r",9]],["objtype",["r",8]]]},{"name":"__set__()","vars":[["self",["r",7]],["obj",["r",9]],["value",["p","-1"]]]},{"name":"глобальная область","vars":[["Positive",["r",5]],["Product",["r",8]],["p",["r",9]],["e",["r",10]]]},{"name":"__delete__()","vars":[["self",["r",6]],["obj",["r",9]]]}],"out":"250\nweight должно быть > 0\nУдаляем _price\n","error":null,"truncated":false},"deep":"Дескрипторы бывают двух видов:\n- **дескриптор данных** — определяет `__set__` или `__delete__` (например, `property`). Он **сильнее** словаря экземпляра;\n- **дескриптор не-данных** — только `__get__` (например, обычные функции). Его можно «заслонить» атрибутом экземпляра.\n\nПолный порядок для `obj.x`: дескриптор данных в классе → `obj.__dict__` → дескриптор не-данных или обычный атрибут класса → `__getattr__`.\n\n`__set_name__(owner, name)` (Python 3.6+) вызывается при создании класса и сообщает дескриптору имя, под которым он записан, — больше не нужно передавать имя вручную.","pitfalls":["Хранить значение в самом дескрипторе (`self.value = v`) — оно станет общим для всех экземпляров.","Ждать, что дескриптор сработает, если положить его в экземпляр, а не в класс."],"links":["12-2","5-3","13-1"],"checks":[{"q":"Что напечатает код?","options":["1 1","1 2","2 2","Ошибка"],"answer":2,"why":"Значение хранится в самом дескрипторе, а он один на класс, поэтому оба объекта видят последнее присвоенное.","code":"class Bad:\n    def __get__(self, obj, t=None):\n        return self.v\n    def __set__(self, obj, v):\n        self.v = v\nclass A:\n    x = Bad()\na, b = A(), A()\na.x = 1\nb.x = 2\nprint(a.x, b.x)"},{"q":"Чем дескриптор данных отличается от дескриптора не-данных?","options":["Ничем","У дескриптора данных есть `__set__` или `__delete__`, и он приоритетнее `__dict__` экземпляра","Дескриптор данных хранит только числа","Дескриптор не-данных работает быстрее"],"answer":1,"why":"Наличие `__set__`/`__delete__` делает дескриптор приоритетнее атрибутов экземпляра."}]},{"title":"property — готовый дескриптор","covers":["property"],"text":"`property` — встроенный дескриптор, который вызывает твои функции при чтении и записи атрибута. Поэтому `obj.area` выглядит как поле, а на деле вызывает метод.\n\nДаже обычные методы работают через дескрипторы: функция в классе имеет `__get__`, который и превращает её в «привязанный метод» с `self`. Проверим это в коде.","code":"class Rect:\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n\n    @property\n    def area(self):\n        return self.w * self.h\n\n    def describe(self):\n        return f\"{self.w}×{self.h}\"\n\nr = Rect(3, 4)\nprint(r.area)\nr.w = 10\nprint(r.area)\nprint(type(Rect.__dict__[\"area\"]).__name__)\nprint(hasattr(Rect.__dict__[\"describe\"], \"__get__\"))","key":["`property` — это дескриптор.","Методы — тоже дескрипторы (функции имеют `__get__`).","Подробнее про property — в разделе 13."],"id":"12-2","narr":{"6":"Вычисляется при каждом чтении","13":"Без скобок — но вызывается функция","15":"Пересчиталось автоматически","16":"В классе лежит объект property","17":"У функции тоже есть __get__!"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[] 4"]]]},{"name":"глобальная область","vars":[["Rect",["r",4]],["r",["r",5]]]},{"name":"area()","vars":[["self",["r",5]]]}],"out":"12\n40\nproperty\nTrue\n","error":null,"truncated":false},"deep":"`property` — класс-дескриптор данных, написанный на C. Он хранит три функции: `fget`, `fset`, `fdel`. Запись `@x.setter` создаёт **новый** объект property с теми же `fget` и добавленным `fset` — поэтому все три функции обязаны называться одинаково.\n\nФункции — дескрипторы не-данных: их `__get__` создаёт привязанный метод. Поэтому атрибут экземпляра с именем метода заслонит метод:\n```\nclass A:\n    def hi(self): return \"метод\"\na = A()\na.hi = lambda: \"атрибут\"\nprint(a.hi())   # атрибут\n```","pitfalls":["Назвать сеттер иначе, чем геттер, — получится два разных property.","Случайно заслонить метод атрибутом экземпляра с тем же именем."],"links":["13-1","12-1","6-4"],"checks":[{"q":"Что напечатает код?","options":["метод","атрибут","Ошибка","None"],"answer":1,"why":"Функция — дескриптор не-данных, атрибут экземпляра его заслоняет.","code":"class A:\n    def hi(self):\n        return 'метод'\na = A()\na.hi = lambda: 'атрибут'\nprint(a.hi())"},{"q":"Какой объект лежит в классе под именем свойства, объявленного через @property?","options":["Функция","Объект property (дескриптор)","Значение свойства","Строка с именем"],"answer":1,"why":"`@property` превращает функцию в объект-дескриптор property."}]}],"zone":11,"world":{"name":"Пропускной пункт","hue":176,"kind":"engine","intro":"В классе стоит пост охраны-дескриптор: каждое чтение, запись и удаление атрибута проходит через него.","why":"Дескрипторы — механизм, на котором держатся property, методы, classmethod и staticmethod.","spots":{"__get__":[null,"Окно выдачи: охранник отдаёт значение, когда читают `obj.price`."],"__set__":[null,"Входная рамка: при `obj.price = v` охранник проверяет значение (например, > 0)."],"__delete__":[null,"Шредер: срабатывает на `del obj.price`."],"property":[null,"Готовый типовой пост: встроенный дескриптор, которому дают три функции."],"descriptor protocol":["descriptor protocol","Устав поста: если в классе лежит объект с `__get__`/`__set__`/`__delete__`, доступ идёт через него."]}}},{"title":"Property","items":["getter","setter","deleter","управление доступом к атрибутам"],"intro":"Как сделать атрибут, который выглядит как обычное поле, но под капотом проверяет, вычисляет или защищает данные.","lessons":[{"title":"getter и setter","covers":["getter","setter"],"text":"`@property` над методом делает его **getter**-ом: `obj.celsius` вызывает метод без скобок. `@celsius.setter` задаёт **setter**: `obj.celsius = 30` вызывает его с новым значением.\n\nСнаружи — обычное поле. Внутри — проверки и логика. Данные хранятся в «скрытом» атрибуте `_celsius`.","code":"class Thermometer:\n    def __init__(self, c):\n        self.celsius = c\n\n    @property\n    def celsius(self):\n        return self._celsius\n\n    @celsius.setter\n    def celsius(self, value):\n        if value < -273.15:\n            raise ValueError(\"Ниже абсолютного нуля!\")\n        self._celsius = value\n\n    @property\n    def fahrenheit(self):\n        return self._celsius * 9 / 5 + 32\n\nt = Thermometer(25)\nt.celsius = 30\nprint(t.celsius, t.fahrenheit)\ntry:\n    t.celsius = -300\nexcept ValueError as e:\n    print(e)","key":["`@property` → getter, `@имя.setter` → setter.","Значение хранят в `_имя`.","Можно добавить проверку, не меняя код, который использует класс."],"id":"13-1","narr":{"3":"Даже здесь срабатывает setter","6":"getter","10":"setter — с проверкой","16":"Вычисляемое свойство без setter","20":"Выглядит как присваивание — на деле вызов setter"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":9,"e":"l","f":[0,4],"h":[0,1],"o":0},{ e":"Thermometer","bases":[],"attrs":{"__init__":["p","метод"],"celsius":["p","@property"],"fahrenheit":["p","@property"]}},{"n":5,"k":"obj","t":"Thermometer","attrs":{}},{"n":5,"k":"obj","t":"Thermometer","attrs":{"_celsius":["p","25"]}},{"n":5,"k":"obj","t":"Thermometer","attrs":{"_celsius":["p","30"]}},{"n":6,"k":"obj","t":"ValueError","attrs":{"args":["r",7]},"exc":true},{"n":7,"k":"tuple","t":"tuple","items":[["p","'Ниже абсолютного нуля!'"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Thermometer()","vars":[]},{"name":"тело класса Thermometer","vars":[]},{"name":"тело класса Thermometer","vars":[["__init__",["r",1]]]},{"name":"тело класса Thermometer","vars":[["__init__",["r",1]],["celsius",["r",2]]]},{"name":"тело класса Thermometer","vars":[["__init__",["r",1]],["celsius",["r",3]]]},{"name":"тело класса Thermometer","vars":[["__init__",["r",1]],["celsius",["r",3]],["fahrenheit",["r",2]]]},{"name":"глобальная область","vars":[["Thermometer",["r",4]]]},{"name":"__init__()","vars":[["self",["r",5]],["c",["p","25"]]]},{"name":"celsius()","vars":[["self",["r",5]],["value",["p","25"]]]},{"name":"глобальная область","vars":[["Thermometer",["r",4]],["t",["r",5]]]},{"name":"celsius()","vars":[["self",["r",5]],["value",["p","30"]]]},{"name":"celsius()","vars":[["self",["r",5]]]},{"name":"fahrenheit()","vars":[["self",["r",5]]]},{"name":"celsius()","vars":[["self",["r",5]],["value",["p","-300"]]]},{"name":"глобальная область","vars":[["Thermometer",["r",4]],["t",["r",5]],["e",["r",6]]]}],"out":"30 86.0\nНиже абсолютного нуля!\n","error":null,"truncated":false},"deep":"Property позволяет **начать с простого атрибута**, а когда понадобится проверка или вычисление, превратить его в свойство — без изменения кода, который этим атрибутом пользуется. Это главное отличие от стиля «геттеры и сеттеры с первого дня».\n\nВнутри геттера и сеттера обращайся к «скрытому» атрибуту (`self._celsius`). Если в сеттере написать `self.celsius = value`, сеттер вызовет сам себя — бесконечная рекурсия.\n\nДля дорогих вычислений, которые не меняются, есть `functools.cached_property`: значение считается один раз и кладётся в `__dict__` экземпляра.","pitfalls":["`self.celsius = value` внутри сеттера `celsius` — бесконечная рекурсия.","Тяжёлые вычисления в property, который читают в цикле."],"links":["12-2","7-2","13-2"],"checks":[{"q":"Что напечатает код?","options":["0","Ошибка: отрицательный","-5","None"],"answer":1,"why":"Присваивание в `__init__` уже проходит через сеттер, который проверяет значение.","code":"class T:\n    def __init__(self, v):\n        self.v = v\n    @property\n    def v(self):\n        return self._v\n    @v.setter\n    def v(self, x):\n        if x < 0:\n            raise ValueError('отрицательный')\n        self._v = x\ntry:\n    T(-5)\nexcept ValueError as e:\n    print('Ошибка:', e)"},{"q":"Почему в сеттере нельзя писать `self.celsius = value` для свойства `celsius`?","options":["Это медленно","Сеттер вызовет сам себя — бесконечная рекурсия","Python запрещает","Значение не сохранится"],"answer":1,"why":"Присваивание свойству снова вызывает его сеттер."}]},{"title":"deleter и управление доступом","covers":["deleter","управление доступом к атрибутам"],"text":"`@имя.deleter` срабатывает на `del obj.имя`. А если setter **не объявить**, атрибут станет **только для чтения** — попытка записи даст `AttributeError`.\n\nТак property управляет доступом: что можно читать, что писать, что удалять, и что при этом проверять или логировать.","code":"class User:\n    def __init__(self, login):\n        self._login = login\n        self._token = \"abc123\"\n\n    @property\n    def login(self):\n        return self._login\n\n    @property\n    def token(self):\n        return self._token[:2] + \"***\"\n\n    @token.deleter\n    def token(self):\n        print(\"Токен удалён\")\n        self._token = \"\"\n\nu = User(\"anna\")\nprint(u.login, u.token)\ntry:\n    u.login = \"hacker\"\nexcept AttributeError as e:\n    print(\"Запрещено:\", e)\ndel u.token","key":["`@имя.deleter` → `del obj.имя`.","Нет setter — атрибут только для чтения.","property позволяет контролировать чтение, запись и удаление."],"id":"13-2","narr":{"7":"Только getter — значит только чтение","12":"Показываем частично","15":"Выход из системы"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":14,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":15,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":14,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":15,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":15,"e":"r","f":[0,6],"h":[0,1,3],"o":0,"rv":["p","None"],"fn":"User"},{"l":19,"e":"l","f":[7],"h":[4],"o":0},{"l":3,"e":"l","f":[7,8],"h":[4,5],"o":0},{"l":4,"e":"l","f":[7,8],"h":[4,6],"o":0},{"l":4,"e":"r","f":[7,8],"h":[4,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":20,"e":"l","f":[9],"h":[4,7],"o":0},{"l":8,"e":"l","f":[9,10],"h":[4,7],"o":0},{"l":8,"e":"r","f":[9,10],"h":[4,7],"o":0,"rv":["p","'anna'"],"fn":"login"},{"l":12,"e":"l","f":[9,11],"h":[4,7],"o":0},{"l":12,"e":"r","f":[9,11],"h":[4,7],"o":0,"rv":["p","'ab***'"],"fn":"token"},{"l":21,"e":"l","f":[9],"h":[4,7],"o":11},{"l":22,"e":"l","f":[9],"h":[4,7],"o":11},{"l":22,"e":"e","f":[9],"h":[4,7],"o":11,"ex":"AttributeError: property 'login' of 'User' object has no setter"},{"l":23,"e":"l","f":[9],"h":[4,7],"o":11},{"l":24,"e":"l","f":[12],"h":[4,7,8,9],"o":11},{"l":25,"e":"l","f":[9],"h":[4,7],"o":70},{"l":16,"e":"l","f":[9,11],"h":[4,7],"o":70},{"l":17,"e":"l","f":[9,11],"h":[4,7],"o":83},{"l":17,"e":"r","f":[9,11],"h":[4,10],"o":83,"rv":["p","None"],"fn":"token"},{"l":0,"e":"d","f":[9],"h":[4,10],"o":83}],"objs":[{"n":1,"k":"func","t":"function","name":"User.__init__","sig":"(self, login)"},{"n":2,"k":"other","t":"property","r":"<property object>"},{"n":3,"k":"other","t":"property","r":"<property object>"},{"n":4,"k":"other","t":"property","r":"<property object>"},{"n":5,"k":"class","t":"class","name":"User","bases":[],"attrs":{"__init__":["p","метод"],"login":["p","@property"],"token":["p","@property"]}},{"n":6,"k":"obj","t":"User","attrs":{}},{"n":6,"k":"obj","t":"User","attrs":{"_login":["p","'anna'"]}},{"n":6,"k":"obj","t":"User","attrs":{"_login":["p","'anna'"],"_token":["p","'abc123'"]}},{"n":7,"k":"obj","t":"AttributeError","attrs":{"args":["r",8]},"exc":true},{"n":8,"k":"tuple","t":"tuple","items":[["p","\"property 'login' of 'User' object has no setter\""]],"more":0},{"n":6,"k":"obj","t":"User","attrs":{"_login":["p","'anna'"],"_token":["p","''"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"User()","vars":[]},{"name":"тело класса User","vars":[]},{"name":"тело класса User","vars":[["__init__",["r",1]]]},{"name":"тело класса User","vars":[["__init__",["r",1]],["login",["r",2]]]},{"name":"тело класса User","vars":[["__init__",["r",1]],["login",["r",2]],["token",["r",3]]]},{"name":"тело класса User","vars":[["__init__",["r",1]],["login",["r",2]],["token",["r",4]]]},{"name":"глобальная область","vars":[["User",["r",5]]]},{"name":"__init__()","vars":[["self",["r",6]],["login",["p","'anna'"]]]},{"name":"глобальная область","vars":[["User",["r",5]],["u",["r",6]]]},{"name":"login()","vars":[["self",["r",6]]]},{"name":"token()","vars":[["self",["r",6]]]},{"name":"глобальная область","vars":[["User",["r",5]],["u",["r",6]],["e",["r",7]]]}],"out":"anna ab***\nЗапрещено: property 'login' of 'User' object has no setter\nТокен удалён\n","error":null,"truncated":false},"deep":"Свойство без сеттера — **только для чтения** на уровне атрибута: `obj.login = ...` даст `AttributeError`. Но это защита интерфейса, а не данных: подчёркнутый `obj._login` по-прежнему можно изменить.\n\nВычисляемые свойства (`fahrenheit`, `area`) хороши тем, что всегда согласованы с исходными данными — их нельзя «забыть обновить».\n\nЕсли нужен единый контроль над многими атрибутами, есть `__setattr__` (вызывается при любом присваивании) или `__slots__` (запрещает создавать атрибуты, не перечисленные заранее, и экономит память).","pitfalls":["Думать, что свойство без сеттера делает данные неизменными.","Переопределять `__setattr__` и забыть вызвать `super().__setattr__` — атрибуты перестанут сохраняться."],"links":["13-1","22-2"],"checks":[{"q":"Что напечатает код?","options":["можно","AttributeError","None","Ошибка синтаксиса"],"answer":1,"why":"У свойства нет сеттера — присваивание запрещено.","code":"class U:\n    @property\n    def login(self):\n        return 'anna'\ntry:\n    U().login = 'x'\n    print('можно')\nexcept AttributeError:\n    print('AttributeError')"},{"q":"Что напечатает код?","options":["AttributeError","можно","None","Ошибка"],"answer":0,"why":"`__slots__` запрещает создавать атрибуты, которых нет в списке.","code":"class P:\n    __slots__ = ('x',)\np = P()\ntry:\n    p.y = 1\n    print('можно')\nexcept AttributeError:\n    print('AttributeError')"}]}],"zone":12,"world":{"name":"Банковская касса","hue":150,"kind":"city","intro":"Атрибут выглядит как обычное окошко, но за стеклом кассир проверяет каждую операцию.","why":"Property позволяет добавить проверку или вычисление, не меняя код, который пользуется атрибутом.","spots":{"getter":[null,"Окно выдачи: прочитать баланс можно, кассир просто показывает его."],"setter":[null,"Щель для взноса: кассир проверяет сумму, прежде чем принять."],"deleter":[null,"Кнопка «закрыть счёт»: срабатывает на `del`."],"управление доступом к атрибутам":["управление доступом","Бронированное стекло: что-то можно смотреть, но нельзя менять — свойство только для чтения."]}}},{"title":"Метаклассы","items":["type","class creation","metaclass","__new__","__init_subclass__"],"intro":"Классы — тоже объекты, а значит, их кто-то создаёт. Этот «кто-то» — метакласс. По умолчанию это `type`.","lessons":[{"title":"type и создание класса","covers":["type","class creation"],"text":"`type` — не только функция «узнать тип». Это **класс всех классов**: `type(Dog)` — это `type`. И им можно создать класс вручную: `type(\"Dog\", (Base,), {\"sound\": \"Гав\"})` — имя, родители, словарь атрибутов.\n\nИнструкция `class` делает то же самое: выполняет тело, собирает словарь атрибутов и вызывает `type(имя, родители, словарь)`.","code":"class Cat:\n    sound = \"Мяу\"\n\ndef bark(self):\n    return \"Гав\"\n\nDog = type(\"Dog\", (), {\"sound\": \"Гав\", \"speak\": bark})\nprint(Dog().speak(), Dog.sound)\nprint(type(Cat), type(Dog))\nprint(type(type))","key":["`type(name, bases, dict)` создаёт класс.","`class` — удобная запись для того же.","Тип любого класса по умолчанию — `type`."],"id":"14-1","narr":{"1":"Обычный способ","7":"Класс без слова class!","9":"Оба класса созданы type","10":"type — сам себе тип"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[],"o":0,"rv":["p","None"],"fn":"Cat"},{"l":4,"e":"l","f":[4],"h":[0],"o":0},{"l":7,"e":"l","f":[5],"h":[0,1],"o":0},{"l":8,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":5,"e":"l","f":[6,7],"h":[0,1,2,3],"o":0},{"l":5,"e":"r","f":[6,7],"h":[0,1,2,3],"o":0,"rv":["p","'Гав'"],"fn":"bark"},{"l":9,"e":"l","f":[6],"h":[0,1,2],"o":8},{"l":10,"e":"l","f":[6],"h":[0,1,2],"o":38},{"l":0,"e":"d","f":[6],"h":[0,1,2],"o":53}],"objs":[{"n":1,"k":"class","t":"class","name":"Cat","bases":[],"attrs":{"sound":["p","'Мяу'"]}},{"n":2,"k":"func","t":"function","name":"bark","sig":"(self)"},{"n":3,"k":"class","t":"class","name":"Dog","bases":[],"attrs":{"sound":["p","'Гав'"],"speak":["p","метод"]}},{"n":4,"k":"obj","t":"Dog","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Cat()","vars":[]},{"name":"тело класса Cat","vars":[]},{"name":"тело класса Cat","vars":[["sound",["p","'Мяу'"]]]},{"name":"глобальная область","vars":[["Cat",["r",1]]]},{"name":"глобальная область","vars":[["Cat",["r",1]],["bark",["r",2]]]},{"name":"глобальная область","vars":[["Cat",["r",1]],["bark",["r",2]],["Dog",["r",3]]]},{"name":"bark()","vars":[["self",["r",4]]]}],"out":"Гав Гав\n<class 'type'> <class 'type'>\n<class 'type'>\n","error":null,"truncated":false},"deep":"Создание класса проходит этапы:\n1. определяется метакласс (по умолчанию `type`);\n2. `metaclass.__prepare__` создаёт словарь для тела класса;\n3. тело класса выполняется в этом словаре;\n4. вызывается `metaclass(name, bases, namespace)` → `__new__` и `__init__` метакласса.\n\nЦепочка «тип чего?»: `5` — экземпляр `int`, `int` — экземпляр `type`, `type` — экземпляр самого себя. Это замыкает объектную модель: классы — тоже объекты, у которых есть класс.","pitfalls":["Путать `type(x)` (узнать тип) и `type(name, bases, dict)` (создать класс) — это один и тот же объект с разным числом аргументов."],"links":["14-2","6-1","5-1"],"checks":[{"q":"Что напечатает код?","options":["<class 'type'>","<class 'object'>","<class 'int'>","type"],"answer":0,"why":"Класс `int` — экземпляр метакласса `type`.","code":"print(type(int))"},{"q":"Что напечатает код?","options":["Гав","Ошибка","None","Dog"],"answer":0,"why":"Класс создан через `type` с атрибутом `voice`; экземпляр видит его.","code":"Dog = type('Dog', (), {'voice': 'Гав'})\nprint(Dog().voice)"}]},{"title":"metaclass и __new__","covers":["metaclass","__new__"],"text":"**Метакласс** — класс, экземпляры которого — классы. Наследуешь от `type`, переопределяешь `__new__` (создание класса) — и можешь вмешаться в момент, когда пишется `class ...:`. Например, автоматически регистрировать классы или проверять, что у них есть нужные методы.\n\n`__new__` у метакласса получает: сам метакласс, имя будущего класса, родителей и словарь атрибутов.","code":"registry = {}\n\nclass PluginMeta(type):\n    def __new__(mcls, name, bases, attrs):\n        cls = super().__new__(mcls, name, bases, attrs)\n        if bases:\n            registry[name.lower()] = cls\n        return cls\n\nclass Plugin(metaclass=PluginMeta):\n    pass\n\nclass Csv(Plugin):\n    pass\n\nclass Json(Plugin):\n    pass\n\nprint(registry)\nprint(type(Csv).__name__)","key":["Метакласс создаёт классы, как класс создаёт объекты.","`__new__` метакласса срабатывает при выполнении `class ...:`.","Нужен редко: чаще хватает декоратора класса или `__init_subclass__`."],"id":"14-2","narr":{"4":"Вызывается при создании КЛАССА","6":"Базовый класс не регистрируем","13":"В этот момент сработает PluginMeta.__new__"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1,2],"h":[0],"o":0},{"l":4,"e":"l","f":[1,3],"h":[0],"o":0},{"l":4,"e":"r","f":[1,4],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"PluginMeta"},{"l":10,"e":"l","f":[5],"h":[0,3],"o":0},{"l":10,"e":"l","f":[5,6],"h":[0,3],"o":0},{"l":11,"e":"l","f":[5,7],"h":[0,3],"o":0},{"l":11,"e":"r","f":[5,7],"h":[0,3],"o":0,"rv":["p","None"],"fn":"Plugin"},{"l":5,"e":"l","f":[5,8],"h":[0,3,4,5],"o":0},{"l":6,"e":"l","f":[5,9],"h":[0,3,4,5,6],"o":0},{"l":8,"e":"l","f":[5,9],"h":[0,3,4,5,6],"o":0},{"l":8,"e":"r","f":[5,9],"h":[0,3,4,5,6],"o":0,"rv":["r",7],"fn":"__new__"},{"l":13,"e":"l","f":[10],"h":[0,3,6],"o":0},{"l":13,"e":"l","f":[10,11],"h":[0,3,6],"o":0},{"l":14,"e":"l","f":[10,12],"h":[0,3,6],"o":0},{"l":14,"e":"r","f":[10,12],"h":[0,3,6],"o":0,"rv":["p","None"],"fn":"Csv"},{"l":5,"e":"l","f":[10,13],"h":[0,3,4,6,7,8],"o":0},{"l":6,"e":"l","f":[10,14],"h":[0,3,4,6,7,8,9],"o":0},{"l":7,"e":"l","f":[10,14],"h":[0,3,4,6,7,8,9],"o":0},{"l":8,"e":"l","f":[10,14],"h":[10,3,4,6,7,8,9],"o":0},{"l":8,"e":"r","f":[10,14],"h":[10,3,4,6,7,8,9],"o":0,"rv":["r",10],"fn":"__new__"},{"l":16,"e":"l","f":[15],"h":[10,3,6,9],"o":0},{"l":16,"e":"l","f":[15,16],"h":[10,3,6,9],"o":0},{"l":17,"e":"l","f":[15,17],"
