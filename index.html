out":"13 3.5 3 1 49 True True\n","error":null,"truncated":false},"deep":"Python разбирает выражение в **дерево** по приоритетам и вычисляет его снизу вверх. Каждый оператор — вызов метода: `a + b` → `a.__add__(b)`, `a < b` → `a.__lt__(b)`.\n\nЛогические `and` и `or` особенные: они **ленивые** (short-circuit) и возвращают не `True/False`, а один из операндов.\n\n```\nprint(0 or \"по умолчанию\")   # по умолчанию\nprint(\"x\" and 42)            # 42\n```\n\nСравнения можно цепочкой: `0 < x < 10` значит `0 < x and x < 10`, причём `x` вычисляется один раз.","pitfalls":["Ждать от `/` целого результата: `7 / 2` даёт `3.5`.","Забывать про приоритет: `not a == b` — это `not (a == b)`.","`-7 // 2` равно `-4`, а не `-3`: деление округляет вниз."],"links":["11-4","11-5","2-2"],"checks":[{"q":"Что напечатает код?","options":["True","False","0","''"],"answer":3,"why":"`and` возвращает первый ложный операнд. Пустая строка ложна, поэтому результат — `''` (print показывает пустую строку, но значение именно она). Здесь мы печатаем `repr`.","code":"print(repr('' and 'hello'))"},{"q":"Чему равно `-7 // 2`?","options":["-3","-4","-3.5","3"],"answer":1,"why":"`//` — деление с округлением вниз (к минус бесконечности): −3.5 → −4."}]},{"title":"Инструкция и блок кода","covers":["Инструкция","Блок кода"],"text":"**Инструкция** — это команда, которая что-то делает: присваивание `x = 1`, вызов `print()`, `if`, `for`, `def`, `return`. В отличие от выражения, инструкция не обязана давать значение.\n\n**Блок кода** — группа инструкций с одинаковым отступом после двоеточия. В Python отступы — это синтаксис: они показывают, какие строки «внутри» `if`, цикла или функции. Обычно отступ — 4 пробела.","analogy":"Блок — как подпункты в списке дел: всё, что сдвинуто вправо под пунктом «Если идёт дождь:», делается только при дожде.","code":"temperature = 25\nif temperature > 20:\n    print(\"Тепло\")\n    print(\"Можно гулять\")\nprint(\"Конец\")","key":["Инструкция — команда, выражение — значение.","Двоеточие `:` открывает блок.","Одинаковый отступ = один блок."],"id":"1-5","narr":{"1":"Инструкция присваивания","2":"Инструкция if: проверяет условие и решает, выполнять ли блок","3":"Этот блок выполнится, только если условие истинно","4":"Тот же отступ — тот же блок","5":"Отступа нет — строка уже вне блока if, выполняется всегда"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[],"o":6},{"l":5,"e":"l","f":[1],"h":[],"o":19},{"l":0,"e":"d","f":[1],"h":[],"o":25}],"objs":[],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["temperature",["p","25"]]]}],"out":"Тепло\nМожно гулять\nКонец\n","error":null,"truncated":false},"deep":"Python читает файл и превращает отступы в специальные токены `INDENT` и `DEDENT` — так интерпретатор видит границы блоков. Поэтому отступ в Python — это часть грамматики, а не украшение.\n\nБлок **не создаёт новую область видимости**: переменная, созданная внутри `if` или `for`, видна и после блока.\n\n```\nif True:\n    inside = 1\nprint(inside)   # 1\n```\n\nНовую область создают только функции, классы, модули (и comprehensions).","pitfalls":["Смешивать табы и пробелы — `TabError`.","Забывать двоеточие после `if`, `for`, `def`.","Думать, что переменная из блока `if` недоступна снаружи."],"links":["4-3","3-1"],"checks":[{"q":"Что напечатает код?","options":["1","Ошибка NameError","None","0"],"answer":0,"why":"Блок `if` не создаёт отдельную область видимости, поэтому `y` существует и после него.","code":"if 5 > 3:\n    y = 1\nprint(y)"},{"q":"Что определяет, какие строки входят в блок `while`?","options":["Фигурные скобки","Одинаковый отступ после двоеточия","Ключевое слово end","Пустая строка после блока"],"answer":1,"why":"В Python границы блока задаются отступом."}]},{"title":"Состояние программы","covers":["Состояние"],"text":"**Состояние** — это снимок всего, что программа «помнит» в данный момент: какие имена существуют, на какие объекты они указывают и что лежит внутри этих объектов. Каждая инструкция переводит программу из одного состояния в другое.\n\nИменно состояние и показывает визуализатор справа на каждом шаге. Умение мысленно отслеживать состояние — главный навык программиста: так находят ошибки.","analogy":"Шахматная партия: состояние — это расстановка фигур. Каждый ход (инструкция) меняет расстановку.","code":"balance = 100\nhistory = []\nbalance = balance - 30\nhistory.append(-30)\nbalance = balance + 50\nhistory.append(50)\nprint(\"Баланс:\", balance, \"История:\", history)","key":["Состояние = все имена + все объекты + их содержимое.","Каждый шаг программы меняет состояние.","Отладка — это сравнение ожидаемого и реального состояния."],"id":"1-6","narr":{"1":"Состояние: balance = 100","2":"Добавился пустой список history","3":"Покупка: balance меняется на 70","4":"И в истории появилась запись","5":"Пополнение"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[2],"h":[0],"o":0},{"l":4,"e":"l","f":[3],"h":[0],"o":0},{"l":5,"e":"l","f":[3],"h":[1],"o":0},{"l":6,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4],"h":[2],"o":0},{"l":0,"e":"d","f":[4],"h":[2],"o":31}],"objs":[{"n":1,"k":"list","t":"list","items":[],"more":0},{"n":1,"k":"list","t":"list","items":[["p","-30"]],"more":0},{"n":1,"k":"list","t":"list","items":[["p","-30"],["p","50"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["balance",["p","100"]]]},{"name":"глобальная область","vars":[["balance",["p","100"]],["history",["r",1]]]},{"name":"глобальная область","vars":[["balance",["p","70"]],["history",["r",1]]]},{"name":"глобальная область","vars":[["balance",["p","120"]],["history",["r",1]]]}],"out":"Баланс: 120 История: [-30, 50]\n","error":null,"truncated":false},"deep":"Состояние программы в каждый момент — это **все пространства имён** (глобальное и кадры вызовов) плюс **все живые объекты** в памяти. Визуализатор показывает ровно это: слева имена, справа объекты.\n\nЧем меньше изменяемого состояния, тем проще рассуждать о коде. Поэтому хорошие программы:\n- держат состояние внутри объектов и функций, а не в глобальных переменных;\n- предпочитают возвращать новые значения, а не менять старые там, где это несложно.","pitfalls":["Хранить всё в глобальных переменных и менять их из разных функций: сложно понять, кто что изменил.","Забывать, что изменяемый объект, переданный в функцию, может быть изменён внутри неё."],"links":["4-3","23-1"],"checks":[{"q":"Что напечатает код?","options":["10","15","12","17"],"answer":3,"why":"Следим за состоянием: 10 → 15 (+5) → 12 (−3) → 17 (+5).","code":"s = 10\nfor d in [5, -3, 5]:\n    s += d\nprint(s)"},{"q":"Из чего состоит состояние программы?","options":["Только из переменных","Только из вывода print","Из имён во всех кадрах и объектов, на которые они ссылаются","Из текста программы"],"answer":2,"why":"Состояние = имена + объекты + их содержимое в данный момент."}]}],"zone":0,"world":{"name":"Площадь объектов","hue":38,"kind":"village","intro":"Здесь видно, как Python хранит данные: таблички-имена на ниточках ведут к коробкам-объектам.","why":"Это модель, на которой держится весь язык. Пойми её — и остальные разделы станут вариациями.","spots":{"Переменная":[null,"Табличка с именем `age`. Она ничего не хранит внутри — только привязана ниточкой к объекту."],"Ссылка":[null,"Сама ниточка-стрелка. По ней Python находит объект. К одной коробке может вести несколько табличек."],"Объект":[null,"Коробка в памяти. У каждой коробки есть своё место (id), тип и значение."],"Значение":[null,"Содержимое коробки — число 17. У списков и словарей содержимое можно менять, у чисел — нет."],"Тип":[null,"Штамп `int` на коробке. Он решает, какие операции с объектом разрешены."],"Выражение":[null,"Машинка, которая из нескольких значений делает одно: из 17 и 1 получается 18."],"Оператор":[null,"Шестерёнка «+» внутри машинки — само действие. На деле это вызов метода `__add__`."],"Инструкция":[null,"Карточка-команда `age = age + 1`. Инструкция что-то делает: создаёт имя, печатает, ветвит."],"Блок кода":[null,"Скобка объединяет строки с одинаковым отступом: они выполняются вместе под `if`."],"Состояние":[null,"Фотоаппарат снимает момент: какие имена к каким объектам привязаны прямо сейчас."]}}},{"title":"Типы данных","items":["int","float","bool","str","None","list","tuple","set","dict","пользовательские типы"],"intro":"Встроенные «кирпичики» данных. Главное деление: неизменяемые (int, float, bool, str, None, tuple) и изменяемые (list, set, dict).","lessons":[{"title":"Числа: int и float","covers":["int","float"],"text":"`int` — целые числа любой длины (Python не ограничивает размер). `float` — дробные числа с плавающей точкой; они хранятся приблизительно, поэтому `0.1 + 0.2` даёт не ровно `0.3`.\n\nПреобразование: `int(\"42\")` превращает строку в число, `float(3)` даёт `3.0`, `int(3.9)` отбрасывает дробную часть → `3`, а `round(3.9)` округляет → `4`.","code":"big = 2 ** 100\nprint(big)\nx = 0.1 + 0.2\nprint(x, x == 0.3)\nprint(round(x, 2) == 0.3)\nn = int(\"42\") + 1\nprint(n, int(3.9), round(3.9), float(7))","key":["int — точные целые, float — приблизительные дробные.","Не сравнивай float через `==` без округления.","`int()`, `float()`, `str()` — преобразование типов."],"id":"2-1","narr":{"1":"int может быть сколь угодно большим","3":"float хранится в двоичном виде, поэтому есть погрешность","5":"Сравнивать дробные числа лучше после округления","6":"Строка → число"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":32},{"l":4,"e":"l","f":[2],"h":[],"o":32},{"l":5,"e":"l","f":[2],"h":[],"o":58},{"l":6,"e":"l","f":[2],"h":[],"o":63},{"l":7,"e":"l","f":[3],"h":[],"o":63},{"l":0,"e":"d","f":[3],"h":[],"o":74}],"objs":[],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["big",["p","1267650600228229401496703205376"]]]},{"name":"глобальная область","vars":[["big",["p","1267650600228229401496703205376"]],["x",["p","0.3"]]]},{"name":"глобальная область","vars":[["big",["p","1267650600228229401496703205376"]],["x",["p","0.3"]],["n",["p","43"]]]}],"out":"1267650600228229401496703205376\n0.30000000000000004 False\nTrue\n43 3 4 7.0\n","error":null,"truncated":false},"deep":"`int` в CPython хранит число как массив «цифр» по 30 бит, поэтому размер ограничен только памятью. `float` — это 64-битное число IEEE 754: 52 бита мантиссы дают около 15–17 значащих десятичных цифр. Дроби вроде `0.1` в двоичной системе бесконечны, поэтому хранятся приближённо.\n\n```\nprint(0.1 + 0.2 == 0.3)            # False\nimport math\nprint(math.isclose(0.1 + 0.2, 0.3)) # True\n```\n\nДля денег используют `decimal.Decimal` или считают в копейках целыми числами. `round()` округляет «к чётному»: `round(2.5) == 2`.","pitfalls":["Сравнивать float через `==`. Используй `math.isclose`.","Удивляться, что `round(2.5)` даёт 2: это банковское округление.","`int(\"3.7\")` — ошибка. Нужно `int(float(\"3.7\"))`."],"links":["1-4","2-2"],"checks":[{"q":"Что напечатает код?","options":["3","2","2.5","3.0"],"answer":1,"why":"`round` округляет половинки к ближайшему чётному числу, поэтому 2.5 → 2.","code":"print(round(2.5))"},{"q":"Почему `0.1 + 0.2 != 0.3`?","options":["Ошибка Python","0.1 и 0.2 нельзя точно записать в двоичной системе","float хранит только 2 знака после запятой","Нужно писать 0.10"],"answer":1,"why":"Двоичное представление этих дробей бесконечно, поэтому сумма немного отличается от 0.3."}]},{"title":"Логика и пустота: bool и None","covers":["bool","None"],"text":"`bool` — всего два значения: `True` и `False`. Их дают сравнения и логические операторы. Любой объект можно проверить на «истинность»: `0`, `\"\"`, `[]`, `{}`, `None` считаются ложными, почти всё остальное — истинным.\n\n`None` — специальный объект «ничего», «значения нет». Его возвращают функции без `return`. Проверяют его через `is None`.","code":"is_adult = 18 >= 18\nprint(is_adult, type(is_adult))\nprint(bool(0), bool(\"\"), bool([]), bool(\"0\"), bool([0]))\nresult = None\nif result is None:\n    print(\"Ещё не посчитано\")\nitems = []\nif not items:\n    print(\"Список пуст\")","key":["Ложные значения: `False, 0, 0.0, '', [], {}, set(), None`.","`None` проверяй через `is None`.","Функция без `return` возвращает `None`."],"id":"2-2","narr":{"1":"Сравнение даёт bool","3":"Пустое и ноль — ложь, остальное — истина","4":"Значение пока неизвестно","5":"Правильная проверка на None — через is","8":"Пустой список ложен, поэтому not items == True"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":20},{"l":4,"e":"l","f":[1],"h":[],"o":48},{"l":5,"e":"l","f":[2],"h":[],"o":48},{"l":6,"e":"l","f":[2],"h":[],"o":48},{"l":7,"e":"l","f":[2],"h":[],"o":65},{"l":8,"e":"l","f":[3],"h":[0],"o":65},{"l":9,"e":"l","f":[3],"h":[0],"o":65},{"l":0,"e":"d","f":[3],"h":[0],"o":77}],"objs":[{"n":1,"k":"list","t":"list","items":[],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["is_adult",["p","True"]]]},{"name":"глобальная область","vars":[["is_adult",["p","True"]],["result",["p","None"]]]},{"name":"глобальная область","vars":[["is_adult",["p","True"]],["result",["p","None"]],["items",["r",1]]]}],"out":"True <class 'bool'>\nFalse False False True True\nЕщё не посчитано\nСписок пуст\n","error":null,"truncated":false},"deep":"`bool` — подкласс `int`: `True == 1`, `False == 0`, поэтому `sum([True, True, False])` даёт 2. Истинность объекта определяет метод `__bool__` (или `__len__`, если `__bool__` нет).\n\n`None` — единственный объект своего типа `NoneType` (синглтон). Поэтому его сравнивают через `is`: `x is None` проверяет «это тот самый объект», и это быстрее и надёжнее, чем `==`.\n\n```\nprint(isinstance(True, int))   # True\nprint(True + True)             # 2\n```","pitfalls":["Писать `if x == None` вместо `if x is None`.","Путать «пустое» и «None»: `[]` — пустой список, а не отсутствие списка.","Проверять `if x:` когда 0 — допустимое значение: 0 тоже ложно."],"links":["11-6","1-4"],"checks":[{"q":"Что напечатает код?","options":["2","True","3","Ошибка"],"answer":0,"why":"`bool` — подкласс `int`, поэтому `True` считается как 1.","code":"print(sum([True, False, True]))"},{"q":"Что вернёт функция без `return`?","options":["0","False","None","Пустую строку"],"answer":2,"why":"Если функция не вернула значение явно, Python возвращает `None`."}]},{"title":"Строки: str","covers":["str"],"text":"`str` — неизменяемая последовательность символов. К символам обращаются по индексу с нуля: `s[0]`, с конца — `s[-1]`. Срез `s[1:4]` берёт символы с 1-го по 3-й.\n\nСтроку нельзя изменить «на месте» — все методы (`upper`, `replace`, `strip`) возвращают **новую** строку. f-строки `f\"Привет, {name}\"` подставляют значения прямо в текст.","code":"s = \"Python\"\nprint(s[0], s[-1], s[1:4], len(s))\nt = s.upper()\nprint(s, t)\nname = \"Мир\"\nmsg = f\"Привет, {name}! Длина: {len(name)}\"\nprint(msg)\nwords = \"a,b,c\".split(\",\")\nprint(words, \"-\".join(words))","key":["Строки неизменяемы — методы возвращают новые строки.","Индексы с 0, отрицательные — с конца.","f-строки — самый удобный способ собрать текст."],"id":"2-3","narr":{"2":"Индексы, срез, длина","3":"upper() не меняет s, а создаёт новую строку","6":"f-строка вычисляет выражения в {}","8":"split режет строку в список","9":"join склеивает список обратно"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":10},{"l":4,"e":"l","f":[2],"h":[],"o":10},{"l":5,"e":"l","f":[2],"h":[],"o":24},{"l":6,"e":"l","f":[3],"h":[],"o":24},{"l":7,"e":"l","f":[4],"h":[],"o":24},{"l":8,"e":"l","f":[4],"h":[],"o":46},{"l":9,"e":"l","f":[5],"h":[0],"o":46},{"l":0,"e":"d","f":[5],"h":[0],"o":68}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","'a'"],["p","'b'"],["p","'c'"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["s",["p","'Python'"]]]},{"name":"глобальная область","vars":[["s",["p","'Python'"]],["t",["p","'PYTHON'"]]]},{"name":"глобальная область","vars":[["s",["p","'Python'"]],["t",["p","'PYTHON'"]],["name",["p","'Мир'"]]]},{"name":"глобальная область","vars":[["s",["p","'Python'"]],["t",["p","'PYTHON'"]],["name",["p","'Мир'"]],["msg",["p","'Привет, Мир! Длина: 3'"]]]},{"name":"глобальная область","vars":[["s",["p","'Python'"]],["t",["p","'PYTHON'"]],["name",["p","'Мир'"]],["msg",["p","'Привет, Мир! Длина: 3'"]],["words",["r",1]]]}],"out":"P n yth 6\nPython PYTHON\nПривет, Мир! Длина: 3\n['a', 'b', 'c'] a-b-c\n","error":null,"truncated":false},"deep":"Строка в Python — неизменяемая последовательность **символов Unicode**. CPython хранит её компактно: 1, 2 или 4 байта на символ в зависимости от самого «широкого» символа. Неизменяемость позволяет использовать строки как ключи словарей и безопасно делиться ими.\n\nСклеивать строки в цикле через `+=` может быть медленно: каждый раз создаётся новая строка. Для больших объёмов собирай части в список и делай `\"\".join(parts)`.\n\n```\nparts = []\nfor i in range(3):\n    parts.append(str(i))\nprint(\"-\".join(parts))   # 0-1-2\n```","pitfalls":["Пытаться изменить символ: `s[0] = 'X'` → `TypeError`.","Забывать, что методы возвращают новую строку: `s.upper()` без присваивания ничего не меняет.","Путать индекс и срез: `s[5]` падает за границей, а `s[5:10]` вернёт пустую строку."],"links":["2-5","1-3"],"checks":[{"q":"Что напечатает код?","options":["PYTHON","python","Python","Ошибка"],"answer":2,"why":"`upper()` вернул новую строку, но результат никуда не сохранили — `s` не изменилась.","code":"s = 'Python'\ns.upper()\nprint(s)"},{"q":"Что напечатает код?","options":["yt","yth","Pyt","th"],"answer":0,"why":"Срез `[1:3]` берёт индексы 1 и 2 — правая граница не включается.","code":"print('Python'[1:3])"}]},{"title":"Список: list","covers":["list"],"text":"`list` — упорядоченная **изменяемая** коллекция. Элементы можно добавлять (`append`, `insert`), удалять (`pop`, `remove`), менять по индексу. В списке могут лежать объекты любых типов, даже другие списки.\n\nВ визуализаторе список нарисован рядом ячеек с номерами — это индексы. Смотри, как меняются ячейки после каждого шага.","analogy":"Поезд из вагонов с номерами. Вагоны можно прицепить, отцепить и поменять груз в любом из них.","code":"fruits = [\"яблоко\", \"банан\"]\nfruits.append(\"киви\")\nfruits.insert(0, \"манго\")\nfruits[2] = \"груша\"\nlast = fruits.pop()\nprint(fruits, last, len(fruits))\nmatrix = [[1, 2], [3, 4]]\nprint(matrix[1][0])","key":["list изменяем: append, insert, pop, remove, sort.","Индексация с нуля, `len()` — длина.","Список хранит ссылки на объекты."],"quiz":{"q":"`a = [1, 2, 3]`, `a.pop(0)`. Чему равно `a`?","options":["[1, 2]","[2, 3]","[1, 2, 3]","[3]"],"answer":1,"why":"`pop(0)` удаляет элемент с индексом 0, то есть 1."},"id":"2-4","narr":{"1":"Список из двух строк","2":"append добавляет в конец","3":"insert(0, …) вставляет в начало, остальные сдвигаются","4":"Замена элемента по индексу 2","5":"pop() вынимает последний элемент и возвращает его","7":"Список списков: внешний хранит ссылки на внутренние","8":"Строка 1, столбец 0 → 3"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[1],"o":0},{"l":4,"e":"l","f":[1],"h":[2],"o":0},{"l":5,"e":"l","f":[1],"h":[3],"o":0},{"l":6,"e":"l","f":[2],"h":[4],"o":0},{"l":7,"e":"l","f":[2],"h":[4],"o":36},{"l":8,"e":"l","f":[3],"h":[4,5,6,7],"o":36},{"l":0,"e":"d","f":[3],"h":[4,5,6,7],"o":38}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","'яблоко'"],["p","'банан'"]],"more":0},{"n":1,"k":"list","t":"list","items":[["p","'яблоко'"],["p","'банан'"],["p","'киви'"]],"more":0},{"n":1,"k":"list","t":"list","items":[["p","'манго'"],["p","'яблоко'"],["p","'банан'"],["p","'киви'"]],"more":0},{"n":1,"k":"list","t":"list","items":[["p","'манго'"],["p","'яблоко'"],["p","'груша'"],["p","'киви'"]],"more":0},{"n":1,"k":"list","t":"list","items":[["p","'манго'"],["p","'яблоко'"],["p","'груша'"]],"more":0},{"n":2,"k":"list","t":"list","items":[["r",3],["r",4]],"more":0},{"n":3,"k":"list","t":"list","items":[["p","1"],["p","2"]],"more":0},{"n":4,"k":"list","t":"list","items":[["p","3"],["p","4"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["fruits",["r",1]]]},{"name":"глобальная область","vars":[["fruits",["r",1]],["last",["p","'киви'"]]]},{"name":"глобальная область","vars":[["fruits",["r",1]],["last",["p","'киви'"]],["matrix",["r",2]]]}],"out":"['манго', 'яблоко', 'груша'] киви 3\n3\n","error":null,"truncated":false},"deep":"Список — это **динамический массив ссылок**. Python выделяет памяти чуть больше, чем нужно, поэтому `append` в среднем работает за O(1). А вот `insert(0, x)` и `pop(0)` сдвигают все элементы — это O(n). Для очередей с двух концов есть `collections.deque`.\n\n| Операция | Сложность |\n|---|---|\n| `lst[i]`, `append`, `pop()` | O(1) |\n| `insert(0, x)`, `pop(0)`, `x in lst` | O(n) |\n\nМетод `sort()` сортирует **на месте** и возвращает `None`; функция `sorted()` возвращает **новый** список.","pitfalls":["Писать `lst = lst.sort()` — получишь `None`.","Изменять список во время перебора `for x in lst` — элементы пропускаются.","Использовать `[]` как значение параметра по умолчанию."],"links":["1-3","3-7","11-2"],"checks":[{"q":"Что напечатает код?","options":["[1, 2, 3]","[3, 1, 2]","None","Ошибка"],"answer":2,"why":"`sort()` сортирует на месте и возвращает `None` — это значение и попало в `b`.","code":"a = [3, 1, 2]\nb = a.sort()\nprint(b)"},{"q":"Какая операция со списком из миллиона элементов самая медленная?","options":["append(x)","lst[-1]","pop()","insert(0, x)"],"answer":3,"why":"Вставка в начало сдвигает все элементы вправо — это O(n)."}]},{"title":"Кортеж: tuple","covers":["tuple"],"text":"`tuple` — как список, но **неизменяемый**. Создаётся круглыми скобками или просто через запятую. Его нельзя дополнить или поменять элемент, зато он надёжен и может быть ключом словаря.\n\nКортежи удобно «распаковывать»: `x, y = point`. Именно так работает обмен значениями `a, b = b, a`. В визуализаторе ячейки кортежа нарисованы пунктиром — знак неизменяемости.","code":"point = (3, 4)\nx, y = point\nprint(x, y)\na, b = 1, 2\na, b = b, a\nprint(a, b)\ntry:\n    point[0] = 10\nexcept TypeError as e:\n    print(\"Ошибка:\", e)","key":["tuple неизменяем.","Распаковка `a, b = t` — очень частый приём.","Кортеж можно сделать ключом dict, список — нельзя."],"id":"2-5","narr":{"1":"Кортеж из двух чисел","2":"Распаковка: x = 3, y = 4","5":"Справа создаётся кортеж (2, 1), затем распаковывается в a и b","8":"Попытка изменить кортеж…","10":"…заканчивается ошибкой TypeError"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0],"o":0},{"l":4,"e":"l","f":[2],"h":[0],"o":4},{"l":5,"e":"l","f":[3],"h":[0],"o":4},{"l":6,"e":"l","f":[4],"h":[0],"o":4},{"l":7,"e":"l","f":[4],"h":[0],"o":8},{"l":8,"e":"l","f":[4],"h":[0],"o":8},{"l":8,"e":"e","f":[4],"h":[0],"o":8,"ex":"TypeError: 'tuple' object does not support item assignment"},{"l":9,"e":"l","f":[4],"h":[0],"o":8},{"l":10,"e":"l","f":[5],"h":[0,1,2],"o":8},{"l":0,"e":"d","f":[4],"h":[0],"o":64}],"objs":[{"n":1,"k":"tuple","t":"tuple","items":[["p","3"],["p","4"]],"more":0},{"n":2,"k":"obj","t":"TypeError","attrs":{"args":["r",3]},"exc":true},{"n":3,"k":"tuple","t":"tuple","items":[["p","\"'tuple' object does not support item assignment\""]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["point",["r",1]]]},{"name":"глобальная область","vars":[["point",["r",1]],["x",["p","3"]],["y",["p","4"]]]},{"name":"глобальная область","vars":[["point",["r",1]],["x",["p","3"]],["y",["p","4"]],["a",["p","1"]],["b",["p","2"]]]},{"name":"глобальная область","vars":[["point",["r",1]],["x",["p","3"]],["y",["p","4"]],["a",["p","2"]],["b",["p","1"]]]},{"name":"глобальная область","vars":[["point",["r",1]],["x",["p","3"]],["y",["p","4"]],["a",["p","2"]],["b",["p","1"]],["e",["r",2]]]}],"out":"3 4\n2 1\nОшибка: 'tuple' object does not support item assignment\n","error":null,"truncated":false},"deep":"Кортеж неизменяем на уровне **ссылок**: нельзя заменить элемент, но если элемент — изменяемый объект, его содержимое поменять можно.\n\n```\nt = ([1], 2)\nt[0].append(9)   # можно: меняем список внутри\nprint(t)         # ([1, 9], 2)\n```\n\nКортеж можно сделать ключом словаря, только если **все** его элементы хешируемы. Кортеж из одного элемента пишется с запятой: `(5,)` — без запятой `(5)` это просто число в скобках. Для именованных полей есть `collections.namedtuple` и `typing.NamedTuple`.","pitfalls":["Писать `(5)`, ожидая кортеж: нужно `(5,)`.","Думать, что кортеж «глубоко» неизменяем: вложенный список менять можно."],"links":["2-3","23-4","2-7"],"checks":[{"q":"Что напечатает код?","options":["<class 'int'>","<class 'tuple'>","<class 'list'>","Ошибка"],"answer":0,"why":"Без запятой скобки — просто группировка выражения, получается число.","code":"print(type((5)))"},{"q":"Что напечатает код?","options":["([1], 2)","([1, 9], 2)","Ошибка TypeError","(9, 2)"],"answer":1,"why":"Кортеж хранит ссылку на список, а сам список изменяем.","code":"t = ([1], 2)\nt[0].append(9)\nprint(t)"}]},{"title":"Множество: set","covers":["set"],"text":"`set` — коллекция **уникальных** элементов **без порядка**. Повторы выбрасываются автоматически. Проверка `x in s` работает очень быстро, даже если элементов миллионы.\n\nМножества поддерживают операции из математики: объединение `|`, пересечение `&`, разность `-`.","code":"tags = {\"python\", \"код\", \"python\"}\nprint(tags, len(tags))\ntags.add(\"игры\")\nnums = set([1, 2, 2, 3, 3, 3])\na = {1, 2, 3}\nb = {2, 3, 4}\nprint(a | b, a & b, a - b)\nprint(3 in a)","key":["set хранит только уникальные значения.","Порядок не гарантирован, индексов нет.","`|`, `&`, `-` — операции над множествами."],"id":"2-6","narr":{"1":"Дубликат исчезнет сам","3":"add добавляет элемент","4":"Быстрый способ убрать повторы из списка","7":"Объединение, пересечение, разность","8":"Быстрая проверка принадлежности"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[0],"o":20},{"l":4,"e":"l","f":[1],"h":[1],"o":20},{"l":5,"e":"l","f":[2],"h":[1,2],"o":20},{"l":6,"e":"l","f":[3],"h":[1,2,3],"o":20},{"l":7,"e":"l","f":[4],"h":[1,2,3,4],"o":20},{"l":8,"e":"l","f":[4],"h":[1,2,3,4],"o":44},{"l":0,"e":"d","f":[4],"h":[1,2,3,4],"o":49}],"objs":[{"n":1,"k":"set","t":"set","items":[["p","'python'"],["p","'код'"]],"more":0},{"n":1,"k":"set","t":"set","items":[["p","'python'"],["p","'игры'"],["p","'код'"]],"more":0},{"n":2,"k":"set","t":"set","items":[["p","1"],["p","2"],["p","3"]],"more":0},{"n":3,"k":"set","t":"set","items":[["p","1"],["p","2"],["p","3"]],"more":0},{"n":4,"k":"set","t":"set","items":[["p","2"],["p","3"],["p","4"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["tags",["r",1]]]},{"name":"глобальная область","vars":[["tags",["r",1]],["nums",["r",2]]]},{"name":"глобальная область","vars":[["tags",["r",1]],["nums",["r",2]],["a",["r",3]]]},{"name":"глобальная область","vars":[["tags",["r",1]],["nums",["r",2]],["a",["r",3]],["b",["r",4]]]}],"out":"{'python', 'код'} 2\n{1, 2, 3, 4} {2, 3} {1}\nTrue\n","error":null,"truncated":false},"deep":"Множество построено на **хеш-таблице**: для каждого элемента вычисляется `hash()`, по нему выбирается «корзина». Поэтому проверка `x in s` в среднем O(1), а в списке — O(n). Зато элементы должны быть **хешируемыми** (неизменяемыми): числа, строки, кортежи — да; списки и словари — нет.\n\n```\ns = {1, 2}\ns.add((3, 4))   # кортеж — можно\n# s.add([5])    # TypeError: unhashable type: 'list'\n```\n\nПустое множество создаётся только через `set()`: `{}` — это пустой словарь. Неизменяемая версия — `frozenset`.","pitfalls":["Писать `{}` для пустого множества — это словарь.","Ждать сохранения порядка элементов множества.","Класть в множество списки — `TypeError: unhashable type`."],"links":["2-7","11-6"],"checks":[{"q":"Что напечатает код?","options":["<class 'set'>","<class 'dict'>","<class 'tuple'>","Ошибка"],"answer":1,"why":"Фигурные скобки без элементов создают пустой словарь.","code":"print(type({}))"},{"q":"Почему `x in some_set` быстрее, чем `x in some_list`?","options":["Множество меньше по размеру","Множество ищет по хешу, не перебирая все элементы","Множество отсортировано","Это не так, скорость одинаковая"],"answer":1,"why":"Хеш сразу указывает, где искать элемент, — проверка в среднем O(1)."}]},{"title":"Словарь: dict","covers":["dict"],"text":"`dict` — набор пар **ключ → значение**. По ключу значение находится мгновенно. Ключи уникальны и должны быть неизменяемыми (строки, числа, кортежи).\n\n`d[key]` упадёт с ошибкой, если ключа нет, а `d.get(key, default)` вернёт значение по умолчанию. Перебирать удобно через `d.items()`.","analogy":"Телефонная книга: по имени (ключу) сразу находишь номер (значение).","code":"ages = {\"Аня\": 17, \"Боря\": 20}\nages[\"Вика\"] = 19\nages[\"Аня\"] = 18\nprint(ages.get(\"Гоша\", \"нет данных\"))\nfor name, age in ages.items():\n    print(name, age)\ndel ages[\"Боря\"]\nprint(ages)","key":["Ключ уникален и неизменяем.","`d.get(k, default)` — безопасное чтение.","`items()`, `keys()`, `values()` — перебор."],"id":"2-7","narr":{"1":"Словарь с двумя парами","2":"Новый ключ — новая пара","3":"Существующий ключ — значение заменяется","4":"get не падает при отсутствии ключа","5":"items() даёт пары (ключ, значение)","7":"Удаление пары"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[1],"o":0},{"l":4,"e":"l","f":[1],"h":[2],"o":0},{"l":5,"e":"l","f":[1],"h":[2],"o":11},{"l":6,"e":"l","f":[2],"h":[2],"o":11},{"l":5,"e":"l","f":[2],"h":[2],"o":18},{"l":6,"e":"l","f":[3],"h":[2],"o":18},{"l":5,"e":"l","f":[3],"h":[2],"o":26},{"l":6,"e":"l","f":[4],"h":[2],"o":26},{"l":5,"e":"l","f":[4],"h":[2],"o":34},{"l":7,"e":"l","f":[4],"h":[2],"o":34},{"l":8,"e":"l","f":[4],"h":[3],"o":34},{"l":0,"e":"d","f":[4],"h":[3],"o":58}],"objs":[{"n":1,"k":"dict","t":"dict","pairs":[[["p","'Аня'"],["p","17"]],[["p","'Боря'"],["p","20"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'Аня'"],["p","17"]],[["p","'Боря'"],["p","20"]],[["p","'Вика'"],["p","19"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'Аня'"],["p","18"]],[["p","'Боря'"],["p","20"]],[["p","'Вика'"],["p","19"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'Аня'"],["p","18"]],[["p","'Вика'"],["p","19"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["ages",["r",1]]]},{"name":"глобальная область","vars":[["ages",["r",1]],["name",["p","'Аня'"]],["age",["p","18"]]]},{"name":"глобальная область","vars":[["ages",["r",1]],["name",["p","'Боря'"]],["age",["p","20"]]]},{"name":"глобальная область","vars":[["ages",["r",1]],["name",["p","'Вика'"]],["age",["p","19"]]]}],"out":"нет данных\nАня 18\nБоря 20\nВика 19\n{'Аня': 18, 'Вика': 19}\n","error":null,"truncated":false},"deep":"Словарь — тоже хеш-таблица, но хранит пары. С Python 3.7 словари **сохраняют порядок вставки**. Ключ ищется так: `hash(key)` → корзина → сравнение `==`. Поэтому ключ должен быть хешируемым и не меняться.\n\nПолезные инструменты:\n```\nfrom collections import defaultdict, Counter\ncnt = Counter(\"банан\")          # Counter({'а': 2, 'н': 2, 'б': 1})\ngroups = defaultdict(list)\ngroups[\"a\"].append(1)           # ключ создаётся сам\n```\n\n`d.setdefault(k, [])` и `d.get(k, default)` избавляют от лишних проверок `if k in d`.","pitfalls":["Обращаться `d[k]` к несуществующему ключу — `KeyError`.","Менять словарь (добавлять/удалять ключи) во время перебора — `RuntimeError`.","Использовать список как ключ — `TypeError`."],"links":["2-6","5-5"],"checks":[{"q":"Что напечатает код?","options":["0","None","Ошибка KeyError","{}"],"answer":0,"why":"`get` возвращает значение по умолчанию, если ключа нет.","code":"d = {'a': 1}\nprint(d.get('b', 0))"},{"q":"Что напечатает код?","options":["{'x': 1, 'y': 2}","{'x': 3, 'y': 2}","{'y': 2, 'x': 3}","Ошибка"],"answer":1,"why":"Повторное присваивание существующему ключу заменяет значение, а порядок ключей сохраняется.","code":"d = {'x': 1, 'y': 2}\nd['x'] = 3\nprint(d)"}]},{"title":"Пользовательские типы","covers":["пользовательские типы"],"text":"Встроенных типов не всегда хватает. С помощью `class` ты создаёшь **свой тип** данных: например, `Point`, `User`, `Order`. Объекты этого типа ведут себя как полноценные: у них есть `type`, атрибуты и методы.\n\nПодробно классы разобраны в разделе 6, а здесь — главное: класс — это новый тип, а `Point(1, 2)` — объект этого типа.","code":"class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\np = Point(1, 2)\nprint(type(p).__name__, p.x, p.y)\nprint(isinstance(p, Point), isinstance(5, Point))","key":["`class` создаёт новый тип.","`Point(...)` создаёт объект этого типа.","Свои типы работают наравне со встроенными."],"id":"2-8","narr":{"1":"Создаём новый тип Point","6":"Объект нашего собственного типа","8":"isinstance проверяет тип"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Point"},{"l":6,"e":"l","f":[4],"h":[1],"o":0},{"l":3,"e":"l","f":[4,5],"h":[1,2],"o":0},{"l":4,"e":"l","f":[4,5],"h":[1,3],"o":0},{"l":4,"e":"r","f":[4,5],"h":[1,4],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":7,"e":"l","f":[6],"h":[1,4],"o":0},{"l":8,"e":"l","f":[6],"h":[1,4],"o":10},{"l":0,"e":"d","f":[6],"h":[1,4],"o":21}],"objs":[{"n":1,"k":"func","t":"function","name":"Point.__init__","sig":"(self, x, y)"},{"n":2,"k":"class","t":"class","name":"Point","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Point","attrs":{}},{"n":3,"k":"obj","t":"Point","attrs":{"x":["p","1"]}},{"n":3,"k":"obj","t":"Point","attrs":{"x":["p","1"],"y":["p","2"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Point()","vars":[]},{"name":"тело класса Point","vars":[]},{"name":"тело класса Point","vars":[["__init__",["r",1]]]},{"name":"глобальная область","vars":[["Point",["r",2]]]},{"name":"__init__()","vars":[["self",["r",3]],["x",["p","1"]],["y",["p","2"]]]},{"name":"глобальная область","vars":[["Point",["r",2]],["p",["r",3]]]}],"out":"Point 1 2\nTrue False\n","error":null,"truncated":false},"deep":"Инструкция `class` создаёт новый объект-тип. Экземпляры такого типа по умолчанию хранят атрибуты в собственном словаре `__dict__`. Встроенные функции работают с твоим типом через протоколы: `len(obj)` вызывает `obj.__len__()`, `print(obj)` — `obj.__str__()`.\n\n```\nclass Point:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\np = Point(1, 2)\nprint(p.__dict__)   # {'x': 1, 'y': 2}\n```\n\nТак пользовательский тип становится «гражданином первого класса» — как `list` или `str`.","pitfalls":["Забывать скобки: `p = Point` присваивает сам класс, а не создаёт объект.","Ждать красивого `print(p)` без метода `__str__`/`__repr__`."],"links":["6-1","11-1","22-1"],"checks":[{"q":"Что напечатает код?","options":["True","False","Point","Ошибка"],"answer":1,"why":"Без скобок `q` — это сам класс, а не экземпляр. Класс не является своим экземпляром.","code":"class Point:\n    pass\nq = Point\nprint(isinstance(q, Point))"},{"q":"Где по умолчанию хранятся атрибуты экземпляра?","options":["В классе","В словаре `__dict__` самого объекта","В глобальных переменных","В модуле"],"answer":1,"why":"У каждого экземпляра свой `__dict__` с его атрибутами."}]}],"zone":1,"world":{"name":"Склад типов","hue":200,"kind":"port","intro":"На складе каждая вещь хранится в таре своего типа: кубики, весы, переключатели, бусы, поезда и шкафчики.","why":"Тип определяет, что можно делать с данными и сколько это стоит. Правильная тара — половина решения задачи.","spots":{"int":[null,"Цельный кубик: целое число, точное и любой величины."],"float":[null,"Весы с приблизительным показанием: дробные числа хранятся с крошечной погрешностью."],"bool":[null,"Переключатель: всего два положения — True и False."],"str":[null,"Бусы на нитке: строка — неизменяемая цепочка символов, у каждой бусины свой номер."],"None":[null,"Пустой постамент: значения нет. Такой постамент один на всю программу."],"list":[null,"Открытый поезд с пронумерованными вагонами: порядок важен, груз можно менять, вагоны — цеплять."],"tuple":[null,"Опломбированный состав: порядок есть, но менять вагоны нельзя."],"set":[null,"Мешок с шариками: только уникальные, без порядка, зато проверка «есть ли такой» мгновенная."],"dict":[null,"Стена шкафчиков: на дверце ключ, внутри значение. Найти вещь по ключу — сразу."],"пользовательские типы":["свои типы","Чертёж своей тары `Point(x, y)`: когда встроенных типов мало, ты придумываешь свой."]}}},{"title":"Управление выполнением","items":["if / elif / else","while","for","break","continue","pass","match","comprehensions"],"intro":"По умолчанию код выполняется сверху вниз. Конструкции этого раздела позволяют выбирать ветку, повторять и прыгать. Здесь визуализатор особенно полезен: смотри, как жёлтая стрелка скачет по строкам.","lessons":[{"title":"Ветвление: if / elif / else","covers":["if / elif / else"],"text":"`if` проверяет условие. Если оно истинно — выполняется его блок, и остальные ветки пропускаются. Если ложно — Python проверяет следующий `elif`, и так далее. `else` срабатывает, когда ни одно условие не подошло.\n\nПроверки идут **по порядку**, и срабатывает только **первая** подходящая ветка. Посмотри на шагах, как стрелка перепрыгивает через ненужные ветки.","analogy":"Развилка дорог с указателями: идёшь по первой дороге, чей указатель тебе подходит, и больше не оглядываешься.","code":"for score in [95, 72, 40]:\n    if score >= 90:\n        grade = \"отлично\"\n    elif score >= 60:\n        grade = \"хорошо\"\n    else:\n        grade = \"надо подтянуть\"\n    print(score, grade)","key":["Срабатывает только первая истинная ветка.","`elif` проверяется, только если все предыдущие условия ложны.","`else` — «во всех остальных случаях»."],"quiz":{"q":"Что выведет код при `x = 15`: `if x > 10: print('A')` / `elif x > 5: print('B')` / `else: print('C')`?","options":["A","B","A и B","C"],"answer":0,"why":"Первая же подходящая ветка (`x > 10`) срабатывает, остальные пропускаются, хотя `x > 5` тоже правда."},"id":"3-1","narr":{"1":"Проверим три разных балла","2":"Первая проверка","4":"Сюда попадаем, только если первая проверка не прошла","7":"Ни одна проверка не прошла"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":0},{"l":8,"e":"l","f":[2],"h":[],"o":0},{"l":1,"e":"l","f":[2],"h":[],"o":11},{"l":2,"e":"l","f":[3],"h":[],"o":11},{"l":4,"e":"l","f":[3],"h":[],"o":11},{"l":5,"e":"l","f":[3],"h":[],"o":11},{"l":8,"e":"l","f":[4],"h":[],"o":11},{"l":1,"e":"l","f":[4],"h":[],"o":21},{"l":2,"e":"l","f":[5],"h":[],"o":21},{"l":4,"e":"l","f":[5],"h":[],"o":21},{"l":7,"e":"l","f":[5],"h":[],"o":21},{"l":8,"e":"l","f":[6],"h":[],"o":21},{"l":1,"e":"l","f":[6],"h":[],"o":39},{"l":0,"e":"d","f":[6],"h":[],"o":39}],"objs":[],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["score",["p","95"]]]},{"name":"глобальная область","vars":[["score",["p","95"]],["grade",["p","'отлично'"]]]},{"name":"глобальная область","vars":[["score",["p","72"]],["grade",["p","'отлично'"]]]},{"name":"глобальная область","vars":[["score",["p","72"]],["grade",["p","'хорошо'"]]]},{"name":"глобальная область","vars":[["score",["p","40"]],["grade",["p","'хорошо'"]]]},{"name":"глобальная область","vars":[["score",["p","40"]],["grade",["p","'надо подтянуть'"]]]}],"out":"95 отлично\n72 хорошо\n40 надо подтянуть\n","error":null,"truncated":false},"deep":"`if` проверяет не только `True/False`, а **истинность** любого объекта (через `__bool__`/`__len__`). Компилятор превращает `if/elif/else` в условные переходы байткода: проверка → прыжок к следующей ветке или выполнение блока.\n\nЕсть и **условное выражение** (тернарный оператор) — оно возвращает значение:\n```\nage = 20\nstatus = \"взрослый\" if age >= 18 else \"ребёнок\"\n```\n\nХороший стиль — ранний выход (guard clause) вместо глубокой вложенности: сначала отсечь особые случаи, потом основной код.","pitfalls":["Писать `if x == 1 or 2:` — это всегда истина. Нужно `if x == 1 or x == 2` или `if x in (1, 2)`.","Ставить самые общие условия первыми: более узкие ветки ниже никогда не сработают."],"links":["2-2","3-6","1-4"],"checks":[{"q":"Что напечатает код?","options":["маленькое","среднее","большое","ничего"],"answer":1,"why":"50 не меньше 10, но меньше 100 — срабатывает ветка `elif`.","code":"x = 50\nif x < 10:\n    print('маленькое')\nelif x < 100:\n    print('среднее')\nelse:\n    print('большое')"},{"q":"Почему `if x == 1 or 2:` всегда истинно?","options":["Из-за бага Python","`or 2` проверяет истинность числа 2, а оно всегда истинно","Потому что `==` сильнее `or`","Это не так"],"answer":1,"why":"Выражение читается как `(x == 1) or 2`, а `2` — истинное значение."}]},{"title":"Цикл while","covers":["while"],"text":"`while` повторяет блок, **пока условие истинно**. Перед каждым повтором условие проверяется заново. Если внутри цикла ничего не меняет условие — цикл станет бесконечным.\n\nТипичная схема: переменная-счётчик до цикла, проверка в `while`, изменение счётчика в теле. Посмотри, как строка `while` подсвечивается снова и снова.","analogy":"«Пока тарелка не пустая — ешь ложкой». Каждый раз перед следующей ложкой смотришь на тарелку.","code":"n = 3\nwhile n > 0:\n    print(\"Осталось\", n)\n    n = n - 1\nprint(\"Старт!\")","key":["Условие проверяется перед каждой итерацией.","Тело должно приближать цикл к концу.","Используй while, когда заранее неизвестно, сколько будет повторов."],"id":"3-2","narr":{"1":"Счётчик","2":"Условие проверяется перед каждым кругом","4":"Меняем счётчик, иначе цикл никогда не закончится","5":"Когда n стало 0, условие ложно — выходим из цикла"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[],"o":11},{"l":2,"e":"l","f":[2],"h":[],"o":11},{"l":3,"e":"l","f":[2],"h":[],"o":11},{"l":4,"e":"l","f":[2],"h":[],"o":22},{"l":2,"e":"l","f":[3],"h":[],"o":22},{"l":3,"e":"l","f":[3],"h":[],"o":22},{"l":4,"e":"l","f":[3],"h":[],"o":33},{"l":2,"e":"l","f":[4],"h":[],"o":33},{"l":5,"e":"l","f":[4],"h":[],"o":33},{"l":0,"e":"d","f":[4],"h":[],"o":40}],"objs":[],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["n",["p","3"]]]},{"name":"глобальная область","vars":[["n",["p","2"]]]},{"name":"глобальная область","vars":[["n",["p","1"]]]},{"name":"глобальная область","vars":[["n",["p","0"]]]}],"out":"Осталось 3\nОсталось 2\nОсталось 1\nСтарт!\n","error":null,"truncated":false},"deep":"`while` компилируется в метку проверки условия, тело и прыжок обратно к проверке. У цикла бывает ветка `else` — она выполняется, если цикл закончился **без `break`**.\n\n```\nn = 7\nd = 2\nwhile d * d <= n:\n    if n % d == 0:\n        print(\"составное\"); break\n    d += 1\nelse:\n    print(\"простое\")\n```\n\n`while True:` + `break` — стандартный способ написать цикл, условие выхода которого проверяется в середине (например, ввод пользователя).","pitfalls":["Забыть изменить переменную условия — бесконечный цикл.","Использовать `while` для перебора коллекции, когда хватает `for`."],"links":["3-4","3-3"],"checks":[{"q":"Что напечатает код?","options":["3","4","8","16"],"answer":3,"why":"x удваивается, пока x < 10: 1 → 2 → 4 → 8 → 16. Как только x = 16, условие ложно.","code":"x = 1\nwhile x < 10:\n    x *= 2\nprint(x)"},{"q":"Когда выполняется ветка `else` у цикла `while`?","options":["Всегда после цикла","Если цикл завершился без break","Если условие с самого начала ложно, и только тогда","Никогда"],"answer":1,"why":"`else` цикла срабатывает при обычном завершении, а `break` его пропускает."}]},{"title":"Цикл for","covers":["for"],"text":"`for` проходит по элементам любой коллекции (списка, строки, словаря, `range`) — по одному за раз. Переменная цикла на каждом шаге указывает на очередной элемент.\n\n`range(5)` даёт числа 0…4, `enumerate(seq)` — пары (номер, элемент), `zip(a, b)` — пары из двух списков.","code":"total = 0\nfor price in [100, 250, 50]:\n    total = total + price\nprint(\"Итого:\", total)\nfor i, ch in enumerate(\"абв\"):\n    print(i, ch)\nfor i in range(2):\n    print(\"повтор\", i)","key":["for перебирает элементы, а не индексы.","`range(n)` — числа от 0 до n−1.","`enumerate` — когда нужен и номер, и элемент."],"id":"3-3","narr":{"2":"price по очереди становится каждым элементом","3":"Накапливаем сумму","5":"enumerate даёт номер и элемент","7":"range(2) — это 0 и 1"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[2],"h":[],"o":0},{"l":2,"e":"l","f":[3],"h":[],"o":0},{"l":3,"e":"l","f":[4],"h":[],"o":0},{"l":2,"e":"l","f":[5],"h":[],"o":0},{"l":3,"e":"l","f":[6],"h":[],"o":0},{"l":2,"e":"l","f":[7],"h":[],"o":0},{"l":4,"e":"l","f":[7],"h":[],"o":0},{"l":5,"e":"l","f":[7],"h":[],"o":11},{"l":6,"e":"l","f":[8],"h":[],"o":11},{"l":5,"e":"l","f":[8],"h":[],"o":15},{"l":6,"e":"l","f":[9],"h":[],"o":15},{"l":5,"e":"l","f":[9],"h":[],"o":19},{"l":6,"e":"l","f":[10],"h":[],"o":19},{"l":5,"e":"l","f":[10],"h":[],"o":23},{"l":7,"e":"l","f":[10],"h":[],"o":23},{"l":8,"e":"l","f":[11],"h":[],"o":23},{"l":7,"e":"l","f":[11],"h":[],"o":32},{"l":8,"e":"l","f":[12],"h":[],"o":32},{"l":7,"e":"l","f":[12],"h":[],"o":41},{"l":0,"e":"d","f":[12],"h":[],"o":41}],"objs":[],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["total",["p","0"]]]},{"name":"глобальная область","vars":[["total",["p","0"]],["price",["p","100"]]]},{"name":"глобальная область","vars":[["total",["p","100"]],["price",["p","100"]]]},{"name":"глобальная область","vars":[["total",["p","100"]],["price",["p","250"]]]},{"name":"глобальная область","vars":[["total",["p","350"]],["price",["p","250"]]]},{"name":"глобальная область","vars":[["total",["p","350"]],["price",["p","50"]]]},{"name":"глобальная область","vars":[["total",["p","400"]],["price",["p","50"]]]},{"name":"глобальная область","vars":[["total",["p","400"]],["price",["p","50"]],["i",["p","0"]],["ch",["p","'а'"]]]},{"name":"глобальная область","vars":[["total",["p","400"]],["price",["p","50"]],["i",["p","1"]],["ch",["p","'б'"]]]},{"name":"глобальная область","vars":[["total",["p","400"]],["price",["p","50"]],["i",["p","2"]],["ch",["p","'в'"]]]},{"name":"глобальная область","vars":[["total",["p","400"]],["price",["p","50"]],["i",["p","0"]],["ch",["p","'в'"]]]},{"name":"глобальная область","vars":[["total",["p","400"]],["price",["p","50"]],["i",["p","1"]],["ch",["p","'в'"]]]}],"out":"Итого: 400\n0 а\n1 б\n2 в\nповтор 0\nповтор 1\n","error":null,"truncated":false},"deep":"`for x in obj` работает через **протокол итерации**: сначала `it = iter(obj)`, затем в цикле `x = next(it)`, пока не возникнет `StopIteration`. Поэтому `for` умеет обходить всё итерируемое: списки, строки, словари, файлы, генераторы.\n\n```\nit = iter([10, 20])\nprint(next(it), next(it))   # 10 20\n```\n\nПеременная цикла — обычное имя: после цикла она хранит последнее значение. `range` не создаёт список, а вычисляет числа по запросу.","pitfalls":["Писать `for i in range(len(lst))` там, где хватает `for x in lst` или `enumerate`.","Удалять элементы из списка во время его обхода."],"links":["19-1","11-3","3-7"],"checks":[{"q":"Что напечатает код?","options":["0 1 2","2","3","Ошибка"],"answer":1,"why":"После цикла переменная `i` остаётся связанной с последним значением — 2.","code":"for i in range(3):\n    pass\nprint(i)"},{"q":"Что `for` вызывает, чтобы получить очередной элемент?","options":["len()","next() у итератора","getitem() по индексу","copy()"],"answer":1,"why":"`for` получает итератор через `iter()` и вызывает `next()` до `StopIteration`."}]},{"title":"break и continue","covers":["break","continue"],"text":"`break` немедленно **выходит из цикла** целиком. `continue` **пропускает остаток** текущей итерации и переходит к следующей.\n\nПример ниже ищет первое отрицательное число, пропуская нули. Смотри, как после `continue` стрелка возвращается к `for`, а после `break` — выпрыгивает за цикл.","code":"data = [5, 0, 3, 0, -2, 8]\nfor x in data:\n    if x == 0:\n        continue\n    if x < 0:\n        print(\"Нашли отрицательное:\", x)\n        break\n    print(\"Проверили\", x)\nprint(\"Готово\")","key":["`break` — выйти из цикла.","`continue` — перейти к следующему кругу.","Работают только с ближайшим циклом."],"id":"3-4","narr":{"4":"Ноль пропускаем — сразу к следующему элементу","7":"Дальше искать не нужно — выходим из цикла"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0],"o":0},{"l":5,"e":"l","f":[2],"h":[0],"o":0},{"l":8,"e":"l","f":[2],"h":[0],"o":0},{"l":2,"e":"l","f":[2],"h":[0],"o":12},{"l":3,"e":"l","f":[3],"h":[0],"o":12},{"l":4,"e":"l","f":[3],"h":[0],"o":12},{"l":2,"e":"l","f":[3],"h":[0],"o":12},{"l":3,"e":"l","f":[4],"h":[0],"o":12},{"l":5,"e":"l","f":[4],"h":[0],"o":12},{"l":8,"e":"l","f":[4],"h":[0],"o":12},{"l":2,"e":"l","f":[4],"h":[0],"o":24},{"l":3,"e":"l","f":[3],"h":[0],"o":24},{"l":4,"e":"l","f":[3],"h":[0],"o":24},{"l":2,"e":"l","f":[3],"h":[0],"o":24},{"l":3,"e":"l","f":[5],"h":[0],"o":24},{"l":5,"e":"l","f":[5],"h":[0],"o":24},{"l":6,"e":"l","f":[5],"h":[0],"o":24},{"l":7,"e":"l","f":[5],"h":[0],"o":48},{"l":9,"e":"l","f":[5],"h":[0],"o":48},{"l":0,"e":"d","f":[5],"h":[0],"o":55}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","5"],["p","0"],["p","3"],["p","0"],["p","-2"],["p","8"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["data",["r",1]]]},{"name":"глобальная область","vars":[["data",["r",1]],["x",["p","5"]]]},{"name":"глобальная область","vars":[["data",["r",1]],["x",["p","0"]]]},{"name":"глобальная область","vars":[["data",["r",1]],["x",["p","3"]]]},{"name":"глобальная область","vars":[["data",["r",1]],["x",["p","-2"]]]}],"out":"Проверили 5\nПроверили 3\nНашли отрицательное: -2\nГотово\n","error":null,"truncated":false},"deep":"`break` и `continue` — прыжки в байткоде: `break` ведёт за конец цикла, `continue` — к началу следующей итерации. Они действуют только на **ближайший** цикл. Чтобы выйти из вложенных циклов, обычно выносят их в функцию и делают `return`.\n\n```\ndef find(matrix, target):\n    for row in matrix:\n        for x in row:\n            if x == target:\n                return True\n    return False\n```","pitfalls":["Ждать, что `break` во внутреннем цикле прервёт внешний.","Ставить `continue` до изменения счётчика в `while` — бесконечный цикл."],"links":["3-2","3-3","4-1"],"checks":[{"q":"Что напечатает код?","options":["1 3","1 3 5","1","1 2 3"],"answer":0,"why":"Чётные пропускаются `continue`, на 5 срабатывает `break` до печати.","code":"for x in [1, 2, 3, 4, 5]:\n    if x % 2 == 0:\n        continue\n    if x == 5:\n        break\n    print(x, end=' ')"},{"q":"На какой цикл действует `break` во вложенных циклах?","options":["На внешний","На все сразу","На ближайший охватывающий","На первый в функции"],"answer":2,"why":"`break` прерывает только самый внутренний цикл, в котором он находится."}]},{"title":"pass — пустое место","covers":["pass"],"text":"Python требует, чтобы после `:` был хотя бы одна инструкция. `pass` — инструкция «ничего не делать». Её ставят как заглушку: «здесь потом будет код» или «в этом случае ничего делать не нужно».","code":"def todo():\n    pass\n\nclass Empty:\n    pass\n\nfor n in [1, 2, 3]:\n    if n == 2:\n        pass\n    else:\n        print(n)\nprint(todo())","key":["`pass` ничего не делает.","Нужен там, где синтаксис требует блок."],"id":"3-5","narr":{"2":"Функция пока пустая — pass нужен, чтобы код был корректным","5":"Пустой класс","9":"Для двойки специально ничего не делаем","12":"Пустая функция возвращает None"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0],"o":0},{"l":5,"e":"l","f":[1,3],"h":[0],"o":0},{"l":5,"e":"r","f":[1,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Empty"},{"l":7,"e":"l","f":[4],"h":[0,1],"o":0},{"l":8,"e":"l","f":[5],"h":[0,1],"o":0},{"l":11,"e":"l","f":[5],"h":[0,1],"o":0},{"l":7,"e":"l","f":[5],"h":[0,1],"o":2},{"l":8,"e":"l","f":[6],"h":[0,1],"o":2},{"l":9,"e":"l","f":[6],"h":[0,1],"o":2},{"l":7,"e":"l","f":[6],"h":[0,1],"o":2},{"l":8,"e":"l","f":[7],"h":[0,1],"o":2},{"l":11,"e":"l","f":[7],"h":[0,1],"o":2},{"l":7,"e":"l","f":[7],"h":[0,1],"o":4},{"l":12,"e":"l","f":[7],"h":[0,1],"o":4},{"l":2,"e":"l","f":[7,8],"h":[0,1],"o":4},{"l":2,"e":"r","f":[7,8],"h":[0,1],"o":4,"rv":["p","None"],"fn":"todo"},{"l":0,"e":"d","f":[7],"h":[0,1],"o":9}],"objs":[{"n":1,"k":"func","t":"function","name":"todo","sig":"()"},{"n":2,"k":"class","t":"class","name":"Empty","bases":[],"attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["todo",["r",1]]]},{"name":"Empty()","vars":[]},{"name":"тело класса Empty","vars":[]},{"name":"глобальная область","vars":[["todo",["r",1]],["Empty",["r",2]]]},{"name":"глобальная область","vars":[["todo",["r",1]],["Empty",["r",2]],["n",["p","1"]]]},{"name":"глобальная область","vars":[["todo",["r",1]],["Empty",["r",2]],["n",["p","2"]]]},{"name":"глобальная область","vars":[["todo",["r",1]],["Empty",["r",2]],["n",["p","3"]]]},{"name":"todo()","vars":[]}],"out":"1\n3\nNone\n","error":null,"truncated":false},"deep":"`pass` компилируется в «ничего» — байткод даже не создаётся. Он нужен только потому, что грамматика требует хотя бы одну инструкцию в блоке.\n\nПохожую роль играет `...` (Ellipsis) — это объект, и его часто пишут в заглушках и протоколах: `def area(self): ...`. В отличие от `pass`, `...` — выражение со значением.\n\nДля «ещё не реализовано» честнее писать `raise NotImplementedError` — тогда забытая заглушка не будет молча ничего не делать.","pitfalls":["Оставлять `except: pass` — ошибки молча проглатываются, баги не видны.","Путать `pass` и `continue`: `pass` ничего не меняет в ходе цикла."],"links":["16-2","10-1"],"checks":[{"q":"Что напечатает код?","options":["0 1 2","1 2","0 2","0 1"],"answer":0,"why":"`pass` ничего не делает и не прерывает итерацию, печать выполняется для всех.","code":"for i in range(3):\n    if i == 1:\n        pass\n    print(i, end=' ')"},{"q":"Чем `pass` отличается от `continue` в цикле?","options":["Ничем","`pass` ничего не делает, `continue` переходит к следующей итерации","`pass` выходит из цикла","`continue` ничего не делает"],"answer":1,"why":"`continue` пропускает оставшуюся часть тела, а `pass` — пустая инструкция."}]},{"title":"match — сопоставление с образцом","covers":["match"],"text":"`match` (Python 3.10+) сравнивает значение с **образцами** `case` по порядку. Образцы умеют не только сравнивать с константой, но и **разбирать структуру**: `case (x, 0)` подойдёт для любого кортежа из двух элементов, где второй равен 0, и сразу положит первый в `x`.\n\n`case _` — «всё остальное», аналог `else`.","code":"def describe(cmd):\n    match cmd:\n        case \"stop\":\n            return \"Остановка\"\n        case (\"move\", x, y):\n            return f\"Идём в {x},{y}\"\n        case {\"say\": text}:\n            return \"Говорим: \" + text\n        case _:\n            return \"Не понимаю\"\n\nprint(describe(\"stop\"))\nprint(describe((\"move\", 3, 5)))\nprint(describe({\"say\": \"привет\"}))\nprint(describe(42))","key":["`case` проверяются сверху вниз, срабатывает первый подходящий.","Образцы могут разбирать кортежи, списки, словари и объекты.","`case _:` — запасной вариант."],"id":"3-6","narr":{"3":"Совпадение с константой","5":"Разбор кортежа: x и y заполняются автоматически","7":"Разбор словаря по ключу","10":"Ничего не подошло"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":12,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":3,"e":"l","f":[1,2],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0],"o":0},{"l":4,"e":"r","f":[1,2],"h":[0],"o":0,"rv":["p","'Остановка'"],"fn":"describe"},{"l":13,"e":"l","f":[1],"h":[0],"o":10},{"l":2,"e":"l","f":[1,3],"h":[0,1],"o":10},{"l":3,"e":"l","f":[1,3],"h":[0,1],"o":10},{"l":5,"e":"l","f":[1,3],"h":[0,1],"o":10},{"l":6,"e":"l","f":[1,4],"h":[0,1],"o":10},{"l":6,"e":"r","f":[1,4],"h":[0,1],"o":10,"rv":["p","'Идём в 3,5'"],"fn":"describe"},{"l":14,"e":"l","f":[1],"h":[0],"o":21},{"l":2,"e":"l","f":[1,5],"h":[0,2],"o":21},{"l":3,"e":"l","f":[1,5],"h":[0,2],"o":21},{"l":5,"e":"l","f":[1,5],"h":[0,2],"o":21},{"l":7,"e":"l","f":[1,5],"h":[0,2],"o":21},{"l":8,"e":"l","f":[1,6],"h":[0,2],"o":21},{"l":8,"e":"r","f":[1,6],"h":[0,2],"o":21,"rv":["p","'Говорим: привет'"],"fn":"describe"},{"l":15,"e":"l","f":[1],"h":[0],"o":37},{"l":2,"e":"l","f":[1,7],"h":[0],"o":37},{"l":3,"e":"l","f":[1,7],"h":[0],"o":37},{"l":5,"e":"l","f":[1,7],"h":[0],"o":37},{"l":7,"e":"l","f":[1,7],"h":[0],"o":37},{"l":9,"e":"l","f":[1,7],"h":[0],"o":37},{"l":10,"e":"l","f":[1,7],"h":[0],"o":37},{"l":10,"e":"r","f":[1,7],"h":[0],"o":37,"rv":["p","'Не понимаю'"],"fn":"describe"},{"l":0,"e":"d","f":[1],"h":[0],"o":48}],"objs":[{"n":1,"k":"func","t":"function","name":"describe","sig":"(cmd)"},{"n":2,"k":"tuple","t":"tuple","items":[["p","'move'"],["p","3"],["p","5"]],"more":0},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'say'"],["p","'привет'"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["describe",["r",1]]]},{"name":"describe()","vars":[["cmd",["p","'stop'"]]]},{"name":"describe()","vars":[["cmd",["r",2]]]},{"name":"describe()","vars":[["cmd",["r",2]],["x",["p","3"]],["y",["p","5"]]]},{"name":"describe()","vars":[["cmd",["r",3]]]},{"name":"describe()","vars":[["cmd",["r",3]],["text",["p","'привет'"]]]},{"name":"describe()","vars":[["cmd",["p","42"]]]}],"out":"Остановка\nИдём в 3,5\nГоворим: привет\nНе понимаю\n","error":null,"truncated":false},"deep":"`match` — **структурное сопоставление** (PEP 634). Он не сравнивает подряд через `==`, а проверяет **форму** данных: последовательность какой длины, словарь с какими ключами, объект какого класса и с какими атрибутами.\n\n```\nmatch point:\n    case (0, 0):          print(\"начало координат\")\n    case (x, 0):          print(\"на оси X\", x)\n    case {\"x\": x, \"y\": y}: print(\"словарь\", x, y)\n    case Point(x=0):      print(\"объект на оси Y\")\n```\n\nВажно: голое имя в `case` — это **захват**, а не сравнение. `case color:` поймает всё. Для сравнения с константой используй точечное имя (`Color.RED`) или литерал.","pitfalls":["Писать `case red:`, думая, что сравниваешь с переменной `red`, — это захват любого значения.","Забыть `case _:`, если нужен вариант «всё остальное»."],"links":["3-1","2-5"],"checks":[{"q":"Что напечатает код?","options":["ось X 5","начало","другое","Ошибка"],"answer":0,"why":"Кортеж (5, 0) подходит под образец `(x, 0)`, и x захватывает 5.","code":"p = (5, 0)\nmatch p:\n    case (0, 0):\n        print('начало')\n    case (x, 0):\n        print('ось X', x)\n    case _:\n        print('другое')"},{"q":"Что делает `case value:` (голое имя) в match?","options":["Сравнивает с переменной value","Захватывает любое значение в имя value","Вызывает ошибку","Проверяет тип value"],"answer":1,"why":"Голое имя в образце — это захват: подходит что угодно."}]},{"title":"Comprehensions — сборка коллекций в одну строку","covers":["comprehensions"],"text":"Comprehension — короткая запись цикла, который **строит** новую коллекцию: `[выражение for x in seq if условие]`. Это то же самое, что пустой список + `for` + `append`, только компактнее.\n\nБывают списковые `[...]`, словарные `{k: v ...}` и множественные `{...}`. Сравни шаги обычного цикла и comprehension — результат одинаковый.","code":"nums = [1, 2, 3, 4, 5]\nsquares = []\nfor n in nums:\n    if n % 2 == 1:\n        squares.append(n * n)\nfast = [n * n for n in nums if n % 2 == 1]\nprint(squares, fast)\nlengths = {w: len(w) for w in [\"кот\", \"собака\"]}\nprint(lengths)","key":["`[expr for x in seq if cond]`.","Результат — новая коллекция.","Если логика сложная — лучше обычный цикл."],"id":"3-7","narr":{"3":"Обычный способ: цикл + append","6":"То же самое одной строкой","8":"Словарь через comprehension"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[3],"h":[0,1],"o":0},{"l":5,"e":"l","f":[3],"h":[0,1],"o":0},{"l":3,"e":"l","f":[3],"h":[0,2],"o":0},{"l":4,"e":"l","f":[4],"h":[0,2],"o":0},{"l":3,"e":"l","f":[4],"h":[0,2],"o":0},{"l":4,"e":"l","f":[5],"h":[0,2],"o":0},{"l":5,"e":"l","f":[5],"h":[0,2],"o":0},{"l":3,"e":"l","f":[5],"h":[0,3],"o":0},{"l":4,"e":"l","f":[6],"h":[0,3],"o":0},{"l":3,"e":"l","f":[6],"h":[0,3],"o":0},{"l":4,"e":"l","f":[7],"h":[0,3],"o":0},{"l":5,"e":"l","f":[7],"h":[0,3],"o":0},{"l":3,"e":"l","f":[7],"h":[0,4],"o":0},{"l":6,"e":"l","f":[7],"h":[0,4],"o":0},{"l":6,"e":"l","f":[7],"h":[0,4],"o":0},{"l":6,"e":"l","f":[7],"h":[0,4],"o":0},{"l":6,"e":"l","f":[7],"h":[0,4],"o":0},{"l":6,"e":"l","f":[7],"h":[0,4],"o":0},{"l":6,"e":"l","f":[7],"h":[0,4],"o":0},{"l":7,"e":"l","f":[8],"h":[0,4,5],"o":0},{"l":8,"e":"l","f":[8],"h":[0,4,5],"o":22},{"l":8,"e":"l","f":[8],"h":[0,4,5],"o":22},{"l":8,"e":"l","f":[8],"h":[0,4,5],"o":22},{"l":9,"e":"l","f":[9],"h":[0,4,5,6],"o":22},{"l":0,"e":"d","f":[9],"h":[0,4,5,6],"o":46}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","1"],["p","2"],["p","3"],["p","4"],["p","5"]],"more":0},{"n":2,"k":"list","t":"list","items":[],"more":0},{"n":2,"k":"list","t":"list","items":[["p","1"]],"more":0},{"n":2,"k":"list","t":"list","items":[["p","1"],["p","9"]],"more":0},{"n":2,"k":"list","t":"list","items":[["p","1"],["p","9"],["p","25"]],"more":0},{"n":3,"k":"list","t":"list","items":[["p","1"],["p","9"],["p","25"]],"more":0},{"n":4,"k":"dict","t":"dict","pairs":[[["p","'кот'"],["p","3"]],[["p","'собака'"],["p","6"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["nums",["r",1]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","1"]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","2"]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","3"]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","4"]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","5"]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","5"]],["fast",["r",3]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares",["r",2]],["n",["p","5"]],["fast",["r",3]],["lengths",["r",4]]]}],"out":"[1, 9, 25] [1, 9, 25]\n{'кот': 3, 'собака': 6}\n","error":null,"truncated":false},"deep":"Comprehension компилируется в отдельный маленький цикл. С Python 3.12 (PEP 709) он встраивается в текущую функцию, но **переменная цикла по-прежнему не «утекает»** наружу.\n\nМожно вкладывать циклы — порядок `for` такой же, как в обычном коде:\n```\npairs = [(x, y) for x in range(2) for y in \"ab\"]\n# [(0, 'a'), (0, 'b'), (1, 'a'), (1, 'b')]\n```\n\nУсловие можно ставить в конце (фильтр) или в выражении (`x if x > 0 else 0`). Если нужен только перебор без хранения, используй генераторное выражение в круглых скобках.","pitfalls":["Писать огромные многоэтажные comprehensions — читать их труднее, чем цикл.","Использовать comprehension ради побочного эффекта (`[print(x) for x in ...]`)."],"links":["19-3","2-4","3-3"],"checks":[{"q":"Что напечатает код?","options":["[0, 1, 4, 9]","[0, 4]","[1, 9]","[0, 2]"],"answer":1,"why":"Берём только чётные x (0 и 2) и возводим в квадрат: 0 и 4.","code":"print([x * x for x in range(4) if x % 2 == 0])"},{"q":"Что напечатает код?","options":["{1: 'a', 2: 'b'}","{'a': 1, 'b': 2}","[('a', 1), ('b', 2)]","Ошибка"],"answer":1,"why":"Словарное comprehension: ключ — буква, значение — её номер.","code":"print({ch: i for i, ch in enumerate('ab', 1)})"}]}],"zone":2,"world":{"name":"Перекрёстки","hue":140,"kind":"cross","intro":"Город дорог: развилки выбирают путь, кольца гоняют по кругу, конвейеры подают элементы по одному.","why":"Управление выполнением превращает список команд в алгоритм, который реагирует на данные.","spots":{"if / elif / else":["if/elif/else","Развилка с указателями: едешь по первой дороге, чей указатель подходит. Остальные пропускаются."],"while":[null,"Кольцевая развязка с табличкой «пока n > 0»: катаешься по кругу, пока условие истинно."],"for":[null,"Конвейер подаёт коробки по одной — `for` берёт каждый элемент коллекции по очереди."],"break":[null,"Съезд с кольца: `break` немедленно выводит из цикла."],"continue":[null,"Мостик через участок: `continue` пропускает остаток круга и сразу начинает следующий."],"pass":[null,"Пустой участок с конусом: место занято, но здесь пока ничего не делается."],"match":[null,"Сортировщик с прорезями разной формы: значение проходит в ту прорезь, чью форму повторяет."],"comprehensions":[null,"Пресс-машина: из одного списка в один проход штампует новый."]}}},{"title":"Функции","items":["def","параметры","аргументы","return","область видимости","local / global","*args","**kwargs","lambda","замыкания","рекурсия","генераторы","декораторы"],"intro":"Функция — именованный кусок кода, который можно вызывать много раз. Здесь визуализатор показывает главное: при вызове создаётся новый кадр (frame) со своими переменными, а после return он исчезает.","lessons":[{"title":"def и return","covers":["def","return"],"text":"`def` создаёт **объект-функцию** и привязывает к нему имя. Код внутри при этом ещё не выполняется — только при вызове `имя(...)`.\n\nПри вызове Python создаёт **новый кадр**: отдельное место для переменных функции. `return` завершает функцию и отдаёт значение туда, откуда её вызвали. Кадр после этого исчезает вместе со своими переменными.","analogy":"Функция — как кофемашина: `def` — купить и поставить машину, вызов — нажать кнопку, return — чашка кофе, которую ты получаешь.","code":"def area(width, height):\n    result = width * height\n    return result\n\nroom = area(3, 4)\nhall = area(2, 5)\nprint(room, hall)","key":["`def` создаёт функцию, вызов `f()` её запускает.","Каждый вызов — новый кадр со своими переменными.","`return` возвращает значение и завершает функцию."],"id":"4-1","narr":{"1":"def создаёт объект-функцию, но тело пока НЕ выполняется","2":"Мы внутри нового кадра area()","3":"Отдаём значение наружу, кадр будет закрыт","5":"Вызов: создаётся кадр, width=3, height=4","6":"Второй вызов — новый, чистый кадр"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":3,"e":"l","f":[1,3],"h":[0],"o":0},{"l":3,"e":"r","f":[1,3],"h":[0],"o":0,"rv":["p","12"],"fn":"area"},{"l":6,"e":"l","f":[4],"h":[0],"o":0},{"l":2,"e":"l","f":[4,5],"h":[0],"o":0},{"l":3,"e":"l","f":[4,6],"h":[0],"o":0},{"l":3,"e":"r","f":[4,6],"h":[0],"o":0,"rv":["p","10"],"fn":"area"},{"l":7,"e":"l","f":[7],"h":[0],"o":0},{"l":0,"e":"d","f":[7],"h":[0],"o":6}],"objs":[{"n":1,"k":"func","t":"function","name":"area","sig":"(width, height)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["area",["r",1]]]},{"name":"area()","vars":[["width",["p","3"]],["height",["p","4"]]]},{"name":"area()","vars":[["width",["p","3"]],["height",["p","4"]],["result",["p","12"]]]},{"name":"глобальная область","vars":[["area",["r",1]],["room",["p","12"]]]},{"name":"area()","vars":[["width",["p","2"]],["height",["p","5"]]]},{"name":"area()","vars":[["width",["p","2"]],["height",["p","5"]],["result",["p","10"]]]},{"name":"глобальная область","vars":[["area",["r",1]],["room",["p","12"]],["hall",["p","10"]]]}],"out":"12 10\n","error":null,"truncated":false},"deep":"`def` — исполняемая инструкция: она создаёт объект-функцию, который содержит **код** (`__code__` с байткодом), ссылку на глобальное пространство имён и значения по умолчанию. При вызове создаётся **кадр** (frame) — запись со своими локальными переменными и указателем на текущую строку. Кадры складываются в **стек вызовов**.\n\n```\ndef f(): return 42\nprint(f.__name__, f.__code__.co_varnames)   # f ()\nimport dis\ndis.dis(f)   # покажет байткод: LOAD_CONST 42, RETURN_VALUE\n```\n\n`return` можно писать несколько раз; первый выполненный завершает функцию. `return a, b` возвращает кортеж.","pitfalls":["Путать `print` внутри функции и `return`: напечатанное значение нельзя использовать дальше.","Забыть скобки: `f` — сама функция, `f()` — вызов.","Код после `return` в той же ветке никогда не выполнится."],"links":["4-2","23-1","20-1"],"checks":[{"q":"Что напечатает код?","options":["5","None","5 | None","Ошибка"],"answer":2,"why":"Внутри функции печатается 5, но она ничего не возвращает, поэтому `r` — `None`.","code":"def f():\n    print(5)\nr = f()\nprint(r)"},{"q":"Что вернёт `def g(): return 1, 2`?","options":["1","2","Кортеж (1, 2)","Ошибку"],"answer":2,"why":"Несколько значений через запятую упаковываются в кортеж."}]},{"title":"Параметры и аргументы","covers":["параметры","аргументы"],"text":"**Параметры** — имена в определении функции: `def greet(name, greeting=\"Привет\")`. **Аргументы** — конкретные значения при вызове: `greet(\"Аня\")`.\n\nАргументы можно передавать **по позиции** (по порядку) или **по имени** (`greeting=\"Хай\"`). У параметра может быть **значение по умолчанию** — тогда аргумент можно не передавать.","code":"def greet(name, greeting=\"Привет\", mark=\"!\"):\n    return f\"{greeting}, {name}{mark}\"\n\nprint(greet(\"Аня\"))\nprint(greet(\"Боря\", \"Здравствуй\"))\nprint(greet(\"Вика\", mark=\"?\"))","key":["Параметр — имя в `def`, аргумент — значение при вызове.","Позиционные идут по порядку, именованные — по имени.","Не используй изменяемые объекты (`[]`, `{}`) как значение по умолчанию."],"id":"4-2","narr":{"1":"name — обязательный, остальные со значениями по умолчанию","4":"Позиционный аргумент, остальные по умолчанию","5":"Два позиционных","6":"Именованный аргумент — можно пропустить середину"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":2,"e":"r","f":[1,2],"h":[0],"o":0,"rv":["p","'Привет, Аня!'"],"fn":"greet"},{"l":5,"e":"l","f":[1],"h":[0],"o":13},{"l":2,"e":"l","f":[1,3],"h":[0],"o":13},{"l":2,"e":"r","f":[1,3],"h":[0],"o":13,"rv":["p","'Здравствуй, Боря!'"],"fn":"greet"},{"l":6,"e":"l","f":[1],"h":[0],"o":31},{"l":2,"e":"l","f":[1,4],"h":[0],"o":31},{"l":2,"e":"r","f":[1,4],"h":[0],"o":31,"rv":["p","'Привет, Вика?'"],"fn":"greet"},{"l":0,"e":"d","f":[1],"h":[0],"o":45}],"objs":[{"n":1,"k":"func","t":"function","name":"greet","sig":"(name, greeting='Привет', mark='!')"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["greet",["r",1]]]},{"name":"greet()","vars":[["name",["p","'Аня'"]],["greeting",["p","'Привет'"]],["mark",["p","'!'"]]]},{"name":"greet()","vars":[["name",["p","'Боря'"]],["greeting",["p","'Здравствуй'"]],["mark",["p","'!'"]]]},{"name":"greet()","vars":[["name",["p","'Вика'"]],["greeting",["p","'Привет'"]],["mark",["p","'?'"]]]}],"out":"Привет, Аня!\nЗдравствуй, Боря!\nПривет, Вика?\n","error":null,"truncated":false},"deep":"При вызове Python **связывает** аргументы с параметрами: сначала позиционные по порядку, затем именованные по имени, затем заполняет значения по умолчанию. Значения по умолчанию вычисляются **один раз — в момент `def`**, поэтому изменяемый default будет общим для всех вызовов:\n\n```\ndef add(x, bag=[]):     # плохо!\n    bag.append(x); return bag\nprint(add(1), add(2))   # [1, 2] [1, 2]\n\ndef add(x, bag=None):   # правильно\n    if bag is None: bag = []\n    bag.append(x); return bag\n```\n\nМожно запретить позиционную передачу: всё после `*` — только по имени; всё до `/` — только по позиции.","pitfalls":["Изменяемый объект (`[]`, `{}`) как значение по умолчанию.","Передать один аргумент и по позиции, и по имени — `TypeError: got multiple values`."],"links":["4-4","4-1","1-3"],"checks":[{"q":"Что напечатает код?","options":["[1] [2]","[1, 2] [1, 2]","[1] [1, 2]","Ошибка"],"answer":1,"why":"Список по умолчанию создан один раз при `def`, оба вызова дописывают в него и возвращают одну и ту же ссылку.","code":"def add(x, bag=[]):\n    bag.append(x)\n    return bag\nprint(add(1), add(2))"},{"q":"Когда вычисляется значение по умолчанию параметра?","options":["При каждом вызове","Один раз при выполнении def","При первом вызове","При импорте модуля, но заново после каждого вызова"],"answer":1,"why":"Значения по умолчанию сохраняются в объекте функции при её создании."}]},{"title":"Область видимости, local / global","covers":["область видимости","local / global"],"text":"Имена, созданные внутри функции, — **локальные**: они живут только в её кадре и не видны снаружи. Имена в начале файла — **глобальные**.\n\nPython ищет имя по правилу **LEGB**: Local → Enclosing (внешняя функция) → Global → Built-in. Читать глобальное имя внутри функции можно, а чтобы **перепривязать** его, нужно объявить `global name`. Обычно этого лучше избегать и возвращать значения через `return`.","code":"counter = 0\nlabel = \"глоб\"\n\ndef show():\n    label = \"лок\"\n    print(label, counter)\n\ndef increment():\n    global counter\n    counter = counter + 1\n\nshow()\nincrement()\nincrement()\nprint(label, counter)","key":["Присваивание внутри функции создаёт локальное имя.","Поиск имён: Local → Enclosing → Global → Built-in.","`global` позволяет менять глобальное имя, но лучше возвращать значения."],"id":"4-3","narr":{"1":"Глобальное имя","5":"Это НОВОЕ локальное имя, глобальное не трогаем","6":"label найден в локальной области, counter — в глобальной","10":"Из-за «global counter» выше меняется ГЛОБАЛЬНОЕ имя"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":4,"e":"l","f":[2],"h":[],"o":0},{"l":8,"e":"l","f":[3],"h":[0],"o":0},{"l":12,"e":"l","f":[4],"h":[0,1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[0,1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[0,1],"o":0},{"l":6,"e":"r","f":[4,6],"h":[0,1],"o":6,"rv":["p","None"],"fn":"show"},{"l":13,"e":"l","f":[4],"h":[0,1],"o":6},{"l":10,"e":"l","f":[4,7],"h":[0,1],"o":6},{"l":10,"e":"r","f":[8,7],"h":[0,1],"o":6,"rv":["p","None"],"fn":"increment"},{"l":14,"e":"l","f":[8],"h":[0,1],"o":6},{"l":10,"e":"l","f":[8,7],"h":[0,1],"o":6},{"l":10,"e":"r","f":[9,7],"h":[0,1],"o":6,"rv":["p","None"],"fn":"increment"},{"l":15,"e":"l","f":[9],"h":[0,1],"o":6},{"l":0,"e":"d","f":[9],"h":[0,1],"o":13}],"objs":[{"n":1,"k":"func","t":"function","name":"show","sig":"()"},{"n":2,"k":"func","t":"function","name":"increment","sig":"()"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["counter",["p","0"]]]},{"name":"глобальная область","vars":[["counter",["p","0"]],["label",["p","'глоб'"]]]},{"name":"глобальная область","vars":[["counter",["p","0"]],["label",["p","'глоб'"]],["show",["r",1]]]},{"name":"глобальная область","vars":[["counter",["p","0"]],["label",["p","'глоб'"]],["show",["r",1]],["increment",["r",2]]]},{"name":"show()","vars":[]},{"name":"show()","vars":[["label",["p","'лок'"]]]},{"name":"increment()","vars":[]},{"name":"глобальная область","vars":[["counter",["p","1"]],["label",["p","'глоб'"]],["show",["r",1]],["increment",["r",2]]]},{"name":"глобальная область","vars":[["counter",["p","2"]],["label",["p","'глоб'"]],["show",["r",1]],["increment",["r",2]]]}],"out":"лок 0\nглоб 2\n","error":null,"truncated":false},"deep":"Компилятор заранее решает, какие имена в функции **локальные**: любое имя, которому есть присваивание где-либо в теле функции, считается локальным во всей функции. Поэтому такой код падает:\n\n```\nx = 1\ndef f():\n    print(x)   # UnboundLocalError!\n    x = 2      # из-за этой строки x локальная везде в f\n```\n\nПоиск имени идёт по правилу **LEGB**: Local → Enclosing (внешние функции) → Global (модуль) → Built-in. `global` и `nonlocal` меняют это решение компилятора для конкретного имени.","pitfalls":["`UnboundLocalError`: чтение переменной до присваивания внутри той же функции.","Злоупотреблять `global` — лучше передавать значения параметрами и возвращать."],"links":["4-6","5-5","1-5"],"checks":[{"q":"Что напечатает код?","options":["1","2","UnboundLocalError","None"],"answer":0,"why":"Внутри `f` создаётся локальная `x = 2`, глобальная `x` остаётся 1.","code":"x = 1\ndef f():\n    x = 2\nf()\nprint(x)"},{"q":"В каком порядке Python ищет имя?","options":["Global → Local → Built-in","Local → Enclosing → Global → Built-in","Built-in → Global → Local","Только в Local"],"answer":1,"why":"Правило LEGB: локальная, объемлющая, глобальная, встроенная."}]},{"title":"*args и **kwargs","covers":["*args","**kwargs"],"text":"`*args` собирает все «лишние» позиционные аргументы в **кортеж**. `**kwargs` собирает все «лишние» именованные аргументы в **словарь**. Имена `args` и `kwargs` — традиция, важны звёздочки.\n\nЗвёздочки работают и в обратную сторону: `f(*lst)` распаковывает список в позиционные аргументы, `f(**d)` — словарь в именованные.","code":"def report(title, *args, **kwargs):\n    print(title, args, kwargs)\n    return sum(args)\n\nreport(\"Числа\", 1, 2, 3, unit=\"кг\", note=\"ok\")\ndata = [10, 20]\nopts = {\"unit\": \"м\"}\ntotal = report(\"Распаковка\", *data, **opts)\nprint(total)","key":["`*args` → tuple позиционных аргументов.","`**kwargs` → dict именованных.","`*` и `**` при вызове — распаковка."],"id":"4-4","narr":{"1":"title — обычный параметр","2":"args — кортеж, kwargs — словарь","8":"* и ** распаковывают коллекции в аргументы"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0,1,2],"o":0},{"l":3,"e":"l","f":[1,2],"h":[0,1,2],"o":45},{"l":3,"e":"r","f":[1,2],"h":[0,1,2],"o":45,"rv":["p","6"],"fn":"report"},{"l":6,"e":"l","f":[1],"h":[0],"o":45},{"l":7,"e":"l","f":[3],"h":[0,3],"o":45},{"l":8,"e":"l","f":[4],"h":[0,4,3],"o":45},{"l":2,"e":"l","f":[4,5],"h":[0,4,3,5,6],"o":45},{"l":3,"e":"l","f":[4,5],"h":[0,4,3,5,6],"o":79},{"l":3,"e":"r","f":[4,5],"h":[0,4,3,5,6],"o":79,"rv":["p","30"],"fn":"report"},{"l":9,"e":"l","f":[6],"h":[0,4,3],"o":79},{"l":0,"e":"d","f":[6],"h":[0,4,3],"o":82}],"objs":[{"n":1,"k":"func","t":"function","name":"report","sig":"(title, *args, **kwargs)"},{"n":2,"k":"tuple","t":"tuple","items":[["p","1"],["p","2"],["p","3"]],"more":0},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'unit'"],["p","'кг'"]],[["p","'note'"],["p","'ok'"]]],"more":0},{"n":4,"k":"list","t":"list","items":[["p","10"],["p","20"]],"more":0},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'unit'"],["p","'м'"]]],"more":0},{"n":5,"k":"tuple","t":"tuple","items":[["p","10"],["p","20"]],"more":0},{"n":6,"k":"dict","t":"dict","pairs":[[["p","'unit'"],["p","'м'"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["report",["r",1]]]},{"name":"report()","vars":[["title",["p","'Числа'"]],["args",["r",2]],["kwargs",["r",3]]]},{"name":"глобальная область","vars":[["report",["r",1]],["data",["r",4]]]},{"name":"глобальная область","vars":[["report",["r",1]],["data",["r",4]],["opts",["r",3]]]},{"name":"report()","vars":[["title",["p
