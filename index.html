, ns)` может изменить словарь атрибутов, добавить методы, проверить правила или зарегистрировать класс. Метакласс наследуется: все потомки `Plugin` тоже создаются через `PluginMeta`.\n\nЕсли у двух родителей разные метаклассы, Python потребует общий (конфликт метаклассов). Поэтому в библиотеках метаклассы применяют осторожно: `ABCMeta`, Django-модели, ORM.\n\nПравило из сообщества: «метаклассы — это более глубокая магия, чем нужно 99% пользователей». Чаще хватает декоратора класса или `__init_subclass__`.","pitfalls":["Конфликт метаклассов при множественном наследовании.","Использовать метакласс там, где хватает декоратора класса."],"links":["14-3","10-1","6-6"],"checks":[{"q":"Что напечатает код?","options":["['B']","['A', 'B']","[]","Ошибка"],"answer":0,"why":"Метакласс срабатывает при создании каждого класса; базовый A мы не регистрируем, потому что у него нет родителей.","code":"reg = []\nclass Meta(type):\n    def __new__(m, name, bases, ns):\n        cls = super().__new__(m, name, bases, ns)\n        if bases:\n            reg.append(name)\n        return cls\nclass A(metaclass=Meta): pass\nclass B(A): pass\nprint(reg)"},{"q":"Когда вызывается `__new__` метакласса?","options":["При создании экземпляра класса","При выполнении инструкции `class`, то есть при создании самого класса","При импорте модуля builtins","При вызове метода"],"answer":1,"why":"Метакласс создаёт класс, поэтому срабатывает в момент `class ...:`."}]},{"title":"__init_subclass__","covers":["__init_subclass__"],"text":"`__init_subclass__` — простая альтернатива метаклассам. Этот метод родителя вызывается **автоматически при создании каждого потомка**. Можно зарегистрировать потомка или проверить, что он объявил обязательные атрибуты.","code":"class Command:\n    commands = {}\n\n    def __init_subclass__(cls, name, **kw):\n        super().__init_subclass__(**kw)\n        Command.commands[name] = cls\n\nclass Hello(Command, name=\"hello\"):\n    def run(self):\n        return \"Привет!\"\n\nclass Bye(Command, name=\"bye\"):\n    def run(self):\n        return \"Пока!\"\n\nprint(list(Command.commands))\nprint(Command.commands[\"bye\"]().run())","key":["`__init_subclass__` вызывается при создании подкласса.","Принимает параметры из строки `class X(Base, param=...)`.","Проще метакласса для регистрации и проверок."],"id":"14-3","narr":{"4":"Вызывается при создании потомка","8":"Параметр name уходит в __init_subclass__"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"Command"},{"l":8,"e":"l","f":[5],"h":[0,3],"o":0},{"l":8,"e":"l","f":[5,6],"h":[0,3],"o":0},{"l":9,"e":"l","f":[5,7],"h":[0,3],"o":0},{"l":9,"e":"r","f":[5,8],"h":[0,3,4],"o":0,"rv":["p","None"],"fn":"Hello"},{"l":5,"e":"l","f":[5,9],"h":[0,3,5,6],"o":0},{"l":6,"e":"l","f":[5,9],"h":[0,3,5,6],"o":0},{"l":6,"e":"r","f":[5,9],"h":[7,3,5,6],"o":0,"rv":["p","None"],"fn":"__init_subclass__"},{"l":12,"e":"l","f":[10],"h":[7,3,5],"o":0},{"l":12,"e":"l","f":[10,11],"h":[7,3,5],"o":0},{"l":13,"e":"l","f":[10,12],"h":[7,3,5],"o":0},{"l":13,"e":"r","f":[10,13],"h":[7,3,5,8],"o":0,"rv":["p","None"],"fn":"Bye"},{"l":5,"e":"l","f":[10,14],"h":[7,3,5,9,10],"o":0},{"l":6,"e":"l","f":[10,14],"h":[7,3,5,9,10],"o":0},{"l":6,"e":"r","f":[10,14],"h":[11,3,5,9,10],"o":0,"rv":["p","None"],"fn":"__init_subclass__"},{"l":16,"e":"l","f":[15],"h":[11,3,5,9],"o":0},{"l":17,"e":"l","f":[15],"h":[11,3,5,9],"o":17},{"l":14,"e":"l","f":[15,16],"h":[11,3,5,9,12],"o":17},{"l":14,"e":"r","f":[15,16],"h":[11,3,5,9,12],"o":17,"rv":["p","'Пока!'"],"fn":"run"},{"l":0,"e":"d","f":[15],"h":[11,3,5,9],"o":23}],"objs":[{"n":1,"k":"dict","t":"dict","pairs":[],"more":0},{"n":2,"k":"func","t":"function","name":"Command.__init_subclass__","sig":"(cls, name, **kw)","cells":{"__class__":["p","<пусто>"]}},{"n":3,"k":"other","t":"cell","r":"<cell: empty>"},{"n":4,"k":"class","t":"class","name":"Command","bases":[],"attrs":{"commands":["r",1]}},{"n":5,"k":"func","t":"function","name":"Hello.run","sig":"(self)"},{"n":6,"k":"class","t":"class","name":"Hello","bases":["Command"],"attrs":{"run":["p","метод"]}},{"n":7,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'hello'"],["r",6]]],"more":0},{"n":8,"k":"func","t":"function","name":"Bye.run","sig":"(self)"},{"n":9,"k":"class","t":"class","name":"Bye","bases":["Command"],"attrs":{"run":["p","метод"]}},{"n":10,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'hello'"],["r",6]],[["p","'bye'"],["r",9]]],"more":0},{"n":11,"k":"obj","t":"Bye","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Command()","vars":[]},{"name":"тело класса Command","vars":[]},{"name":"тело класса Command","vars":[["commands",["r",1]]]},{"name":"тело класса Command","vars":[["commands",["r",1]],["__init_subclass__",["r",2]],["__classcell__",["r",3]]]},{"name":"глобальная область","vars":[["Command",["r",4]]]},{"name":"Hello()","vars":[]},{"name":"тело класса Hello","vars":[]},{"name":"тело класса Hello","vars":[["run",["r",5]]]},{"name":"__init_subclass__()","vars":[["cls",["r",6]],["name",["p","'hello'"]],["kw",["r",7]]]},{"name":"глобальная область","vars":[["Command",["r",4]],["Hello",["r",6]]]},{"name":"Bye()","vars":[]},{"name":"тело класса Bye","vars":[]},{"name":"тело класса Bye","vars":[["run",["r",8]]]},{"name":"__init_subclass__()","vars":[["cls",["r",9]],["name",["p","'bye'"]],["kw",["r",10]]]},{"name":"глобальная область","vars":[["Command",["r",4]],["Hello",["r",6]],["Bye",["r",9]]]},{"name":"run()","vars":[["self",["r",11]]]}],"out":"['hello', 'bye']\nПока!\n","error":null,"truncated":false},"deep":"`__init_subclass__` (PEP 487) — хук, который Python вызывает у **родителя** каждый раз, когда создаётся подкласс. По умолчанию это `classmethod`. Он решает большинство задач метаклассов (регистрация плагинов, проверка обязательных атрибутов) без их сложностей.\n\n```\nclass Model:\n    def __init_subclass__(cls, **kw):\n        super().__init_subclass__(**kw)\n        if not hasattr(cls, \"table\"):\n            raise TypeError(f\"{cls.__name__}: нужен атрибут table\")\n```\n\nБлизкий родственник — `__set_name__` у дескрипторов: тоже вызывается при создании класса.","pitfalls":["Забыть `super().__init_subclass__(**kw)` — сломаются другие классы в цепочке.","Ждать вызова для самого базового класса — хук срабатывает только для подклассов."],"links":["14-2","12-1"],"checks":[{"q":"Что напечатает код?","options":["['Child']","['Base', 'Child']","[]","Ошибка"],"answer":0,"why":"Хук вызывается только при создании подклассов, не самого Base.","code":"seen = []\nclass Base:\n    def __init_subclass__(cls, **kw):\n        super().__init_subclass__(**kw)\n        seen.append(cls.__name__)\nclass Child(Base): pass\nprint(seen)"},{"q":"Чем `__init_subclass__` лучше метакласса для регистрации плагинов?","options":["Он быстрее","Он проще и не вызывает конфликтов метаклассов","Он работает для экземпляров","Он обязателен в Python 3"],"answer":1,"why":"Это обычный метод класса без отдельного метакласса."}]}],"zone":13,"world":{"name":"Фабрика фабрик","hue":300,"kind":"engine","intro":"Машина `type` штампует чертежи-классы, а по чертежам потом строятся объекты.","why":"Метаклассы объясняют, как появляются сами классы, и дают точку для автоматической регистрации и проверок.","spots":{"type":[null,"Главная машина: `type` — класс всех классов. Даже `type` сделан машиной `type`."],"class creation":["class creation","Конвейер: имя + родители + словарь атрибутов → готовый класс."],"metaclass":[null,"Особая машина со своим журналом: собственный метакласс вмешивается в создание классов."],"__new__":[null,"Пресс метакласса: срабатывает в момент инструкции `class` и создаёт объект-класс."],"__init_subclass__":[null,"Инспектор у родительского цеха: проверяет каждый новый подкласс."]}}},{"title":"Модули и пакеты","items":["module","package","import","from ... import","__name__","__main__","__init__.py","namespace"],"intro":"Как разложить код по файлам и папкам и собрать его вместе.","lessons":[{"title":"Модуль и import","covers":["module","import","from ... import","namespace"],"opts":{"show_modules":true},"text":"**Модуль** — это просто файл `.py`. `import geometry` выполняет этот файл **один раз** и создаёт объект-модуль; его содержимое доступно через точку: `geometry.PI`. У каждого модуля своё **пространство имён** (namespace) — поэтому имена из разных файлов не конфликтуют.\n\n`from geometry import circle_area` берёт из модуля конкретное имя и кладёт его в **твоё** пространство имён. Повторный `import` не выполняет файл заново — модуль берётся из кэша `sys.modules`.","code":"import geometry\nprint(geometry.PI)\nfrom geometry import circle_area\nprint(circle_area(2))\nimport geometry\nimport math as m\nprint(m.sqrt(16))","key":["Модуль = файл .py, выполняется при первом импорте.","`import m` → `m.имя`; `from m import имя` → просто `имя`.","У каждого модуля своё пространство имён."],"id":"15-1","narr":{"1":"Выполняется geometry.py, создаётся объект-модуль","2":"Доступ через имя модуля","3":"Копируем одно имя в наше пространство имён","5":"Повторный импорт — файл НЕ выполняется второй раз","6":"Псевдоним"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":18},{"l":3,"e":"l","f":[1],"h":[0],"o":26},{"l":4,"e":"l","f":[1],"h":[0],"o":26},{"l":5,"e":"l","f":[1],"h":[0],"o":35},{"l":6,"e":"l","f":[1],"h":[0],"o":35},{"l":7,"e":"l","f":[2],"h":[0,1],"o":35},{"l":0,"e":"d","f":[2],"h":[0,1],"o":39}],"objs":[{"n":1,"k":"other","t":"module","r":"модуль geometry: PI, circle_area"},{"n":2,"k":"other","t":"module","r":"модуль math: acos, acosh, asin, asinh, atan, atan2, atanh, cbrt"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["geometry",["r",1]]]},{"name":"глобальная область","vars":[["geometry",["r",1]],["m",["r",2]]]}],"out":"geometry загружен\n3.14159\n12.56636\n4.0\n","error":null,"truncated":false},"files_show":{"geometry.py":"PI = 3.14159\n\ndef circle_area(r):\n    return PI * r * r\n\nprint('geometry загружен')\n"},"deep":"`import name` делает:\n1. смотрит в кэш `sys.modules` — если модуль уже загружен, просто берёт его;\n2. иначе ищет файл по путям из `sys.path` (папка запуска, стандартная библиотека, site-packages);\n3. создаёт объект-модуль, **выполняет** файл в его пространстве имён и кладёт модуль в кэш;\n4. связывает имя в текущем пространстве имён.\n\n`from m import x` копирует **ссылку** на объект `x` в твоё пространство имён. Если потом в модуле `m` переприсвоят `x`, у тебя останется старый объект. `import *` засоряет пространство имён — его избегают.","pitfalls":["Назвать свой файл `random.py` или `json.py` — он заслонит стандартный модуль.","Циклические импорты (`a` импортирует `b`, `b` импортирует `a`) — частично инициализированные модули.","Ждать, что повторный `import` перечитает изменённый файл."],"links":["15-2","5-5","15-3"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","None"],"answer":0,"why":"Повторный импорт берёт модуль из кэша `sys.modules` — это тот же объект.","code":"import math\nimport math as m2\nprint(math is m2)"},{"q":"Где Python ищет модули при импорте?","options":["Только в текущей папке","По списку путей `sys.path`","Только в интернете","В переменной PATH операционной системы"],"answer":1,"why":"`sys.path` содержит папку запуска, стандартную библиотеку и site-packages."}]},{"title":"Пакет и __init__.py","covers":["package","__init__.py"],"opts":{"show_modules":true},"text":"**Пакет** — папка с модулями. Файл `__init__.py` внутри папки выполняется при импорте пакета: в нём часто «поднимают» важные имена наверх, чтобы писать `from shop import Cart` вместо `from shop.cart import Cart`.\n\nИмпорт внутри пакета пишут с точкой: `from .cart import Cart` — «из соседнего модуля».","code":"import shop\nfrom shop.cart import Cart\nfrom shop import Cart as C2\nprint(Cart is C2)\nc = Cart().add(\"хлеб\").add(\"сыр\")\nprint(c.items)","key":["Пакет = папка с модулями.","`__init__.py` выполняется при импорте пакета.","`from .модуль import X` — импорт внутри пакета."],"id":"15-2","narr":{"1":"Выполняется shop/__init__.py","2":"Полный путь: пакет.модуль","3":"Короткий путь — благодаря __init__.py","4":"Это один и тот же класс"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":27},{"l":3,"e":"l","f":[1],"h":[0],"o":27},{"l":4,"e":"l","f":[1],"h":[0],"o":27},{"l":5,"e":"l","f":[1],"h":[0],"o":32},{"l":6,"e":"l","f":[2],"h":[0,1],"o":32},{"l":0,"e":"d","f":[2],"h":[0,1],"o":48}],"objs":[{"n":1,"k":"other","t":"module","r":"модуль shop: cart, Cart"},{"n":2,"k":"other","t":"Cart","r":"<shop.cart.Cart object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["shop",["r",1]]]},{"name":"глобальная область","vars":[["shop",["r",1]],["c",["r",2]]]}],"out":"пакет shop инициализирован\nTrue\n['хлеб', 'сыр']\n","error":null,"truncated":false},"files_show":{"shop/__init__.py":"print('пакет shop инициализирован')\nfrom .cart import Cart\n","shop/cart.py":"class Cart:\n    def __init__(self):\n        self.items = []\n    def add(self, item):\n        self.items.append(item)\n        return self\n"},"deep":"Пакет — модуль, у которого есть атрибут `__path__` (папка). `import shop.cart` сначала импортирует `shop` (выполняет `shop/__init__.py`), затем `shop.cart`. Подмодуль становится атрибутом пакета.\n\nОтносительный импорт `from .cart import Cart` работает **только внутри пакета**; запуск такого файла напрямую (`python cart.py`) даст ошибку — пакетные модули запускают как `python -m shop.cart`.\n\nБез `__init__.py` папка тоже импортируется — как **namespace package** (PEP 420), который может собираться из нескольких папок. Но для обычных проектов `__init__.py` лучше оставить: он делает структуру явной.","pitfalls":["Запускать файл с относительными импортами напрямую — `ImportError: attempted relative import with no known parent package`.","Складывать в `__init__.py` тяжёлую логику — она выполнится при любом импорте пакета."],"links":["15-1","24-1"],"checks":[{"q":"Что выполняется первым при `import shop.cart`?","options":["shop/cart.py","shop/__init__.py","Ничего, только поиск","Оба одновременно"],"answer":1,"why":"Сначала импортируется родительский пакет, его `__init__.py`."},{"q":"Как правильно запустить модуль внутри пакета, где есть относительные импорты?","options":["python shop/cart.py","python -m shop.cart","import cart","Только через IDE"],"answer":1,"why":"Флаг `-m` запускает модуль как часть пакета, и относительные импорты работают."}]},{"title":"__name__ и __main__","covers":["__name__","__main__"],"opts":{"show_name":true},"text":"У каждого модуля есть переменная `__name__`. Если файл **запущен напрямую** (`python tools.py`), в ней лежит строка `\"__main__\"`. Если файл **импортирован**, там его имя — `\"tools\"`.\n\nПоэтому блок `if __name__ == \"__main__\":` выполняется только при прямом запуске. Туда кладут демонстрацию или тесты, которые не должны срабатывать при импорте.","code":"print(\"Этот файл:\", __name__)\nimport tools\nprint(tools.shout(\"привет\"))\nif __name__ == \"__main__\":\n    print(\"Главная программа стартует\")","key":["Запущен напрямую → `__name__ == '__main__'`.","Импортирован → `__name__` = имя модуля.","`if __name__ == '__main__':` — точка входа программы."],"id":"15-3","narr":{"1":"Мы запущены напрямую → \"__main__\"","2":"В tools.py __name__ будет \"tools\", поэтому блок if там не сработает","5":"Сработает: мы — главный модуль"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[0],"h":[],"o":20},{"l":3,"e":"l","f":[0],"h":[],"o":44},{"l":4,"e":"l","f":[0],"h":[],"o":52},{"l":5,"e":"l","f":[0],"h":[],"o":52},{"l":0,"e":"d","f":[0],"h":[],"o":79}],"objs":[],"frames":[{"name":"глобальная область","vars":[["__name__",["p","'__main__'"]]]}],"out":"Этот файл: __main__\ntools: __name__ = tools\nПРИВЕТ!\nГлавная программа стартует\n","error":null,"truncated":false},"files_show":{"tools.py":"def shout(s):\n    return s.upper() + '!'\n\nprint('tools: __name__ =', __name__)\n\nif __name__ == '__main__':\n    print('Запущен как программа — тесты')\n"},"deep":"При запуске `python app.py` модуль `app` загружается под именем `\"__main__\"`. Если тот же файл потом импортируют, он загрузится **второй раз** — уже под своим именем. Поэтому код верхнего уровня, который запускает программу, прячут под `if __name__ == \"__main__\":`.\n\nТипичный шаблон:\n```\ndef main():\n    ...\nif __name__ == \"__main__\":\n    main()\n```\n\nДля пакета `python -m shop` запускает `shop/__main__.py`. Это удобная точка входа для командных утилит.","pitfalls":["Код запуска без проверки `__name__` выполняется при каждом импорте модуля.","Импортировать главный модуль из другого модуля — получится второй экземпляр с отдельным состоянием."],"links":["15-1","15-2"],"checks":[{"q":"Что напечатает код, если файл запущен напрямую?","options":["__main__","имя файла","None","main"],"answer":0,"why":"Запущенный модуль получает имя `__main__`.","code":"print(__name__)"},{"q":"Зачем нужен `if __name__ == '__main__':`?","options":["Ускоряет программу","Чтобы код запуска не выполнялся при импорте модуля","Это обязательная строка","Чтобы задать имя модуля"],"answer":1,"why":"Блок выполнится только при прямом запуске файла."}]}],"zone":14,"world":{"name":"Порт модулей","hue":190,"kind":"port","intro":"Код упакован в контейнеры-модули, контейнеры собраны в корабли-пакеты, краны `import` выгружают их в программу.","why":"Настоящие программы состоят из многих файлов. Модули дают каждому файлу своё пространство имён.","spots":{"module":[null,"Контейнер = один файл `.py` со своим набором имён."],"package":[null,"Корабль = папка, в которой лежат модули-контейнеры."],"import":[null,"Кран целиком переносит контейнер в программу: `import geometry`."],"from ... import":["from … import","Кран достаёт из контейнера одну вещь: `from geometry import circle_area`."],"__name__":[null,"Бирка на контейнере: имя модуля, а у запущенного файла — `__main__`."],"__main__":[null,"Флаг капитана: этот модуль запущен напрямую, он главный."],"__init__.py":[null,"Судовой манифест: выполняется при импорте пакета и поднимает нужные имена наверх."],"namespace":[null,"Опись груза на каждом контейнере: свои имена, которые не путаются с чужими."]}}},{"title":"Исключения","items":["Exception","try","except","else","finally","raise","custom exceptions"],"intro":"Ошибки во время работы программы — это тоже объекты. Их можно поймать, обработать и даже создать свои.","lessons":[{"title":"Что такое исключение","covers":["Exception"],"text":"Когда Python не может выполнить действие (деление на ноль, нет ключа в словаре, неверный тип), он создаёт **объект-исключение** и «выбрасывает» его. Выполнение текущей функции прерывается, и исключение летит вверх по стеку вызовов, пока его кто-нибудь не поймает. Если не поймал никто — программа падает.\n\nВсе обычные исключения наследуют от `Exception`: `ValueError`, `TypeError`, `KeyError`, `IndexError`, `ZeroDivisionError`… Смотри в визуализаторе на шаги с красным «!».","code":"def divide(a, b):\n    return a / b\n\ndef calc():\n    return divide(10, 0)\n\ntry:\n    calc()\nexcept Exception as e:\n    print(\"Поймали:\", type(e).__name__, \"-\", e)\n    print(isinstance(e, ZeroDivisionError), isinstance(e, Exception))","key":["Исключение — объект, описывающий ошибку.","Оно поднимается вверх по стеку вызовов.","Не поймано — программа завершается с ошибкой."],"id":"16-1","narr":{"2":"При b = 0 здесь возникнет ZeroDivisionError","5":"Исключение пролетит и через эту функцию","9":"Ловим на самом верху"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":8,"e":"l","f":[2],"h":[0,1],"o":0},{"l":5,"e":"l","f":[2,3],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3,4],"h":[0,1],"o":0},{"l":2,"e":"e","f":[2,3,4],"h":[0,1],"o":0,"ex":"ZeroDivisionError: division by zero"},{"l":2,"e":"r","f":[2,3,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"divide"},{"l":5,"e":"e","f":[2,3],"h":[0,1],"o":0,"ex":"ZeroDivisionError: division by zero"},{"l":5,"e":"r","f":[2,3],"h":[0,1],"o":0,"rv":["p","None"],"fn":"calc"},{"l":8,"e":"e","f":[2],"h":[0,1],"o":0,"ex":"ZeroDivisionError: division by zero"},{"l":9,"e":"l","f":[2],"h":[0,1],"o":0},{"l":10,"e":"l","f":[5],"h":[0,1,2,3],"o":0},{"l":11,"e":"l","f":[5],"h":[0,1,2,3],"o":46},{"l":0,"e":"d","f":[2],"h":[0,1],"o":56}],"objs":[{"n":1,"k":"func","t":"function","name":"divide","sig":"(a, b)"},{"n":2,"k":"func","t":"function","name":"calc","sig":"()"},{"n":3,"k":"obj","t":"ZeroDivisionError","attrs":{"args":["r",4]},"exc":true},{"n":4,"k":"tuple","t":"tuple","items":[["p","'division by zero'"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["divide",["r",1]]]},{"name":"глобальная область","vars":[["divide",["r",1]],["calc",["r",2]]]},{"name":"calc()","vars":[]},{"name":"divide()","vars":[["a",["p","10"]],["b",["p","0"]]]},{"name":"глобальная область","vars":[["divide",["r",1]],["calc",["r",2]],["e",["r",3]]]}],"out":"Поймали: ZeroDivisionError - division by zero\nTrue True\n","error":null,"truncated":false},"deep":"Исключения образуют **иерархию классов**. Корень — `BaseException`; от него идут `Exception` (обычные ошибки), а также `KeyboardInterrupt` и `SystemExit`, которые не стоит ловить случайно. Поэтому `except Exception:` безопаснее голого `except:`.\n\n```\nBaseException\n ├── KeyboardInterrupt, SystemExit\n └── Exception\n      ├── ArithmeticError → ZeroDivisionError\n      ├── LookupError → KeyError, IndexError\n      ├── ValueError, TypeError, AttributeError …\n```\n\nКогда исключение не поймано, Python печатает **traceback** — стек кадров от места вызова до места ошибки. Читать его нужно **снизу вверх**: последняя строка — тип и сообщение, над ней — строка, где всё сломалось.","pitfalls":["Голый `except:` ловит даже Ctrl+C и `sys.exit()`.","Читать traceback сверху и искать ошибку не там."],"links":["16-2","16-3","23-1"],"checks":[{"q":"Что напечатает код?","options":["True True","True False","False True","False False"],"answer":0,"why":"`KeyError` — подкласс `LookupError`, а тот — подкласс `Exception`.","code":"print(issubclass(KeyError, LookupError), issubclass(KeyError, Exception))"},{"q":"Почему не стоит писать голый `except:`?","options":["Он медленный","Он ловит и KeyboardInterrupt/SystemExit, мешая остановить программу","Он не ловит ошибки","Так нельзя по синтаксису"],"answer":1,"why":"Голый except перехватывает все BaseException, включая сигналы остановки."}]},{"title":"try / except / else / finally","covers":["try","except","else","finally"],"text":"`try` — «попробуй выполнить». `except Тип` — «если случилась такая ошибка, сделай это». `else` — выполняется, **если ошибки не было**. `finally` — выполняется **всегда**, при ошибке и без — туда кладут уборку: закрыть файл, соединение.\n\nМожно писать несколько `except` для разных ошибок: срабатывает первый подходящий. Пройди по шагам оба запуска: с хорошими данными и с плохими.","code":"def parse_age(text):\n    try:\n        age = int(text)\n    except ValueError:\n        print(f\"'{text}' — не число\")\n        age = None\n    else:\n        print(\"Успешно:\", age)\n    finally:\n        print(\"Проверка завершена\")\n    return age\n\nparse_age(\"25\")\nparse_age(\"abc\")","key":["`try` → `except` при ошибке → `else` без ошибки → `finally` всегда.","Лови конкретные исключения, а не все подряд.","`finally` — для освобождения ресурсов."],"quiz":{"q":"Что выполнится, если в `try` ошибки НЕ было?","options":["except и finally","else и finally","только finally","только else"],"answer":1,"why":"`else` — для случая без ошибки, `finally` — всегда."},"id":"16-2","narr":{"3":"Может бросить ValueError","8":"Только если ошибки не было","10":"Всегда"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":13,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":3,"e":"l","f":[1,2],"h":[0],"o":0},{"l":8,"e":"l","f":[1,3],"h":[0],"o":0},{"l":10,"e":"l","f":[1,3],"h":[0],"o":12},{"l":11,"e":"l","f":[1,3],"h":[0],"o":31},{"l":11,"e":"r","f":[1,3],"h":[0],"o":31,"rv":["p","25"],"fn":"parse_age"},{"l":14,"e":"l","f":[1],"h":[0],"o":31},{"l":2,"e":"l","f":[1,4],"h":[0],"o":31},{"l":3,"e":"l","f":[1,4],"h":[0],"o":31},{"l":3,"e":"e","f":[1,4],"h":[0],"o":31,"ex":"ValueError: invalid literal for int() with base 10: 'abc'"},{"l":4,"e":"l","f":[1,4],"h":[0],"o":31},{"l":5,"e":"l","f":[1,4],"h":[0],"o":31},{"l":6,"e":"l","f":[1,4],"h":[0],"o":48},{"l":10,"e":"l","f":[1,5],"h":[0],"o":48},{"l":11,"e":"l","f":[1,5],"h":[0],"o":67},{"l":11,"e":"r","f":[1,5],"h":[0],"o":67,"rv":["p","None"],"fn":"parse_age"},{"l":0,"e":"d","f":[1],"h":[0],"o":67}],"objs":[{"n":1,"k":"func","t":"function","name":"parse_age","sig":"(text)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["parse_age",["r",1]]]},{"name":"parse_age()","vars":[["text",["p","'25'"]]]},{"name":"parse_age()","vars":[["text",["p","'25'"]],["age",["p","25"]]]},{"name":"parse_age()","vars":[["text",["p","'abc'"]]]},{"name":"parse_age()","vars":[["text",["p","'abc'"]],["age",["p","None"]]]}],"out":"Успешно: 25\nПроверка завершена\n'abc' — не число\nПроверка завершена\n","error":null,"truncated":false},"deep":"Python проверяет `except`-ветки **сверху вниз** и выбирает первую подходящую по `isinstance`. Поэтому узкие исключения ставят выше широких. Можно ловить несколько типов кортежем: `except (KeyError, IndexError):`.\n\n`finally` выполняется **всегда**: и при `return` внутри `try`, и при исключении. Если `finally` сам делает `return`, он перекрывает и возвращаемое значение, и исключение — так писать не стоит.\n\n```\ndef f():\n    try:\n        return \"try\"\n    finally:\n        print(\"finally сработал\")\nprint(f())\n```\n\nВ `try` держи как можно меньше кода — только то, что действительно может бросить ожидаемое исключение.","pitfalls":["Ставить `except Exception` выше `except ValueError` — узкая ветка никогда не сработает.","`return` в `finally` — проглатывает исключения.","Огромный блок `try` — непонятно, какая строка бросила ошибку."],"links":["16-1","18-1","17-3"],"checks":[{"q":"Что напечатает код?","options":["try","finally | try","try | finally","finally"],"answer":1,"why":"`finally` выполняется перед тем, как функция фактически вернёт значение, поэтому сначала печатается 'finally'.","code":"def f():\n    try:\n        return 'try'\n    finally:\n        print('finally')\nprint(f())"},{"q":"Что напечатает код?","options":["общая","значение","ничего","Ошибка"],"answer":0,"why":"Ветки проверяются по порядку: `Exception` подходит для `ValueError` и стоит первой.","code":"try:\n    int('x')\nexcept Exception:\n    print('общая')\nexcept ValueError:\n    print('значение')"}]},{"title":"raise и свои исключения","covers":["raise","custom exceptions"],"text":"`raise` бросает исключение самостоятельно — когда твоя функция обнаружила недопустимую ситуацию. Свои исключения создают, наследуя от `Exception`: так их можно ловить отдельно и добавлять полезные поля.\n\n`raise ... from e` сохраняет исходную причину — удобно, когда одну ошибку превращаешь в другую.","code":"class NotEnoughMoney(Exception):\n    def __init__(self, need, have):\n        super().__init__(f\"Нужно {need}, есть {have}\")\n        self.need = need\n        self.have = have\n\ndef buy(price, wallet):\n    if price > wallet:\n        raise NotEnoughMoney(price, wallet)\n    return wallet - price\n\ntry:\n    buy(500, 120)\nexcept NotEnoughMoney as e:\n    print(\"Ошибка:\", e)\n    print(\"Не хватает:\", e.need - e.have)","key":["`raise X(...)` — бросить исключение.","Свои исключения — `class MyError(Exception)`.","В них можно хранить дополнительные данные."],"id":"16-3","narr":{"1":"Своё исключение","9":"Бросаем своё исключение"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0,1],"o":0,"rv":["r",2],"fn":"NotEnoughMoney"},{"l":7,"e":"l","f":[4],"h":[2],"o":0},{"l":12,"e":"l","f":[5],"h":[2,3],"o":0},{"l":13,"e":"l","f":[5],"h":[2,3],"o":0},{"l":8,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":9,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":3,"e":"l","f":[5,6,7],"h":[2,3,4,5],"o":0},{"l":4,"e":"l","f":[5,6,7],"h":[2,3,6,7],"o":0},{"l":5,"e":"l","f":[5,6,7],"h":[2,3,8,7],"o":0},{"l":5,"e":"r","f":[5,6,7],"h":[2,3,9,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":9,"e":"e","f":[5,6],"h":[2,3],"o":0,"ex":"NotEnoughMoney: Нужно 500, есть 120"},{"l":9,"e":"r","f":[5,6],"h":[2,3],"o":0,"rv":["p","None"],"fn":"buy"},{"l":13,"e":"e","f":[5],"h":[2,3],"o":0,"ex":"NotEnoughMoney: Нужно 500, есть 120"},{"l":14,"e":"l","f":[5],"h":[2,3],"o":0},{"l":15,"e":"l","f":[8],"h":[2,3,9,7],"o":0},{"l":16,"e":"l","f":[8],"h":[2,3,9,7],"o":28},{"l":0,"e":"d","f":[5],"h":[2,3],"o":44}],"objs":[{"n":1,"k":"func","t":"function","name":"NotEnoughMoney.__init__","sig":"(self, need, have)","cells":{"__class__":["p","<пусто>"]}},{"n":2,"k":"other","t":"cell","r":"<cell: empty>"},{"n":3,"k":"class","t":"class","name":"NotEnoughMoney","bases":["Exception"],"attrs":{"__init__":["p","метод"]}},{"n":4,"k":"func","t":"function","name":"buy","sig":"(price, wallet)"},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",6]},"exc":true},{"n":6,"k":"tuple","t":"tuple","items":[["p","500"],["p","120"]],"more":0},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",7]},"exc":true},{"n":7,"k":"tuple","t":"tuple","items":[["p","'Нужно 500, есть 120'"]],"more":0},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",7],"need":["p","500"]},"exc":true},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",7],"need":["p","500"],"have":["p","120"]},"exc":true}],"frames":[{"name":"глобальная область","vars":[]},{"name":"NotEnoughMoney()","vars":[]},{"name":"тело класса NotEnoughMoney","vars":[]},{"name":"тело класса NotEnoughMoney","vars":[["__init__",["r",1]],["__classcell__",["r",2]]]},{"name":"глобальная область","vars":[["NotEnoughMoney",["r",3]]]},{"name":"глобальная область","vars":[["NotEnoughMoney",["r",3]],["buy",["r",4]]]},{"name":"buy()","vars":[["price",["p","500"]],["wallet",["p","120"]]]},{"name":"__init__()","vars":[["self",["r",5]],["need",["p","500"]],["have",["p","120"]]]},{"name":"глобальная область","vars":[["NotEnoughMoney",["r",3]],["buy",["r",4]],["e",["r",5]]]}],"out":"Ошибка: Нужно 500, есть 120\nНе хватает: 380\n","error":null,"truncated":false},"deep":"`raise X from e` сохраняет исходное исключение в `__cause__` — в traceback видно «The above exception was the direct cause…». Если поднять новое исключение внутри `except` без `from`, Python всё равно сохранит контекст в `__context__`. `raise` без аргументов внутри `except` перебрасывает текущее исключение дальше.\n\nСвою иерархию исключений делают так: один базовый класс для библиотеки (`class ShopError(Exception)`) и конкретные потомки. Тогда пользователь может ловить всё сразу или точечно.\n\nPython 3.11 добавил `ExceptionGroup` и `except*` для нескольких одновременных ошибок (например, из параллельных задач) и `e.add_note(...)` для добавления пояснений.","pitfalls":["Бросать голый `Exception(\"...\")` — его невозможно поймать точечно.","Глушить исключение в `except` и бросать новое без `from` — теряется понятная причина."],"links":["16-1","16-2"],"checks":[{"q":"Что напечатает код?","options":["KeyError","ValueError","None","Ошибка"],"answer":0,"why":"`raise ... from e` сохраняет исходное исключение в атрибуте `__cause__`.","code":"try:\n    try:\n        {}['x']\n    except KeyError as e:\n        raise ValueError('нет настройки') from e\nexcept ValueError as v:\n    print(type(v.__cause__).__name__)"},{"q":"Зачем делать свой базовый класс исключений для библиотеки?","options":["Так требует Python","Чтобы можно было поймать все ошибки библиотеки одним except","Чтобы исключения были быстрее","Чтобы не писать сообщения"],"answer":1,"why":"Общий предок позволяет ловить всю группу ошибок сразу."}]}],"zone":15,"world":{"name":"Цирк со страховкой","hue":8,"kind":"village","intro":"Акробат идёт по канату (`try`). Упадёт — поймает подходящая сетка (`except`). Уборщик выходит всегда (`finally`).","why":"Исключения позволяют отделить обычный путь от обработки ошибок и не терять ресурсы при сбоях.","spots":{"Exception":[null,"Падающий красный мяч: объект-ошибка, который летит вверх по стеку вызовов."],"try":[null,"Канат: опасный участок, где может что-то пойти не так."],"except":[null,"Сетка с надписью `ValueError`: ловит только ошибки своего вида."],"else":[null,"Аплодисменты: срабатывают, только если никто не упал."],"finally":[null,"Уборщик: выходит после номера всегда — с падением и без."],"raise":[null,"Красный флаг: программа сама сигналит об ошибке."],"custom exceptions":["custom exceptions","Флаг своего цвета `NotEnoughMoney`: своя ошибка для своей ситуации."]}}},{"title":"Файлы и I/O","items":["open()","read()","write()","close()","with","context manager","streams"],"intro":"Ввод-вывод (I/O): как программа читает и пишет данные в файлы и потоки.","lessons":[{"title":"open, write и close","covers":["open()","write()","close()"],"text":"`open(путь, режим)` открывает файл и возвращает **файловый объект**. Режимы: `\"r\"` — читать, `\"w\"` — записать заново (старое содержимое стирается), `\"a\"` — дописать в конец. Для русских букв указывай `encoding=\"utf-8\"`.\n\n`write(текст)` пишет строку (перевод строки `\\n` нужно добавлять самому). `close()` закрывает файл и сбрасывает данные на диск. Забыть `close()` — частая ошибка, поэтому обычно используют `with` (следующие уроки).","code":"f = open(\"notes.txt\", \"w\", encoding=\"utf-8\")\nf.write(\"Купить хлеб\\n\")\nf.write(\"Позвонить маме\\n\")\nf.close()\nprint(f.closed)\ng = open(\"notes.txt\", \"a\", encoding=\"utf-8\")\ng.write(\"Выучить Python\\n\")\ng.close()\nprint(open(\"notes.txt\", encoding=\"utf-8\").read())","key":["`open(path, mode, encoding='utf-8')`.","`w` — перезаписать, `a` — дописать, `r` — читать.","После работы файл нужно закрыть."],"id":"17-1","narr":{"1":"Открываем на запись — файл создаётся","2":"write возвращает число записанных символов","4":"Закрываем: данные сохранены на диск","6":"Режим a — дописать в конец"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":5},{"l":7,"e":"l","f":[2],"h":[0,1],"o":5},{"l":8,"e":"l","f":[2],"h":[0,1],"o":5},{"l":9,"e":"l","f":[2],"h":[0,1],"o":5},{"l":0,"e":"d","f":[3],"h":[0,1,2],"o":48}],"objs":[{"n":1,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='notes.txt' mode='w' encoding='utf-8'>"},{"n":2,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='notes.txt' mode='a' encoding='utf-8'>"},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'version'"],["p","0"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["f",["r",1]]]},{"name":"глобальная область","vars":[["f",["r",1]],["g",["r",2]]]},{"name":"глобальная область","vars":[["f",["r",1]],["g",["r",2]],["__warningregistry__",["r",3]]]}],"out":"True\nКупить хлеб\nПозвонить маме\nВыучить Python\n\n","error":null,"truncated":false},"deep":"`open()` возвращает объект из модуля `io`, собранный слоями:\n- `FileIO` — сырые байты от операционной системы (файловый дескриптор);\n- `BufferedWriter`/`BufferedReader` — буфер, чтобы не дёргать диск на каждый байт;\n- `TextIOWrapper` — превращает байты в строки по кодировке и обрабатывает переводы строк.\n\nИз-за буфера данные попадают на диск не сразу, а при `flush()` или `close()`. Если программа упадёт до закрытия, последние записи могут потеряться — ещё одна причина использовать `with`.\n\nРежим `\"b\"` (`\"rb\"`, `\"wb\"`) работает с байтами без кодировки — для картинок и бинарных файлов.","pitfalls":["Открыть без `encoding=\"utf-8\"` — на некоторых системах кириллица превратится в «кракозябры».","Режим `\"w\"` стирает существующий файл — для дописывания нужен `\"a\"`.","Забыть `\\n` в `write()` — всё окажется в одной строке."],"links":["17-3","17-2"],"checks":[{"q":"Что напечатает код?","options":["5","None","hello","True"],"answer":0,"why":"`write` возвращает количество записанных символов.","code":"import io\nf = io.StringIO()\nprint(f.write('hello'))"},{"q":"Что произойдёт при `open('data.txt', 'w')`, если файл уже существует?","options":["Новые данные допишутся в конец","Файл будет очищен и записан заново","Ошибка FileExistsError","Ничего"],"answer":1,"why":"Режим 'w' обрезает файл до нуля. Для дописывания используется 'a', для ошибки при существовании — 'x'."}]},{"title":"read и потоки","covers":["read()","streams"],"text":"`read()` читает весь файл в одну строку, `readline()` — одну строку, а перебор `for line in f` читает **построчно**, не загружая весь файл в память. Это и есть идея **потока** (stream): данные текут порциями, а файл помнит позицию, где остановился.\n\nПотоки бывают не только файлами: `print` пишет в поток `sys.stdout`, а `io.StringIO` — поток в памяти, который ведёт себя как файл.","code":"with open(\"data.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"первая\\nвторая\\nтретья\\n\")\n\nf = open(\"data.txt\", encoding=\"utf-8\")\nprint(repr(f.readline()))\nfor line in f:\n    print(\"строка:\", line.strip())\nf.close()\n\nimport io\nbuf = io.StringIO()\nbuf.write(\"hello \")\nbuf.write(\"stream\")\nprint(buf.getvalue())","key":["`read()` — всё, `readline()` — строка, `for line in f` — построчно.","Поток помнит позицию чтения.","`sys.stdout` и `StringIO` — тоже потоки."],"id":"17-2","narr":{"5":"Прочитали одну строку — позиция сдвинулась","6":"Продолжаем с текущей позиции, по строке за раз","11":"Поток в памяти"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":1,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[2],"h":[1],"o":0},{"l":6,"e":"l","f":[2],"h":[1],"o":11},{"l":7,"e":"l","f":[3],"h":[1],"o":11},{"l":6,"e":"l","f":[3],"h":[1],"o":26},{"l":7,"e":"l","f":[4],"h":[1],"o":26},{"l":6,"e":"l","f":[4],"h":[1],"o":41},{"l":8,"e":"l","f":[4],"h":[1],"o":41},{"l":10,"e":"l","f":[4],"h":[1],"o":41},{"l":11,"e":"l","f":[4],"h":[1],"o":41},{"l":12,"e":"l","f":[5],"h":[1,2],"o":41},{"l":13,"e":"l","f":[5],"h":[1,2],"o":41},{"l":14,"e":"l","f":[5],"h":[1,2],"o":41},{"l":0,"e":"d","f":[5],"h":[1,2],"o":54}],"objs":[{"n":1,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='data.txt' mode='w' encoding='utf-8'>"},{"n":2,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='data.txt' mode='r' encoding='utf-8'>"},{"n":3,"k":"other","t":"StringIO","r":"<_io.StringIO object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["f",["r",1]]]},{"name":"глобальная область","vars":[["f",["r",2]]]},{"name":"глобальная область","vars":[["f",["r",2]],["line",["p","'вторая\\n'"]]]},{"name":"глобальная область","vars":[["f",["r",2]],["line",["p","'третья\\n'"]]]},{"name":"глобальная область","vars":[["f",["r",2]],["line",["p","'третья\\n'"]],["buf",["r",3]]]}],"out":"'первая\\n'\nстрока: вторая\nстрока: третья\nhello stream\n","error":null,"truncated":false},"deep":"Файл — **поток** с текущей позицией. `read()` читает от позиции до конца, `seek(0)` возвращает позицию в начало, `tell()` показывает её. Перебор `for line in f` читает буферизованно, по строке — так можно обработать файл размером с гигабайты.\n\nСтроки из файла содержат символ `\\n` в конце — его убирают `line.rstrip(\"\\n\")` или `strip()`.\n\nДля путей удобен `pathlib`:\n```\nfrom pathlib import Path\np = Path(\"notes.txt\")\np.write_text(\"a\\nb\\n\", encoding=\"utf-8\")\nprint(p.read_text(encoding=\"utf-8\").splitlines())   # ['a', 'b']\n```","pitfalls":["Вызывать `read()` второй раз и получать пустую строку — позиция уже в конце.","`f.read()` для огромного файла — загрузит всё в память."],"links":["17-1","19-1"],"checks":[{"q":"Что напечатает код?","options":["'abc' 'abc'","'abc' ''","'' ''","Ошибка"],"answer":1,"why":"После первого `read()` позиция в конце, второй `read()` возвращает пустую строку.","code":"import io\nf = io.StringIO('abc')\nprint(repr(f.read()), repr(f.read()))"},{"q":"Как прочитать огромный файл, не загружая его целиком в память?","options":["f.read()","f.readlines()","for line in f","list(f)"],"answer":2,"why":"Перебор файла читает его по строкам через буфер."}]},{"title":"with — файлы без забот","covers":["with","context manager"],"text":"`with open(...) as f:` открывает файл и **гарантированно закрывает** его в конце блока — даже если внутри произошла ошибка. Файловый объект — это **контекстный менеджер**: объект, который знает, что делать при входе в блок и при выходе.\n\nЭто стандартный и правильный способ работы с файлами. Как это устроено внутри — в разделе 18.","code":"with open(\"log.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"старт\\n\")\n    print(\"Внутри блока, закрыт?\", f.closed)\nprint(\"После блока, закрыт?\", f.closed)\n\ntry:\n    with open(\"log.txt\", encoding=\"utf-8\") as f:\n        print(f.read().strip())\n        raise RuntimeError(\"что-то сломалось\")\nexcept RuntimeError:\n    print(\"Ошибка, но файл всё равно закрыт:\", f.closed)","key":["`with` сам закрывает файл.","Работает и при ошибках внутри блока.","Файл — пример контекстного менеджера."],"id":"17-3","narr":{"1":"Вход: файл открыт","4":"Выход из with закрыл файл сам","9":"Ошибка внутри блока…","11":"…файл всё равно закрыт"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[0],"o":0},{"l":1,"e":"l","f":[1],"h":[0],"o":28},{"l":4,"e":"l","f":[1],"h":[0],"o":28},{"l":6,"e":"l","f":[1],"h":[0],"o":54},{"l":7,"e":"l","f":[1],"h":[0],"o":54},{"l":8,"e":"l","f":[2],"h":[1],"o":54},{"l":9,"e":"l","f":[2],"h":[1],"o":60},{"l":9,"e":"e","f":[2],"h":[1],"o":60,"ex":"RuntimeError: что-то сломалось"},{"l":7,"e":"l","f":[2],"h":[1],"o":60},{"l":10,"e":"l","f":[2],"h":[1],"o":60},{"l":11,"e":"l","f":[2],"h":[1],"o":60},{"l":0,"e":"d","f":[2],"h":[1],"o":99}],"objs":[{"n":1,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='log.txt' mode='w' encoding='utf-8'>"},{"n":2,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='log.txt' mode='r' encoding='utf-8'>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["f",["r",1]]]},{"name":"глобальная область","vars":[["f",["r",2]]]}],"out":"Внутри блока, закрыт? False\nПосле блока, закрыт? True\nстарт\nОшибка, но файл всё равно закрыт: True\n","error":null,"truncated":false},"deep":"`with open(...) as f:` превращается в:\n```\nf = open(...)\nf.__enter__()\ntry:\n    ...тело...\nfinally:\n    f.__exit__(...)   # закрывает файл\n```\nТак ресурс освобождается при любом выходе из блока: обычном, через `return`, `break` или исключение.\n\nВ одном `with` можно открыть несколько ресурсов: `with open(a) as src, open(b, \"w\") as dst:`. Тот же приём работает для блокировок (`threading.Lock`), соединений с базой, временных папок и т. д.","pitfalls":["Использовать `f` после выхода из `with` — файл уже закрыт (`ValueError: I/O operation on closed file`).","Открывать файлы без `with` и забывать `close()` — утечка дескрипторов."],"links":["18-1","16-2"],"checks":[{"q":"Что напечатает код?","options":["закрыт","открыт","Ошибка","None"],"answer":0,"why":"Даже при выходе через исключение `with` закрывает файл.","code":"import io\ntry:\n    with io.StringIO('x') as f:\n        raise RuntimeError\nexcept RuntimeError:\n    pass\nprint('закрыт' if f.closed else 'открыт')"},{"q":"Во что по сути разворачивается `with`?","options":["В цикл while","В __enter__, затем try/finally с __exit__","В if/else","В import"],"answer":1,"why":"`with` — это гарантированный вызов `__exit__` через try/finally."}]}],"zone":16,"world":{"name":"Архив","hue":32,"kind":"port","intro":"Файлы — ящики архива: их открывают, читают, пишут и обязательно закрывают. Данные текут по трубам-потокам.","why":"Программы общаются с внешним миром через файлы и потоки, и важно не оставлять ресурсы открытыми.","spots":{"open()":[null,"Выдвинутый ящик: `open()` даёт объект-файл для работы."],"read()":[null,"Лупа над свитком: `read()` читает содержимое с текущей позиции."],"write()":[null,"Перо: `write()` пишет строку; перевод строки нужно ставить самому."],"close()":[null,"Ключ в замке: `close()` закрывает файл и сохраняет буфер на диск."],"with":[null,"Дверь-доводчик: сама закрывается, как только выходишь из блока."],"context manager":["context manager","Швейцар у двери: знает, что делать при входе и выходе."],"streams":[null,"Пневмопочта: данные идут порциями, а поток помнит, где остановился."]}}},{"title":"Контекстные менеджеры","items":["__enter__","__exit__","with","contextlib"],"intro":"Шаблон «подготовить → поработать → гарантированно убрать за собой».","lessons":[{"title":"__enter__ и __exit__","covers":["__enter__","__exit__","with"],"text":"`with obj as x:` работает так: 1) вызывается `obj.__enter__()`, его результат попадает в `x`; 2) выполняется блок; 3) вызывается `obj.__exit__(тип_ошибки, ошибка, трассировка)` — **всегда**, даже при исключении.\n\nЕсли `__exit__` вернёт `True`, исключение считается обработанным и дальше не полетит. Смотри по шагам, как появляются кадры `__enter__` и `__exit__`.","code":"class Timer:\n    def __enter__(self):\n        print(\"▶ старт\")\n        self.steps = 0\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        print(\"■ стоп, шагов:\", self.steps, \"ошибка:\", exc_type.__name__ if exc_type else None)\n        return exc_type is ValueError\n\nwith Timer() as t:\n    t.steps += 1\n    t.steps += 1\n\nwith Timer() as t:\n    t.steps += 1\n    raise ValueError(\"упс\")\nprint(\"Программа продолжается\")","key":["`with` → `__enter__` → блок → `__exit__`.","`__exit__` вызывается всегда.","Вернёт `True` — исключение подавлено."],"id":"18-1","narr":{"2":"Вход в блок with","5":"Это значение попадёт в переменную после as","7":"Выход — всегда","9":"True = «ошибку я обработал»","17":"__exit__ получит эту ошибку и подавит её"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Timer"},{"l":11,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":4,"e":"l","f":[5,6],"h":[2,3],"o":8},{"l":5,"e":"l","f":[5,6],"h":[2,4],"o":8},{"l":5,"e":"r","f":[5,6],"h":[2,4],"o":8,"rv":["r",4],"fn":"__enter__"},{"l":12,"e":"l","f":[7],"h":[2,4],"o":8},{"l":13,"e":"l","f":[7],"h":[2,5],"o":8},{"l":11,"e":"l","f":[7],"h":[2,6],"o":8},{"l":8,"e":"l","f":[7,8],"h":[2,6],"o":8},{"l":9,"e":"l","f":[7,8],"h":[2,6],"o":38},{"l":9,"e":"r","f":[7,8],"h":[2,6],"o":38,"rv":["p","False"],"fn":"__exit__"},{"l":15,"e":"l","f":[7],"h":[2,6],"o":38},{"l":3,"e":"l","f":[7,9],"h":[2,6,7],"o":38},{"l":4,"e":"l","f":[7,9],"h":[2,6,7],"o":46},{"l":5,"e":"l","f":[7,9],"h":[2,6,8],"o":46},{"l":5,"e":"r","f":[7,9],"h":[2,6,8],"o":46,"rv":["r",5],"fn":"__enter__"},{"l":16,"e":"l","f":[10],"h":[2,8],"o":46},{"l":17,"e":"l","f":[10],"h":[2,9],"o":46},{"l":17,"e":"e","f":[10],"h":[2,9],"o":46,"ex":"ValueError: упс"},{"l":15,"e":"l","f":[10],"h":[2,9],"o":46},{"l":8,"e":"l","f":[10,11],"h":[2,9,10,11,12],"o":46},{"l":9,"e":"l","f":[10,11],"h":[2,9,10,11,12],"o":82},{"l":9,"e":"r","f":[10,11],"h":[2,9,10,11,12],"o":82,"rv":["p","True"],"fn":"__exit__"},{"l":18,"e":"l","f":[10],"h":[2,9],"o":82},{"l":0,"e":"d","f":[10],"h":[2,9],"o":105}],"objs":[{"n":1,"k":"func","t":"function","name":"Timer.__enter__","sig":"(self)"},{"n":2,"k":"func","t":"function","name":"Timer.__exit__","sig":"(self, exc_type, exc, tb)"},{"n":3,"k":"class","t":"class","name":"Timer","bases":[],"attrs":{}},{"n":4,"k":"obj","t":"Timer","attrs":{}},{"n":4,"k":"obj","t":"Timer","attrs":{"steps":["p","0"]}},{"n":4,"k":"obj","t":"Timer","attrs":{"steps":["p","1"]}},{"n":4,"k":"obj","t":"Timer","attrs":{"steps":["p","2"]}},{"n":5,"k":"obj","t":"Timer","attrs":{}},{"n":5,"k":"obj","t":"Timer","attrs":{"steps":["p","0"]}},{"n":5,"k":"obj","t":"Timer","attrs":{"steps":["p","1"]}},{"n":6,"k":"obj","t":"ValueError","attrs":{"args":["r",7]},"exc":true},{"n":7,"k":"tuple","t":"tuple","items":[["p","'упс'"]],"more":0},{"n":8,"k":"other","t":"traceback","r":"<traceback object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Timer()","vars":[]},{"name":"тело класса Timer","vars":[]},{"name":"тело класса Timer","vars":[["__enter__",["r",1]]]},{"name":"тело класса Timer","vars":[["__enter__",["r",1]],["__exit__",["r",2]]]},{"name":"глобальная область","vars":[["Timer",["r",3]]]},{"name":"__enter__()","vars":[["self",["r",4]]]},{"name":"глобальная область","vars":[["Timer",["r",3]],["t",["r",4]]]},{"name":"__exit__()","vars":[["self",["r",4]],["exc_type",["p","None"]],["exc",["p","None"]],["tb",["p","None"]]]},{"name":"__enter__()","vars":[["self",["r",5]]]},{"name":"глобальная область","vars":[["Timer",["r",3]],["t",["r",5]]]},{"name":"__exit__()","vars":[["self",["r",5]],["exc_type",["p","<класс ValueError>"]],["exc",["r",6]],["tb",["r",8]]]}],"out":"▶ старт\n■ стоп, шагов: 2 ошибка: None\n▶ старт\n■ стоп, шагов: 1 ошибка: ValueError\nПрограмма продолжается\n","error":null,"truncated":false},"deep":"`__exit__(exc_type, exc, tb)` получает информацию об исключении (или три `None`, если всё прошло хорошо). Вернул **истину** — исключение подавлено; вернул `None`/`False` — исключение летит дальше. Большинство менеджеров возвращают `None`: они только убирают за собой.\n\nЗначение после `as` — это то, что вернул `__enter__`, а не сам объект в `with`. У файлов `__enter__` возвращает `self`, поэтому разницы не видно, но у других менеджеров (например, у блокировок) она есть.\n\nЕсть и асинхронная версия — `async with` с `__aenter__`/`__aexit__`.","pitfalls":["Случайно вернуть `True` из `__exit__` — все ошибки в блоке будут молча проглочены.","Путать объект в `with` и значение после `as`."],"links":["18-2","17-3","16-2"],"checks":[{"q":"Что напечатает код?","options":["enter | body | exit","body | enter | exit","enter | exit | body","enter | body"],"answer":0,"why":"Сначала `__enter__`, затем тело, затем `__exit__`.","code":"class M:\n    def __enter__(self):\n        print('enter')\n    def __exit__(self, *a):\n        print('exit')\nwith M():\n    print('body')"},{"q":"Что напечатает код?","options":["X","<M object>","None","Ошибка"],"answer":0,"why":"После `as` оказывается то, что вернул `__enter__`.","code":"class M:\n    def __enter__(self):\n        return 'X'\n    def __exit__(self, *a):\n        pass\nwith M() as v:\n    print(v)"}]},{"title":"contextlib","covers":["contextlib"],"text":"Модуль `contextlib` упрощает создание менеджеров. Декоратор `@contextmanager` превращает **генератор** в контекстный менеджер: код до `yield` — это `__enter__`, значение `yield` попадает в `as`, код после — `__exit__`. Оберни `yield` в `try/finally`, чтобы уборка шла даже при ошибке.\n\nЕщё полезное: `contextlib.suppress(Ошибка)` — тихо игнорировать конкретную ошибку.","code":"from contextlib import contextmanager, suppress\n\n@contextmanager\ndef tag(name):\n    print(f\"<{name}>\")\n    try:\n        yield name.upper()\n    finally:\n        print(f\"<\/{name}>\")\n\nwith tag(\"div\") as t:\n    print(\"  содержимое\", t)\n\nwith suppress(KeyError):\n    {}[\"нет такого\"]\nprint(\"дальше\")","key":["`@contextmanager` + генератор = простой менеджер.","До `yield` — вход, после — выход.","`suppress` — игнорировать конкретное исключение."],"id":"18-2","narr":{"5":"Это как __enter__","7":"Значение уходит в as; генератор ждёт конца блока","9":"Это как __exit__ — всегда","15":"Ошибка тихо подавлена"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":11,"e":"l","f":[1],"h":[0,1],"o":0},{"l":5,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":6,"e":"l","f":[1,2],"h":[0,1],"o":6},{"l":7,"e":"l","f":[1,2],"h":[0,1],"o":6},{"l":7,"e":"r","f":[1,2],"h":[0,1],"o":6,"rv":["p","'DIV'"],"fn":"tag"},{"l":12,"e":"l","f":[3],"h":[0,1],"o":6},{"l":11,"e":"l","f":[3],"h":[0,1],"o":23},{"l":9,"e":"l","f":[3,2],"h":[0,1],"o":23},{"l":9,"e":"r","f":[3,2],"h":[0,1],"o":30,"rv":["p","None"],"fn":"tag"},{"l":14,"e":"l","f":[3],"h":[0,1],"o":30},{"l":15,"e":"l","f":[3],"h":[0,1],"o":30},{"l":15,"e":"e","f":[3],"h":[0,1],"o":30,"ex":"KeyError: 'нет такого'"},{"l":14,"e":"l","f":[3],"h":[0,1],"o":30},{"l":16,"e":"l","f":[3],"h":[0,1],"o":30},{"l":0,"e":"d","f":[3],"h":[0,1],"o":37}],"objs":[{"n":1,"k":"func","t":"function","name":"tag","sig":"(name)","cells":{"func":["r",2]},"wraps":["r",2]},{"n":2,"k":"func","t":"function","name":"tag","sig":"(name)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["tag",["r",1]]]},{"name":"tag() ⟳генератор","vars":[["name",["p","'div'"]]]},{"name":"глобальная область","vars":[["tag",["r",1]],["t",["p","'DIV'"]]]}],"out":"<div>\n  содержимое DIV\n<\/div>\nдальше\n","error":null,"truncated":false},"deep":"`@contextmanager` оборачивает генератор: `__enter__` запускает его до `yield`, а `__exit__` продолжает после. Если в блоке `with` возникло исключение, оно **бросается внутрь генератора** в точке `yield` — поэтому `try/finally` вокруг `yield` обязателен для уборки.\n\nДругие полезные инструменты `contextlib`:\n- `suppress(*исключения)` — проглотить конкретные ошибки;\n- `redirect_stdout(buf)` — перенаправить `print`;\n- `ExitStack` — открыть заранее неизвестное число ресурсов и закрыть их все;\n- `nullcontext()` — пустой менеджер, когда менеджер нужен лишь иногда.","pitfalls":["Не обернуть `yield` в `try/finally` — при ошибке уборка не выполнится.","Сделать в генераторе два `yield` — `RuntimeError: generator didn't stop`."],"links":["18-1","19-2"],"checks":[{"q":"Что напечатает код?","options":["start | end","start","start | body | end","end"],"answer":0,"why":"Блок `with` бросил ошибку, она пришла в генератор, `finally` всё равно выполнился, а `suppress` проглотил ошибку снаружи.","code":"from contextlib import contextmanager, suppress\n@contextmanager\ndef cm():\n    print('start')\n    try:\n        yield\n    finally:\n        print('end')\nwith suppress(ValueError):\n    with cm():\n        raise ValueError"},{"q":"Что напечатает код?","options":["hi","''","None","Ошибка"],"answer":0,"why":"`redirect_stdout` перенаправил print в буфер, затем мы печатаем содержимое буфера.","code":"import io\nfrom contextlib import redirect_stdout\nbuf = io.StringIO()\nwith redirect_stdout(buf):\n    print('hi')\nprint(buf.getvalue().strip())"}]}],"zone":17,"world":{"name":"Шлюзовая камера","hue":205,"kind":"engine","intro":"Вход в рабочую камеру проходит через шлюз: при входе всё готовят, при выходе всё убирают — даже при аварии.","why":"Шаблон «подготовить → поработать → убрать» нужен для файлов, соединений, блокировок и временных настроек.","spots":{"__enter__":[null,"Входной шлюз: подготовка ресурса, результат попадает в `as`."],"__exit__":[null,"Выходной шлюз: срабатывает всегда и узнаёт об аварии, если она была."],"with":[null,"Коридор через камеру: всё, что внутри, защищено шлюзами."],"contextlib":[null,"Пояс с готовыми устройствами: `@contextmanager`, `suppress`, `redirect_stdout`."]}}},{"title":"Итераторы и генераторы","items":["iterable","iterator","iter()","next()","yield","generator","generator expression"],"intro":"Как Python перебирает элементы по одному и как создавать данные «лениво» — только когда они нужны.","lessons":[{"title":"iterable, iterator, iter() и next()","covers":["iterable","iterator","iter()","next()"],"text":"**Iterable** (итерируемое) — то, что можно перебрать: список, строка, словарь, файл. **Iterator** (итератор) — объект, который выдаёт элементы по одному и **помнит позицию**.\n\n`iter(iterable)` создаёт итератор, `next(iterator)` берёт следующий элемент. Когда элементы закончились — `StopIteration`. Итератор одноразовый: прошёл до конца — нужно создавать новый. А список можно перебирать сколько угодно раз, потому что каждый `for` создаёт новый итератор.","code":"colors = [\"red\", \"green\", \"blue\"]\nit = iter(colors)\nprint(next(it))\nprint(next(it))\nprint(list(it))\nprint(list(it))\ntry:\n    next(it)\nexcept StopIteration:\n    print(\"StopIteration: элементов нет\")","key":["Iterable — можно перебрать; iterator — перебирает и помнит позицию.","`iter()` создаёт итератор, `next()` берёт элемент.","Итератор одноразовый."],"id":"19-1","narr":{"1":"Iterable","2":"Создаём итератор — у него своя позиция","3":"Первый элемент","4":"Второй — итератор помнит, где был","5":"Остаток","6":"Итератор исчерпан — пусто"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[2],"h":[0,1],"o":4},{"l":5,"e":"l","f":[2],"h":[0,1],"o":10},{"l":6,"e":"l","f":[2],"h":[0,1],"o":19},{"l":7,"e":"l","f":[2],"h":[0,1],"o":22},{"l":8,"e":"l","f":[2],"h":[0,1],"o":22},{"l":8,"e":"e","f":[2],"h":[0,1],"o":22,"ex":"StopIteration: "},{"l":9,"e":"l","f":[2],"h":[0,1],"o":22},{"l":10,"e":"l","f":[2],"h":[0,1],"o":22},{"l":0,"e":"d","f":[2],"h":[0,1],"o":51}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","'red'"],["p","'green'"],["p","'blue'"]],"more":0},{"n":2,"k":"other","t":"list_iterator","r":"<list_iterator object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["colors",["r",1]]]},{"name":"глобальная область","vars":[["colors",["r",1]],["it",["r",2]]]}],"out":"red\ngreen\n['blue']\n[]\nStopIteration: элементов нет\n","error":null,"truncated":false},"deep":"Протокол итерации:\n- **iterable**: `iter(x)` возвращает итератор (метод `__iter__`);\n- **iterator**: `next(it)` возвращает следующий элемент или бросает `StopIteration`; сам итератор тоже iterable (`__iter__` возвращает self).\n\nФункции `map`, `filter`, `zip`, `enumerate`, `reversed` возвращают **ленивые итераторы**: элементы вычисляются по требованию и только один раз. Модуль `itertools` — набор строительных блоков для потоков данных: `islice`, `chain`, `count`, `groupby`, `product`.\n\n```\nfrom itertools import islice, count\nprint(list(islice(count(10), 3)))   # [10, 11, 12]\n```","pitfalls":["Перебирать результат `map`/`zip` второй раз — он уже исчерпан.","Вызывать `len()` у итератора — `TypeError`."],"links":["19-2","11-3","3-3"],"checks":[{"q":"Что напечатает код?","options":["[2, 4] [2, 4]","[2, 4] []","[] []","Ошибка"],"answer":1,"why":"`map` возвращает одноразовый итератор.","code":"m = map(lambda x: x * 2, [1, 2])\nprint(list(m), list(m))"},{"q":"Что напечатает код?","options":["[(1, 'a'), (2, 'b')]","[(1, 'a'), (2, 'b'), (3, None)]","Ошибка","[1, 2, 'a', 'b']"],"answer":0,"why":"`zip` останавливается на самой короткой последовательности.","code":"print(list(zip([1, 2, 3], 'ab')))"}]},{"title":"yield и generator","covers":["yield","generator"],"text":"Функция с `yield` — **генератор**. Её вызов возвращает объект-генератор (который является итератором), а тело выполняется по кусочкам: до `yield` → пауза → до следующего `yield` → пауза…\n\nВ визуализаторе объект `generator` показывает своё состояние («на паузе», «завершён») и локальные переменные, которые сохраняются между паузами. Генераторы экономят память: элементы создаются по запросу, а не все сразу.","code":"def fib():\n    a, b = 0, 1\n    while True:\n        yield a\n        a, b = b, a + b\n\ngen = fib()\nfirst = [next(gen) for _ in range(6)]\nprint(first)\nprint(next(gen))","key":["`yield` = отдать значение и встать на паузу.","Локальные переменные сохраняются между вызовами.","Генератор ленивый: можно описать даже бесконечную последовательность."],"id":"19-2","narr":{"3":"Бесконечный цикл — но генератору это не страшно","4":"Отдаём a и замираем","7":"Тело не начало выполняться","8":"Берём только 6 значений","10":"Можно продолжить с того же места"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":8,"e":"l","f":[2],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,4],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,4],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,4],"h":[0,3],"o":0,"rv":["p","0"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,3],"o":0},{"l":5,"e":"l","f":[2,4],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,5],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,5],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,5],"h":[0,4],"o":0,"rv":["p","1"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,4],"o":0},{"l":5,"e":"l","f":[2,5],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,6],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,6],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,6],"h":[0,5],"o":0,"rv":["p","1"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,5],"o":0},{"l":5,"e":"l","f":[2,6],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,7],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,7],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,7],"h":[0,6],"o":0,"rv":["p","2"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,6],"o":0},{"l":5,"e":"l","f":[2,7],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,8],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,8],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,8],"h":[0,7],"o":0,"rv":["p","3"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,7],"o":0},{"l":5,"e":"l","f":[2,8],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,9],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,9],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,9],"h":[0,8],"o":0,"rv":["p","5"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,8],"o":0},{"l":9,"e":"l","f":[10],"h":[0,8,9],"o":0},{"l":10,"e":"l","f":[10],"h":[0,8,9],"o":19},{"l":5,"e":"l","f":[10,9],"h":[0,2,9],"o":19},{"l":3,"e":"l","f":[10,11],"h":[0,2,9],"o":19},{"l":4,"e":"l","f":[10,11],"h":[0,2,9],"o":19},{"l":4,"e":"r","f":[10,11],"h":[0,10,9],"o":19,"rv":["p","8"],"fn":"fib"},{"l":0,"e":"d","f":[10],"h":[0,10,9],"o":21}],"objs":[{"n":1,"k":"func","t":"function","name":"fib","sig":"()"},{"n":2,"k":"gen","t":"generator","name":"fib","state":"создан, ещё не запускался","locals":{}},{"n":2,"k":"gen","t":"generator","name":"fib","state":"работает"},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","0"],"b":["p","1"]},"line":4},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","1"],"b":["p","1"]},"line":4},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","1"],"b":["p","2"]},"line":4},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","2"],"b":["p","3"]},"line":4},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","3"],"b":["p","5"]},"line":4},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","5"],"b":["p","8"]},"line":4},{"n":3,"k":"list","t":"list","items":[["p","0"],["p","1"],["p","1"],["p","2"],["p","3"],["p","5"]],"more":0},{"n":2,"k":"gen","t":"generator","name":"fib","state":"на паузе (yield)","locals":{"a":["p","8"],"b":["p","13"]},"line":4}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["fib",["r",1]]]},{"name":"глобальная область","vars":[["fib",["r",1]],["gen",["r",2]]]},{"name":"fib() ⟳генератор","vars":[]},{"name":"fib() ⟳генератор","vars":[["a",["p","0"]],["b",["p","1"]]]},{"name":"fib() ⟳генератор","vars":[["a",["p","1"]],["b",["p","1"]]]},{"name":"fib() ⟳генератор","vars":[["a",["p","1"]],["b",["p","2"]]]},{"name":"fib() ⟳генератор","vars":[["a",["p","2"]],["b",["p","3"]]]},{"name":"fib() ⟳генератор","vars":[["a",["p","3"]],["b",["p","5"]]]},{"name":"fib() ⟳генератор","vars":[["a",["p","5"]],["b",["p","8"]]]},{"name":"глобальная область","vars":[["fib",["r",1]],["gen",["r",2]],["first",["r",3]]]},{"name":"fib() ⟳генератор","vars":[["a",["p","8"]],["b",["p","13"]]]}],"out":"[0, 1, 1, 2, 3, 5]\n8\n","error":null,"truncated":false},"deep":"Генератор — это функция с «замороженным» кадром. Кроме `next()`, у него есть:\n- `send(value)` — продолжить и передать значение: оно станет результатом выражения `yield` внутри;\n- `throw(exc)` — бросить исключение в точку `yield`;\n- `close()` — завершить генератор (внутри возникнет `GeneratorExit`).\n\n`yield from другой_итерируемый` делегирует выдачу значений вложенному генератору — удобно для рекурсивных структур:\n```\ndef flat(items):\n    for x in items:\n        if isinstance(x, list): yield from flat(x)\n        else: yield x\nprint(list(flat([1, [2, [3]], 4])))   # [1, 2, 3, 4]\n```","pitfalls":["Ждать, что `return value` в генераторе вернёт значение в `for` — оно попадает в `StopIteration.value`.","Хранить генератор и забыть, что его нельзя «перемотать» назад."],"links":["19-1","19-3","4-8"],"checks":[{"q":"Что напечатает код?","options":["[1, 2, 3, 4]","[1, [2, [3]], 4]","[1, 4]","Ошибка"],"answer":0,"why":"`yield from` рекурсивно разворачивает вложенные списки.","code":"def flat(items):\n    for x in items:\n        if isinstance(x, list):\n            yield from flat(x)\n        else:\n            yield x\nprint(list(flat([1, [2, [3]], 4])))"},{"q":"Что напечатает код?","options":["A 1","A B","1 2","A"],"answer":1,"why":"Первый `next` выполняет тело до первого yield ('A'), второй — до второго ('B').","code":"def g():\n    yield 'A'\n    yield 'B'\nit = g()\nprint(next(it), next(it))"}]},{"title":"Generator expression","covers":["generator expression"],"text":"`(x * x for x in data)` — как list comprehension, но в **круглых** скобках. Получается не список, а генератор: значения не создаются заранее, а вычисляются по одному при переборе.\n\nЭто экономит память на больших данных. Часто пишется прямо в аргументе функции: `sum(x * x for x in data)`.","code":"nums = [1, 2, 3, 4]\nsquares_list = [n * n for n in nums]\nsquares_gen = (n * n for n in nums)\nprint(squares_list)\nprint(next(squares_gen), next(squares_gen))\nprint(sum(squares_gen))\nprint(max(len(w) for w in [\"кот\", \"собака\", \"ёж\"]))","key":["`(expr for x in seq)` — генераторное выражение.","Ленивое: значения считаются по одному.","Отлично подходит для `sum`, `max`, `any`, `all`."],"id":"19-3","narr":{"2":"Список: все значения сразу в памяти","3":"Генератор: пока ничего не посчитано","5":"Считаем по требованию","6":"Досчитали остаток: 9 + 16","7":"Генератор прямо в аргументе функции"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":5,"e":"l","f":[3],"h":[0,1,2],"o":14},{"l":3,"e":"l","f":[3,4],"h":[0,1,3],"o":14},{"l":3,"e":"r","f":[3,5],"h":[0,1,4],"o":14,"rv":["p","1"],"fn":"<genexpr>"},{"l":3,"e":"l","f":[3,5],"h":[0,1,3],"o":14},{"l":3,"e":"r","f":[3,6],"h":[0,1,5],"o":14,"rv":["p","4"],"fn":"<genexpr>"},{"l":6,"e":"l","f":[3],"h":[0,1,5],"o":18},{"l":3,"e":"l","f":[3,6],"h":[0,1,3],"o":18},{"l":3,"e":"r","f":[3,7],"h":[0,1,6],"o":18,"rv":["p","9"],"fn":"<genexpr>"},{"l":3,"e":"l","f":[3,7],"h":[0,1,3],"o":18},{"l":3,"e":"r","f":[3,8],"h":[0,1,7],"o":18,"rv":["p","16"],"fn":"<genexpr>"},{"l":3,"e":"l","f":[3,8],"h":[0,1,3],"o":18},{"l":3,"e":"r","f":[3,8],"h":[0,1,3],"o":18,"rv":["p","None"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[3],"h":[0,1,8],"o":21},{"l":7,"e":"l","f":[3,4],"h":[0,1,8],"o":21},{"l":7,"e":"r","f":[3,9],"h":[0,1,8],"o":21,"rv":["p","3"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[3,9],"h":[0,1,8],"o":21},{"l":7,"e":"r","f":[3,10],"h":[0,1,8],"o":21,"rv":["p","6"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[3,10],"h":[0,1,8],"o":21},{"l":7,"e":"r","f":[3,11],"h":[0,1,8],"o":21,"rv":["p","2"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[3,11],"h":[0,1,8],"o":21},{"l":7,"e":"r","f":[3,11],"h":[0,1,8],"o":21,"rv":["p","None"],"fn":"<genexpr>"},{"l":0,"e":"d","f":[3],"h":[0,1,8],"o":23}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","1"],["p","2"],["p","3"],["p","4"]],"more":0},{"n":2,"k":"list","t":"list","items":[["p","1"],["p","4"],["p","9"],["p","16"]],"more":0},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"создан, ещё не запускался","locals":{}},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"работает"},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"на паузе (yield)","locals":{"n":["p","1"]},"line":3},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"на паузе (yield)","locals":{"n":["p","2"]},"line":3},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"на паузе (yield)","locals":{"n":["p","3"]},"line":3},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"на паузе (yield)","locals":{"n":["p","4"]},"line":3},{"n":3,"k":"gen","t":"generator","name":"<genexpr>","state":"завершён"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["nums",["r",1]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares_list",["r",2]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["squares_list",["r",2]],["squares_gen",["r",3]]]},{"name":"<genexpr>() ⟳генератор","vars":[]},{"name":"<genexpr>() ⟳генератор","vars":[["n",["p","1"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["n",["p","2"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["n",["p","3"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["n",["p","4"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["w",["p","'кот'"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["w",["p","'собака'"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["w",["p","'ёж'"]]]}],"out":"[1, 4, 9, 16]\n1 4\n25\n6\n","error":null,"truncated":false},"deep":"Генераторное выражение `(expr for x in it)` создаёт объект-генератор, почти не занимая памяти, сколько бы элементов ни было. Список `[expr for x in it]` хранит все результаты сразу.\n\n```\nimport sys\nprint(sys.getsizeof([x for x in range(10**6)]) > 1_000_000)  # True\nprint(sys.getsizeof(x for x in range(10**6)) < 1000)          # True\n```\n\nПервая (самая левая) последовательность вычисляется **сразу**, при создании выражения; остальное — лениво. Если генераторное выражение — единственный аргумент функции, скобки можно не дублировать: `sum(x * x for x in data)`.","pitfalls":["Использовать генераторное выражение там, где результат нужен несколько раз (он одноразовый).","Ждать от `(x for x in data)` кортеж — это генератор; кортеж — `tuple(...)`."],"links":["3-7","19-2"],"checks":[{"q":"Что напечатает код?","options":["generator","tuple","list","Ошибка"],"answer":0,"why":"Круглые скобки вокруг comprehension дают генератор, а не кортеж.","code":"print(type(x for x in 'ab').__name__)"},{"q":"Что напечатает код?","options":["True","False","[True, False]","Ошибка"],"answer":0,"why":"`any` останавливается на первом истинном значении генератора.","code":"print(any(n > 2 for n in [1, 5, 0]))"}]}],"zone":18,"world":{"name":"Река потоков","hue":196,"kind":"river","intro":"Данные текут по реке: лодка-итератор плывёт по озеру-коллекции, мельница-генератор выдаёт по одной порции.","why":"Итераторы и генераторы позволяют обрабатывать огромные и даже бесконечные потоки, не загружая их в память.","spots":{"iterable":[null,"Озеро с товаром: то, по чему можно проплыть, — список, строка, файл."],"iterator":[null,"Лодка со стрелкой-указателем: помнит, где остановилась, и плывёт только вперёд."],"iter()":[null,"Спуск лодки на воду: `iter(озеро)` даёт новую лодку."],"next()":[null,"Гребок вёслами: `next()` подплывает к следующему элементу."],"yield":[null,"Шлюз на реке: отдаёт порцию воды и закрывается до следующего запроса."],"generator":[null,"Водяная мельница: работает, только когда у неё просят муку."],"generator expression":["generator expression","Узкий ручеёк `(x*x for x in data)`: генератор в одну строку."]}}},{"title":"Декораторы","items":["функция как объект","функция высшего порядка","decorator","@decorator","functools"],"intro":"Как добавить функции новое поведение, не меняя её код.","lessons":[{"title":"Функция как объект и функции высшего порядка","covers":["функция как объект","функция высшего порядка"],"text":"Функция — обычный объект: её можно присвоить другому имени, положить в словарь, передать аргументом и вернуть из другой функции. Обрати внимание: `say` без скобок — это **сама функция**, а `say()` — **вызов**.\n\n**Функция высшего порядка** — функция, которая принимает другую функцию или возвращает её. `map`, `filter`, `sorted(key=...)` — встроенные примеры.","code":"def say(text):\n    return text + \"!\"\n\nshout = say\nprint(shout(\"эй\"))\n\ndef apply_twice(func, value):\n    return func(func(value))\n\nprint(apply_twice(say, \"ура\"))\n\nops = {\"+\": lambda a, b: a + b, \"*\": lambda a, b: a * b}\nprint(ops[\"*\"](3, 4))","key":["`f` — функция, `f()` — её вызов.","Функции можно передавать и возвращать.","Функция высшего порядка работает с функциями."],"id":"20-1","narr":{"4":"Новое имя для ТОЙ ЖЕ функции (без скобок!)","7":"Функция высшего порядка: принимает функцию","12":"Функции в словаре"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[2],"h":[0],"o":0},{"l":2,"e":"l","f":[2,3],"h":[0],"o":0},{"l":2,"e":"r","f":[2,3],"h":[0],"o":0,"rv":["p","'эй!'"],"fn":"say"},{"l":7,"e":"l","f":[2],"h":[0],"o":4},{"l":10,"e":"l","f":[4],"h":[0,1],"o":4},{"l":8,"e":"l","f":[4,5],"h":[0,1],"o":4},{"l":2,"e":"l","f":[4,5,6],"h":[0,1],"o":4},{"l":2,"e":"r","f":[4,5,6],"h":[0,1],"o":4,"rv":["p","'ура!'"],"fn":"say"},{"l":2,"e":"l","f":[4,5,7],"h":[0,1],"o":4},{"l":2,"e":"r","f":[4,5,7],"h":[0,1],"o":4,"rv":["p","'ура!!'"],"fn":"say"},{"l":8,"e":"r","f":[4,5],"h":[0,1],"o":4,"rv":["p","'ура!!'"],"fn":"apply_twice"},{"l":12,"e":"l","f":[4],"h":[0,1],"o":10},{"l":13,"e":"l","f":[8],"h":[0,1,2,3,4],"o":10},{"l":12,"e":"l","f":[8,9],"h":[0,1,2,3,4],"o":10},{"l":12,"e":"r","f":[8,9],"h":[0,1,2,3,4],"o":10,"rv":["p","12"],"fn":"<lambda>"},{"l":0,"e":"d","f":[8],"h":[0,1,2,3,4],"o":13}],"objs":[{"n":1,"k":"func","t":"function","name":"say","sig":"(text)"},{"n":2,"k":"func","t":"function","name":"apply_twice","sig":"(func, value)"},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'+'"],["r",4]],[["p","'*'"],["r",5]]],"more":0},{"n":4,"k":"func","t":"function","name":"lambda","sig":"(a, b)"},{"n":5,"k":"func","t":"function","name":"lambda","sig":"(a, b)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["say",["r",1]]]},{"name":"глобальная область","vars":[["say",["r",1]],["shout",["r",1]]]},{"name":"say()","vars":[["text",["p","'эй'"]]]},{"name":"глобальная область","vars":[["say",["r",1]],["shout",["r",1]],["apply_twice",["r",2]]]},{"name":"apply_twice()","vars":[["func",["r",1]],["value",["p","'ура'"]]]},{"name":"say()","vars":[["text",["p","'ура'"]]]},{"name":"say()","vars":[["text",["p","'ура!'"]]]},{"name":"глобальная область","vars":[["say",["r",1]],["shout",["r",1]],["apply_twice",["r",2]],["ops",["r",3]]]},{"name":"<lambda>()","vars":[["a",["p","3"]],["b",["p","4"]]]}],"out":"эй!\nура!!\n12\n","error":null,"truncated":false},"deep":"Функция высшего порядка — функция, которая работает с функциями: принимает их или возвращает. Это основа функционального стиля: `map`, `filter`, `sorted(key=...)`, `functools.reduce`.\n\n```\nfrom functools import reduce\nprint(reduce(lambda acc, x: acc * x, [1, 2, 3, 4], 1))   # 24\n```\n\nУ объекта-функции много полезных атрибутов: `__name__`, `__doc__`, `__defaults__`, `__code__`, `__closure__`, `__annotations__`. Можно даже добавлять свои атрибуты: `f.calls = 0`.","pitfalls":["Передать результат вызова вместо функции: `map(str.upper(), ...)`.","Писать `reduce` там, где читаемее `sum`, `max` или цикл."],"links":["5-1","20-2","4-5"],"checks":[{"q":"Что напечатает код?","options":["24","10","4","Ошибка"],"answer":0,"why":"reduce последовательно умножает: 1·1·2·3·4 = 24.","code":"from functools import reduce\nprint(reduce(lambda acc, x: acc * x, [1, 2, 3, 4], 1))"},{"q":"Что напечатает код?","options":["['A', 'B']","['a', 'b']","Ошибка","AB"],"answer":0,"why":"`map` принимает саму функцию `str.upper` и применяет её к каждому элементу.","code":"print(list(map(str.upper, ['a', 'b'])))"}]},{"title":"decorator и @decorator","covers":["decorator","@decorator"],"text":"Декоратор — функция высшего порядка, которая принимает функцию и возвращает **обёртку**. Обёртка делает что-то до и после вызова оригинала.\n\nСинтаксис `@timer` над `def work` — просто сокращение для `work = timer(work)`. После этого имя `work` указывает на обёртку, а оригинал сохранён в замыкании (видно в памяти как «замыкание: func»). Декоратор может принимать параметры — тогда это функция, возвращающая декоратор (три уровня вложенности).","code":"def log_calls(func):\n    def wrapper(*args):\n        print(\"→ вызов\", func.__name__, args)\n        result = func(*args)\n        print(\"← результат\", result)\n        return result\n    return wrapper\n\n@log_calls\ndef add(a, b):\n    return a + b\n\ndef repeat(n):\n    def deco(func):\n        def wrapper():\n            return [func() for _ in range(n)]\n        return wrapper\n    return deco\n\n@repeat(3)\ndef hi():\n    return \"hi\"\n\nadd(2, 3)\nprint(hi())","key":["`@deco` над `def f` = `f = deco(f)`.","Обёртка вызывает оригинал из замыкания.","Декоратор с параметрами — функция, возвращающая декоратор."],"id":"20-2","narr":{"1":"Декоратор получает функцию","4":"Вызываем оригинал","7":"Возвращаем обёртку","9":"То же, что add = log_calls(add)","13":"Декоратор с параметром"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[1],"h":[0],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":7,"e":"l","f":[1,3],"h":[0,1,2],"o":0},{"l":7,"e":"r","f":[1,3],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"log_calls"},{"l":10,"e":"l","f":[1],"h":[0],"o":0},{"l":13,"e":"l","f":[4],"h":[0,1,2],"o":0},{"l":20,"e":"l","f":[5],"h":[0,1,2,3],"o":0},{"l":14,"e":"l","f":[5,6],"h":[0,1,2,3],"o":0},{"l":18,"e":"l","f":[5,7],"h":[0,1,2,3,4],"o":0},{"l":18,"e":"r","f":[5,7],"h":[0,1,2,3,4],"o":0,"rv":["r",5],"fn":"repeat"},{"l":21,"e":"l","f":[5],"h":[0,1,2,3],"o":0},{"l":20,"e":"l","f":[5],"h":[0,1,2,3],"o":0},{"l":15,"e":"l","f":[5,8],"h":[0,1,2,3,5],"o":0},{"l":17,"e":"l","f":[5,9],"h":[0,1,2,3,5,6],"o":0},{"l":17,"e":"r","f":[5,9],"h":[0,1,2,3,5,6],"o":0,"rv":["r",7],"fn":"deco"},{"l":21,"e":"l","f":[5],"h":[0,1,2,3],"o":0},{"l":24,"e":"l","f":[10],"h":[0,1,2,3,5,6],"o":0},{"l":3,"e":"l","f":[10,11],"h":[0,1,2,3,5,6,7],"o":0},{"l":4,"e":"l","f":[10,11],"h":[0,1,2,3,5,6,7],"o":19},{"l":11,"e":"l","f":[10,11,12],"h":[0,1,2,3,5,6,7],"o":19},{"l":11,"e":"r","f":[10,11,12],"h":[0,1,2,3,5,6,7],"o":19,"rv":["p","5"],"fn":"add"},{"l":5,"e":"l","f":[10,13],"h":[0,1,2,3,5,6,7],"o":19},{"l":6,"e":"l","f":[10,13],"h":[0,1,2,3,5,6,7],"o":33},{"l":6,"e":"r","f":[10,13],"h":[0,1,2,3,5,6,7],"o":33,"rv":["p","5"],"fn":"wrapper"},{"l":25,"e":"l","f":[10],"h":[0,1,2,3,5,6],"o":33},{"l":16,"e":"l","f":[10,14],"h":[0,1,2,3,5,6],"o":33},{"l":22,"e":"l","f":[10,15,16],"h":[0,1,2,3,5,6],"o":33},{"l":22,"e":"r","f":[10,15,16],"h":[0,1,2,3,5,6],"o":33,"rv":["p","'hi'"],"fn":"hi"},{"l":16,"e":"l","f":[10,15],"h":[0,1,2,3,5,6],"o":33},{"l":22,"e":"l","f":[10,17,16],"h":[0,1,2,3,5,6],"o":33},{"l":22,"e":"r","f":[10,17,16],"h":[0,1,2,3,5,6],"o":33,"rv":["p","'hi'"],"fn":"hi"},{"l":16,"e":"l","f":[10,17],"h":[0,1,2,3,5,6],"o":33},{"l":22,"e"
