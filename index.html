yment):\n    pass\n\nprint(Card().pay(500))\nfor cls in (Payment, Broken):\n    try:\n        cls()\n    except TypeError as e:\n        print(\"Нельзя:\", cls.__name__)","key":["Наследуй от `ABC`, помечай обязательное `@abstractmethod`.","Нельзя создать экземпляр, пока всё не реализовано.","Ошибка возникает рано — при создании объекта."],"id":"10-1","narr":{"3":"Абстрактный класс","5":"Обязательный метод без реализации","8":"Реализовали — можно создавать объекты","12":"Забыли реализовать pay","19":"Python не даёт создать неполный объект"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Payment"},{"l":7,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4,5],"h":[1],"o":0},{"l":8,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Card"},{"l":11,"e":"l","f":[8],"h":[1,3],"o":0},{"l":11,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":12,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":12,"e":"r","f":[8,10],"h":[1,3],"o":0,"rv":["p","None"],"fn":"Broken"},{"l":14,"e":"l","f":[11],"h":[1,3,4],"o":0},{"l":9,"e":"l","f":[11,12],"h":[1,3,4,5],"o":0},{"l":9,"e":"r","f":[11,12],"h":[1,3,4,5],"o":0,"rv":["p","'Оплачено картой: 500'"],"fn":"pay"},{"l":15,"e":"l","f":[11],"h":[1,3,4],"o":21},{"l":16,"e":"l","f":[13],"h":[1,3,4],"o":21},{"l":17,"e":"l","f":[13],"h":[1,3,4],"o":21},{"l":17,"e":"e","f":[13],"h":[1,3,4],"o":21,"ex":"TypeError: Can't instantiate abstract class Payment without an implementation for abstract method 'pay'"},{"l":18,"e":"l","f":[13],"h":[1,3,4],"o":21},{"l":19,"e":"l","f":[14],"h":[1,3,4,6,7],"o":21},{"l":15,"e":"l","f":[13],"h":[1,3,4],"o":37},{"l":16,"e":"l","f":[15],"h":[1,3,4],"o":37},{"l":17,"e":"l","f":[15],"h":[1,3,4]," цию»: `obj(x)` вызывает `obj.__call__(x)`. Такой объект может хранить состояние между вызовами.","code":"class Vec:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n    def __add__(self, other):\n        return Vec(self.x + other.x, self.y + other.y)\n    def __repr__(self):\n        return f\"Vec({self.x}, {self.y})\"\n\nclass Multiplier:\n    def __init__(self, k):\n        self.k = k\n    def __call__(self, x):\n        return x * self.k\n\nprint(Vec(1, 2) + Vec(3, 4))\ntriple = Multiplier(3)\nprint(triple(5), callable(triple))","key":["`+` → `__add__` (и `-` → `__sub__`, `*` → `__mul__`…).","`obj()` → `__call__`.","Операторы в Python — это вызовы методов."],"id":"11-5","narr":{"4":"v1 + v2","12":"Объект можно вызывать как функцию"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":6,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"Vec"},{"l":9,"e":"l","f":[6],"h":[3],"o":0},{"l":9,"e":"l","f":[6,7],"h":[3],"o":0},{"l":10,"e":"l","f":[6,8],"h":[3],"o":0},{"l":12,"e":"l","f":[6,9],"h":[3,4],"o":0},{"l":12,"e":"r","f":[6,10],"h":[3,4,5],"o":0,"rv":["p","None"],"fn":"Multiplier"},{"l":15,"e":"l","f":[11],"h":[3,6],"o":0},{"l":3,"e":"l","f":[11,12],"h":[3,6,7],"o":0},{"l":3,"e":"r","f":[11,12],"h":[3,6,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":3,"e":"l","f":[11,13],"h":[3,6,9],"o":0},{"l":3,"e":"r","f":[11,13],"h":[3,6,10],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":5,"e":"l","f":[11,14],"h":[3,6,8,10],"o":0},{"l":3,"e":"l","f":[11,14,15],"h":[3,6,8,10,11],"o":0},{"l":3,"e":"r","f":[11,14,15],"h":[3,6,8,10,12],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":5,"e":"r","f":[11,14],"h":[3,6,8,10,12],"o":0,"rv":["r",10],"fn":"__add__"},{"l":7,"e":"l","f":[11,16],"h":[3,6,12],"o":0},{"l":7,"e":"r","f":[11,16],"h":[3,6,12],"o":0,"rv":["p","'Vec(4, 6)'"],"fn":"__repr__"},{"l" te__`.","Он перехватывает доступ к атрибуту у экземпляров.","Один дескриптор можно использовать для многих полей."],"id":"12-1","narr":{"3":"Запоминаем, где хранить значение","5":"Чтение obj.price","8":"Запись obj.price = …","13":"del obj.price","18":"Дескриптор живёт в КЛАССЕ","22":"→ Positive.__set__(p, 250)","23":"→ Positive.__get__(p, Product)","28":"→ Positive.__delete__(p)"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":8,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":13,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":13,"e":"r","f":[0,6],"h":[0,1,2,3],"o":0,"rv":["p","None"],"fn":"Positive"},{"l":17,"e":"l","f":[7],"h":[4],"o":0},{"l":17,"e":"l","f":[7,8],"h":[4],"o":0},{"l":18,"e":"l","f":[7,9],"h":[4],"o":0},{"l":19,"e":"l","f":[7,10],"h":[4,5],"o":0},{"l":19,"e":"r","f":[7,11],"h":[4,5,6],"o":0,"rv":["p","None"],"fn":"Product"},{"l":3,"e":"l","f":[7,12],"h":[4,5,7],"o":0},{"l":3,"e":"r","f":[7,12],"h":[4,8,7],"o":0,"rv":["p","None"],"fn":"__set_name__"},{"l":3,"e":"l","f":[7,13],"h":[4,6,7],"o":0},{"l":3,"e":"r","f":[7,13],"h":[4,9,7],"o":0,"rv":["p","None"],"fn":"__set_name__"},{"l":21,"e":"l","f":[14],"h":[4,7],"o":0},{"l":22,"e":"l","f":[15],"h":[4,7,10],"o":0},{"l":9,"e":"l","f":[15,16],"h":[4,8,7,10],"o":0},{"l":11,"e":"l","f":[15,16],"h":[4,8,7,10],"o":0},{"l":11,"e":"r","f":[15,16],"h":[4,8,7,11],"o":0,"rv":["p","None"],"fn":"__set__"},{"l":23,"e":"l","f":[15],"h":[4,7,11],"o":0},{"l":6,"e":"l","f":[15,17],"h":[4,8,7,11],"o":0},{"l":6,"e":"r","f":[15,17],"h":[4,8,7,11],"o":0,"rv":["p","250"],"fn":"__get__"},{"l":24,"e":"l","f":[15],"h":[4,7,11],"o":4},{"l":25,"e":"l","f":[15],"h":[4,7,11],"o":4},{"l":9,"e":"l","f":[15,18],"h":[4,9,7,11],"o":4},{"l":10,"e":"l","f":[15,18],"h":[4,9,7,11],"o":4},{"l":10,"e":"e","f":[15,18],"h":[4,9,7,11],"o":4,"ex":"ValueError: weight должно быть > 0"},{"l":10,"e":"r","f":[15,18],"h":[4,9,7,11],"o":4," ":"deleter и управление доступом","covers":["deleter","управление доступом к атрибутам"],"text":"`@имя.deleter` срабатывает на `del obj.имя`. А если setter **не объявить**, атрибут станет **только для чтения** — попытка записи даст `AttributeError`.\n\nТак property управляет доступом: что можно читать, что писать, что удалять, и что при этом проверять или логировать.","code":"class User:\n    def __init__(self, login):\n        self._login = login\n        self._token = \"abc123\"\n\n    @property\n    def login(self):\n        return self._login\n\n    @property\n    def token(self):\n        return self._token[:2] + \"***\"\n\n    @token.deleter\n    def token(self):\n        print(\"Токен удалён\")\n        self._token = \"\"\n\nu = User(\"anna\")\nprint(u.login, u.token)\ntry:\n    u.login = \"hacker\"\nexcept AttributeError as e:\n    print(\"Запрещено:\", e)\ndel u.token","key":["`@имя.deleter` → `del obj.имя`.","Нет setter — атрибут только для чтения.","property позволяет контролировать чтение, запись и удаление."],"id":"13-2","narr":{"7":"Только getter — значит только чтение","12":"Показываем частично","15":"Выход из системы"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":14,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":15,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":14,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":15,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":15,"e":"r","f":[0,6],"h":[0,1,3],"o":0,"rv":["p","None"],"fn":"User"},{"l":19,"e":"l","f":[7],"h":[4],"o":0},{"l":3,"e":"l","f":[7,8],"h":[4,5],"o":0},{"l":4,"e":"l","f":[7,8],"h":[4,6],"o":0},{"l" s, name, **kw):\n        super().__init_subclass__(**kw)\n        Command.commands[name] = cls\n\nclass Hello(Command, name=\"hello\"):\n    def run(self):\n        return \"Привет!\"\n\nclass Bye(Command, name=\"bye\"):\n    def run(self):\n        return \"Пока!\"\n\nprint(list(Command.commands))\nprint(Command.commands[\"bye\"]().run())","key":["`__init_subclass__` вызывается при создании подкласса.","Принимает параметры из строки `class X(Base, param=...)`.","Проще метакласса для регистрации и проверок."],"id":"14-3","narr":{"4":"Вызывается при создании потомка","8":"Параметр name уходит в __init_subclass__"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"Command"},{"l":8,"e":"l","f":[5],"h":[0,3],"o":0},{"l":8,"e":"l","f":[5,6],"h":[0,3],"o":0},{"l":9,"e":"l","f":[5,7],"h":[0,3],"o":0},{"l":9,"e":"r","f":[5,8],"h":[0,3,4],"o":0,"rv":["p","None"],"fn":"Hello"},{"l":5,"e":"l","f":[5,9],"h":[0,3,5,6],"o":0},{"l":6,"e":"l","f":[5,9],"h":[0,3,5,6],"o":0},{"l":6,"e":"r","f":[5,9],"h":[7,3,5,6],"o":0,"rv":["p","None"],"fn":"__init_subclass__"},{"l":12,"e":"l","f":[10],"h":[7,3,5],"o":0},{"l":12,"e":"l","f":[10,11],"h":[7,3,5],"o":0},{"l":13,"e":"l","f":[10,12],"h":[7,3,5],"o":0},{"l":13,"e":"r","f":[10,13],"h":[7,3,5,8],"o":0,"rv":["p","None"],"fn":"Bye"},{"l":5,"e":"l","f":[10,14],"h":[7,3,5,9,10],"o":0},{"l":6,"e":"l","f":[10,14],"h":[7,3,5,9,10],"o":0},{"l":6,"e":"r","f":[10,14],"h":[11,3,5,9,10],"o":0,"rv":["p","None"],"fn":"__init_subclass__"},{"l":16,"e":"l","f":[15],"h":[11,3,5,9],"o":0},{"l":17,"e":"l","f":[15],"h":[11,3,5,9],"o":17},{"l":14,"e":"l","f":[15,16],"h":[11,3,5,9,12],"o":17},{"l":14,"e":"r","f":[15,16],"h":[11,3,5,9,12],"o":17,"rv":["p","'Пока!'"],"fn":"run"},{"l":0,"e":"d","f":[15],"h":[11,3,5,9],"o":23}],"objs":[{"n":1,"k":"dict","t":"dict","pairs":[],"more":0},{"n":2,"k":"func","t":"function","name":"Command.__init_subclass__","sig":"(cls, name, **kw)","cells":{"__class__":["p","<пусто>"]}},{"n":3,"k":"other","t":"cell","r":"<cell: empty>"},{"n":4,"k":"class","t":"class","name":"Command","bases":[],"attrs":{"commands":["r",1]}},{"n":5,"k":"func","t":"function","name":"Hello.run","sig":"(self)"},{"n":6,"k":"class","t":"class","name":"Hello","bases":["Command"],"attrs":{"run":["p","метод"]}},{"n":7,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'hello'"],["r",6]]],"more":0},{"n":8,"k":"func","t":"function","name":"Bye.run","sig":"(self)"},{"n":9,"k":"class","t":"class","name":"Bye","bases":["Command"],"attrs":{"run":["p","метод"]}},{"n":10,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'hello'"],["r",6]],[["p","'bye'"],["r",9]]],"more":0},{"n":11,"k":"obj","t":"Bye","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Command()","vars":[]},{"name":"тело класса Command","vars":[]},{"name":"тело класса Command","vars":[["commands",["r",1]]]},{"name":"тело класса Command","vars":[["commands",["r",1]],["__init_subclass__",["r",2]],["__classcell__",["r",3]]]},{"name":"глобальная область","vars":[["Command",["r",4]]]},{"name":"Hello()","vars":[]},{"name":"тело класса Hello","vars":[]},{"name":"тело класса Hello","vars":[["run",["r",5]]]},{"name":"__init_subclass__()","vars":[["cls",["r",6]],["name",["p","'hello'"]],["kw",["r",7]]]},{"name":"глобальная область","vars":[["Command",["r",4]],["Hello",["r",6]]]},{"name":"Bye()","vars":[]},{"name":"тело класса Bye","vars":[]},{"name":"тело класса Bye","vars":[["run",["r",8]]]},{"name":"__init_subclass__()","vars":[["cls",["r",9]],["name",["p","'bye'"]],["kw",["r",10]]]},{"name":"глобальная область","vars":[["Command",["r",4]],["Hello",["r",6]],["Bye",["r",9]]]},{"name":"run()","vars":[["self",["r",11]]]}],"out":"['hello', 'bye']\nПока!\n","error":null,"truncated":false}}]},{"title":"Модули и пакеты","items":["module","package","import","from ... import","__name__","__main__","__init__.py","namespace"],"intro":"Как разложить код по файлам и папкам и собрать его вместе.","lessons":[{"title":"Модуль и import","covers":["module","import","from ... import","namespace"],"opts":{"show_modules":true},"text":"**Модуль** — это просто файл `.py`. `import geometry` выполняет этот файл **один раз** и создаёт объект-модуль; его содержимое доступно через точку: `geometry.PI`. У каждого модуля своё **пространство имён** (namespace) — поэтому имена из разных файлов не конфликтуют.\n\n`from geometry import circle_area` берёт из модуля конкретное имя и кладёт его в **твоё** пространство имён. Повторный `import` не выполняет файл заново — модуль берётся из кэша `sys.modules`.","code":"import geometry\nprint(geometry.PI)\nfrom geometry import circle_area\nprint(circle_area(2))\nimport geometry\nimport math as m\nprint(m.sqrt(16))","key":["Модуль = файл .py, выполняется при первом импорте.","`import m` → `m.имя`; `from m import имя` → просто `имя`.","У каждого модуля своё пространство имён."],"id":"15-1","narr":{"1":"Выполняется geometry.py, создаётся объект-модуль","2":"Доступ через имя модуля","3":"Копируем одно имя в наше пространство имён","5":"Повторный импорт — файл НЕ выполняется второй раз","6":"Псевдоним"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":18},{"l":3,"e":"l","f":[1],"h":[0],"o":26},{"l":4,"e":"l","f":[1],"h":[0],"o":26},{"l":5,"e":"l","f":[1],"h":[0],"o":35},{"l":6,"e":"l","f":[1],"h":[0],"o":35},{"l":7,"e":"l","f":[2],"h":[0,1],"o":35},{"l":0,"e":"d","f":[2],"h":[0,1],"o":39}],"objs":[{"n":1,"k":"other","t":"module","r":"модуль geometry: PI, circle_area"},{"n":2,"k":"other","t":"module","r":"модуль math: acos, acosh, asin, asinh, atan, atan2, atanh, cbrt"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["geometry",["r",1]]]},{"name":"глобальная область","vars":[["geometry",["r",1]],["m",["r",2]]]}],"out":"geometry загружен\n3.14159\n12.56636\n4.0\n","error":null,"truncated":false},"files_show":{"geometry.py":"PI = 3.14159\n\ndef circle_area(r):\n    return PI * r * r\n\nprint('geometry загружен')\n"}},{"title":"Пакет и __init__.py","covers":["package","__init__.py"],"opts":{"show_modules":true},"text":"**Пакет** — папка с модулями. Файл `__init__.py` внутри папки выполняется при импорте пакета: в нём часто «поднимают» важные имена наверх, чтобы писать `from shop import Cart` вместо `from shop.cart import Cart`.\n\nИмпорт внутри пакета пишут с точкой: `from .cart import Cart` — «из соседнего модуля».","code":"import shop\nfrom shop.cart import Cart\nfrom shop import Cart as C2\nprint(Cart is C2)\nc = Cart().add(\"хлеб\").add(\"сыр\")\nprint(c.items)","key":["Пакет = папка с модулями.","`__init__.py` выполняется при импорте пакета.","`from .модуль import X` — импорт внутри пакета."],"id":"15-2","narr":{"1":"Выполняется shop/__init__.py","2":"Полный путь: пакет.модуль","3":"Короткий путь — благодаря __init__.py","4":"Это один и тот же класс"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":27},{"l":3,"e":"l","f":[1],"h":[0],"o":27},{"l":4,"e":"l","f":[1],"h":[0],"o":27},{"l":5,"e":"l","f":[1],"h":[0],"o":32},{"l":6,"e":"l","f":[2],"h":[0,1],"o":32},{"l":0,"e":"d","f":[2],"h":[0,1],"o":48}],"objs":[{"n":1,"k":"other","t":"module","r":"модуль shop: cart, Cart"},{"n":2,"k":"other","t":"Cart","r":"<shop.cart.Cart object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["shop",["r",1]]]},{"name":"глобальная область","vars":[["shop",["r",1]],["c",["r",2]]]}],"out":"пакет shop инициализирован\nTrue\n['хлеб', 'сыр']\n","error":null,"truncated":false},"files_show":{"shop/__init__.py":"print('пакет shop инициализирован')\nfrom .cart import Cart\n","shop/cart.py":"class Cart:\n    def __init__(self):\n        self.items = []\n    def add(self, item):\n        self.items.append(item)\n        return self\n"}},{"title":"__name__ и __main__","covers":["__name__","__main__"],"opts":{"show_name":true},"text":"У каждого модуля есть переменная `__name__`. Если файл **запущен напрямую** (`python tools.py`), в ней лежит строка `\"__main__\"`. Если файл **импортирован**, там его имя — `\"tools\"`.\n\nПоэтому блок `if __name__ == \"__main__\":` выполняется только при прямом запуске. Туда кладут демонстрацию или тесты, которые не должны срабатывать при импорте.","code":"print(\"Этот файл:\", __name__)\nimport tools\nprint(tools.shout(\"привет\"))\nif __name__ == \"__main__\":\n    print(\"Главная программа стартует\")","key":["Запущен напрямую → `__name__ == '__main__'`.","Импортирован → `__name__` = имя модуля.","`if __name__ == '__main__':` — точка входа программы."],"id":"15-3","narr":{"1":"Мы запущены напрямую → \"__main__\"","2":"В tools.py __name__ будет \"tools\", поэтому блок if там не сработает","5":"Сработает: мы — главный модуль"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[0],"h":[],"o":20},{"l":3,"e":"l","f":[0],"h":[],"o":44},{"l":4,"e":"l","f":[0],"h":[],"o":52},{"l":5,"e":"l","f":[0],"h":[],"o":52},{"l":0,"e":"d","f":[0],"h":[],"o":79}],"objs":[],"frames":[{"name":"глобальная область","vars":[["__name__",["p","'__main__'"]]]}],"out":"Этот файл: __main__\ntools: __name__ = tools\nПРИВЕТ!\nГлавная программа стартует\n","error":null,"truncated":false},"files_show":{"tools.py":"def shout(s):\n    return s.upper() + '!'\n\nprint('tools: __name__ =', __name__)\n\nif __name__ == '__main__':\n    print('Запущен как программа — тесты')\n"}}]},{"title":"Исключения","items":["Exception","try","except","else","finally","raise","custom exceptions"],"intro":"Ошибки во время работы программы — это тоже объекты. Их можно поймать, обработать и даже создать свои.","lessons":[{"title":"Что такое исключение","covers":["Exception"],"text":"Когда Python не может выполнить действие (деление на ноль, нет ключа в словаре, неверный тип), он создаёт **объект-исключение** и «выбрасывает» его. Выполнение текущей функции прерывается, и исключение летит вверх по стеку вызовов, пока его кто-нибудь не поймает. Если не поймал никто — программа падает.\n\nВсе обычные исключения наследуют от `Exception`: `ValueError`, `TypeError`, `KeyError`, `IndexError`, `ZeroDivisionError`… Смотри в визуализаторе на шаги с красным «!».","code":"def divide(a, b):\n    return a / b\n\ndef calc():\n    return divide(10, 0)\n\ntry:\n    calc()\nexcept Exception as e:\n    print(\"Поймали:\", type(e).__name__, \"-\", e)\n    print(isinstance(e, ZeroDivisionError), isinstance(e, Exception))","key":["Исключение — объект, описывающий ошибку.","Оно поднимается вверх по стеку вызовов.","Не поймано — программа завершается с ошибкой."],"id":"16-1","narr":{"2":"При b = 0 здесь возникнет ZeroDivisionError","5":"Исключение пролетит и через эту функцию","9":"Ловим на самом верху"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":8,"e":"l","f":[2],"h":[0,1],"o":0},{"l":5,"e":"l","f":[2,3],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3,4],"h":[0,1],"o":0},{"l":2,"e":"e","f":[2,3,4],"h":[0,1],"o":0,"ex":"ZeroDivisionError: division by zero"},{"l":2,"e":"r","f":[2,3,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"divide"},{"l":5,"e":"e","f":[2,3],"h":[0,1],"o":0,"ex":"ZeroDivisionError: division by zero"},{"l":5,"e":"r","f":[2,3],"h":[0,1],"o":0,"rv":["p","None"],"fn":"calc"},{"l":8,"e":"e","f":[2],"h":[0,1],"o":0,"ex":"ZeroDivisionError: division by zero"},{"l":9,"e":"l","f":[2],"h":[0,1],"o":0},{"l":10,"e":"l","f":[5],"h":[0,1,2,3],"o":0},{"l":11,"e":"l","f":[5],"h":[0,1,2,3],"o":46},{"l":0,"e":"d","f":[2],"h":[0,1],"o":56}],"objs":[{"n":1,"k":"func","t":"function","name":"divide","sig":"(a, b)"},{"n":2,"k":"func","t":"function","name":"calc","sig":"()"},{"n":3,"k":"obj","t":"ZeroDivisionError","attrs":{"args":["r",4]},"exc":true},{"n":4,"k":"tuple","t":"tuple","items":[["p","'division by zero'"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["divide",["r",1]]]},{"name":"глобальная область","vars":[["divide",["r",1]],["calc",["r",2]]]},{"name":"calc()","vars":[]},{"name":"divide()","vars":[["a",["p","10"]],["b",["p","0"]]]},{"name":"глобальная область","vars":[["divide",["r",1]],["calc",["r",2]],["e",["r",3]]]}],"out":"Поймали: ZeroDivisionError - division by zero\nTrue True\n","error":null,"truncated":false}},{"title":"try / except / else / finally","covers":["try","except","else","finally"],"text":"`try` — «попробуй выполнить». `except Тип` — «если случилась такая ошибка, сделай это». `else` — выполняется, **если ошибки не было**. `finally` — выполняется **всегда**, при ошибке и без — туда кладут уборку: закрыть файл, соединение.\n\nМожно писать несколько `except` для разных ошибок: срабатывает первый подходящий. Пройди по шагам оба запуска: с хорошими данными и с плохими.","code":"def parse_age(text):\n    try:\n        age = int(text)\n    except ValueError:\n        print(f\"'{text}' — не число\")\n        age = None\n    else:\n        print(\"Успешно:\", age)\n    finally:\n        print(\"Проверка завершена\")\n    return age\n\nparse_age(\"25\")\nparse_age(\"abc\")","key":["`try` → `except` при ошибке → `else` без ошибки → `finally` всегда.","Лови конкретные исключения, а не все подряд.","`finally` — для освобождения ресурсов."],"quiz":{"q":"Что выполнится, если в `try` ошибки НЕ было?","options":["except и finally","else и finally","только finally","только else"],"answer":1,"why":"`else` — для случая без ошибки, `finally` — всегда."},"id":"16-2","narr":{"3":"Может бросить ValueError","8":"Только если ошибки не было","10":"Всегда"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":13,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":3,"e":"l","f":[1,2],"h":[0],"o":0},{"l":8,"e":"l","f":[1,3],"h":[0],"o":0},{"l":10,"e":"l","f":[1,3],"h":[0],"o":12},{"l":11,"e":"l","f":[1,3],"h":[0],"o":31},{"l":11,"e":"r","f":[1,3],"h":[0],"o":31,"rv":["p","25"],"fn":"parse_age"},{"l":14,"e":"l","f":[1],"h":[0],"o":31},{"l":2,"e":"l","f":[1,4],"h":[0],"o":31},{"l":3,"e":"l","f":[1,4],"h":[0],"o":31},{"l":3,"e":"e","f":[1,4],"h":[0],"o":31,"ex":"ValueError: invalid literal for int() with base 10: 'abc'"},{"l":4,"e":"l","f":[1,4],"h":[0],"o":31},{"l":5,"e":"l","f":[1,4],"h":[0],"o":31},{"l":6,"e":"l","f":[1,4],"h":[0],"o":48},{"l":10,"e":"l","f":[1,5],"h":[0],"o":48},{"l":11,"e":"l","f":[1,5],"h":[0],"o":67},{"l":11,"e":"r","f":[1,5],"h":[0],"o":67,"rv":["p","None"],"fn":"parse_age"},{"l":0,"e":"d","f":[1],"h":[0],"o":67}],"objs":[{"n":1,"k":"func","t":"function","name":"parse_age","sig":"(text)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["parse_age",["r",1]]]},{"name":"parse_age()","vars":[["text",["p","'25'"]]]},{"name":"parse_age()","vars":[["text",["p","'25'"]],["age",["p","25"]]]},{"name":"parse_age()","vars":[["text",["p","'abc'"]]]},{"name":"parse_age()","vars":[["text",["p","'abc'"]],["age",["p","None"]]]}],"out":"Успешно: 25\nПроверка завершена\n'abc' — не число\nПроверка завершена\n","error":null,"truncated":false}},{"title":"raise и свои исключения","covers":["raise","custom exceptions"],"text":"`raise` бросает исключение самостоятельно — когда твоя функция обнаружила недопустимую ситуацию. Свои исключения создают, наследуя от `Exception`: так их можно ловить отдельно и добавлять полезные поля.\n\n`raise ... from e` сохраняет исходную причину — удобно, когда одну ошибку превращаешь в другую.","code":"class NotEnoughMoney(Exception):\n    def __init__(self, need, have):\n        super().__init__(f\"Нужно {need}, есть {have}\")\n        self.need = need\n        self.have = have\n\ndef buy(price, wallet):\n    if price > wallet:\n        raise NotEnoughMoney(price, wallet)\n    return wallet - price\n\ntry:\n    buy(500, 120)\nexcept NotEnoughMoney as e:\n    print(\"Ошибка:\", e)\n    print(\"Не хватает:\", e.need - e.have)","key":["`raise X(...)` — бросить исключение.","Свои исключения — `class MyError(Exception)`.","В них можно хранить дополнительные данные."],"id":"16-3","narr":{"1":"Своё исключение","9":"Бросаем своё исключение"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0,1],"o":0,"rv":["r",2],"fn":"NotEnoughMoney"},{"l":7,"e":"l","f":[4],"h":[2],"o":0},{"l":12,"e":"l","f":[5],"h":[2,3],"o":0},{"l":13,"e":"l","f":[5],"h":[2,3],"o":0},{"l":8,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":9,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":3,"e":"l","f":[5,6,7],"h":[2,3,4,5],"o":0},{"l":4,"e":"l","f":[5,6,7],"h":[2,3,6,7],"o":0},{"l":5,"e":"l","f":[5,6,7],"h":[2,3,8,7],"o":0},{"l":5,"e":"r","f":[5,6,7],"h":[2,3,9,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":9,"e":"e","f":[5,6],"h":[2,3],"o":0,"ex":"NotEnoughMoney: Нужно 500, есть 120"},{"l":9,"e":"r","f":[5,6],"h":[2,3],"o":0,"rv":["p","None"],"fn":"buy"},{"l":13,"e":"e","f":[5],"h":[2,3],"o":0,"ex":"NotEnoughMoney: Нужно 500, есть 120"},{"l":14,"e":"l","f":[5],"h":[2,3],"o":0},{"l":15,"e":"l","f":[8],"h":[2,3,9,7],"o":0},{"l":16,"e":"l","f":[8],"h":[2,3,9,7],"o":28},{"l":0,"e":"d","f":[5],"h":[2,3],"o":44}],"objs":[{"n":1,"k":"func","t":"function","name":"NotEnoughMoney.__init__","sig":"(self, need, have)","cells":{"__class__":["p","<пусто>"]}},{"n":2,"k":"other","t":"cell","r":"<cell: empty>"},{"n":3,"k":"class","t":"class","name":"NotEnoughMoney","bases":["Exception"],"attrs":{"__init__":["p","метод"]}},{"n":4,"k":"func","t":"function","name":"buy","sig":"(price, wallet)"},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",6]},"exc":true},{"n":6,"k":"tuple","t":"tuple","items":[["p","500"],["p","120"]],"more":0},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",7]},"exc":true},{"n":7,"k":"tuple","t":"tuple","items":[["p","'Нужно 500, есть 120'"]],"more":0},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",7],"need":["p","500"]},"exc":true},{"n":5,"k":"obj","t":"NotEnoughMoney","attrs":{"args":["r",7],"need":["p","500"],"have":["p","120"]},"exc":true}],"frames":[{"name":"глобальная область","vars":[]},{"name":"NotEnoughMoney()","vars":[]},{"name":"тело класса NotEnoughMoney","vars":[]},{"name":"тело класса NotEnoughMoney","vars":[["__init__",["r",1]],["__classcell__",["r",2]]]},{"name":"глобальная область","vars":[["NotEnoughMoney",["r",3]]]},{"name":"глобальная область","vars":[["NotEnoughMoney",["r",3]],["buy",["r",4]]]},{"name":"buy()","vars":[["price",["p","500"]],["wallet",["p","120"]]]},{"name":"__init__()","vars":[["self",["r",5]],["need",["p","500"]],["have",["p","120"]]]},{"name":"глобальная область","vars":[["NotEnoughMoney",["r",3]],["buy",["r",4]],["e",["r",5]]]}],"out":"Ошибка: Нужно 500, есть 120\nНе хватает: 380\n","error":null,"truncated":false}}]},{"title":"Файлы и I/O","items":["open()","read()","write()","close()","with","context manager","streams"],"intro":"Ввод-вывод (I/O): как программа читает и пишет данные в файлы и потоки.","lessons":[{"title":"open, write и close","covers":["open()","write()","close()"],"text":"`open(путь, режим)` открывает файл и возвращает **файловый объект**. Режимы: `\"r\"` — читать, `\"w\"` — записать заново (старое содержимое стирается), `\"a\"` — дописать в конец. Для русских букв указывай `encoding=\"utf-8\"`.\n\n`write(текст)` пишет строку (перевод строки `\\n` нужно добавлять самому). `close()` закрывает файл и сбрасывает данные на диск. Забыть `close()` — частая ошибка, поэтому обычно используют `with` (следующие уроки).","code":"f = open(\"notes.txt\", \"w\", encoding=\"utf-8\")\nf.write(\"Купить хлеб\\n\")\nf.write(\"Позвонить маме\\n\")\nf.close()\nprint(f.closed)\ng = open(\"notes.txt\", \"a\", encoding=\"utf-8\")\ng.write(\"Выучить Python\\n\")\ng.close()\nprint(open(\"notes.txt\", encoding=\"utf-8\").read())","key":["`open(path, mode, encoding='utf-8')`.","`w` — перезаписать, `a` — дописать, `r` — читать.","После работы файл нужно закрыть."],"id":"17-1","narr":{"1":"Открываем на запись — файл создаётся","2":"write возвращает число записанных символов","4":"Закрываем: данные сохранены на диск","6":"Режим a — дописать в конец"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":5},{"l":7,"e":"l","f":[2],"h":[0,1],"o":5},{"l":8,"e":"l","f":[2],"h":[0,1],"o":5},{"l":9,"e":"l","f":[2],"h":[0,1],"o":5},{"l":0,"e":"d","f":[3],"h":[0,1,2],"o":48}],"objs":[{"n":1,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='notes.txt' mode='w' encoding='utf-8'>"},{"n":2,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='notes.txt' mode='a' encoding='utf-8'>"},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'version'"],["p","0"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["f",["r",1]]]},{"name":"глобальная область","vars":[["f",["r",1]],["g",["r",2]]]},{"name":"глобальная область","vars":[["f",["r",1]],["g",["r",2]],["__warningregistry__",["r",3]]]}],"out":"True\nКупить хлеб\nПозвонить маме\nВыучить Python\n\n","error":null,"truncated":false}},{"title":"read и потоки","covers":["read()","streams"],"text":"`read()` читает весь файл в одну строку, `readline()` — одну строку, а перебор `for line in f` читает **построчно**, не загружая весь файл в память. Это и есть идея **потока** (stream): данные текут порциями, а файл помнит позицию, где остановился.\n\nПотоки бывают не только файлами: `print` пишет в поток `sys.stdout`, а `io.StringIO` — поток в памяти, который ведёт себя как файл.","code":"with open(\"data.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"первая\\nвторая\\nтретья\\n\")\n\nf = open(\"data.txt\", encoding=\"utf-8\")\nprint(repr(f.readline()))\nfor line in f:\n    print(\"строка:\", line.strip())\nf.close()\n\nimport io\nbuf = io.StringIO()\nbuf.write(\"hello \")\nbuf.write(\"stream\")\nprint(buf.getvalue())","key":["`read()` — всё, `readline()` — строка, `for line in f` — построчно.","Поток помнит позицию чтения.","`sys.stdout` и `StringIO` — тоже потоки."],"id":"17-2","narr":{"5":"Прочитали одну строку — позиция сдвинулась","6":"Продолжаем с текущей позиции, по строке за раз","11":"Поток в памяти"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":1,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[2],"h":[1],"o":0},{"l":6,"e":"l","f":[2],"h":[1],"o":11},{"l":7,"e":"l","f":[3],"h":[1],"o":11},{"l":6,"e":"l","f":[3],"h":[1],"o":26},{"l":7,"e":"l","f":[4],"h":[1],"o":26},{"l":6,"e":"l","f":[4],"h":[1],"o":41},{"l":8,"e":"l","f":[4],"h":[1],"o":41},{"l":10,"e":"l","f":[4],"h":[1],"o":41},{"l":11,"e":"l","f":[4],"h":[1],"o":41},{"l":12,"e":"l","f":[5],"h":[1,2],"o":41},{"l":13,"e":"l","f":[5],"h":[1,2],"o":41},{"l":14,"e":"l","f":[5],"h":[1,2],"o":41},{"l":0,"e":"d","f":[5],"h":[1,2],"o":54}],"objs":[{"n":1,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='data.txt' mode='w' encoding='utf-8'>"},{"n":2,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='data.txt' mode='r' encoding='utf-8'>"},{"n":3,"k":"other","t":"StringIO","r":"<_io.StringIO object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["f",["r",1]]]},{"name":"глобальная область","vars":[["f",["r",2]]]},{"name":"глобальная область","vars":[["f",["r",2]],["line",["p","'вторая\\n'"]]]},{"name":"глобальная область","vars":[["f",["r",2]],["line",["p","'третья\\n'"]]]},{"name":"глобальная область","vars":[["f",["r",2]],["line",["p","'третья\\n'"]],["buf",["r",3]]]}],"out":"'первая\\n'\nстрока: вторая\nстрока: третья\nhello stream\n","error":null,"truncated":false}},{"title":"with — файлы без забот","covers":["with","context manager"],"text":"`with open(...) as f:` открывает файл и **гарантированно закрывает** его в конце блока — даже если внутри произошла ошибка. Файловый объект — это **контекстный менеджер**: объект, который знает, что делать при входе в блок и при выходе.\n\nЭто стандартный и правильный способ работы с файлами. Как это устроено внутри — в разделе 18.","code":"with open(\"log.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"старт\\n\")\n    print(\"Внутри блока, закрыт?\", f.closed)\nprint(\"После блока, закрыт?\", f.closed)\n\ntry:\n    with open(\"log.txt\", encoding=\"utf-8\") as f:\n        print(f.read().strip())\n        raise RuntimeError(\"что-то сломалось\")\nexcept RuntimeError:\n    print(\"Ошибка, но файл всё равно закрыт:\", f.closed)","key":["`with` сам закрывает файл.","Работает и при ошибках внутри блока.","Файл — пример контекстного менеджера."],"id":"17-3","narr":{"1":"Вход: файл открыт","4":"Выход из with закрыл файл сам","9":"Ошибка внутри блока…","11":"…файл всё равно закрыт"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[1],"h":[0],"o":0},{"l":1,"e":"l","f":[1],"h":[0],"o":28},{"l":4,"e":"l","f":[1],"h":[0],"o":28},{"l":6,"e":"l","f":[1],"h":[0],"o":54},{"l":7,"e":"l","f":[1],"h":[0],"o":54},{"l":8,"e":"l","f":[2],"h":[1],"o":54},{"l":9,"e":"l","f":[2],"h":[1],"o":60},{"l":9,"e":"e","f":[2],"h":[1],"o":60,"ex":"RuntimeError: что-то сломалось"},{"l":7,"e":"l","f":[2],"h":[1],"o":60},{"l":10,"e":"l","f":[2],"h":[1],"o":60},{"l":11,"e":"l","f":[2],"h":[1],"o":60},{"l":0,"e":"d","f":[2],"h":[1],"o":99}],"objs":[{"n":1,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='log.txt' mode='w' encoding='utf-8'>"},{"n":2,"k":"other","t":"TextIOWrapper","r":"<_io.TextIOWrapper name='log.txt' mode='r' encoding='utf-8'>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["f",["r",1]]]},{"name":"глобальная область","vars":[["f",["r",2]]]}],"out":"Внутри блока, закрыт? False\nПосле блока, закрыт? True\nстарт\nОшибка, но файл всё равно закрыт: True\n","error":null,"truncated":false}}]},{"title":"Контекстные менеджеры","items":["__enter__","__exit__","with","contextlib"],"intro":"Шаблон «подготовить → поработать → гарантированно убрать за собой».","lessons":[{"title":"__enter__ и __exit__","covers":["__enter__","__exit__","with"],"text":"`with obj as x:` работает так: 1) вызывается `obj.__enter__()`, его результат попадает в `x`; 2) выполняется блок; 3) вызывается `obj.__exit__(тип_ошибки, ошибка, трассировка)` — **всегда**, даже при исключении.\n\nЕсли `__exit__` вернёт `True`, исключение считается обработанным и дальше не полетит. Смотри по шагам, как появляются кадры `__enter__` и `__exit__`.","code":"class Timer:\n    def __enter__(self):\n        print(\"▶ старт\")\n        self.steps = 0\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        print(\"■ стоп, шагов:\", self.steps, \"ошибка:\", exc_type.__name__ if exc_type else None)\n        return exc_type is ValueError\n\nwith Timer() as t:\n    t.steps += 1\n    t.steps += 1\n\nwith Timer() as t:\n    t.steps += 1\n    raise ValueError(\"упс\")\nprint(\"Программа продолжается\")","key":["`with` → `__enter__` → блок → `__exit__`.","`__exit__` вызывается всегда.","Вернёт `True` — исключение подавлено."],"id":"18-1","narr":{"2":"Вход в блок with","5":"Это значение попадёт в переменную после as","7":"Выход — всегда","9":"True = «ошибку я обработал»","17":"__exit__ получит эту ошибку и подавит её"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Timer"},{"l":11,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":4,"e":"l","f":[5,6],"h":[2,3],"o":8},{"l" mer()","vars":[]},{"name":"тело класса Timer","vars":[]},{"name":"тело класса Timer","vars":[["__enter__",["r",1]]]},{"name":"тело класса Timer","vars":[["__enter__",["r",1]],["__exit__",["r",2]]]},{"name":"глобальная область","vars":[["Timer",["r",3]]]},{"name":"__enter__()","vars":[["self",["r",4]]]},{"name":"глобальная область","vars":[["Timer",["r",3]],["t",["r",4]]]},{"name":"__exit__()","vars":[["self",["r",4]],["exc_type",["p","None"]],["exc",["p","None"]],["tb",["p","None"]]]},{"name":"__enter__()","vars":[["self",["r",5]]]},{"name":"глобальная область","vars":[["Timer",["r",3]],["t",["r",5]]]},{"name":"__exit__()","vars":[["self",["r",5]],["exc_type",["p","<класс ValueError>"]],["exc",["r",6]],["tb",["r",8]]]}],"out":"▶ старт\n■ стоп, шагов: 2 ошибка: None\n▶ старт\n■ стоп, шагов: 1 ошибка: ValueError\nПрограмма продолжается\n","error":null,"truncated":false}},{"title":"contextlib","covers":["contextlib"],"text":"Модуль `contextlib` упрощает создание менеджеров. Декоратор `@contextmanager` превращает **генератор** в контекстный менеджер: код до `yield` — это `__enter__`, значение `yield` попадает в `as`, код после — `__exit__`. Оберни `yield` в `try/finally`, чтобы уборка шла даже при ошибке.\n\nЕщё полезное: `contextlib.suppress(Ошибка)` — тихо игнорировать конкретную ошибку.","code":"from contextlib import contextmanager, suppress\n\n@contextmanager\ndef tag(name):\n    print(f\"<{name}>\")\n    try:\n        yield name.upper()\n    finally:\n        print(f\"<\/{name}>\")\n\nwith tag(\"div\") as t:\n    print(\"  содержимое\", t)\n\nwith suppress(KeyError):\n    {}[\"нет такого\"]\nprint(\"дальше\")","key":["`@contextmanager` + генератор = простой менеджер.","До `yield` — вход, после — выход.","`suppress` — игнорировать конкретное исключение."],"id":"18-2","narr":{"5":"Это как __enter__","7":"Значение уходит в as; генератор ждёт конца блока","9":"Это как __exit__ — всегда","15":"Ошибка тихо подавлена"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o": ились — `StopIteration`. Итератор одноразовый: прошёл до конца — нужно создавать новый. А список можно перебирать сколько угодно раз, потому что каждый `for` создаёт новый итератор.","code":"colors = [\"red\", \"green\", \"blue\"]\nit = iter(colors)\nprint(next(it))\nprint(next(it))\nprint(list(it))\nprint(list(it))\ntry:\n    next(it)\nexcept StopIteration:\n    print(\"StopIteration: элементов нет\")","key":["Iterable — можно перебрать; iterator — перебирает и помнит позицию.","`iter()` создаёт итератор, `next()` берёт элемент.","Итератор одноразовый."],"id":"19-1","narr":{"1":"Iterable","2":"Создаём итератор — у него своя позиция","3":"Первый элемент","4":"Второй — итератор помнит, где был","5":"Остаток","6":"Итератор исчерпан — пусто"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[2],"h":[0,1],"o":4},{"l":5,"e":"l","f":[2],"h":[0,1],"o":10},{"l":6,"e":"l","f":[2],"h":[0,1],"o":19},{"l":7,"e":"l","f":[2],"h":[0,1],"o":22},{"l":8,"e":"l","f":[2],"h":[0,1],"o":22},{"l":8,"e":"e","f":[2],"h":[0,1],"o":22,"ex":"StopIteration: "},{"l":9,"e":"l","f":[2],"h":[0,1],"o":22},{"l":10,"e":"l","f":[2],"h":[0,1],"o":22},{"l":0,"e":"d","f":[2],"h":[0,1],"o":51}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","'red'"],["p","'green'"],["p","'blue'"]],"more":0},{"n":2,"k":"other","t":"list_iterator","r":"<list_iterator object>"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["colors",["r",1]]]},{"name":"глобальная область","vars":[["colors",["r",1]],["it",["r",2]]]}],"out":"red\ngreen\n['blue']\n[]\nStopIteration: элементов нет\n","error":null,"truncated":false}},{"title":"yield и generator","covers":["yield","generator"],"text":"Функция с `yield` — **генератор**. Её вызов возвращает объект-генератор (который является итератором), а тело выполняется по кусочкам: до `yield` → пауза → до следующего `yield` → пауза…\n\nВ визуализаторе объект `generator` показывает своё состояние («на паузе», «завершён») и локальные переменные, которые сохраняются между паузами. Генераторы экономят память: элементы создаются по запросу, а не все сразу.","code":"def fib():\n    a, b = 0, 1\n    while True:\n        yield a\n        a, b = b, a + b\n\ngen = fib()\nfirst = [next(gen) for _ in range(6)]\nprint(first)\nprint(next(gen))","key":["`yield` = отдать значение и встать на паузу.","Локальные переменные сохраняются между вызовами.","Генератор ленивый: можно описать даже бесконечную последовательность."],"id":"19-2","narr":{"3":"Бесконечный цикл — но генератору это не страшно","4":"Отдаём a и замираем","7":"Тело не начало выполняться","8":"Берём только 6 значений","10":"Можно продолжить с того же места"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":8,"e":"l","f":[2],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,4],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,4],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,4],"h":[0,3],"o":0,"rv":["p","0"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,3],"o":0},{"l":5,"e":"l","f":[2,4],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,5],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,5],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,5],"h":[0,4],"o":0,"rv":["p","1"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,4],"o":0},{"l":5,"e":"l","f":[2,5],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,6],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,6],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,6],"h":[0,5],"o":0,"rv":["p","1"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,5],"o":0},{"l":5,"e":"l","f":[2,6],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,7],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,7],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,7],"h":[0,6],"o":0,"rv":["p","2"],"fn":"fib"},{"l":8,"e":"l","f":[2],"h":[0,6],"o":0},{"l":5,"e":"l","f":[2,7],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,8],"h":[0,2],"o":0},{"l":4,"e":"l","f":[2,8],"h":[0,2],"o":0},{"l":4,"e":"r","f":[2,8],"h":[0,7] ', 'hi']\n","error":null,"truncated":false}},{"title":"functools","covers":["functools"],"text":"Модуль `functools` — инструменты для работы с функциями:\n\n`@wraps(func)` внутри декоратора копирует имя и документацию оригинала на обёртку (иначе `__name__` будет `wrapper`). `@lru_cache` запоминает результаты вызовов — повторный вызов с теми же аргументами возвращается мгновенно. `partial` создаёт новую функцию с частично заданными аргументами.","code":"from functools import wraps, lru_cache, partial\n\ndef noisy(func):\n    @wraps(func)\n    def wrapper(*a):\n        return func(*a)\n    return wrapper\n\n@noisy\ndef greet(name):\n    return \"hi \" + name\n\nprint(greet.__name__)\n\n@lru_cache\ndef slow_square(n):\n    print(\"  считаю\", n)\n    return n * n\n\nslow_square(4)\nslow_square(4)\npower2 = partial(pow, 2)\nprint(power2(10))","key":["`@wraps` — обёртка сохраняет имя оригинала.","`@lru_cache` — кэширование результатов.","`partial` — фиксирует часть аргументов."],"id":"20-3","narr":{"4":"Сохраняем имя оригинала","13":"greet, а не wrapper","17":"Напечатается только при первом вызове для n","21":"Результат из кэша — «считаю» не печатается","22":"pow(2, x) с зафиксированным первым аргументом"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[1],"h":[0],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":5,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":5,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":7,"e":"l","f":[1,3],"h":[0,1,2],"o":0},{"l":7,"e":"r","f":[1,3],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"noisy"},{"l":10,"e":"l","f":[1],"h":[0],"o":0},{"l":13,"e":"l","f":[4],"h":[0,1,2],"o":0},{"l":15,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":16,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":15,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":16,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":20,"e":"l","f":[5],"h":[0,1,2,3 om typing import Optional, Literal\n\ndef find_user(uid: int) -> Optional[str]:\n    users = {1: \"Аня\", 2: \"Боря\"}\n    return users.get(uid)\n\ndef to_text(value: int | str) -> str:\n    return value if isinstance(value, str) else str(value)\n\nMode = Literal[\"light\", \"dark\"]\n\ndef set_theme(mode: Mode) -> str:\n    return \"тема: \" + mode\n\nname = find_user(3)\nif name is None:\n    print(\"не найден\")\nprint(to_text(5), to_text(\"пять\"), set_theme(\"dark\"))","key":["`A | B` = `Union[A, B]`.","`Optional[X]` = `X | None`.","`Literal[...]` — фиксированный набор значений."],"id":"21-2","narr":{"3":"Может вернуть None","7":"Union: int или str","12":"Только \"light\" или \"dark\"","16":"Optional напоминает про эту проверку"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[2],"h":[0,1],"o":0},{"l":12,"e":"l","f":[2],"h":[0,1],"o":0},{"l":15,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":4,"e":"l","f":[3,4],"h":[0,1,2],"o":0},{"l":5,"e":"l","f":[3,5],"h":[0,1,2,3],"o":0},{"l":5,"e":"r","f":[3,5],"h":[0,1,2,3],"o":0,"rv":["p","None"],"fn":"find_user"},{"l":16,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":17,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":18,"e":"l","f":[6],"h":[0,1,2],"o":10},{"l":8,"e":"l","f":[6,7],"h":[0,1,2],"o":10},{"l":8,"e":"r","f":[6,7],"h":[0,1,2],"o":10,"rv":["p","'5'"],"fn":"to_text"},{"l":8,"e":"l","f":[6,8],"h":[0,1,2],"o":10},{"l":8,"e":"r","f":[6,8],"h":[0,1,2],"o":10,"rv":["p","'пять'"],"fn":"to_text"},{"l":13,"e":"l","f":[6,9],"h":[0,1,2],"o":10},{"l":13,"e":"r","f":[6,9],"h":[0,1,2],"o":10,"rv":["p","'тема: dark'"],"fn":"set_theme"},{"l":0,"e":"d","f":[6],"h":[0,1,2],"o":28}],"objs":[{"n":1,"k":"func","t":"function","name":"find_user","sig":"(uid: int) -> Optional[str]"},{"n":2,"k":"func","t":"function","name":"to_text","sig":"(value: int | str) -> str"},{"n":3,"k":"func","t":"function","name":"set_theme","sig":"(mode: Literal['light', 'dark'] сам аргумент функции — тоже ссылка). Следи, как объект исчезает из «кучи» в визуализаторе, когда на него не остаётся ссылок.","code":"import sys\n\ndata = [1, 2, 3]\nprint(sys.getrefcount(data) - 1)\nalias = data\nbox = {\"x\": data}\nprint(sys.getrefcount(data) - 1)\ndel alias\nbox.clear()\nprint(sys.getrefcount(data) - 1)\ndata = None\nprint(\"список удалён из памяти\")","key":["Ссылки: имена, элементы коллекций, атрибуты.","Счётчик = 0 → объект освобождается сразу.","`del x` удаляет имя, а не объект."],"id":"23-2","narr":{"3":"Одна ссылка: имя data","5":"Ещё одна ссылка","6":"И ещё одна — из словаря","8":"Ссылок стало меньше","11":"Последняя ссылка исчезла — список освобождён"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":2},{"l":6,"e":"l","f":[2],"h":[0],"o":2},{"l":7,"e":"l","f":[3],"h":[0,1],"o":2},{"l":8,"e":"l","f":[3],"h":[0,1],"o":4},{"l":9,"e":"l","f":[4],"h":[0,1],"o":4},{"l":10,"e":"l","f":[4],"h":[0,2],"o":4},{"l":11,"e":"l","f":[4],"h":[0,2],"o":6},{"l":12,"e":"l","f":[5],"h":[2],"o":6},{"l":0,"e":"d","f":[5],"h":[2],"o":30}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","1"],["p","2"],["p","3"]],"more":0},{"n":2,"k":"dict","t":"dict","pairs":[[["p","'x'"],["r",1]]],"more":0},{"n":2,"k":"dict","t":"dict","pairs":[],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["data",["r",1]]]},{"name":"глобальная область","vars":[["data",["r",1]],["alias",["r",1]]]},{"name":"глобальная область","vars":[["data",["r",1]],["alias",["r",1]],["box",["r",2]]]},{"name":"глобальная область","vars":[["data",["r",1]],["box",["r",2]]]},{"name":"глобальная область","vars":[["data",["p","None"]],["box",["r",2]]]}],"out":"1\n3\n1\nсписок удалён из памяти\n","error":null,"truncated":false}},{"title":"Garbage collector и жизненный цикл объекта","covers":["garbage collector","object lifecycle"],"text":"**Жизненный цикл объекта**: создание (`__new__`) → инициализация (`__init__`) → использование → последняя ссылка исчезла → финализация (`__del__`) → освобождение памяти.\n\nСчётчик ссылок не справляется с **циклами**: если A ссылается на B, а B на A, их счётчики никогда не станут нулём. Для этого есть **сборщик мусора** (garbage collector, модуль `gc`): он периодически ищет группы объектов, недоступные из программы, и удаляет их.","code":"import gc\n\nclass Node:\n    def __init__(self, name):\n        self.name = name\n        print(\"создан\", name)\n    def __del__(self):\n        print(\"удалён\", self.name)\n\na = Node(\"A\")\na = None\nb = Node(\"B\")\nc = Node(\"C\")\nb.friend = c\nc.friend = b\nb = c = None\nprint(\"цикл ещё в памяти…\")\ngc.collect()\nprint(\"готово\")","key":["Создание → использование → нет ссылок → удаление.","Reference counting удаляет сразу, но не видит циклы.","`gc` находит и удаляет недоступные циклы."],"id":"23-3","narr":{"7":"Финализатор — вызывается перед уничтожением","11":"Ссылок нет → удаляется сразу (reference counting)","14":"Цикл: B → C → B","16":"Имён нет, но объекты ссылаются друг на друга","18":"Сборщик мусора находит и удаляет цикл"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Node"},{"l":10,"e":"l","f":[5],"h":[2],"o":0},{"l":5,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":6,"e":"l","f":[5,6],"h":[2,4],"o":0},{"l":6,"e":"r","f":[5,6],"h":[2,4],"o":9,"rv":["p","None"],"fn":"__init__"},{"l":11,"e":"l","f":[7],"h":[2,4],"o":9},{"l":8,"e":"l","f":[8,9],"h":[2,4],"o":9},{"l":8,"e":"r","f":[8,9],"h":[2,4],"o":18,"rv":["p","None"],"fn":"__del__"},{"l":12,"e":"l","f":[8],"h":[2],"o":18},{"l":5,"e":"l","f":[8,10],"h":[2,5],"o":18},{"l":6,"e":"l","f":[8,10],"h":[2,6],"o":18},{"l":6,"e":"r","f":[8,10],"h":[2,6],"o":2  программы занимается **одним делом** — одна читает данные, другая считает, третья показывает результат. Тогда изменение формата вывода не заденет расчёты.\n\n**Модульность** — программа собрана из независимых частей (функций, классов, модулей) с понятными границами. Части можно тестировать и заменять по отдельности.","code":"def load_scores():\n    return {\"Аня\": [5, 4, 5], \"Боря\": [3, 4, 4]}\n\ndef average(values):\n    return round(sum(values) / len(values), 2)\n\ndef render(name, avg):\n    return f\"{name:<5} {avg}\"\n\nfor name, marks in load_scores().items():\n    print(render(name, average(marks)))","key":["Одна часть — одно дело.","Модули с чёткими границами легко менять и тестировать.","Главный код — «клей», соединяющий части."],"id":"24-1","narr":{"1":"Ответственность 1: получить данные","4":"Ответственность 2: посчитать","7":"Ответственность 3: показать","10":"Главный код только соединяет части"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":10,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":2,"e":"l","f":[3,4],"h":[0,1,2],"o":0},{"l":2,"e":"r","f":[3,4],"h":[0,1,2,3,4,5],"o":0,"rv":["r",4],"fn":"load_scores"},{"l":11,"e":"l","f":[5],"h":[0,1,2,4],"o":0},{"l":5,"e":"l","f":[5,6],"h":[0,1,2,4],"o":0},{"l":5,"e":"r","f":[5,6],"h":[0,1,2,4],"o":0,"rv":["p","4.67"],"fn":"average"},{"l":8,"e":"l","f":[5,7],"h":[0,1,2,4],"o":0},{"l":8,"e":"r","f":[5,7],"h":[0,1,2,4],"o":0,"rv":["p","'Аня   4.67'"],"fn":"render"},{"l":10,"e":"l","f":[5],"h":[0,1,2,4],"o":11},{"l":11,"e":"l","f":[8],"h":[0,1,2,5],"o":11},{"l":5,"e":"l","f":[8,9],"h":[0,1,2,5],"o":11},{"l":5,"e":"r","f":[8,9],"h":[0,1,2,5],"o":11,"rv":["p","3.67"],"fn":"average"},{"l":8,"e":"l","f":[8,10],"h":[0,1,2,5],"o":11},{"l":8,"e":"r","f":[8,10],"h":[0,1,2,5],"o":11,"rv":["p","'Боря  3.67'"],"fn":"render"},{"l":10,"e":"l","f":[8],"h":[0,1,2,5],"o":22},{"l":0,"e":"d","f":[8],"h":[0,1,2,5],"o":22}],"objs":[{"n":1,"k":"fun f):\n        return sum(p for _, p in self.items)\n\nclass Receipt:\n    def print_for(self, cart):\n        return f\"К оплате: {cart.total()} ₽\"\n\ncart = Cart()\ncart.add(\"книга\", 500)\ncart.add(\"ручка\", 50)\nprint(Receipt().print_for(cart))","key":["Cohesion — единство задачи внутри модуля (чем выше, тем лучше).","Coupling — зависимость между модулями (чем ниже, тем лучше).","Общайтесь через интерфейсы, а не через внутренности."],"id":"24-2","narr":{"1":"Высокая связность: всё про корзину","9":"Низкое сцепление: знает только метод total()"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":6,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"Cart"},{"l":9,"e":"l","f":[6],"h":[3],"o":0},{"l":9,"e":"l","f":[6,7],"h":[3],"o":0},{"l":10,"e":"l","f":[6,8],"h":[3],"o":0},{"l":10,"e":"r","f":[6,9],"h":[3,4],"o":0,"rv":["p","None"],"fn":"Receipt"},{"l":13,"e":"l","f":[10],"h":[3,5],"o":0},{"l":3,"e":"l","f":[10,11],"h":[3,5,6],"o":0},{"l":3,"e":"r","f":[10,11],"h":[3,5,7,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":14,"e":"l","f":[12],"h":[3,5,7,8],"o":0},{"l":5,"e":"l","f":[12,13],"h":[3,5,7,8],"o":0},{"l":5,"e":"r","f":[12,13],"h":[3,5,7,9,10],"o":0,"rv":["p","None"],"fn":"add"},{"l":15,"e":"l","f":[12],"h":[3,5,7,9,10],"o":0},{"l":5,"e":"l","f":[12,14],"h":[3,5,7,9,10],"o":0},{"l":5,"e":"r","f":[12,14],"h":[3,5,7,11,10,12],"o":0,"rv":["p","None"],"fn":"add"},{"l":16,"e":"l","f":[12],"h":[3,5,7,11,10,12],"o":0},{"l":11,"e":"l","f":[12,15],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"l","f":[12,15,16],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"l","f":[12,15,16,17],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"r","f":[12,15,16,18],"h":[3,5,7,11,10,12,13],"o":0,"rv":["p","500"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[12,15,16,18],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"r","f":[12,15,16,19],  код легко тестировать и менять."],"id":"24-3","narr":{"5":"Подделка для тестов","13":"Зависимость приходит СНАРУЖИ","20":"Тот же Notifier, другая зависимость"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"EmailSender"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"l","f":[4,7],"h":[1,2],"o":0},{"l":8,"e":"r","f":[4,8],"h":[1,2,3],"o":0,"rv":["p","None"],"fn":"FakeSender"},{"l":12,"e":"l","f":[9],"h":[1,4],"o":0},{"l":12,"e":"l","f":[9,10],"h":[1,4],"o":0},{"l":13,"e":"l","f":[9,11],"h":[1,4],"o":0},{"l":15,"e":"l","f":[9,12],"h":[1,4,5],"o":0},{"l":15,"e":"r","f":[9,13],"h":[1,4,5,6],"o":0,"rv":["p","None"],"fn":"Notifier"},{"l":18,"e":"l","f":[14],"h":[1,4,7],"o":0},{"l":14,"e":"l","f":[14,15],"h":[1,4,7,8,9],"o":0},{"l":14,"e":"r","f":[14,15],"h":[1,4,7,10,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":16,"e":"l","f":[14,16],"h":[1,4,7,10,9],"o":0},{"l":3,"e":"l","f":[14,16,17],"h":[1,4,7,10,9],"o":0},{"l":3,"e":"r","f":[14,16,17],"h":[1,4,7,10,9],"o":0,"rv":["p","'email → anna@mail.ru: Добро пожаловать!'"],"fn":"send"},{"l":16,"e":"r","f":[14,16],"h":[1,4,7,10,9],"o":0,"rv":["p","'email → anna@mail.ru: Добро пожаловать!'"],"fn":"welcome"},{"l":19,"e":"l","f":[14],"h":[1,4,7],"o":40},{"l":7,"e":"l","f":[14,18],"h":[1,4,7,11],"o":40},{"l":7,"e":"r","f":[14,18],"h":[1,4,7,12,13],"o":40,"rv":["p","None"],"fn":"__init__"},{"l":20,"e":"l","f":[19],"h":[1,4,7,12,13],"o":40},{"l":14,"e":"l","f":[19,20],"h":[1,4,7,12,13,14],"o":40},{"l":14,"e":"r","f":[19,20],"h":[1,4,7,12,13,15],"o":40,"rv":["p","None"],"fn":"__init__"},{"l":16,"e":"l","f":[19,21],"h":[1,4,7,12,13,15],"o":40},{"l":9,"e":"l","f":[19,21,22],"h":[1,4,7,12,13,15],"o":40},{"l":10,"e":"l","f":[19,21,22],"h":[1,4,7,12,16,15],"o":40},{"l":10,"e":"r","f":[19,21,22],"h":[1,4,7,12,     return { n: i + 1, name: LEVELS[i][1], lo, hi, next: LEVELS[i + 1] ? LEVELS[i + 1][1] : null, frac: hi > lo ? (xp - lo) / (hi - lo) : 1 };

  function streak() {

  function confetti(power = 1) {

  // ---------- syntax highlight ----------
  const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
  const BI = new Set("print len range list dict set tuple int float str bool type id isinstance issubclass super object iter next open enumerate zip map filter sorted sum min max abs repr hasattr getattr setattr callable vars property classmethod staticmethod any all round input reversed frozenset Exception ValueError TypeError KeyError IndexError ZeroDivisionError StopIteration AttributeError NotImplementedError RuntimeError".split(" "));
  function hl(line) {
    const re = /(#.*$)|("""|'''|f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(@[\w.]+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;

    while ((m = re.exec(line))) {
      const [t, com, str, dec, num, id] = m;

    switch (o.k) {

        body = o.items.length ? `<div class="cells">${o.items.map((c, i) => `<div class="cell">${o.k === "set" ? "" : `<span class="i">${i}</span>`}<span class="b">${val(c)}</span></div>`).join("")}</div>${more}` : `<div class="emptyc">пусто</div>`;

        body = Object.keys(o.attrs).length ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : `<div class="emptyc">нет своих атрибутов</div>`;
        break;

  // ---------- what changed ----------
  function cellText(c) { return c ? (c[0] === "p" ? c[1] : "#" + c[1]) : ""; }
  function describeChange(L, prev, cur) {
    const tr = L.trace, out = [];
    if (!prev) return out;
    const pf = prev.f.map(i => tr.frames[i]), cf = cur.f.map(i => tr.frames[i]);
    if (cf.length > pf.length) out.push(`Вызов <b>${esc(cf[cf.length - 1].name)}</b>: создан новый кадр со своими переменными.`);
    if (cf.length < pf.length) out.push(`Кадр <b>${esc(pf[pf.length - 1].name)}</b> закрыт: его локальные имена исчезли.`);
    const n = Math.min(cf.length, pf.length);
    for (let i = 0; i < n; i++) {
      if (cf[i].name !== pf[i].name) continue;
      const pm = Object.fromEntries(pf[i].vars), cm = Object.fromEntries(cf[i].vars);
      for (const [k, v] of cf[i].vars) {
        if (!(k in pm)) out.push(`Новое имя <b>${esc(k)}</b> = ${esc(cellText(v))}`);
        else if (JSON.stringify(pm[k]) !== JSON.stringify(v)) out.push(`<b>${esc(k)}</b>: ${esc(cellText(pm[k]))} → ${esc(cellText(v))}`);
      }
      for (const k in pm) if (!(k in cm)) out.push(`Имя <b>${esc(k)}</b> удалено`);
    }
    const ph = new Map(prev.h.map(i => [tr.objs[i].n, i]));
    for (const i of cur.h) {
      const o = tr.objs[i];
      if (ph.has(o.n) && ph.get(o.n) !== i) out.push(`Объект <b>#${o.n}</b> (${esc(o.t)}) изменился внутри`);
    }
    for (const [k] of ph) if (!cur.h.some(i => tr.objs[i].n === k)) out.push(`Объект <b>#${k}</b> больше никому не нужен: его уберёт сборщик мусора`);
    if (cur.o > prev.o) out.push(`Напечатано: <b>${esc(tr.out.slice(prev.o, cur.o).trimEnd())}</b>`);
    return out.slice(0, 6);
  }

  // ---------- lesson ----------
  let player = null;
  function renderLesson(id) {
    const L = byId[id];
    const s = L.sec;
    setBar(`${L.si + 1}. ${esc(s.title)} · <b>${esc(L.title)}</b>`, true);
    const idx = LESSONS.indexOf(L);
    const prevL = LESSONS[idx - 1], nextL = LESSONS[idx + 1];
    let html = `<div class="sh" style="--sh:${secHue(L.si)}"><div class="lhead"><div class="eyebrow">Урок ${L.si + 1}.${L.li + 1} · ${esc(s.title)}</div><h1>${esc(L.title)}</h1>
      <div class="covers">${L.covers.map(c => `<span>${esc(c)}</span>`).join("")}</div></div>
      <div class="prose">${L.text.split(/\n\s*\n/).map(p => `<p>${md(p.trim())}</p>`).join("")}</div>`;
    if (L.analogy) html += `<div class="analogy"><div class="ic">${ICON.bulb}</div><div><b>ПРЕДСТАВЬ</b>${md(L.analogy)}</div></div>`;
    if (L.files_show) html += Object.entries(L.files_show).map(([fn, src]) => `<div class="file"><div class="fn">файл ${esc(fn)} <span>(лежит рядом, выполняется при import)</span></div><div class="code">${src.replace(/\n$/, "").split("\n").map((ln, i) => `<div class="ln"><span class="ar"></span><span class="no">${i + 1}</span><span>${hl(ln) || " "}</span></div>`).join("")}</div></div>`).join("");
    if (L.code) html += vizShell(L);
    if (L.key && L.key.length) html += `<div class="key"><h3>Запомни</h3><ul>${L.key.map(k => `<li>${md(k)}</li>`).join("")}</ul></div>`;
    if (L.quiz) html += quizHTML(L);
    const dn = isDone(L.id);
    html += `<button class="done-btn ${dn ? "on" : ""}" id="donebtn">${dn ? "✓ Урок пройден<small>нажми, чтобы снять отметку</small>" : `Я понял — урок пройден<small>+${XP.l} XP</small>`}</button>
      <nav class="pn">${prevL ? `<a class="press" href="#l${prevL.id}"><small>← назад</small><span>${esc(prevL.title)}</span></a>` : ""}${nextL ? `<a class="nx press" href="#l${nextL.id}"><small>дальше →</small><span>${esc(nextL.title)}</span></a>` : ""}</nav></div>`;
    app.innerHTML = html;
    document.getElementById("donebtn").addEventListener("click", () => {
      if (isDone(L.id)) { delete S.aw["l:" + L.id]; save(); refreshPills(false); renderLesson(id); return; }
      const res = withRewards(() => award("l:" + L.id));
      renderLesson(id);
      completeSheet(L, res);
    });
    if (L.quiz) wireQuiz(L);
    if (L.code) startPlayer(L);
    window.scrollTo(0, 0);
  }

  function completeSheet(L, res) {
    const s = L.sec, sd = s.lessons.filter(l => isDone(l.id)).length, left = s.lessons.length - sd;
    const lv = levelOf(res.xp1), st = streak();
    const idx = LESSONS.indexOf(L);
    const nextL = LESSONS.slice(idx + 1).find(l => !isDone(l.id)) || LESSONS[idx + 1];
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = `<div class="sheet sh" role="dialog" aria-modal="true" aria-label="Урок пройден" style="--sh:${secHue(L.si)}">
      <svg class="check" viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="39"/><path d="M22 40l11 11 23-24"/></svg>
      <h2>${left === 0 ? "Раздел пройден целиком!" : "Урок пройден!"}</h2>
      <p class="say">${PRAISE[(Math.random() * PRAISE.length) | 0]}</p>
      <div class="gain" id="gain">+0 XP</div>
      ${res.levelUp ? `<div class="lvup">Новый уровень ${lv.n}<b>${esc(lv.name)}</b></div>` : ""}
      <div class="lvline"><div><span>Ур. ${lv.n} · ${esc(lv.name)}</span><span>${res.xp1}${lv.next ? " / " + lv.hi : ""} XP</span></div><div class="xpbar"><i id="sheetbar" style="width:${res.levelUp ? 0 : Math.round(levelOf(res.xp0).frac * 100)}%"></i></div></div>
      <div class="secp"><b>${esc(s.title)}</b>: ${sd} из ${s.lessons.length}${left ? ` — осталось ${plural(left, "урок", "урока", "уроков")}` : " — все уроки!"}<div class="mini">${s.lessons.map(l => `<i class="${isDone(l.id) ? "on" : ""}"></i>`).join("")}</div></div>
      ${st.n ? `<div class="streakline">${plural(st.n, "день", "дня", "дней")} подряд · сегодня ${Math.min(todayLessons(), DAILY_GOAL)}/${DAILY_GOAL}${todayLessons() === DAILY_GOAL ? " — цель дня выполнена!" : ""}</div>` : ""}
      <div class="btns"><a href="#home" id="sh-map">К карте</a>${nextL ? `<a class="primary" href="#l${nextL.id}" id="sh-next">Дальше: ${esc(nextL.title.length > 22 ? nextL.title.slice(0, 21) + "…" : nextL.title)} →</a>` : `<a class="primary" href="#home">Готово</a>`}</div>
    </div>`;
    document.body.appendChild(v);
    const close = () => v.remove();
    v.addEventListener("click", e => { if (e.target === v || e.target.closest("a")) close(); });
    window.addEventListener("hashchange", close, { once: true });
    confetti(left === 0 || res.levelUp ? 1.6 : 1);
    // count-up XP and fill bar
    const g = v.querySelector("#gain"), t0 = performance.now(), dur = reduceMotion ? 0 : 700;
    (function tick(t) { const k = dur ? Math.min(1, (t - t0) / dur) : 1; g.textContent = `+${Math.round(res.gained * k)} XP`; if (k < 1) requestAnimationFrame(tick); })(t0);
    setTimeout(() => { const b = v.querySelector("#sheetbar"); if (b) b.style.width = Math.round(lv.frac * 100) + "%"; }, 120);
    announce(res);
  }

  function quizHTML(L) {
    const q = L.quiz, gotIt = S.aw["q:" + L.id];
    return `<div class="quiz"><h3>Проверь себя <span>${gotIt ? "✓ +" + XP.q + " XP получено" : "+" + XP.q + " XP с первой попытки"}</span></h3><p class="q">${md(q.q)}</p><div class="opts">${q.options.map((o, i) => `<button data-i="${i}">${md(o)}</button>`).join("")}</div><div class="why" id="why" hidden></div></div>`;
  }
  function wireQuiz(L) {
    const q = L.quiz;
    let first = !S.tried[L.id];
    app.querySelectorAll(".quiz .opts button").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i, right = i === q.answer;
      app.querySelectorAll(".quiz .opts button").forEach(x => x.classList.remove("right", "wrong"));
      b.classList.add(right ? "right" : "wrong");
      if (right) b.classList.add("right"); else setTimeout(() => app.querySelector(`.quiz .opts button[data-i="${q.answer}"]`)?.classList.add("right"), 450);
      const why = document.getElementById("why");
      why.hidden = false;
      why.innerHTML = (right ? "<b>Верно!</b> " : "<b>Не совсем.</b> ") + md(q.why || "");
      if (first) {
        first = false; S.tried[L.id] = 1; save();
        if (right) {
          const res = withRewards(() => award("q:" + L.id));
          if (res.gained) { toast(`<b>+${res.gained} XP</b><small>верно с первой попытки</small>`, `<span class="pill xp">${ICON.bolt}</span>`); confetti(.4); announce(res); }
        }
      }
    }));
  }

  function vizShell(L) {
    return `<section class="viz" aria-label="Пошаговое выполнение">
      <div class="viz-top"><span class="eyebrow">Выполнение по шагам</span><span class="vt-r"><span id="solved">${S.aw["v:" + L.id] ? `<span class="solved">✓ разобран</span>` : `<span class="solved todo">+${XP.v} XP</span>`}</span><span class="stepno" id="stepno"></span></span></div>
      <div class="stepbar"><i id="stepbar"></i></div>
      <div class="codebox" id="codebox"><div class="code" id="code"></div></div>
      <div class="narr" id="narr" aria-live="polite"></div>
      <div class="ctrl">
        <button id="b-first" aria-label="В начало">⏮</button>
        <button id="b-prev" aria-label="Шаг назад">◀</button>
        <button id="b-next" class="main hint" aria-label="Шаг вперёд">▶</button>
        <button id="b-play" aria-label="Автопроигрывание">⏵⏵</button>
        <button id="b-last" aria-label="В конец">⏭</button>
      </div>
      <div class="scrub"><input type="range" id="scrub" min="0" value="0" aria-label="Шаг"></div>
      <div class="mem" id="mem">
        <svg class="arrows" id="arrows" aria-hidden="true"></svg>
        <div><h3>Имена</h3><div class="frames" id="frames"></div></div>
        <div><h3>Объекты в памяти</h3><div class="heap" id="heap"></div></div>
      </div>
      <div class="outwrap"><h3>Вывод программы</h3><div class="out" id="out"></div><div id="errbox"></div></div>
    </section>`;
  }

  // ---------- arrows from names to objects ----------
  function drawArrows(fresh) {
    const mem = document.getElementById("mem"), svg = document.getElementById("arrows");
    if (!mem || !svg) return;
    const mr = mem.getBoundingClientRect();
    svg.setAttribute("width", mr.width); svg.setAttribute("height", mr.height);
    svg.setAttribute("viewBox", `0 0 ${mr.width} ${mr.height}`);
    const single = mem.classList.contains("single");
    let out = "";
    mem.querySelectorAll(".ref").forEach(chip => {
      const n = chip.dataset.ref, t = document.getElementById("obj-" + n);
      if (!t) return;
      const a = chip.getBoundingClientRect(), b = t.getBoundingClientRect();
      const sx = a.right - mr.left - 2, sy = a.top + a.height / 2 - mr.top;
      const ey = b.top - mr.top + 13;
      const col = `hsl(${h(+n)} var(--chip-s) var(--chip-l))`;
      let d, head;
      if (!single && !chip.closest(".heap") && b.left >= a.right) {
        const ex = b.left - mr.left - 1, dx = Math.max(18, (ex - sx) * .5);
        d = `M${sx},${sy} C${sx + dx},${sy} ${ex - dx},${ey} ${ex},${ey}`;
        head = `M${ex},${ey} l-7,-4 l0,8 z`;
      } else {
        const ex = b.right - mr.left + 1, gx = Math.min(mr.width - 4, Math.max(sx, ex) + 16);
        d = `M${sx},${sy} C${gx},${sy} ${gx},${ey} ${ex},${ey}`;
        head = `M${ex},${ey} l7,-4 l0,8 z`;
      }
      const isNew = fresh && fresh.has(n);
      out += `<path class="ln-a${isNew ? " draw" : ""}" d="${d}" stroke="${col}"/><path d="${head}" fill="${col}" opacity=".9"/>`;
    });
    svg.innerHTML = out;
    if (!reduceMotion) svg.querySelectorAll("path.draw").forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  }

  function startPlayer(L) {
    if (player && player.timer) clearInterval(player.timer);
    const tr = L.trace, steps = tr.steps, lines = L.code.split("\n");
    const st = { i: 0, timer: null };
    player = st;
    const $ = id => document.getElementById(id);
    const codeEl = $("code");
    codeEl.innerHTML = lines.map((ln, i) => `<div class="ln" data-l="${i + 1}"><span class="ar"></span><span class="no">${i + 1}</span><span>${hl(ln) || " "}</span></div>`).join("");
    const scrub = $("scrub");
    scrub.max = steps.length - 1;
    const hasHeap = steps.some(s => s.h.length);
    if (!hasHeap) $("mem").classList.add("single");
    if (!hasHeap) $("heap").parentElement.hidden = true;

    function show(i, user) {
      st.i = Math.max(0, Math.min(steps.length - 1, i));
      const cur = steps[st.i], prev = st.i > 0 ? steps[st.i - 1] : null;
      scrub.value = st.i;
      $("stepno").textContent = `${st.i + 1} / ${steps.length}`;
      $("stepbar").style.width = (100 * st.i / Math.max(1, steps.length - 1)) + "%";
      if (st.i > 0) $("b-next").classList.remove("hint");
      codeEl.querySelectorAll(".ln").forEach(el => el.classList.remove("cur", "prev"));
      if (prev && prev.l && prev.e !== "d") codeEl.querySelector(`.ln[data-l="${prev.l}"]`)?.classList.add("prev");
      if (cur.e !== "d") {
        const el = codeEl.querySelector(`.ln[data-l="${cur.l}"]`);
        if (el) {
          el.classList.add("cur");
          const box = $("codebox");
          box.scrollTo({ top: Math.max(0, el.offsetTop - box.clientHeight / 2 + el.clientHeight), behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
      let narr = "";
      if (cur.e === "d") narr += `<div class="nx done"><i>✓</i><span><b>Программа завершилась.</b> Ниже итоговое состояние памяти.</span></div>`;
      else if (cur.e === "r") narr += `<div class="nx done"><i>↩</i><span><b>${esc(cur.fn)}()</b> завершается и возвращает <b>${esc(cellText(cur.rv))}</b>.</span></div>`;
      else if (cur.e === "x") narr += `<div class="nx bad"><i>!</i><span>Исключение <code>${esc(cur.ex)}</code> в строке ${cur.l}. Python ищет подходящий <code>except</code>.</span></div>`;
      else {
        const n = (L.narr || {})[cur.l];
        narr += `<div class="nx next"><i>${cur.l}</i><span>${n ? md(n) : `Python готовится выполнить строку ${cur.l}.`}</span></div>`;
      }
      if (st.i === 0) narr += `<div class="hint">Нажимай ▶ и следи, как меняются имена, стрелки и объекты.</div>`;
      const ch = describeChange(L, prev, cur);
      if (ch.length) narr += `<div class="chg">${ch.map(c => `<div>${c}</div>`).join("")}</div>`;
      $("narr").innerHTML = narr;

      const pfr = prev ? prev.f.map(k => tr.frames[k]) : [];
      const frs = cur.f.map(k => tr.frames[k]);
      const fresh = new Set();
      $("frames").innerHTML = frs.map((f, fi) => {
        const same = pfr[fi] && pfr[fi].name === f.name;
        const pm = same ? Object.fromEntries(pfr[fi].vars) : {};
        const rows = f.vars.length ? f.vars.map(([k, v]) => {
          const changed = prev && JSON.stringify(pm[k]) !== JSON.stringify(v);
          if (changed && v[0] === "r") fresh.add(String(v[1]));
          return `<div class="row${changed ? " flash" : ""}"><span class="k">${esc(k)}</span><span class="v">${val(v)}</span></div>`;
        }).join("") : `<div class="empty">пока нет имён</div>`;
        const isTop = fi === frs.length - 1;
        const ret = isTop && cur.e === "r" ? `<div class="ret">↩ return ${val(cur.rv)}</div>` : "";
        return `<div class="frame${isTop ? " top" : ""}${prev && !same ? " enter" : ""}"><div class="fh"><span>${esc(f.name)}</span>${isTop && frs.length > 1 ? "<span>●</span>" : ""}</div>${rows}${ret}</div>`;
      }).join("") || `<div class="frame"><div class="empty">пусто</div></div>`;

      const ph = new Map(prev ? prev.h.map(k => [tr.objs[k].n, k]) : []);
      $("heap").innerHTML = cur.h.length ? cur.h.map(k => {
        const o = tr.objs[k];
        const state = !prev ? "" : !ph.has(o.n) ? "enter" : ph.get(o.n) !== k ? "flash" : "";
        if (state === "enter") fresh.add(String(o.n));
        return objHTML(o, state);
      }).join("") : `<div class="frame"><div class="empty">Пока пусто. Здесь появятся списки, словари, функции, классы и объекты.</div></div>`;

      const o = tr.out.slice(0, cur.o), po = prev ? Math.min(prev.o, cur.o) : cur.o;
      $("out").innerHTML = (o ? esc(o.slice(0, po)) + `<span class="new">${esc(o.slice(po))}</span>` : "") + `<span class="cursor"></span>`;
      $("errbox").innerHTML = cur.e === "d" && tr.error ? `<div class="err">Программа упала: ${esc(tr.error)}</div>` : "";

      $("b-first").disabled = $("b-prev").disabled = st.i === 0;
      $("b-next").disabled = $("b-last").disabled = st.i === steps.length - 1;
      requestAnimationFrame(() => drawArrows(prev ? fresh : null));
      if (st.i === steps.length - 1) {
        stop();
        if (user && !S.aw["v:" + L.id]) {
          const res = withRewards(() => award("v:" + L.id));
          $("solved").innerHTML = `<span class="solved">✓ разобран</span>`;
          toast(`<b>+${res.gained} XP</b><small>пример разобран до конца</small>`, `<span class="pill xp">${ICON.bolt}</span>`);
          announce(res);
        }
      }
    }
    function stop() { if (st.timer) { clearInterval(st.timer); st.timer = null; } $("b-play").textContent = "⏵⏵"; }
    $("b-first").onclick = () => { stop(); show(0, true); };
    $("b-prev").onclick = () => { stop(); show(st.i - 1, true); };
    $("b-next").onclick = () => { stop(); show(st.i + 1, true); };
    $("b-last").onclick = () => { stop(); show(steps.length - 1, false); };
    $("b-play").onclick = () => {
      if (st.timer) return stop();
      if (st.i === steps.length - 1) show(0, true);
      $("b-play").textContent = "⏸";
      st.timer = setInterval(() => { if (player !== st || !document.body.contains(scrub)) return clearInterval(st.timer); show(st.i + 1, true); }, 1100);
    };
    scrub.oninput = () => { stop(); show(+scrub.value, false); };
    $("mem").addEventListener("click", onRef);
    $("narr").addEventListener("click", onRef);
    st.redraw = () => drawArrows(null);
    show(0, false);
  }
  function onRef(e) {
    const b = e.target.closest(".ref");
    if (!b) return;
    const o = document.getElementById("obj-" + b.dataset.ref);
    if (!o) return;
    o.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
    o.classList.remove("pulse"); void o.offsetWidth; o.classList.add("pulse");
    setTimeout(() => o.classList.remove("pulse"), 1400);
  }
  let rz;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => player && player.redraw && player.redraw(), 80); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => player && player.redraw && player.redraw());
  document.addEventListener("keydown", e => {
    if (!player || e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") document.getElementById("b-next")?.click();
    if (e.key === "ArrowLeft") document.getElementById("b-prev")?.click();
  });

  function render() {
    if (player && player.timer) { clearInterval(player.timer); player.timer = null; }
    player = null;
    const r = route();
    if (r.type === "lesson") renderLesson(r.id);
    else if (r.type === "sec") { renderSection(r.i); window.scrollTo(0, 0); }
    else renderHome();
  }
  render();
})();
</script>

</body>
</html>
