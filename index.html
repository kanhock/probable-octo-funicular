vars":[]},{"name":"тело класса Car","vars":[]},{"name":"тело класса Car","vars":[["__init__",["r",4]]]},{"name":"тело класса Car","vars":[["__init__",["r",4]],["drive",["r",5]]]},{"name":"глобальная область","vars":[["Engine",["r",3]],["Car",["r",6]]]},{"name":"__init__()","vars":[["self",["r",7]]]},{"name":"__init__()","vars":[["self",["r",8]],["hp",["p","150"]]]},{"name":"глобальная область","vars":[["Engine",["r",3]],["Car",["r",6]],["car",["r",7]]]},{"name":"drive()","vars":[["self",["r",7]]]},{"name":"start()","vars":[["self",["r",8]]]}],"out":"Двигатель 150 л.с. запущен, едем\n","error":null,"truncated":false},"deep":"Композиция — отношение **«имеет»** (has-a). Объект собирается из частей и делегирует им работу. Части можно заменять и тестировать отдельно, а связи между ними явные.\n\nПочему «предпочитай композицию наследованию»: наследование жёстко связывает потомка со всеми деталями родителя (хрупкий базовый класс), а композиция связывает только через интерфейс части.\n\n```\nclass Car:\n    def __init__(self, engine):   # часть можно подставить снаружи\n        self.engine = engine\n```","pitfalls":["Наследовать `Car(Engine)` — машина не является двигателем.","Делать объект-«бог», который сам делает всё, вместо сборки из частей."],"links":["7-5","24-3","7-6"],"checks":[{"q":"Какое отношение выражает композиция?","options":["является (is-a)","имеет (has-a)","использует на время","наследует"],"answer":1,"why":"Композиция — целое состоит из частей."},{"q":"Что напечатает код?","options":["V8","electric","Ошибка","None"],"answer":1,"why":"Машина делегирует работу своей части, а часть можно заменить.","code":"class Engine:\n    def kind(self):\n        return 'V8'\nclass Electric:\n    def kind(self):\n        return 'electric'\nclass Car:\n    def __init__(self, engine):\n        self.engine = engine\nprint(Car(Electric()).engine.kind())"}]},{"title":"Агрегация и ассоциация","covers":["Агрегация","Ассоциация"],"text":"**Агрегация** — объект содержит другие, но **не владеет** ими: их создали снаружи и передали. Команда содержит игроков, но игроки существуют и без команды.\n\n**Ассоциация** — самая слабая связь: объекты просто «знают» друг о друге или используют друг друга на время. Учитель проверяет работу ученика, но не хранит его в себе навсегда.","code":"class Player:\n    def __init__(self, name):\n        self.name = name\n\nclass Team:\n    def __init__(self, players):\n        self.players = players\n\nclass Coach:\n    def praise(self, player):\n        return \"Молодец, \" + player.name\n\nann = Player(\"Аня\")\nbob = Player(\"Боря\")\nteam = Team([ann, bob])\nprint(Coach().praise(ann))\ndel team\nprint(ann.name, bob.name)","key":["Композиция: создаю и владею.","Агрегация: держу, но не владею.","Ассоциация: просто использую."],"id":"7-5","narr":{"7":"Агрегация: игроков создали СНАРУЖИ и передали","10":"Ассоциация: тренер просто использует игрока","17":"Команды нет, а игроки живут дальше"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Player"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":6,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Team"},{"l":9,"e":"l","f":[8],"h":[1,3],"o":0},{"l":9,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":10,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":10,"e":"r","f":[8,11],"h":[1,3,4],"o":0,"rv":["p","None"],"fn":"Coach"},{"l":13,"e":"l","f":[12],"h":[1,3,5],"o":0},{"l":3,"e":"l","f":[12,13],"h":[1,3,5,6],"o":0},{"l":3,"e":"r","f":[12,13],"h":[1,3,5,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":14,"e":"l","f":[14],"h":[1,3,5,7],"o":0},{"l":3,"e":"l","f":[14,15],"h":[1,3,5,7,8],"o":0},{"l":3,"e":"r","f":[14,15],"h":[1,3,5,7,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":15,"e":"l","f":[16],"h":[1,3,5,7,9],"o":0},{"l":7,"e":"l","f":[16,17],"h":[1,3,5,7,9,10,11],"o":0},{"l":7,"e":"r","f":[16,17],"h":[1,3,5,7,9,12,11],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":16,"e":"l","f":[18],"h":[1,3,5,7,9,12,11],"o":0},{"l":11,"e":"l","f":[18,19],"h":[1,3,5,7,9,12,11,13],"o":0},{"l":11,"e":"r","f":[18,19],"h":[1,3,5,7,9,12,11,13],"o":0,"rv":["p","'Молодец, Аня'"],"fn":"praise"},{"l":17,"e":"l","f":[18],"h":[1,3,5,7,9,12,11],"o":13},{"l":18,"e":"l","f":[16],"h":[1,3,5,7,9],"o":13},{"l":0,"e":"d","f":[16],"h":[1,3,5,7,9],"o":22}],"objs":[{"n":1,"k":"func","t":"function","name":"Player.__init__","sig":"(self, name)"},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":3,"k":"func","t":"function","name":"Team.__init__","sig":"(self, players)"},{"n":4,"k":"class","t":"class","name":"Team","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":5,"k":"func","t":"function","name":"Coach.praise","sig":"(self, player)"},{"n":6,"k":"class","t":"class","name":"Coach","bases":[],"attrs":{"praise":["p","метод"]}},{"n":7,"k":"obj","t":"Player","attrs":{}},{"n":7,"k":"obj","t":"Player","attrs":{"name":["p","'Аня'"]}},{"n":8,"k":"obj","t":"Player","attrs":{}},{"n":8,"k":"obj","t":"Player","attrs":{"name":["p","'Боря'"]}},{"n":9,"k":"obj","t":"Team","attrs":{}},{"n":10,"k":"list","t":"list","items":[["r",7],["r",8]],"more":0},{"n":9,"k":"obj","t":"Team","attrs":{"players":["r",10]}},{"n":11,"k":"obj","t":"Coach","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Player()","vars":[]},{"name":"тело класса Player","vars":[]},{"name":"тело класса Player","vars":[["__init__",["r",1]]]},{"name":"глобальная область","vars":[["Player",["r",2]]]},{"name":"Team()","vars":[]},{"name":"тело класса Team","vars":[]},{"name":"тело класса Team","vars":[["__init__",["r",3]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["Team",["r",4]]]},{"name":"Coach()","vars":[]},{"name":"тело класса Coach","vars":[]},{"name":"тело класса Coach","vars":[["praise",["r",5]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["Team",["r",4]],["Coach",["r",6]]]},{"name":"__init__()","vars":[["self",["r",7]],["name",["p","'Аня'"]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["Team",["r",4]],["Coach",["r",6]],["ann",["r",7]]]},{"name":"__init__()","vars":[["self",["r",8]],["name",["p","'Боря'"]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["Team",["r",4]],["Coach",["r",6]],["ann",["r",7]],["bob",["r",8]]]},{"name":"__init__()","vars":[["self",["r",9]],["players",["r",10]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["Team",["r",4]],["Coach",["r",6]],["ann",["r",7]],["bob",["r",8]],["team",["r",9]]]},{"name":"praise()","vars":[["self",["r",11]],["player",["r",7]]]}],"out":"Молодец, Аня\nАня Боря\n","error":null,"truncated":false},"deep":"Три вида связи различаются **временем жизни и владением**:\n- **композиция** — часть создаётся и умирает вместе с целым;\n- **агрегация** — целое держит ссылки на части, созданные снаружи; части переживают целое;\n- **ассоциация** — объект лишь пользуется другим (получил параметром), не храня его.\n\nВ Python всё это просто ссылки, поэтому различие — в **дизайне**: кто создаёт объект и кто отвечает за его жизнь. Это важно, например, при закрытии ресурсов: владелец должен их закрыть.","pitfalls":["Закрывать или изменять объект, которым ты не владеешь (агрегированный).","Хранить ссылку там, где хватило бы параметра метода (лишняя связанность)."],"links":["7-4","24-2"],"checks":[{"q":"Команда хранит игроков, созданных снаружи. Это…","options":["композиция","агрегация","наследование","ассоциация"],"answer":1,"why":"Агрегация: целое держит части, но не создаёт и не владеет ими."},{"q":"Что напечатает код?","options":["Аня","Ошибка NameError","None","[]"],"answer":0,"why":"Удалили команду, но игрок жил отдельно: на него есть ссылка `ann`.","code":"class Player:\n    def __init__(self, name):\n        self.name = name\nclass Team:\n    def __init__(self, players):\n        self.players = players\nann = Player('Аня')\nteam = Team([ann])\ndel team\nprint(ann.name)"}]},{"title":"Делегирование","covers":["Делегирование"],"text":"**Делегирование** — объект передаёт работу другому объекту вместо того, чтобы делать её сам. В Python для этого есть удобный приём: метод `__getattr__` вызывается, когда атрибут не найден, и может перенаправить запрос внутреннему объекту.","code":"class Logger:\n    def __init__(self, target):\n        self.target = target\n        self.log = []\n\n    def __getattr__(self, name):\n        self.log.append(name)\n        return getattr(self.target, name)\n\nitems = Logger([3, 1, 2])\nitems.append(0)\nitems.sort()\nprint(items.target, items.log)","key":["Делегирование: «пусть это сделает мой помощник».","`__getattr__` — точка перенаправления."],"id":"7-6","narr":{"3":"Объект, которому делегируем работу","6":"Вызывается, если атрибута нет у Logger","8":"Передаём запрос внутреннему объекту","11":"append ищется в Logger, не находится — делегируется списку"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Logger"},{"l":10,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3,4],"o":0},{"l":4,"e":"l","f":[5,6],"h":[2,5,4],"o":0},{"l":4,"e":"r","f":[5,6],"h":[2,6,4,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":11,"e":"l","f":[7],"h":[2,6,4,7],"o":0},{"l":7,"e":"l","f":[7,8],"h":[2,6,4,7],"o":0},{"l":8,"e":"l","f":[7,8],"h":[2,6,4,8],"o":0},{"l":8,"e":"r","f":[7,8],"h":[2,6,4,8],"o":0,"rv":["p","<встроенная append>"],"fn":"__getattr__"},{"l":12,"e":"l","f":[7],"h":[2,6,9,8],"o":0},{"l":7,"e":"l","f":[7,9],"h":[2,6,9,8],"o":0},{"l":8,"e":"l","f":[7,9],"h":[2,6,9,10],"o":0},{"l":8,"e":"r","f":[7,9],"h":[2,6,9,10],"o":0,"rv":["p","<встроенная sort>"],"fn":"__getattr__"},{"l":13,"e":"l","f":[7],"h":[2,6,11,10],"o":0},{"l":0,"e":"d","f":[7],"h":[2,6,11,10],"o":32}],"objs":[{"n":1,"k":"func","t":"function","name":"Logger.__init__","sig":"(self, target)"},{"n":2,"k":"func","t":"function","name":"Logger.__getattr__","sig":"(self, name)"},{"n":3,"k":"class","t":"class","name":"Logger","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":4,"k":"obj","t":"Logger","attrs":{}},{"n":5,"k":"list","t":"list","items":[["p","3"],["p","1"],["p","2"]],"more":0},{"n":4,"k":"obj","t":"Logger","attrs":{"target":["r",5]}},{"n":4,"k":"obj","t":"Logger","attrs":{"target":["r",5],"log":["r",6]}},{"n":6,"k":"list","t":"list","items":[],"more":0},{"n":6,"k":"list","t":"list","items":[["p","'append'"]],"more":0},{"n":5,"k":"list","t":"list","items":[["p","3"],["p","1"],["p","2"],["p","0"]],"more":0},{"n":6,"k":"list","t":"list","items":[["p","'append'"],["p","'sort'"]],"more":0},{"n":5,"k":"list","t":"list","items":[["p","0"],["p","1"],["p","2"],["p","3"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Logger()","vars":[]},{"name":"тело класса Logger","vars":[]},{"name":"тело класса Logger","vars":[["__init__",["r",1]]]},{"name":"тело класса Logger","vars":[["__init__",["r",1]],["__getattr__",["r",2]]]},{"name":"глобальная область","vars":[["Logger",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]],["target",["r",5]]]},{"name":"глобальная область","vars":[["Logger",["r",3]],["items",["r",4]]]},{"name":"__getattr__()","vars":[["self",["r",4]],["name",["p","'append'"]]]},{"name":"__getattr__()","vars":[["self",["r",4]],["name",["p","'sort'"]]]}],"out":"[0, 1, 2, 3] ['append', 'sort']\n","error":null,"truncated":false},"deep":"`__getattr__` вызывается **только когда обычный поиск атрибута не нашёл** имя — поэтому собственные атрибуты обёртки работают как обычно, а неизвестные уходят во внутренний объект. (Не путай с `__getattribute__`, который вызывается всегда.)\n\nДелегирование — основа паттернов Proxy, Adapter, Decorator (как паттерна). Явное делегирование (написать метод, который вызывает метод части) проще читать; автоматическое через `__getattr__` удобно, но прячет интерфейс от редактора и `dir()`.","pitfalls":["Использовать `__getattribute__` вместо `__getattr__` и получить бесконечную рекурсию.","Обращаться в `__getattr__` к атрибуту, который ещё не создан (`self.target` до `__init__`), — рекурсия."],"links":["25-6","25-4","7-4"],"checks":[{"q":"Когда вызывается `__getattr__`?","options":["При каждом обращении к атрибуту","Только если атрибут не найден обычным способом","Только при присваивании","При создании объекта"],"answer":1,"why":"Это «последний шанс»: обычный поиск не сработал."},{"q":"Что напечатает код?","options":["3","Ошибка","None","[1, 2, 3]"],"answer":0,"why":"У обёртки нет метода `count`, поэтому срабатывает `__getattr__` и отдаёт метод внутреннего списка. В [1, 1, 1] три единицы.","code":"class Wrap:\n    def __init__(self, t):\n        self.t = t\n    def __getattr__(self, name):\n        return getattr(self.t, name)\nw = Wrap([1, 1, 1])\nprint(w.count(1))"}]}],"zone":6,"world":{"name":"Город ООП","hue":230,"kind":"city","intro":"Четыре столпа и связи между объектами: приборная панель, сейф, родословная, хор и машина из деталей.","why":"Эти принципы помогают строить код, который легко понимать, расширять и менять частями.","spots":{"Абстракция":[null,"Руль и педали: ты управляешь машиной, не зная устройства двигателя."],"Инкапсуляция":[null,"Сейф с кнопками: данные внутри, менять их можно только через разрешённые кнопки."],"Наследование":[null,"Родословная: спорткар получил всё от обычной машины и добавил своё."],"Полиморфизм":[null,"Одна кнопка «голос» — и собака лает, а кошка мяукает. Один вызов, разное поведение."],"Композиция":[null,"Двигатель внутри машины: часть создаётся вместе с целым и живёт внутри него."],"Агрегация":[null,"Автобус с игроками: игроки сели в него, но существуют и без автобуса."],"Ассоциация":[null,"Тренер свистит игроку: связь на время действия, без хранения."],"Делегирование":[null,"Менеджер передаёт задачу помощнику: «сделай это за меня»."]}}},{"title":"Наследование","items":["базовый класс","дочерний класс","переопределение","super()","множественное наследование","MRO","mixins"],"intro":"Как классы получают поведение от родителей, как его менять и в каком порядке Python ищет методы.","lessons":[{"title":"Базовый и дочерний класс","covers":["базовый класс","дочерний класс"],"text":"**Базовый** (родительский) класс содержит общее поведение. **Дочерний** класс указывает родителя в скобках и автоматически получает все его атрибуты и методы.\n\nКогда ты вызываешь метод у объекта, Python ищет его сначала в классе объекта, потом в родителе, потом в родителе родителя.","code":"class Vehicle:\n    wheels = 4\n    def describe(self):\n        return f\"{type(self).__name__}: колёс {self.wheels}\"\n\nclass Bike(Vehicle):\n    wheels = 2\n\nclass Truck(Vehicle):\n    pass\n\nprint(Bike().describe())\nprint(Truck().describe())\nprint(issubclass(Bike, Vehicle), isinstance(Bike(), Vehicle))","key":["`class Child(Parent)` наследует всё от Parent.","Поиск атрибута идёт от потомка к предкам.","Экземпляр потомка — тоже экземпляр предка."],"id":"8-1","narr":{"1":"Базовый класс","6":"Дочерний класс","7":"Своё значение заслоняет родительское","10":"Ничего своего — всё от родителя","12":"describe найден в Vehicle"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":3,"e":"l","f":[0,3],"h":[],"o":0},{"l":3,"e":"r","f":[0,4],"h":[0],"o":0,"rv":["p","None"],"fn":"Vehicle"},{"l":6,"e":"l","f":[5],"h":[1],"o":0},{"l":6,"e":"l","f":[5,6],"h":[1],"o":0},{"l":7,"e":"l","f":[5,7],"h":[1],"o":0},{"l":7,"e":"r","f":[5,8],"h":[1],"o":0,"rv":["p","None"],"fn":"Bike"},{"l":9,"e":"l","f":[9],"h":[1,2],"o":0},{"l":9,"e":"l","f":[9,10],"h":[1,2],"o":0},{"l":10,"e":"l","f":[9,11],"h":[1,2],"o":0},{"l":10,"e":"r","f":[9,11],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Truck"},{"l":12,"e":"l","f":[12],"h":[1,2,3],"o":0},{"l":4,"e":"l","f":[12,13],"h":[1,2,3,4],"o":0},{"l":4,"e":"r","f":[12,13],"h":[1,2,3,4],"o":0,"rv":["p","'Bike: колёс 2'"],"fn":"describe"},{"l":13,"e":"l","f":[12],"h":[1,2,3],"o":14},{"l":4,"e":"l","f":[12,14],"h":[1,2,3,5],"o":14},{"l":4,"e":"r","f":[12,14],"h":[1,2,3,5],"o":14,"rv":["p","'Truck: колёс 4'"],"fn":"describe"},{"l":14,"e":"l","f":[12],"h":[1,2,3],"o":29},{"l":0,"e":"d","f":[12],"h":[1,2,3],"o":39}],"objs":[{"n":1,"k":"func","t":"function","name":"Vehicle.describe","sig":"(self)"},{"n":2,"k":"class","t":"class","name":"Vehicle","bases":[],"attrs":{"wheels":["p","4"],"describe":["p","метод"]}},{"n":3,"k":"class","t":"class","name":"Bike","bases":["Vehicle"],"attrs":{"wheels":["p","2"]}},{"n":4,"k":"class","t":"class","name":"Truck","bases":["Vehicle"],"attrs":{}},{"n":5,"k":"obj","t":"Bike","attrs":{}},{"n":6,"k":"obj","t":"Truck","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Vehicle()","vars":[]},{"name":"тело класса Vehicle","vars":[]},{"name":"тело класса Vehicle","vars":[["wheels",["p","4"]]]},{"name":"тело класса Vehicle","vars":[["wheels",["p","4"]],["describe",["r",1]]]},{"name":"глобальная область","vars":[["Vehicle",["r",2]]]},{"name":"Bike()","vars":[]},{"name":"тело класса Bike","vars":[]},{"name":"тело класса Bike","vars":[["wheels",["p","2"]]]},{"name":"глобальная область","vars":[["Vehicle",["r",2]],["Bike",["r",3]]]},{"name":"Truck()","vars":[]},{"name":"тело класса Truck","vars":[]},{"name":"глобальная область","vars":[["Vehicle",["r",2]],["Bike",["r",3]],["Truck",["r",4]]]},{"name":"describe()","vars":[["self",["r",5]]]},{"name":"describe()","vars":[["self",["r",6]]]}],"out":"Bike: колёс 2\nTruck: колёс 4\nTrue True\n","error":null,"truncated":false},"deep":"Каждый класс хранит кортеж родителей в `__bases__` и полный порядок поиска в `__mro__`. Все классы в итоге наследуют от `object` — поэтому у любого объекта есть `__repr__`, `__eq__`, `__hash__` по умолчанию.\n\n```\nclass Vehicle: pass\nclass Bike(Vehicle): pass\nprint(Bike.__bases__, Bike.__mro__)\n```\n\n`isinstance(obj, Base)` проверяет весь MRO; `issubclass(Bike, Vehicle)` — то же для классов. Проверки типов в коде лучше заменять полиморфизмом: вместо `if isinstance(x, Bike)` вызвать метод, который каждый класс реализует по-своему.","pitfalls":["Глубокие иерархии (5+ уровней): трудно понять, откуда берётся метод.","Цепочки `if isinstance(...)` вместо полиморфных методов."],"links":["8-3","7-3","9-2"],"checks":[{"q":"Что напечатает код?","options":["True True","True False","False True","False False"],"answer":0,"why":"Экземпляр потомка — также экземпляр родителя, и любой класс — подкласс `object`.","code":"class V: pass\nclass B(V): pass\nprint(isinstance(B(), V), issubclass(B, object))"},{"q":"От какого класса неявно наследуют все классы Python?","options":["type","object","Base","ABC"],"answer":1,"why":"`object` — корень иерархии всех классов."}]},{"title":"Переопределение и super()","covers":["переопределение","super()"],"text":"**Переопределение** — потомок объявляет метод с тем же именем и заменяет поведение родителя. `super()` позволяет **вызвать версию родителя** изнутри потомка — чтобы дополнить, а не переписать полностью.\n\nЧаще всего `super()` используют в `__init__`: родитель настраивает общие поля, потомок — свои. Смотри, как в стеке кадров появляются оба `__init__`.","code":"class Employee:\n    def __init__(self, name):\n        self.name = name\n\n    def info(self):\n        return f\"Сотрудник {self.name}\"\n\nclass Manager(Employee):\n    def __init__(self, name, team):\n        super().__init__(name)\n        self.team = team\n\n    def info(self):\n        return super().info() + f\", команда: {self.team}\"\n\nm = Manager(\"Ольга\", 5)\nprint(m.info())","key":["Переопределение — тот же метод в потомке.","`super().метод()` — вызвать версию родителя.","В `__init__` потомка почти всегда нужен `super().__init__(...)`."],"id":"8-2","narr":{"10":"Пусть родитель настроит name","11":"А это — своё поле","13":"Переопределяем метод…","14":"…и дополняем версию родителя"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":5,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Employee"},{"l":8,"e":"l","f":[5],"h":[2],"o":0},{"l":8,"e":"l","f":[5,6],"h":[2],"o":0},{"l":9,"e":"l","f":[5,7],"h":[2],"o":0},{"l":13,"e":"l","f":[5,8],"h":[2,3],"o":0},{"l":13,"e":"r","f":[5,9],"h":[2,3,4,5],"o":0,"rv":["r",6],"fn":"Manager"},{"l":16,"e":"l","f":[10],"h":[2,6],"o":0},{"l":10,"e":"l","f":[10,11],"h":[2,6,7],"o":0},{"l":3,"e":"l","f":[10,11,12],"h":[2,6,7],"o":0},{"l":3,"e":"r","f":[10,11,12],"h":[2,6,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":11,"e":"l","f":[10,11],"h":[2,6,8],"o":0},{"l":11,"e":"r","f":[10,11],"h":[2,6,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":17,"e":"l","f":[13],"h":[2,6,9],"o":0},{"l":14,"e":"l","f":[13,14],"h":[2,6,9],"o":0},{"l":6,"e":"l","f":[13,14,14],"h":[2,6,9],"o":0},{"l":6,"e":"r","f":[13,14,14],"h":[2,6,9],"o":0,"rv":["p","'Сотрудник Ольга'"],"fn":"info"},{"l":14,"e":"r","f":[13,14],"h":[2,6,9],"o":0,"rv":["p","'Сотрудник Ольга, команда: 5'"],"fn":"info"},{"l":0,"e":"d","f":[13],"h":[2,6,9],"o":28}],"objs":[{"n":1,"k":"func","t":"function","name":"Employee.__init__","sig":"(self, name)"},{"n":2,"k":"func","t":"function","name":"Employee.info","sig":"(self)"},{"n":3,"k":"class","t":"class","name":"Employee","bases":[],"attrs":{"__init__":["p","метод"],"info":["p","метод"]}},{"n":4,"k":"func","t":"function","name":"Manager.__init__","sig":"(self, name, team)","cells":{"__class__":["p","<пусто>"]}},{"n":5,"k":"func","t":"function","name":"Manager.info","sig":"(self)","cells":{"__class__":["p","<пусто>"]}},{"n":6,"k":"other","t":"cell","r":"<cell: empty>"},{"n":7,"k":"class","t":"class","name":"Manager","bases":["Employee"],"attrs":{"__init__":["p","метод"],"info":["p","метод"]}},{"n":8,"k":"obj","t":"Manager","attrs":{}},{"n":8,"k":"obj","t":"Manager","attrs":{"name":["p","'Ольга'"]}},{"n":8,"k":"obj","t":"Manager","attrs":{"name":["p","'Ольга'"],"team":["p","5"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Employee()","vars":[]},{"name":"тело класса Employee","vars":[]},{"name":"тело класса Employee","vars":[["__init__",["r",1]]]},{"name":"тело класса Employee","vars":[["__init__",["r",1]],["info",["r",2]]]},{"name":"глобальная область","vars":[["Employee",["r",3]]]},{"name":"Manager()","vars":[]},{"name":"тело класса Manager","vars":[]},{"name":"тело класса Manager","vars":[["__init__",["r",4]]]},{"name":"тело класса Manager","vars":[["__init__",["r",4]],["info",["r",5]],["__classcell__",["r",6]]]},{"name":"глобальная область","vars":[["Employee",["r",3]],["Manager",["r",7]]]},{"name":"__init__()","vars":[["self",["r",8]],["name",["p","'Ольга'"]],["team",["p","5"]]]},{"name":"__init__()","vars":[["self",["r",8]],["name",["p","'Ольга'"]]]},{"name":"глобальная область","vars":[["Employee",["r",3]],["Manager",["r",7]],["m",["r",8]]]},{"name":"info()","vars":[["self",["r",8]]]}],"out":"Сотрудник Ольга, команда: 5\n","error":null,"truncated":false},"deep":"`super()` без аргументов — это `super(ТекущийКласс, self)`: прокси, который ищет метод **в следующем классе по MRO** объекта `self`, начиная после текущего. Компилятор неявно передаёт текущий класс через ячейку `__class__`.\n\nЕсли потомок переопределил `__init__` и не вызвал `super().__init__()`, инициализация родителя **не произойдёт**, и атрибутов родителя не будет.\n\n```\nclass A:\n    def __init__(self): self.a = 1\nclass B(A):\n    def __init__(self): self.b = 2     # забыли super()\nprint(hasattr(B(), \"a\"))   # False\n```","pitfalls":["Забыть `super().__init__(...)` в потомке.","Вызывать родителя явно `Parent.method(self)` при множественном наследовании — ломает кооперативную цепочку."],"links":["8-3","8-1"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","1"],"answer":1,"why":"`B.__init__` не вызвал `super().__init__()`, поэтому атрибут `a` не создан.","code":"class A:\n    def __init__(self):\n        self.a = 1\nclass B(A):\n    def __init__(self):\n        self.b = 2\nprint(hasattr(B(), 'a'))"},{"q":"Что напечатает код?","options":["A","B","BA","AB"],"answer":2,"why":"Метод потомка добавляет 'B' к результату версии родителя: 'B' + 'A'.","code":"class A:\n    def who(self):\n        return 'A'\nclass B(A):\n    def who(self):\n        return 'B' + super().who()\nprint(B().who())"}]},{"title":"Множественное наследование и MRO","covers":["множественное наследование","MRO"],"text":"Класс может наследовать от нескольких родителей: `class C(A, B)`. Тогда возникает вопрос: если метод есть и в A, и в B — какой взять? Ответ даёт **MRO** (Method Resolution Order) — линейный порядок поиска, который Python строит алгоритмом C3.\n\nПосмотреть его можно через `Класс.__mro__` или `Класс.mro()`. Важная деталь: `super()` идёт не просто «к родителю», а к **следующему классу в MRO**.","code":"class A:\n    def hello(self):\n        return \"A\"\n\nclass B(A):\n    def hello(self):\n        return \"B → \" + super().hello()\n\nclass C(A):\n    def hello(self):\n        return \"C → \" + super().hello()\n\nclass D(B, C):\n    pass\n\nprint([k.__name__ for k in D.__mro__])\nprint(D().hello())","key":["`class D(B, C)` — множественное наследование.","MRO — порядок поиска методов, смотри `D.__mro__`.","`super()` идёт к следующему классу в MRO."],"quiz":{"q":"Для `class D(B, C)` с общим предком A, где Python будет искать метод сразу после D?","options":["A","B","C","object"],"answer":1,"why":"MRO = D, B, C, A, object. Родители перечисляются слева направо."},"id":"8-3","narr":{"13":"Два родителя","16":"Порядок поиска: D, B, C, A, object","17":"super() в B ведёт к C, а не к A!"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn" ses":["A"],"attrs":{"hello":["p","метод"]}},{"n":9,"k":"class","t":"class","name":"D","bases":["B","C"],"attrs":{}},{"n":10,"k":"obj","t":"D","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"A()","vars":[]},{"name":"тело класса A","vars":[]},{"name":"тело класса A","vars":[["hello",["r",1]]]},{"name":"глобальная область","vars":[["A",["r",2]]]},{"name":"B()","vars":[]},{"name":"тело класса B","vars":[]},{"name":"тело класса B","vars":[["hello",["r",3]],["__classcell__",["r",4]]]},{"name":"глобальная область","vars":[["A",["r",2]],["B",["r",5]]]},{"name":"C()","vars":[]},{"name":"тело класса C","vars":[]},{"name":"тело класса C","vars":[["hello",["r",6]],["__classcell__",["r",7]]]},{"name":"глобальная область","vars":[["A",["r",2]],["B",["r",5]],["C",["r",8]]]},{"name":"D()","vars":[]},{"name":"тело класса D","vars":[]},{"name":"глобальная область","vars":[["A",["r",2]],["B",["r",5]],["C",["r",8]],["D",["r",9]]]},{"name":"hello()","vars":[["self",["r",10]]]}],"out":"['D', 'B', 'C', 'A', 'object']\nB → C → A\n","error":null,"truncated":false},"deep":"MRO строится алгоритмом **C3-линеаризации**: класс идёт раньше своих родителей, порядок родителей из определения сохраняется, и общий предок появляется после всех своих потомков. Если такой порядок невозможен, Python откажется создавать класс (`TypeError: Cannot create a consistent MRO`).\n\nБлагодаря C3 `super()` в «ромбе» вызывает каждый класс ровно один раз — это **кооперативное множественное наследование**. Чтобы оно работало, все классы в цепочке должны вызывать `super()` и принимать `**kwargs`.","pitfalls":["Противоречивый порядок родителей — `TypeError` при создании класса.","Классы в ромбе без `super()` — части цепочки не вызываются."],"links":["8-2","8-4"],"checks":[{"q":"Что напечатает код?","options":["D B A","D B C A","D C B A","D A"],"answer":1,"why":"C3-линеаризация для D(B, C), где B и C наследуют A: D, B, C, A (и object).","code":"class A: pass\nclass B(A): pass\nclass C(A): pass\nclass D(B, C): pass\nprint(*[k.__name__ for k in D.__mro__[:-1]])"},{"q":"Сколько раз вызовется `A.hello` в ромбе D(B, C), если все используют `super()`?","options":["0","1","2","3"],"answer":1,"why":"Благодаря MRO каждый класс в цепочке super() встречается один раз."}]},{"title":"Mixins","covers":["mixins"],"text":"**Mixin** — маленький класс, который добавляет **одну способность** и не предназначен для самостоятельного использования. Его «подмешивают» через множественное наследование: `class User(JsonMixin, Base)`.\n\nТак одно и то же умение (например, сериализация в JSON или логирование) можно дать разным классам без копирования кода.","code":"import json\n\nclass JsonMixin:\n    def to_json(self):\n        return json.dumps(vars(self), ensure_ascii=False)\n\nclass GreetMixin:\n    def greet(self):\n        return \"Привет, я \" + self.name\n\nclass User(JsonMixin, GreetMixin):\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\nu = User(\"Лена\", 22)\nprint(u.greet())\nprint(u.to_json())","key":["Mixin = одна переиспользуемая способность.","Подключается множественным наследованием.","Сам по себе экземпляров не создаёт."],"id":"8-4","narr":{"3":"Одна способность — превращаться в JSON","11":"Подмешиваем обе способности"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"JsonMixin"},{"l":7,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4,5],"h":[1],"o":0},{"l":8,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"GreetMixin"},{"l":11,"e":"l","f":[8],"h":[1,3],"o":0},{"l":11,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":12,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":12,"e":"r","f":[8,11],"h":[1,3,4],"o":0,"rv":["p","None"],"fn":"User"},{"l":16,"e":"l","f":[12],"h":[1,3,5],"o":0},{"l":13,"e":"l","f":[12,13],"h":[1,3,5,6],"o":0},{"l":14,"e":"l","f":[12,13],"h":[1,3,5,7],"o":0},{"l":14,"e":"r","f":[12,13],"h":[1,3,5,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":17,"e":"l","f":[14],"h":[1,3,5,8],"o":0},{"l":9,"e":"l","f":[14,15],"h":[1,3,5,8],"o":0},{"l":9,"e":"r","f":[14,15],"h":[1,3,5,8],"o":0,"rv":["p","'Привет, я Лена'"],"fn":"greet"},{"l":18,"e":"l","f":[14],"h":[1,3,5,8],"o":15},{"l":5,"e":"l","f":[14,16],"h":[1,3,5,8],"o":15},{"l":5,"e":"r","f":[14,16],"h":[1,3,5,8],"o":15,"rv":["p","'{\"name\": \"Лена\", \"age\": 22}'"],"fn":"to_json"},{"l":0,"e":"d","f":[14],"h":[1,3,5,8],"o":43}],"objs":[{"n":1,"k":"func","t":"function","name":"JsonMixin.to_json","sig":"(self)"},{"n":2,"k":"class","t":"class","name":"JsonMixin","bases":[],"attrs":{"to_json":["p","метод"]}},{"n":3,"k":"func","t":"function","name":"GreetMixin.greet","sig":"(self)"},{"n":4,"k":"class","t":"class","name":"GreetMixin","bases":[],"attrs":{"greet":["p","метод"]}},{"n":5,"k":"func","t":"function","name":"User.__init__","sig":"(self, name, age)"},{"n":6,"k":"class","t":"class","name":"User","bases":["JsonMixin","GreetMixin"],"attrs":{"__init__":["p","метод"]}},{"n":7,"k":"obj","t":"User","attrs":{}},{"n":7,"k":"obj","t":"User","attrs":{"name":["p","'Лена'"]}},{"n":7,"k":"obj","t":"User","attrs":{"name":["p","'Лена'"],"age":["p","22"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"JsonMixin()","vars":[]},{"name":"тело класса JsonMixin","vars":[]},{"name":"тело класса JsonMixin","vars":[["to_json",["r",1]]]},{"name":"глобальная область","vars":[["JsonMixin",["r",2]]]},{"name":"GreetMixin()","vars":[]},{"name":"тело класса GreetMixin","vars":[]},{"name":"тело класса GreetMixin","vars":[["greet",["r",3]]]},{"name":"глобальная область","vars":[["JsonMixin",["r",2]],["GreetMixin",["r",4]]]},{"name":"User()","vars":[]},{"name":"тело класса User","vars":[]},{"name":"тело класса User","vars":[["__init__",["r",5]]]},{"name":"глобальная область","vars":[["JsonMixin",["r",2]],["GreetMixin",["r",4]],["User",["r",6]]]},{"name":"__init__()","vars":[["self",["r",7]],["name",["p","'Лена'"]],["age",["p","22"]]]},{"name":"глобальная область","vars":[["JsonMixin",["r",2]],["GreetMixin",["r",4]],["User",["r",6]],["u",["r",7]]]},{"name":"greet()","vars":[["self",["r",7]]]},{"name":"to_json()","vars":[["self",["r",7]]]}],"out":"Привет, я Лена\n{\"name\": \"Лена\", \"age\": 22}\n","error":null,"truncated":false},"deep":"Mixin — узкий класс без собственного состояния (обычно без `__init__`), который рассчитывает на атрибуты «хозяина». Mixin ставят **левее** основного базового класса, чтобы их методы были раньше в MRO:\n\n```\nclass User(JsonMixin, Base): ...\n```\n\nMixin хорош для поперечной функциональности (сериализация, логирование, сравнение). Если mixin начинает хранить своё состояние и зависеть от многих атрибутов хозяина, лучше сделать отдельный объект и использовать композицию.","pitfalls":["Ставить mixin правее базового класса — его методы могут оказаться заслонены.","Создавать экземпляры mixin напрямую."],"links":["8-3","7-4"],"checks":[{"q":"Что напечатает код?","options":["base","mixin","Ошибка","base mixin"],"answer":1,"why":"Mixin стоит левее в списке родителей, поэтому его `hello` раньше в MRO.","code":"class Base:\n    def hello(self):\n        return 'base'\nclass Mix:\n    def hello(self):\n        return 'mixin'\nclass X(Mix, Base):\n    pass\nprint(X().hello())"},{"q":"Что обычно отличает mixin?","options":["Он хранит много состояния","Он добавляет одну способность и не используется сам по себе","Он всегда абстрактный","Он заменяет object"],"answer":1,"why":"Mixin — небольшая подмешиваемая способность."}]}],"zone":7,"world":{"name":"Родовое древо","hue":120,"kind":"village","intro":"Классы растут из общего корня: ветви наследуют всё от ствола, а порядок поиска методов — тропинка по дереву.","why":"Наследование позволяет переиспользовать и уточнять поведение, а MRO объясняет, какой метод сработает.","spots":{"базовый класс":["базовый класс","Ствол `Vehicle`: общее поведение для всех ветвей."],"дочерний класс":["дочерний класс","Ветви `Bike` и `Truck`: получают всё от ствола автоматически."],"переопределение":[null,"Ветка с другим плодом: `Bike` заменяет `wheels = 4` на свои 2."],"super()":[null,"Верёвка к стволу: потомок зовёт версию метода родителя, чтобы дополнить её."],"множественное наследование":["множ. наследование","У ветки D два родителя — B и C. Получается ромб."],"MRO":[null,"Пронумерованная тропинка D → B → C → A: в таком порядке Python ищет метод."],"mixins":[null,"Значки-способности, пришитые к классу: JSON, Greet. Одна способность — один значок."]}}},{"title":"Полиморфизм","items":["duck typing","переопределение методов","общий интерфейс","протоколы","structural typing"],"intro":"Один и тот же код работает с объектами разных типов — главное, чтобы они умели нужное действие.","lessons":[{"title":"Duck typing","covers":["duck typing"],"text":"«Если что-то ходит как утка и крякает как утка — это утка». Python не проверяет **тип** объекта, он просто вызывает нужный метод. Если метод есть — всё работает.\n\nНиже функция `make_noise` ничего не знает о классах — ей важно лишь, что у объекта есть `.sound()`. Утке, роботу и человеку не нужен общий родитель.","code":"class Duck:\n    def sound(self):\n        return \"Кря\"\n\nclass Robot:\n    def sound(self):\n        return \"Бип\"\n\nclass Person:\n    def sound(self):\n        return \"Привет\"\n\ndef make_noise(thing):\n    return thing.sound()\n\nfor t in [Duck(), Robot(), Person()]:\n    print(make_noise(t))","key":["Важно поведение, а не тип.","Нет общего предка — и не нужно.","Ошибка возникнет только если метода действительно нет."],"id":"9-1","narr":{"14":"Никаких проверок типа: просто зовём метод"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Duck"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f )"},{"n":6,"k":"class","t":"class","name":"Person","bases":[],"attrs":{"sound":["p","метод"]}},{"n":7,"k":"func","t":"function","name":"make_noise","sig":"(thing)"},{"n":8,"k":"obj","t":"Duck","attrs":{}},{"n":9,"k":"obj","t":"Robot","attrs":{}},{"n":10,"k":"obj","t":"Person","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Duck()","vars":[]},{"name":"тело класса Duck","vars":[]},{"name":"тело класса Duck","vars":[["sound",["r",1]]]},{"name":"глобальная область","vars":[["Duck",["r",2]]]},{"name":"Robot()","vars":[]},{"name":"тело класса Robot","vars":[]},{"name":"тело класса Robot","vars":[["sound",["r",3]]]},{"name":"глобальная область","vars":[["Duck",["r",2]],["Robot",["r",4]]]},{"name":"Person()","vars":[]},{"name":"тело класса Person","vars":[]},{"name":"тело класса Person","vars":[["sound",["r",5]]]},{"name":"глобальная область","vars":[["Duck",["r",2]],["Robot",["r",4]],["Person",["r",6]]]},{"name":"глобальная область","vars":[["Duck",["r",2]],["Robot",["r",4]],["Person",["r",6]],["make_noise",["r",7]]]},{"name":"глобальная область","vars":[["Duck",["r",2]],["Robot",["r",4]],["Person",["r",6]],["make_noise",["r",7]],["t",["r",8]]]},{"name":"make_noise()","vars":[["thing",["r",8]]]},{"name":"sound()","vars":[["self",["r",8]]]},{"name":"глобальная область","vars":[["Duck",["r",2]],["Robot",["r",4]],["Person",["r",6]],["make_noise",["r",7]],["t",["r",9]]]},{"name":"make_noise()","vars":[["thing",["r",9]]]},{"name":"sound()","vars":[["self",["r",9]]]},{"name":"глобальная область","vars":[["Duck",["r",2]],["Robot",["r",4]],["Person",["r",6]],["make_noise",["r",7]],["t",["r",10]]]},{"name":"make_noise()","vars":[["thing",["r",10]]]},{"name":"sound()","vars":[["self",["r",10]]]}],"out":"Кря\nБип\nПривет\n","error":null,"truncated":false},"deep":"Утиная типизация — следствие **динамического** поиска методов: Python смотрит на атрибуты объекта в момент вызова. Отсюда стиль **EAFP** («проще попросить прощения, чем разрешения»):\n\n```\ntry:\n    data = source.read()\nexcept AttributeError:\n    data = str(source)\n```\n\nвместо LBYL («посмотри, прежде чем прыгать»: `if hasattr(source, \"read\")`). Встроенные функции сами устроены по-утиному: `len()` работает с любым объектом, у которого есть `__len__`.","pitfalls":["Проверять тип через `type(x) == list` и отказывать объектам, которые ведут себя как список.","Ловить слишком широкое исключение и прятать настоящие ошибки."],"links":["9-3","11-2"],"checks":[{"q":"Что напечатает код?","options":["3","Ошибка TypeError","0","None"],"answer":0,"why":"`len` вызывает `__len__` у любого объекта — тип класса неважен.","code":"class Bag:\n    def __len__(self):\n        return 3\nprint(len(Bag()))"},{"q":"Что означает принцип EAFP?","options":["Сначала проверить всё через if","Попробовать действие и обработать исключение","Всегда указывать типы","Использовать только ABC"],"answer":1,"why":"EAFP — пробуем и ловим ошибку, вместо предварительных проверок."}]},{"title":"Переопределение методов и общий интерфейс","covers":["переопределение методов","общий интерфейс"],"text":"Классический полиморфизм через наследование: базовый класс задаёт **общий интерфейс** — набор методов (`area()`), а каждый потомок **переопределяет** его по-своему.\n\nКод, который работает с фигурами, вызывает только `area()` и не знает, круг перед ним или квадрат. Добавишь новую фигуру — этот код менять не придётся.","code":"class Shape:\n    def area(self):\n        raise NotImplementedError\n\nclass Square(Shape):\n    def __init__(self, a):\n        self.a = a\n    def area(self):\n        return self.a ** 2\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return round(3.14159 * self.r ** 2, 2)\n\nshapes = [Square(3), Circle(1)]\ntotal = sum(s.area() for s in shapes)\nprint(total)","key":["Базовый класс задаёт интерфейс.","Потомки переопределяют методы.","Клиентский код зависит только от интерфейса."],"id":"9-2","narr":{"2":"Общий интерфейс","8":"Своя реализация","18":"Код не знает, какие именно фигуры"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Shape"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"l","f":[4,7],"h":[1,2],"o":0},{"l":8,"e":"r","f":[4,8],"h":[1,2,3],"o":0,"rv":["p","None"],"fn":"Square"},{"l":11,"e":"l","f":[9],"h":[1,4],"o":0},{"l":11,"e":"l","f":[9,10],"h":[1,4],"o":0},{"l":12,"e":"l","f":[9,11],"h":[1,4],"o":0},{"l":14,"e":"l","f":[9,12],"h":[1,4,5],"o":0},{"l":14,"e":"r","f":[9,13],"h":[1,4,5,6],"o":0,"rv":["p","None"],"fn":"Circle"},{"l":17,"e":"l","f":[14],"h":[1,4,7],"o":0},{"l":7,"e":"l","f":[14,15],"h":[1,4,7,8],"o":0},{"l":7,"e":"r","f":[14,15],"h":[1,4,7,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":13,"e":"l","f":[14,16],"h":[1,4,7,10],"o":0},{"l":13,"e":"r","f":[14,16],"h":[1,4,7,11],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":18,"e":"l","f":[17],"h":[1,4,7,9,11,12],"o":0},{"l":18,"e":"l","f":[17,18],"h":[1,4,7,9,11,12],"o":0},{"l":9,"e":"l","f":[17,19,20],"h":[1,4,7,9,11,12],"o":0},{"l":9,"e":"r","f":[17,19,20],"h":[1,4,7,9,11,12],"o":0,"rv":["p","9"],"fn":"area"},{"l":18,"e":"r","f":[17,19],"h":[1,4,7,9,11,12],"o":0,"rv":["p","9"],"fn":"<genexpr>"},{"l":18,"e":"l","f":[17,19],"h":[1,4,7,9,11,12],"o":0},{"l":15,"e":"l","f":[17,21,22],"h":[1,4,7,9,11,12],"o":0},{"l":15,"e":"r","f":[17,21,22],"h":[1,4,7,9,11,12],"o":0,"rv":["p","3.14"],"fn":"area"},{"l":18,"e":"r","f":[17,21],"h":[1,4,7,9,11,12],"o":0,"rv":["p","3.14"],"fn":"<genexpr>"},{"l":18,"e":"l","f":[17,21],"h":[1,4,7,9,11,12],"o":0},{"l":18,"e":"r","f":[17,21],"h":[1,4,7,9,11,12],"o":0,"rv":["p","None"],"fn":"<genexpr>"},{"l":19,"e":"l","f":[23],"h":[1,4,7,9,11,12],"o":0},{"l":0,"e":"d","f":[23],"h":[1,4,7,9,11,12],"o":6}],"objs":[{"n":1,"k":"func","t":"function","name":"Shape.area","sig":"(self)"},{"n":2,"k":"class","t":"class","name":"Shape","bases":[],"attrs":{"area":["p","метод"]}},{"n":3,"k":"func","t":"function","name":"Square.__init__","sig":"(self, a)"},{"n":4,"k":"func","t":"function","name":"Square.area","sig":"(self)"},{"n":5,"k":"class","t":"class","name":"Square","bases":["Shape"],"attrs":{"__init__":["p","метод"],"area":["p","метод"]}},{"n":6,"k":"func","t":"function","name":"Circle.__init__","sig":"(self, r)"},{"n":7,"k":"func","t":"function","name":"Circle.area","sig":"(self)"},{"n":8,"k":"class","t":"class","name":"Circle","bases":["Shape"],"attrs":{"__init__":["p","метод"],"area":["p","метод"]}},{"n":9,"k":"obj","t":"Square","attrs":{}},{"n":9,"k":"obj","t":"Square","attrs":{"a":["p","3"]}},{"n":10,"k":"obj","t":"Circle","attrs":{}},{"n":10,"k":"obj","t":"Circle","attrs":{"r":["p","1"]}},{"n":11,"k":"list","t":"list","items":[["r",9],["r",10]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Shape()","vars":[]},{"name":"тело класса Shape","vars":[]},{"name":"тело класса Shape","vars":[["area",["r",1]]]},{"name":"глобальная область","vars":[["Shape",["r",2]]]},{"name":"Square()","vars":[]},{"name":"тело класса Square","vars":[]},{"name":"тело класса Square","vars":[["__init__",["r",3]]]},{"name":"тело класса Square","vars":[["__init__",["r",3]],["area",["r",4]]]},{"name":"глобальная область","vars":[["Shape",["r",2]],["Square",["r",5]]]},{"name":"Circle()","vars":[]},{"name":"тело класса Circle","vars":[]},{"name":"тело класса Circle","vars":[["__init__",["r",6]]]},{"name":"тело класса Circle","vars":[["__init__",["r",6]],["area",["r",7]]]},{"name":"глобальная область","vars":[["Shape",["r",2]],["Square",["r",5]],["Circle",["r",8]]]},{"name":"__init__()","vars":[["self",["r",9]],["a",["p","3"]]]},{"name":"__init__()","vars":[["self",["r",10]],["r",["p","1"]]]},{"name":"глобальная область","vars":[["Shape",["r",2]],["Square",["r",5]],["Circle",["r",8]],["shapes",["r",11]]]},{"name":"<genexpr>() ⟳генератор","vars":[]},{"name":"<genexpr>() ⟳генератор","vars":[["s",["r",9]]]},{"name":"area()","vars":[["self",["r",9]]]},{"name":"<genexpr>() ⟳генератор","vars":[["s",["r",10]]]},{"name":"area()","vars":[["self",["r",10]]]},{"name":"глобальная область","vars":[["Shape",["r",2]],["Square",["r",5]],["Circle",["r",8]],["shapes",["r",11]],["total",["p","12.14"]]]}],"out":"12.14\n","error":null,"truncated":false},"deep":"Полиморфизм через наследование даёт **позднее связывание**: какая реализация `area()` выполнится, решается во время работы по фактическому типу объекта. Это открывает код для расширения без изменения (принцип открытости/закрытости): новая фигура — новый класс, а функция `total_area` не меняется.\n\nЕсли в базовом классе метод «обязателен», но реализации нет, лучше сделать его абстрактным (раздел 10), чем бросать `NotImplementedError` — тогда ошибка проявится при создании объекта, а не при вызове.","pitfalls":["Менять сигнатуру метода в потомке (другие параметры) — ломает общий интерфейс.","Добавлять в общий код `if isinstance(shape, Circle)` при появлении новой фигуры."],"links":["10-1","8-1","25-7"],"checks":[{"q":"Что напечатает код?","options":["8","6","4","Ошибка"],"answer":0,"why":"Квадрат 2×2 даёт 4, прямоугольник 1×4 даёт 4, сумма 8. Функция не знает конкретных типов.","code":"class Sq:\n    def __init__(self, a):\n        self.a = a\n    def area(self):\n        return self.a ** 2\nclass Rect:\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\nprint(sum(s.area() for s in [Sq(2), Rect(1, 4)]))"},{"q":"Что даёт общий интерфейс при добавлении нового класса фигуры?","options":["Нужно переписать весь код","Код, работающий с интерфейсом, не меняется","Нужно добавить if в каждую функцию","Ничего"],"answer":1,"why":"Это принцип открытости/закрытости: расширяем, не изменяя."}]},{"title":"Протоколы и structural typing","covers":["протоколы","structural typing"],"text":"**Протокол** — набор методов, которые объект должен уметь, чтобы участвовать в каком-то действии. Python сам полон протоколов: «итерируемый» — значит есть `__iter__`, «имеет длину» — есть `__len__`.\n\n`typing.Protocol` позволяет описать протокол явно. Это **structural typing**: класс подходит, если у него есть нужные методы, — **наследовать** ничего не нужно. Это формализованный duck typing, который проверяют инструменты типа mypy.","code":"from typing import Protocol, runtime_checkable\n\n@runtime_checkable\nclass Drawable(Protocol):\n    def draw(self) -> str: ...\n\nclass Button:\n    def draw(self) -> str:\n        return \"[Кнопка]\"\n\nclass Text:\n    def write(self) -> str:\n        return \"abc\"\n\ndef render(item: Drawable) -> str:\n    return item.draw()\n\nprint(isinstance(Button(), Drawable))\nprint(isinstance(Text(), Drawable))\nprint(render(Button()))","key":["Протокол = набор нужных методов.","Structural typing: подходит по форме, без наследования.","`typing.Protocol` описывает протокол явно."],"id":"9-3","narr":{"4":"Протокол: «умеет draw()»","7":"НЕ наследует Drawable…","18":"…но подходит по структуре","19":"У Text нет draw — не подходит"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Drawable"},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":7,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4,5],"h":[1],"o":0},{"l":8,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Button"},{"l":11,"e":"l","f":[8],"h":[1,3],"o":0},{"l":11,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":12,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":12,"e":"r","f":[8,11],"h":[1,3,4],"o":0,"rv":["p","None"],"fn":"Text"},{"l":15,"e":"l","f":[12],"h":[1,3,5],"o":0},{"l":18,"e":"l","f":[13],"h":[1,3,5,6],"o":0},{"l":19,"e":"l" ]},{"name":"draw()","vars":[["self",["r",8]]]}],"out":"True\nFalse\n[Кнопка]\n","error":null,"truncated":false},"deep":"**Номинальная** типизация: тип подходит, если **объявлено** наследование. **Структурная**: подходит, если **совпадает форма** (нужные методы и атрибуты). `typing.Protocol` вводит структурную типизацию для статических проверок: mypy проверит, что у переданного объекта есть `draw()`.\n\n`@runtime_checkable` позволяет `isinstance` с протоколом, но проверяется только **наличие** методов, а не их сигнатуры и типы. Встроенные протоколы описаны в `collections.abc`: `Iterable`, `Sized`, `Callable` и т. д.","pitfalls":["Полагаться на `isinstance(x, MyProtocol)` как на полную проверку — сигнатуры не проверяются.","Забыть `@runtime_checkable` и получить `TypeError` при `isinstance`."],"links":["10-2","9-1","21-4"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","None"],"answer":0,"why":"Проверка с runtime_checkable смотрит только на наличие метода `draw`, неважно, что он возвращает.","code":"from typing import Protocol, runtime_checkable\n@runtime_checkable\nclass Drawable(Protocol):\n    def draw(self) -> str: ...\nclass Weird:\n    def draw(self):\n        return 42\nprint(isinstance(Weird(), Drawable))"},{"q":"Чем структурная типизация отличается от номинальной?","options":["Ничем","Подходит по набору методов, без объявленного наследования","Требует наследования от Protocol у всех классов","Работает только в рантайме"],"answer":1,"why":"Структурная типизация сравнивает форму, а не родословную."}]}],"zone":8,"world":{"name":"Концертный зал","hue":330,"kind":"city","intro":"Разные артисты выходят к одному микрофону: важно, что они умеют, а не кто они.","why":"Полиморфизм позволяет писать код, который работает с любыми подходящими объектами без проверок типа.","spots":{"duck typing":[null,"Утка, робот и человек — все умеют `sound()`, и микрофону этого достаточно."],"переопределение методов":["переопределение","Одна партитура `area()`, а каждый инструмент играет её по-своему."],"общий интерфейс":["общий интерфейс","Одинаковая вилка у всех приборов: розетке неважно, что подключено."],"протоколы":[null,"Пропуск с перечнем умений: «есть draw()» — проходи."],"structural typing":["structural typing","Фигура проходит в прорезь по форме, а не по надписи на ней."]}}},{"title":"Абстракция и интерфейсы","items":["abstract base class","ABC","@abstractmethod","Protocol","интерфейс","контракт"],"intro":"Как описать «что должно уметь», не говоря «как», и заставить потомков выполнить обещание.","lessons":[{"title":"ABC и @abstractmethod","covers":["abstract base class","ABC","@abstractmethod"],"text":"**Абстрактный базовый класс** (abstract base class) — класс-шаблон, от которого нельзя создать объект. Он наследует от `ABC` и помечает обязательные методы декоратором `@abstractmethod`.\n\nЕсли потомок не реализовал все абстрактные методы, Python не даст создать его экземпляр — ошибка возникнет сразу, а не где-то потом.","code":"from abc import ABC, abstractmethod\n\nclass Payment(ABC):\n    @abstractmethod\n    def pay(self, amount): ...\n\nclass Card(Payment):\n    def pay(self, amount):\n        return f\"Оплачено картой: {amount}\"\n\nclass Broken(Payment):\n    pass\n\nprint(Card().pay(500))\nfor cls in (Payment, Broken):\n    try:\n        cls()\n    except TypeError as e:\n        print(\"Нельзя:\", cls.__name__)","key":["Наследуй от `ABC`, помечай обязательное `@abstractmethod`.","Нельзя создать экземпляр, пока всё не реализовано.","Ошибка возникает рано — при создании объекта."],"id":"10-1","narr":{"3":"Абстрактный класс","5":"Обязательный метод без реализации","8":"Реализовали — можно создавать объекты","12":"Забыли реализовать pay","19":"Python не даёт создать неполный объект"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Payment"},{"l":7,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4,5],"h":[1],"o":0},{"l":8,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Card"},{"l":11,"e":"l","f":[8],"h":[1,3],"o":0},{"l":11,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":12,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":12,"e":"r","f":[8,10],"h":[1,3],"o":0,"rv":["p","None"],"fn":"Broken"},{"l":14,"e":"l","f":[11],"h":[1,3,4],"o":0},{"l":9,"e":"l","f":[11,12],"h":[1,3,4,5],"o":0},{"l":9,"e":"r","f":[11,12],"h":[1,3,4,5],"o":0,"rv":["p","'Оплачено картой: 500'"],"fn":"pay"},{"l":15,"e":"l","f":[11],"h":[1,3,4],"o":21},{"l":16,"e":"l","f":[13],"h":[1,3,4],"o":21},{"l":17,"e":"l","f":[13],"h":[1,3,4],"o":21},{"l":17,"e":"e","f":[13],"h":[1,3,4],"o":21,"ex":"TypeError: Can't instantiate abstract class Payment without an implementation for abstract method 'pay'"},{"l":18,"e":"l","f":[13],"h":[1,3,4],"o":21},{"l":19,"e":"l","f":[14],"h":[1,3,4,6,7],"o":21},{"l":15,"e":"l","f":[13],"h":[1,3,4],"o":37},{"l":16,"e":"l","f":[15],"h":[1,3,4],"o":37},{"l":17,"e":"l","f":[15],"h":[1,3,4],"o":37},{"l":17,"e":"e","f":[15],"h":[1,3,4],"o":37,"ex":"TypeError: Can't instantiate abstract class Broken without an implementation for abstract method 'pay'"},{"l":18,"e":"l","f":[15],"h":[1,3,4],"o":37},{"l":19,"e":"l","f":[16],"h":[1,3,4,6,8],"o":37},{"l":15,"e":"l","f":[15],"h":[1,3,4],"o":52},{"l":0,"e":"d","f":[15],"h":[1,3,4],"o":52}],"objs":[{"n":1,"k":"func","t":"function","name":"Payment.pay","sig":"(self, amount)"},{"n":2,"k":"class","t":"class","name":"Payment","bases":["ABC"],"attrs":{"pay":["p","метод ⚠abstract"]},"meta":"ABCMeta"},{"n":3,"k":"func","t":"function","name":"Card.pay","sig":"(self, amount)"},{"n":4,"k":"class","t":"class","name":"Card","bases":["Payment"],"attrs":{"pay":["p","метод"]},"meta":"ABCMeta"},{"n":5,"k":"class","t":"class","name":"Broken","bases":["Payment"],"attrs":{},"meta":"ABCMeta"},{"n":6,"k":"obj","t":"Card","attrs":{}},{"n":7,"k":"obj","t":"TypeError","attrs":{"args":["r",8]},"exc":true},{"n":8,"k":"tuple","t":"tuple","items":[["p","\"Can't instantiate abstract class Payment without an implem…"]],"more":0},{"n":8,"k":"tuple","t":"tuple","items":[["p","\"Can't instantiate abstract class Broken without an impleme…"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Payment()","vars":[]},{"name":"тело класса Payment","vars":[]},{"name":"тело класса Payment","vars":[["pay",["r",1]]]},{"name":"глобальная область","vars":[["Payment",["r",2]]]},{"name":"Card()","vars":[]},{"name":"тело класса Card","vars":[]},{"name":"тело класса Card","vars":[["pay",["r",3]]]},{"name":"глобальная область","vars":[["Payment",["r",2]],["Card",["r",4]]]},{"name":"Broken()","vars":[]},{"name":"тело класса Broken","vars":[]},{"name":"глобальная область","vars":[["Payment",["r",2]],["Card",["r",4]],["Broken",["r",5]]]},{"name":"pay()","vars":[["self",["r",6]],["amount",["p","500"]]]},{"name":"глобальная область","vars":[["Payment",["r",2]],["Card",["r",4]],["Broken",["r",5]],["cls",["r",2]]]},{"name":"глобальная область","vars":[["Payment",["r",2]],["Card",["r",4]],["Broken",["r",5]],["cls",["r",2]],["e",["r",7]]]},{"name":"глобальная область","vars":[["Payment",["r",2]],["Card",["r",4]],["Broken",["r",5]],["cls",["r",5]]]},{"name":"глобальная область","vars":[["Payment",["r",2]],["Card",["r",4]],["Broken",["r",5]],["cls",["r",5]],["e",["r",7]]]}],"out":"Оплачено картой: 500\nНельзя: Payment\nНельзя: Broken\n","error":null,"truncated":false},"deep":"Класс, наследующий `ABC`, получает метакласс `ABCMeta`. Декоратор `@abstractmethod` помечает функцию флагом, а `ABCMeta` при создании класса собирает множество `__abstractmethods__`. Если оно непустое, `object.__new__` откажется создавать экземпляр.\n\n```\nfrom abc import ABC, abstractmethod\nclass P(ABC):\n    @abstractmethod\n    def pay(self): ...\nprint(P.__abstractmethods__)   # frozenset({'pay'})\n```\n\nABC также поддерживают **виртуальное наследование**: `P.register(SomeClass)` заставит `isinstance` считать класс подходящим без реального наследования.","pitfalls":["Забыть наследовать от `ABC` — `@abstractmethod` тогда ничего не запрещает.","Ставить `@abstractmethod` ниже `@property` — нужен порядок `@property` сверху, `@abstractmethod` снизу."],"links":["10-2","14-2","9-2"],"checks":[{"q":"Что напечатает код?","options":["frozenset({'pay'})","set()","['pay']","Ошибка"],"answer":0,"why":"ABCMeta собирает имена абстрактных методов в `__abstractmethods__`.","code":"from abc import ABC, abstractmethod\nclass P(ABC):\n    @abstractmethod\n    def pay(self): ...\nprint(P.__abstractmethods__)"},{"q":"Что напечатает код?","options":["ok","TypeError","None","Ошибка импорта"],"answer":0,"why":"Без наследования от ABC декоратор `@abstractmethod` не мешает создать объект.","code":"from abc import abstractmethod\nclass P:\n    @abstractmethod\n    def pay(self): ...\nP()\nprint('ok')"}]},{"title":"Интерфейс, контракт и Protocol","covers":["Protocol","интерфейс","контракт"],"text":"**Интерфейс** — список того, что объект умеет (имена методов и их параметры). **Контракт** — интерфейс плюс обещания: что метод принимает, что возвращает, какие правила соблюдает («возвращает число ≥ 0», «бросает ValueError при пустом вводе»).\n\nВ Python интерфейс можно задать через ABC (с наследованием) или через `Protocol` (без наследования). Контракт обычно описывают в docstring и проверяют `assert`-ами и тестами.","code":"from typing import Protocol\n\nclass Storage(Protocol):\n    def save(self, key: str, value: str) -> None: ...\n    def load(self, key: str) -> str: ...\n\nclass MemoryStorage:\n    def __init__(self):\n        self.data = {}\n    def save(self, key, value):\n        assert key, \"контракт: ключ не пустой\"\n        self.data[key] = value\n    def load(self, key):\n        return self.data.get(key, \"\")\n\ndef remember(store: Storage):\n    store.save(\"hero\", \"Гарри\")\n    return store.load(\"hero\")\n\nprint(remember(MemoryStorage()))","key":["Интерфейс — что умеет объект.","Контракт — интерфейс + правила и гарантии.","ABC требует наследования, Protocol — нет."],"id":"10-2","narr":{"3":"Интерфейс: save и load","7":"Реализует интерфейс без наследования","11":"Проверяем обещание контракта"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":5,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Storage"},{"l":7,"e":"l","f":[5],"h":[2],"o":0},{"l":7,"e":"l","f":[5,6],"h":[2],"o":0},{"l":8,"e":"l","f":[5,7],"h":[2],"o":0},{"l":10,"e":"l","f":[5,8],"h":[2,3],"o":0},{"l":13,"e":"l","f":[5,9],"h":[2,3,4],"o":0},{"l":13,"e":"r","f":[5,10],"h":[2,3,4,5],"o":0,"rv":["p","None"],"fn":"MemoryStorage"},{"l":16,"e":"l","f":[11],"h":[2,6],"o":0},{"l":20,"e":"l","f":[12],"h":[2,6,7],"o":0},{"l":9,"e":"l","f":[12,13],"h":[2,6,7,8],"o":0},{"l":9,"e":"r","f":[12,13],"h":[2,6,7,9,10],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":17,"e":"l","f":[12,14],"h":[2,6,7,9,10],"o":0},{"l":11,"e":"l","f":[12,14,15],"h":[2,6,7,9,10],"o":0},{"l":12,"e":"l","f":[12,14,15],"h":[2,6,7,9,10],"o":0},{"l":12,"e":"r","f":[12,14,15],"h":[2,6,7,9,11],"o":0,"rv":["p","None"],"fn":"save"},{"l":18,"e":"l","f":[12,14],"h":[2,6,7,9,11],"o":0},{"l":14,"e":"l","f":[12,14,16],"h":[2,6,7,9,11],"o":0},{"l":14,"e":"r","f":[12,14,16],"h":[2,6,7,9,11],"o":0,"rv":["p","'Гарри'"],"fn":"load"},{"l":18,"e":"r","f":[12,14],"h":[2,6,7,9,11],"o":0,"rv":["p","'Гарри'"],"fn":"remember"},{"l":0,"e":"d","f":[12],"h":[2,6,7],"o":6}],"objs":[{"n":1,"k":"func","t":"function","name":"Storage.save","sig":"(self, key: str, value: str) -> None"},{"n":2,"k":"func","t":"function","name":"Storage.load","sig":"(self, key: str) -> str"},{"n":3,"k":"class","t":"class","name":"Storage","bases":["Protocol"],"attrs":{"save":["p","метод"],"load":["p","метод"],"_is_protocol":["p","True"],"__init__":["p","метод"]},"meta":"_ProtocolMeta"},{"n":4,"k":"func","t":"function","name":"MemoryStorage.__init__","sig":"(self)"},{"n":5,"k":"func","t":"function","name":"MemoryStorage.save","sig":"(self, key, value)"},{"n":6,"k":"func","t":"function","name":"MemoryStorage.load","sig":"(self, key)"},{"n":7,"k":"class","t":"class","name":"MemoryStorage","bases":[],"attrs":{"__init__":["p","метод"],"save":["p","метод"],"load":["p","метод"]}},{"n":8,"k":"func","t":"function","name":"remember","sig":"(store: __main__.Storage)"},{"n":9,"k":"obj","t":"MemoryStorage","attrs":{}},{"n":9,"k":"obj","t":"MemoryStorage","attrs":{"data":["r",10]}},{"n":10,"k":"dict","t":"dict","pairs":[],"more":0},{"n":10,"k":"dict","t":"dict","pairs":[[["p","'hero'"],["p","'Гарри'"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Storage()","vars":[]},{"name":"тело класса Storage","vars":[]},{"name":"тело класса Storage","vars":[["save",["r",1]]]},{"name":"тело класса Storage","vars":[["save",["r",1]],["load",["r",2]]]},{"name":"глобальная область","vars":[["Storage",["r",3]]]},{"name":"MemoryStorage()","vars":[]},{"name":"тело класса MemoryStorage","vars":[]},{"name":"тело класса MemoryStorage","vars":[["__init__",["r",4]]]},{"name":"тело класса MemoryStorage","vars":[["__init__",["r",4]],["save",["r",5]]]},{"name":"тело класса MemoryStorage","vars":[["__init__",["r",4]],["save",["r",5]],["load",["r",6]]]},{"name":"глобальная область","vars":[["Storage",["r",3]],["MemoryStorage",["r",7]]]},{"name":"глобальная область","vars":[["Storage",["r",3]],["MemoryStorage",["r",7]],["remember",["r",8]]]},{"name":"__init__()","vars":[["self",["r",9]]]},{"name":"remember()","vars":[["store",["r",9]]]},{"name":"save()","vars":[["self",["r",9]],["key",["p","'hero'"]],["value",["p","'Гарри'"]]]},{"name":"load()","vars":[["self",["r",9]],["key",["p","'hero'"]]]}],"out":"Гарри\n","error":null,"truncated":false},"deep":"**Контракт** = интерфейс + **предусловия** (что должно быть верно на входе), **постусловия** (что гарантируется на выходе) и **инварианты** (что всегда верно для объекта). Этот подход называют Design by Contract.\n\nВ Python контракт фиксируют:\n- типами (`def load(key: str) -> str`) — для статических проверок;\n- docstring с описанием правил;\n- `assert` и исключениями на границах (`ValueError` для неправильных аргументов);\n- тестами, которые проверяют, что любая реализация интерфейса соблюдает контракт.\n\nABC годится, когда нужна общая реализация и явная иерархия; Protocol — когда хочешь принять любой подходящий по форме объект, в том числе из чужих библиотек.","pitfalls":["Проверять бизнес-правила через `assert`: при запуске с `python -O` проверки отключаются.","Описывать интерфейс, но не фиксировать поведение — разные реализации ведут себя по-разному."],"links":["10-1","9-3","24-4"],"checks":[{"q":"Что напечатает код?","options":["ValueError: ключ пустой","AssertionError","None","ok"],"answer":0,"why":"Нарушение предусловия сообщаем исключением — оно работает и в режиме `-O`, в отличие от assert.","code":"def save(key):\n    if not key:\n        raise ValueError('ключ пустой')\ntry:\n    save('')\nexcept ValueError as e:\n    print('ValueError:', e)"},{"q":"Когда уместнее Protocol, чем ABC?","options":["Когда нужна общая реализация методов","Когда хочешь принимать любые подходящие по форме объекты без наследования","Всегда","Никогда"],"answer":1,"why":"Protocol описывает форму, не требуя наследования."}]}],"zone":9,"world":{"name":"Бюро контрактов","hue":48,"kind":"village","intro":"Здесь лежат шаблоны и договоры: что объект обязан уметь, прежде чем его можно построить.","why":"Абстракции и интерфейсы фиксируют обещания между частями программы и ловят ошибки рано.","spots":{"abstract base class":["abstract base class","Пунктирный шаблон машины: по нему нельзя построить объект, пока не заполнены пустые места."],"ABC":[null,"Штамп ABC на шаблоне: класс наследует `ABC` и получает контроль абстрактных методов."],"@abstractmethod":[null,"Пустое гнездо с пометкой «обязательно»: потомок должен вставить сюда `pay()`."],"Protocol":[null,"Чек-лист умений: подходит любой объект, у которого есть все пункты, без наследования."],"интерфейс":[null,"Пульт с кнопками-методами: что объект умеет, без подробностей как."],"контракт":[null,"Подписанный договор: интерфейс плюс обещания — что на входе, что на выходе."]}}},{"title":"Специальные методы","items":["__str__","__repr__","__len__","__getitem__","__setitem__","__iter__","__next__","__eq__","__lt__","__add__","__call__","..."],"intro":"Методы с двойными подчёркиваниями (dunder-методы) — это «крючки», через которые Python подключает твои объекты к встроенному синтаксису: `print`, `len`, `[]`, `for`, `==`, `+`, `()`. Ты их не вызываешь напрямую — их вызывает Python.","lessons":[{"title":"__str__ и __repr__","covers":["__str__","__repr__"],"text":"`__str__` отвечает за **красивый текст для людей** — его использует `print()` и `str()`. `__repr__` — за **точное описание для программиста** — его видно в отладчике, в консоли и когда объект лежит внутри списка.\n\nХорошее правило: `__repr__` должен выглядеть как код, которым можно создать такой же объект.","code":"class Money:\n    def __init__(self, amount, cur):\n        self.amount = amount\n        self.cur = cur\n\n    def __str__(self):\n        return f\"{self.amount} {self.cur}\"\n\n    def __repr__(self):\n        return f\"Money({self.amount!r}, {self.cur!r})\"\n\nm = Money(100, \"₽\")\nprint(m)\nprint([m])\nprint(repr(m))","key":["`print(obj)` → `__str__`.","Отладка, консоль, содержимое списков → `__repr__`.","Если `__str__` нет, Python берёт `__repr__`."],"id":"11-1","narr":{"6":"Для людей","9":"Для программистов","13":"print вызывает __str__","14":"Внутри списка используется __repr__"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e" :[["Money",["r",4]],["m",["r",5]]]},{"name":"__str__()","vars":[["self",["r",5]]]},{"name":"__repr__()","vars":[["self",["r",5]]]}],"out":"100 ₽\n[Money(100, '₽')]\nMoney(100, '₽')\n","error":null,"truncated":false},"deep":"`print(x)` вызывает `str(x)`, а тот — `type(x).__str__(x)`. Если `__str__` не определён, `object.__str__` вызывает `__repr__`. Контейнеры (список, словарь) показывают свои элементы через `repr`, чтобы было видно разницу между `1` и `'1'`.\n\nВ f-строках есть модификаторы: `f\"{x!r}\"` — repr, `f\"{x!s}\"` — str, а `f\"{x=}\"` печатает и выражение, и значение — удобно для отладки:\n```\nprice = 9.5\nprint(f\"{price=}\")   # price=9.5\n```","pitfalls":["Определить только `__str__` и удивляться некрасивому виду объекта внутри списка — нужен `__repr__`.","Возвращать из `__repr__` не строку — `TypeError`."],"links":["2-8","22-1"],"checks":[{"q":"Что напечатает код?","options":["[M]","[m]","[<M object>]","M m"],"answer":0,"why":"Внутри списка используется `__repr__`, он возвращает 'M'.","code":"class X:\n    def __str__(self):\n        return 'm'\n    def __repr__(self):\n        return 'M'\nprint([X()])"},{"q":"Что напечатает код?","options":["x=5","5","x 5","{x=}"],"answer":0,"why":"Спецификатор `=` в f-строке печатает выражение и его значение.","code":"x = 5\nprint(f'{x=}')"}]},{"title":"__len__, __getitem__, __setitem__","covers":["__len__","__getitem__","__setitem__"],"text":"Эти методы делают объект похожим на коллекцию. `len(obj)` вызывает `obj.__len__()`, `obj[k]` — `obj.__getitem__(k)`, а `obj[k] = v` — `obj.__setitem__(k, v)`.\n\nСмотри: в визуализаторе каждый `[]` превращается в вызов метода — появляется кадр `__getitem__()` или `__setitem__()`.","code":"class Playlist:\n    def __init__(self, *songs):\n        self.songs = list(songs)\n\n    def __len__(self):\n        return len(self.songs)\n\n    def __getitem__(self, i):\n        return self.songs[i]\n\n    def __setitem__(self, i, value):\n        self.songs[i] = value.upper()\n\np = Playlist(\"intro\", \"song\", \"outro\")\nprint(len(p))\nprint(p[1])\np[0] = \"opening\"\nprint(p.songs)","key":["`len()` → `__len__`.","`obj[k]` → `__getitem__`, `obj[k] = v` → `__setitem__`.","Так строятся собственные коллекции."],"id":"11-2","narr":{"8":"Срабатывает на p[i]","11":"Срабатывает на p[i] = value","15":"→ p.__len__()","16":"→ p.__getitem__(1)","17":"→ p.__setitem__(0, \"opening\")"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":8,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":11,"e":"r","f":[0,6],"h":[0,1,2,3],"o":0,"rv":["p","None"],"fn":"Playlist"},{"l":14,"e":"l","f":[7],"h":[4],"o":0},{"l":3,"e":"l","f":[7,8],"h":[4,5,6],"o":0},{"l":3,"e":"r","f":[7,8],"h":[4,7,6,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":15,"e":"l","f":[9],"h":[4,7,8],"o":0},{"l":6,"e":"l","f":[9,10],"h":[4,7,8],"o":0},{"l":6,"e":"r","f":[9,10],"h":[4,7,8],"o":0,"rv":["p","3"],"fn":"__len__"},{"l":16,"e":"l","f":[9],"h":[4,7,8],"o":2},{"l":9,"e":"l","f":[9,11],"h":[4,7,8],"o":2},{"l":9,"e":"r","f":[9,11],"h":[4,7,8],"o":2,"rv":["p","'song'"],"fn":"__getitem__"},{"l":17,"e":"l","f":[9],"h":[4,7,8],"o":7},{"l":12,"e":"l","f":[9,12],"h":[4,7,8],"o":7},{"l":12,"e":"r","f":[9,12],"h":[4,7,9],"o":7,"rv":["p","None"],"fn":"__setitem__"},{"l":18,"e":"l","f":[9],"h":[4,7,9],"o":7},{"l":0,"e":"d","f":[9],"h":[4,7,9],"o":36}],"objs":[{"n":1,"k":"func","t":"function","name":"Playlist.__init__","sig":"(self, *songs)"},{"n":2,"k":"func","t":"function","name":"Playlist.__len__","sig":"(self)"},{"n":3,"k":"func","t":"function","name":"Playlist.__getitem__","sig":"(self, i)"},{"n":4,"k":"func","t":"function","name":"Playlist.__setitem__","sig":"(self, i, value)"},{"n":5,"k":"class","t":"class","name":"Playlist","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":6,"k":"obj","t":"Playlist","attrs":{}},{"n":7,"k":"tuple","t":"t росить `IndexError` в `__getitem__` — перебор через `for` станет бесконечным."],"links":["11-3","9-1"],"checks":[{"q":"Что напечатает код?","options":["[0, 1, 4]","Ошибка: объект не итерируемый","[0, 1, 4, 9]","[]"],"answer":0,"why":"Есть только `__getitem__`: `for` перебирает индексы 0, 1, 2 и останавливается на IndexError.","code":"class Sq:\n    def __getitem__(self, i):\n        if i > 2:\n            raise IndexError\n        return i * i\nprint(list(Sq()))"},{"q":"Что вызывает выражение `box[1:3]`?","options":["`__getitem__(1, 3)`","`__getitem__(slice(1, 3, None))`","`__slice__(1, 3)`","`__len__`"],"answer":1,"why":"Срез передаётся в `__getitem__` одним объектом `slice`."}]},{"title":"__iter__ и __next__","covers":["__iter__","__next__"],"text":"Цикл `for` работает через два метода. Сначала `iter(obj)` вызывает `obj.__iter__()` и получает **итератор**. Потом цикл раз за разом вызывает `__next__()` у итератора, пока тот не бросит `StopIteration` — сигнал «элементы кончились».\n\nНиже класс сам себе итератор: `__iter__` возвращает `self`.","code":"class Countdown:\n    def __init__(self, start):\n        self.current = start\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.current <= 0:\n            raise StopIteration\n        self.current -= 1\n        return self.current + 1\n\nfor n in Countdown(3):\n    print(n)","key":["`for` = `iter()` + много `next()` + перехват `StopIteration`.","`__iter__` возвращает итератор.","`__next__` отдаёт следующий элемент или бросает `StopIteration`."],"id":"11-3","narr":{"5":"for сначала вызывает этот метод","8":"…а потом этот — на каждом круге","10":"Сигнал циклу: стоп"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":8,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":8,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"Countdown"},{"l":14,"e":"l","f":[6] r",["p","1"]],["minor",["p","10"]]]},{"name":"глобальная область","vars":[["Version",["r",5]],["vs",["r",10]]]},{"name":"__lt__()","vars":[["self",["r",8]],["other",["r",7]]]},{"name":"__lt__()","vars":[["self",["r",9]],["other",["r",8]]]},{"name":"__lt__()","vars":[["self",["r",8]],["other",["r",9]]]},{"name":"__lt__()","vars":[["self",["r",9]],["other",["r",7]]]},{"name":"__repr__()","vars":[["self",["r",8]]]},{"name":"__repr__()","vars":[["self",["r",9]]]},{"name":"__repr__()","vars":[["self",["r",7]]]}],"out":"True\n[v1.5, v1.10, v2.0]\n","error":null,"truncated":false},"deep":"Если `__eq__` не может сравнить объекты (другой тип), он должен вернуть **`NotImplemented`** — тогда Python попробует отражённую операцию у второго объекта. Определив `__eq__`, класс теряет `__hash__` (он становится `None`), иначе равные объекты могли бы иметь разные хеши. Если объект нужен в `set`/`dict`, определи `__hash__` сам.\n\n`functools.total_ordering` достраивает недостающие сравнения:\n```\nfrom functools import total_ordering\n@total_ordering\nclass V:\n    def __init__(self, n): self.n = n\n    def __eq__(self, o): return self.n == o.n\n    def __lt__(self, o): return self.n < o.n\nprint(V(2) >= V(1))   # True\n```","pitfalls":["Определить `__eq__` и потом класть объекты в `set` — `TypeError: unhashable type`.","Возвращать `False` вместо `NotImplemented` для чужого типа — ломаются сравнения с другими классами."],"links":["11-6","2-6","1-4"],"checks":[{"q":"Что напечатает код?","options":["True","unhashable","False","None"],"answer":1,"why":"Определение `__eq__` без `__hash__` делает объекты нехешируемыми.","code":"class P:\n    def __eq__(self, o):\n        return True\ntry:\n    {P()}\n    print('True')\nexcept TypeError:\n    print('unhashable')"},{"q":"Что должен вернуть `__eq__`, если не умеет сравнивать с объектом другого типа?","options":["False","None","NotImplemented","Бросить ошибку"],"answer":2,"why":"`NotImplemented` даёт Python шанс попробовать сравнение со стороны другого объекта."}]},{"title":"__add__ и __call__","covers":["__add__","__call__"],"text":"`a + b` вызывает `a.__add__(b)` — так можно научить свои объекты складываться (векторы, деньги, матрицы). Есть и другие: `__sub__`, `__mul__`, `__truediv__`.\n\n`__call__` превращает объект в «функцию»: `obj(x)` вызывает `obj.__call__(x)`. Такой объект может хранить состояние между вызовами.","code":"class Vec:\n    def __init__(self, x, y):\n        self.x, self.y = x, y\n    def __add__(self, other):\n        return Vec(self.x + other.x, self.y + other.y)\n    def __repr__(self):\n        return f\"Vec({self.x}, {self.y})\"\n\nclass Multiplier:\n    def __init__(self, k):\n        self.k = k\n    def __call__(self, x):\n        return x * self.k\n\nprint(Vec(1, 2) + Vec(3, 4))\ntriple = Multiplier(3)\nprint(triple(5), callable(triple))","key":["`+` → `__add__` (и `-` → `__sub__`, `*` → `__mul__`…).","`obj()` → `__call__`.","Операторы в Python — это вызовы методов."],"id":"11-5","narr":{"4":"v1 + v2","12":"Объект можно вызывать как функцию"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":6,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"Vec"},{"l":9,"e":"l","f":[6],"h":[3],"o":0},{"l":9,"e":"l","f":[6,7],"h":[3],"o":0},{"l":10,"e":"l","f":[6,8],"h":[3],"o":0},{"l":12,"e":"l","f":[6,9],"h":[3,4],"o":0},{"l":12,"e":"r","f":[6,10],"h":[3,4,5],"o":0,"rv":["p","None"],"fn":"Multiplier"},{"l":15,"e":"l","f":[11],"h":[3,6],"o":0},{"l":3,"e":"l","f":[11,12],"h":[3,6,7],"o":0},{"l":3,"e":"r","f":[11,12],"h":[3,6,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":3,"e":"l","f":[11,13],"h":[3,6,9],"o":0},{"l":3,"e":"r","f":[11,13],"h":[3,6,10],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":5,"e":"l","f":[11,14],"h":[3,6,8,10],"o":0},{"l":3,"e":"l","f":[11,14,15],"h":[3,6,8,10,11],"o":0},{"l":3,"e":"r","f":[ d__",["r",2]],["__repr__",["r",3]]]},{"name":"глобальная область","vars":[["Vec",["r",4]]]},{"name":"Multiplier()","vars":[]},{"name":"тело класса Multiplier","vars":[]},{"name":"тело класса Multiplier","vars":[["__init__",["r",5]]]},{"name":"тело класса Multiplier","vars":[["__init__",["r",5]],["__call__",["r",6]]]},{"name":"глобальная область","vars":[["Vec",["r",4]],["Multiplier",["r",7]]]},{"name":"__init__()","vars":[["self",["r",8]],["x",["p","1"]],["y",["p","2"]]]},{"name":"__init__()","vars":[["self",["r",9]],["x",["p","3"]],["y",["p","4"]]]},{"name":"__add__()","vars":[["self",["r",8]],["other",["r",9]]]},{"name":"__init__()","vars":[["self",["r",10]],["x",["p","4"]],["y",["p","6"]]]},{"name":"__repr__()","vars":[["self",["r",10]]]},{"name":"__init__()","vars":[["self",["r",11]],["k",["p","3"]]]},{"name":"глобальная область","vars":[["Vec",["r",4]],["Multiplier",["r",7]],["triple",["r",11]]]},{"name":"__call__()","vars":[["self",["r",11]],["x",["p","5"]]]}],"out":"Vec(4, 6)\n15 True\n","error":null,"truncated":false},"deep":"Для `a + b` Python сначала вызывает `a.__add__(b)`. Если тот вернул `NotImplemented`, пробует **отражённый** `b.__radd__(a)`. Так работает `3 + Vec(...)` или `sum([...])` (sum начинает с 0 и делает `0 + первый`). Есть и `__iadd__` для `+=` — он может изменить объект на месте (так делают списки).\n\n`__call__` превращает объект в вызываемый: `callable(obj)` вернёт True. Объекты с `__call__` удобны, когда функции нужно хранить состояние или настройки.","pitfalls":["Не определить `__radd__` и получить ошибку в `sum(vectors)` (sum начинает с 0).","Менять `self` в `__add__` — оператор `+` не должен портить операнды."],"links":["11-4","20-1","1-4"],"checks":[{"q":"Что напечатает код?","options":["Vec(4)","Ошибка TypeError","4","Vec(3)"],"answer":0,"why":"sum начинает с 0: `0 + Vec(1)` вызывает `Vec.__radd__`, дальше работает `__add__`.","code":"class Vec:\n    def __init__(self, x):\n        self.x = x\n    def __add__(self, o):\n        return Vec(self.x + (o.x if isinstance(o, Vec) else o))\n    __radd__ = __add__\n    def __repr__(self):\n        return f'Vec({self.x})'\nprint(sum([Vec(1), Vec(3)]))"},{"q":"Что делает объект вызываемым как функция?","options":["`__init__`","`__call__`","`__func__`","`__run__`"],"answer":1,"why":"`obj(...)` превращается в `type(obj).__call__(obj, ...)`."}]},{"title":"И другие: __contains__, __bool__, __hash__ …","covers":["..."],"text":"Dunder-методов десятки. Самые полезные из остальных: `__contains__` (оператор `in`), `__bool__` (истинность в `if`), `__hash__` (можно ли класть в `set` и делать ключом `dict`), `__enter__/__exit__` (`with`, раздел 18), `__get__/__set__` (дескрипторы, раздел 12), `__init_subclass__` (раздел 14).\n\nПринцип всегда один: синтаксис Python → вызов соответствующего dunder-метода.","code":"class Team:\n    def __init__(self, *names):\n        self.names = set(names)\n    def __contains__(self, name):\n        return name in self.names\n    def __bool__(self):\n        return len(self.names) > 0\n    def __hash__(self):\n        return hash(frozenset(self.names))\n    def __eq__(self, other):\n        return self.names == other.names\n\nt = Team(\"Аня\", \"Боря\")\nprint(\"Аня\" in t, \"Гоша\" in t)\nif not Team():\n    print(\"Пустая команда — ложь\")\nprint(len({t, Team(\"Боря\", \"Аня\")}))","key":["`in` → `__contains__`, `if obj` → `__bool__`.","`__hash__` нужен для set и ключей dict.","Синтаксис → dunder-метод: это общее правило."],"id":"11-6","narr":{"4":"Оператор in","6":"Истинность в if","8":"Позволяет класть объект в set","17":"Равные команды с одним хешем — в set один элемент"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":8,"e":"l","f":[0,5],"h":[0,1,2],"o":0},{"l":10,"e":"l","f":[0,6],"h":[0,1,2,3],"o":0},{"l":10,"e":"r","f":[0,7],"h":[0,1,2,3,4],"o":0,"rv":["
