["r",8]],["result",["p","5"]],["func",["r",2]]]},{"name":"wrapper()","vars":[["func",["r",6]],["n",["p","3"]]]},{"name":"wrapper()","vars":[["_",["p","0"]],["func",["r",6]],["n",["p","3"]]]},{"name":"hi()","vars":[]},{"name":"wrapper()","vars":[["_",["p","1"]],["func",["r",6]],["n",["p","3"]]]},{"name":"wrapper()","vars":[["_",["p","2"]],["func",["r",6]],["n",["p","3"]]]}],"out":"→ вызов add (2, 3)\n← результат 5\n['hi', 'hi', 'hi']\n","error":null,"truncated":false},"deep":"Декоратор работает в два момента:\n1. **время определения**: `@deco` над `def f` выполняет `f = deco(f)` один раз;\n2. **время вызова**: при каждом `f(...)` выполняется обёртка.\n\nШаблон декоратора:\n```\nimport functools\ndef deco(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        # до\n        result = func(*args, **kwargs)\n        # после\n        return result\n    return wrapper\n```\n\nДекоратор с параметрами — функция, которая **возвращает декоратор** (три уровня). Декорировать можно и классы: `@dataclass` — пример декоратора класса.","pitfalls":["Забыть `return result` в обёртке — функция начнёт возвращать `None`.","Не использовать `*args, **kwargs` — обёртка сломается на функциях с другой сигнатурой.","Забыть `@wraps` — пропадут имя и документация функции."],"links":["20-3","4-6","4-4"],"checks":[{"q":"Что напечатает код?","options":["5","None","10","Ошибка"],"answer":1,"why":"Обёртка вызывает функцию, но не возвращает её результат, поэтому получаем None.","code":"def deco(func):\n    def wrapper(*a):\n        func(*a)\n    return wrapper\n@deco\ndef add(a, b):\n    return a + b\nprint(add(2, 3))"},{"q":"Что напечатает код?","options":["def | call","call | def","call","def"],"answer":0,"why":"Декоратор применяется при определении функции ('def'), обёртка срабатывает при вызове ('call').","code":"def deco(func):\n    print('def')\n    def wrapper():\n        print('call')\n    return wrapper\n@deco\ndef f():\n    pass\nf()"}]},{"title":"functools","covers":["functools"],"text":"Модуль `functools` — инструменты для работы с функциями:\n\n`@wraps(func)` внутри декоратора копирует имя и документацию оригинала на обёртку (иначе `__name__` будет `wrapper`). `@lru_cache` запоминает результаты вызовов — повторный вызов с теми же аргументами возвращается мгновенно. `partial` создаёт новую функцию с частично заданными аргументами.","code":"from functools import wraps, lru_cache, partial\n\ndef noisy(func):\n    @wraps(func)\n    def wrapper(*a):\n        return func(*a)\n    return wrapper\n\n@noisy\ndef greet(name):\n    return \"hi \" + name\n\nprint(greet.__name__)\n\n@lru_cache\ndef slow_square(n):\n    print(\"  считаю\", n)\n    return n * n\n\nslow_square(4)\nslow_square(4)\npower2 = partial(pow, 2)\nprint(power2(10))","key":["`@wraps` — обёртка сохраняет имя оригинала.","`@lru_cache` — кэширование результатов.","`partial` — фиксирует часть аргументов."],"id":"20-3","narr":{"4":"Сохраняем имя оригинала","13":"greet, а не wrapper","17":"Напечатается только при первом вызове для n","21":"Результат из кэша — «считаю» не печатается","22":"pow(2, x) с зафиксированным первым аргументом"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[1],"h":[0],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":5,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":5,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":7,"e":"l","f":[1,3],"h":[0,1,2],"o":0},{"l":7,"e":"r","f":[1,3],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"noisy"},{"l":10,"e":"l","f":[1],"h":[0],"o":0},{"l":13,"e":"l","f":[4],"h":[0,1,2],"o":0},{"l":15,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":16,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":15,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":16,"e":"l","f":[4],"h":[0,1,2],"o":6},{"l":20,"e":"l","f":[5],"h":[0,1,2,3],"o":6},{"l":17,"e":"l","f":[5,6],"h":[0,1,2,3],"o":6},{"l":18,"e":"l","f": 28, currsize=1)","CacheInfo(hits=0, misses=2, maxsize=128, currsize=2)","2","Ошибка"],"answer":0,"why":"Первый вызов — промах (вычисление), второй с тем же аргументом — попадание в кэш.","code":"from functools import lru_cache\n@lru_cache(maxsize=128)\ndef sq(n):\n    return n * n\nsq(3); sq(3)\nprint(sq.cache_info())"},{"q":"Что напечатает код?","options":["8","6","9","Ошибка"],"answer":0,"why":"`partial(pow, 2)` фиксирует первый аргумент: pow(2, 3) = 8.","code":"from functools import partial\nprint(partial(pow, 2)(3))"}]}],"zone":19,"world":{"name":"Упаковочный цех","hue":320,"kind":"workshop","intro":"Функции едут по ленте в коробках: их можно передавать, класть в обёртки и штамповать знаком `@`.","why":"Декораторы добавляют поведение (логи, кэш, проверки) без изменения кода самой функции.","spots":{"функция как объект":["функция как объект","Функция в коробке едет по ленте: её можно передать, сохранить, вернуть."],"функция высшего порядка":["высший порядок","Станок, который принимает функции-коробки и возвращает новые."],"decorator":[null,"Обёрточная машина: берёт функцию и выдаёт обёртку с добавленным поведением."],"@decorator":[null,"Штамп `@`: `@deco` над `def f` значит `f = deco(f)`."],"functools":[null,"Полка инструментов: `wraps`, `lru_cache`, `partial`."]}}},{"title":"Типизация","items":["type hints","TypeVar","Generic","Union","Optional","Literal","Protocol","TypedDict","dataclass"],"intro":"Подсказки типов не меняют выполнение программы, но помогают редактору и инструментам (mypy, pyright) находить ошибки ещё до запуска.","lessons":[{"title":"Type hints","covers":["type hints"],"text":"Аннотации `name: str`, `-> int` — это **подсказки**, а не проверки. Python их сохраняет (в `__annotations__`), но при выполнении не проверяет: передашь число вместо строки — Python не остановит. Ловят такие ошибки редактор и проверяльщики типов.\n\nЗачем тогда? Код становится самодокументируемым, а автодополнение — умным.","code":"def greet(name: str, times: int = 1) -> str:\n    return \", \".join([f\"Привет, {name}\"] * times)\n\nscores: list[int] = [5, 4, 5]\nprint(greet(\"Аня\", 2))\nprint(greet.__annotations__)\nprint(greet(42))","key":["Аннотации не проверяются при выполнении.","`x: int`, `def f(a: str) -> bool`.","Проверяют их mypy, pyright и редактор."],"id":"21-1","narr":{"1":"Подсказки: ожидается str и int, вернётся str","4":"Аннотация переменной","6":"Подсказки хранятся, но не проверяются","7":"Python не мешает — ошибку найдёт только mypy/редактор"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[2],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3],"h":[0,1],"o":0},{"l":2,"e":"r","f":[2,3],"h":[0,1],"o":0,"rv":["p","'Привет, Аня, Привет, Аня'"],"fn":"greet"},{"l":6,"e":"l","f":[2],"h":[0,1],"o":25},{"l":7,"e":"l","f":[2],"h":[0,1],"o":98},{"l":2,"e":"l","f":[2,4],"h":[0,1],"o":98},{"l":2,"e":"r","f":[2,4],"h":[0,1],"o":98,"rv":["p","'Привет, 42'"],"fn":"greet"},{"l":0,"e":"d","f":[2],"h":[0,1],"o":109}],"objs":[{"n":1,"k":"func","t":"function","name":"greet","sig":"(name: str, times: int = 1) -> str"},{"n":2,"k":"list","t":"list","items":[["p","5"],["p","4"],["p","5"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["greet",["r",1]]]},{"name":"глобальная область","vars":[["greet",["r",1]],["scores",["r",2]]]},{"name":"greet()","vars":[["name",["p","'Аня'"]],["times",["p","2"]]]},{"name":"greet()","vars":[["name",["p","42"]],["times",["p","1"]]]}],"out":"Привет, Аня, Привет, Аня\n{'name': <class 'str'>, 'times': <class 'int'>, 'return': <class 'str'>}\nПривет, 42\n","error":null,"truncated":false},"deep":"Аннотации — **метаданные**, которые Python сохраняет, но не проверяет. Их читают внешние инструменты: mypy и pyright (проверка до запуска), редакторы (автодополнение), библиотеки вроде pydantic (проверка данных во время работы).\n\nPython остаётся **динамически** типизированным: тип проверяется при выполнении операции. Подсказки добавляют **постепенную** типизацию (gradual typing): аннотировать можно не всё сразу, а неаннотированный код считается типом `Any`.\n\nСовременный синтаксис: `list[int]`, `dict[str, int]`, `int | None` (Python 3.10+) вместо `List`, `Dict`, `Optional` из `typing`.","pitfalls":["Ждать, что аннотация `x: int` запретит присвоить строку во время работы программы.","Аннотировать изменяемый default (`x: list = []`) — проблема общего списка никуда не девается."],"links":["21-2","21-3"],"checks":[{"q":"Что напечатает код?","options":["hihi","TypeError","4","Ошибка mypy"],"answer":0,"why":"Аннотация `int` не проверяется при выполнении: строка умножается на 2 и получается 'hihi'. Ошибку покажет только mypy.","code":"def double(x: int) -> int:\n    return x * 2\nprint(double('hi'))"},{"q":"Кто проверяет type hints?","options":["Интерпретатор при каждом вызове","Внешние инструменты: mypy, pyright, редактор","Никто, они только для красоты","Компилятор C"],"answer":1,"why":"Сам Python аннотации только хранит."}]},{"title":"Union, Optional, Literal","covers":["Union","Optional","Literal"],"text":"`Union[int, str]` или `int | str` — «одно из». `Optional[str]` = `str | None` — «строка или ничего». `Literal[\"r\", \"w\"]` — «только одно из этих конкретных значений».\n\nТакие подсказки заставляют помнить о краевых случаях: если функция возвращает `Optional`, проверяльщик напомнит проверить на `None`.","code":"from typing import Optional, Literal\n\ndef find_user(uid: int) -> Optional[str]:\n    users = {1: \"Аня\", 2: \"Боря\"}\n    return users.get(uid)\n\ndef to_text(value: int | str) -> str:\n    return value if isinstance(value, str) else str(value)\n\nMode = Literal[\"light\", \"dark\"]\n\ndef set_theme(mode: Mode) -> str:\n    return \"тема: \" + mode\n\nname = find_user(3)\nif name is None:\n    print(\"не найден\")\nprint(to_text(5), to_text(\"пять\"), set_theme(\"dark\"))","key":["`A | B` = `Union[A, B]`.","`Optional[X]` = `X | None`.","`Literal[...]` — фиксированный набор значений."],"id":"21-2","narr":{"3":"Может вернуть None","7":"Union: int или str","12":"Только \"light\" или \"dark\"","16":"Optional напоминает про эту проверку"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[2],"h":[0,1],"o":0},{"l":12,"e":"l","f":[2],"h":[0,1],"o":0},{"l":15,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":4,"e":"l","f":[3,4],"h":[0,1,2],"o":0},{"l":5,"e":"l","f":[3,5],"h":[0,1,2,3],"o":0},{"l":5,"e":"r","f":[3,5],"h":[0,1,2,3],"o":0,"rv":["p","None"],"fn":"find_user"},{"l":16,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":17,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":18,"e":"l","f":[6],"h":[0,1,2],"o":10},{"l":8,"e":"l","f":[6,7],"h":[0,1,2],"o":10},{"l":8,"e":"r","f":[6,7],"h":[0,1,2],"o":10,"rv":["p","'5'"],"fn":"to_text"},{"l":8,"e":"l","f":[6,8],"h":[0,1,2],"o":10},{"l":8,"e":"r","f":[6,8],"h":[0,1,2],"o":10,"rv":["p","'пять'"],"fn":"to_text"},{"l":13,"e":"l","f":[6,9],"h":[0,1,2],"o":10},{"l":13,"e":"r","f":[6,9],"h":[0,1,2],"o":10,"rv":["p","'тема: dark'"],"fn":"set_theme"},{"l":0,"e":"d","f":[6],"h":[0,1,2],"o":28}],"objs":[{"n":1,"k":"func","t":"function","name":"find_user","sig":"(uid: int) -> Optional[str]"},{"n":2,"k":"func","t":"function","name":"to_text","sig":"(value: int | str) -> str"},{"n":3,"k":"func","t":"function","name":"set_theme","sig":"(mode: Literal['light', 'dark']) -> str"},{"n":4,"k":"dict","t":"dict","pairs":[[["p","1"],["p","'Аня'"]],[["p","2"],["p","'Боря'"]]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["find_user",["r",1]]]},{"name":"глобальная область","vars":[["find_user",["r",1]],["to_text",["r",2]]]},{"name":"глобальная область","vars":[["find_user",["r",1]],["to_text",["r",2]],["set_theme",["r",3]]]},{"name":"find_user()","vars":[["uid",["p","3"]]]},{"name":"find_user()","vars":[["uid",["p","3"]],["users",["r",4]]]},{"name":"глобальная область","vars":[["find_user",["r",1]],["to_text",["r",2]],["set_theme",["r",3]],["name",["p","None"]]]},{"name":"to_text()","vars":[["value",["p","5"]]]},{"name":"to_text()","vars":[["value",["p","'пять'"]]]},{"name":"set_theme()","vars":[["mode",["p","'dark'"]]]}],"out":"не найден\n5 пять тема: dark\n","error":null,"truncated":false},"deep":"`Optional[X]` — это ровно `X | None`, а не «необязательный параметр». Необязательным параметр делает значение по умолчанию. Проверяльщик типов выполняет **сужение типа** (narrowing): после `if x is None: return` он знает, что дальше `x` уже не `None`.\n\n```\ndef greet(name: str | None) -> str:\n    if name is None:\n        return \"Привет, гость\"\n    return \"Привет, \" + name   # здесь name: str\n```\n\n`Literal[\"r\", \"w\"]` разрешает только перечисленные значения — удобная замена «магическим строкам». Для набора связанных констант часто лучше `enum.Enum`.","pitfalls":["Путать `Optional` с «можно не передавать».","Обращаться к атрибутам `X | None` без проверки на None — mypy предупредит, а в рантайме будет `AttributeError`."],"links":["21-1","2-2"],"checks":[{"q":"Что означает `Optional[str]`?","options":["Параметр можно не передавать","Значение — строка или None","Строка любой длины","Необязательный импорт"],"answer":1,"why":"Optional[X] — это просто X | None."},{"q":"Что напечатает код?","options":["Привет, гость","Привет, None","Ошибка","None"],"answer":0,"why":"Проверка на None обрабатывает отсутствие значения.","code":"def greet(name: str | None) -> str:\n    if name is None:\n        return 'Привет, гость'\n    return 'Привет, ' + name\nprint(greet(None))"}]},{"title":"TypeVar и Generic","covers":["TypeVar","Generic"],"text":"`TypeVar` — «переменная для типа». `def first(items: list[T]) -> T` говорит: «какого типа элементы — того типа и результат». Передал `list[int]` — получишь `int`.\n\n`Generic[T]` позволяет сделать **обобщённый класс**: `Box[int]`, `Box[str]` — одна реализация, разные типы содержимого. В Python 3.12+ можно писать короче: `class Box[T]:`.","code":"from typing import TypeVar, Generic\n\nT = TypeVar(\"T\")\n\ndef first(items: list[T]) -> T:\n    return items[0]\n\nclass Box(Generic[T]):\n    def __init__(self, item: T):\n        self.item = item\n    def get(self) -> T:\n        return self.item\n\nprint(first([3, 1, 2]), first([\"a\", \"b\"]))\nint_box: Box[int] = Box(42)\nstr_box: Box[str] = Box(\"текст\")\nprint(int_box.get(), str_box.get())","key":["`TypeVar` связывает типы входа и выхода.","`Generic[T]` — обобщённый класс.","Это всё подсказки — на выполнение не влияют."],"id":"21-3","narr":{"3":"Переменная типа","5":"Тип результата = тип элементов","8":"Обобщённый класс"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":8,"e":"l","f":[2],"h":[0,1],"o":0},{"l":8,"e":"l","f":[2,3],"h":[0,1],"o":0},{"l":9,"e":"l","f":[2,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[2,5],"h":[0,1,2],"o":0},{"l":11,"e":"r","f":[2,6],"h":[0,1,2,3],"o":0,"rv":["p","None"],"fn":"Box"},{"l":14,"e":"l","f":[7],"h":[0,1,4],"o":0},{"l":6,"e":"l","f":[7,8],"h":[0,1,4,5],"o":0},{"l":6,"e":"r","f":[7,8],"h":[0,1,4,5],"o":0,"rv":["p","3"],"fn":"first"},{"l":6,"e":"l","f":[7,8],"h":[0,1,4,6],"o":0},{"l":6,"e":"r","f":[7,8],"h":[0,1,4,6],"o":0,"rv":["p","'a'"],"fn":"first"},{"l":15,"e":"l","f":[7],"h":[0,1,4],"o":4},{"l":10,"e":"l","f":[7,9],"h":[0,1,4,7],"o":4},{"l":10,"e":"r","f":[7,9],"h":[0,1,4,8],"o":4,"rv":["p","None"],"fn":"__init__"},{"l":16,"e":"l","f":[10],"h":[0,1,4,8],"o":4},{"l":10,"e":"l","f":[10,11],"h":[0,1,4,8,9],"o":4},{"l":10,"e":"r","f":[10,11],"h":[0,1,4,8,10],"o":4,"rv":["p","None"],"fn":"__init__"},{"l":17,"e":"l","f":[12],"h":[0,1,4,8,10],"o":4},{"l":12,"e":"l","f":[12,13],"h":[0,1,4,8,10],"o":4},{"l":12,"e":"r","f":[12,13],"h":[0,1,4,8,10],"o":4,"rv":["p","42"],"fn":"get"},{"l":12,"e":"l","f":[12,14],"h":[0,1,4,8,10],"o":4},{"l":12,"e":"r","f":[12,14],"h":[0,1,4,8,10],"o":4,"rv":["p","'текст'"],"fn":"get"},{"l":0,"e":"d","f":[12],"h":[0,1,4,8,10],"o":13}],"objs":[{"n":1,"k":"other","t":"TypeVar","r":"~T"},{"n":2,"k":"func","t":"function","name":"first","sig":"(items: list[~T]) -> ~T"},{"n":3,"k":"func","t":"function","name":"Box.__init__","sig":"(self, item: ~T)"},{"n":4,"k":"func","t":"function","name":"Box.get","sig":"(self) -> ~T"},{"n":5,"k":"class","t":"class","name":"Box","bases":["Generic"],"attrs":{"__init__":["p","метод"],"get":["p","метод"]}},{"n":6,"k":"list","t":"list","items":[["p","3"],["p","1"],["p","2"]],"more":0},{"n":6,"k":"list","t":"list","items":[["p","'a'"],["p","'b'"]],"more":0},{"n":7,"k":"obj","t":"Box","attrs":{}},{"n":7,"k":"obj","t":"Box","attrs":{"item":["p","42"]}},{"n":8,"k":"obj","t":"Box","attrs":{}},{"n":8,"k":"obj","t":"Box","attrs":{"item":["p","'текст'"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["T",["r",1]]]},{"name":"глобальная область","vars":[["T",["r",1]],["first",["r",2]]]},{"name":"Box()","vars":[]},{"name":"тело класса Box","vars":[]},{"name":"тело класса Box","vars":[["__init__",["r",3]]]},{"name":"тело класса Box","vars":[["__init__",["r",3]],["get",["r",4]]]},{"name":"глобальная область","vars":[["T",["r",1]],["first",["r",2]],["Box",["r",5]]]},{"name":"first()","vars":[["items",["r",6]]]},{"name":"__init__()","vars":[["self",["r",7]],["item",["p","42"]]]},{"name":"глобальная область","vars":[["T",["r",1]],["first",["r",2]],["Box",["r",5]],["int_box",["r",7]]]},{"name":"__init__()","vars":[["self",["r",8]],["item",["p","'текст'"]]]},{"name":"глобальная область","vars":[["T",["r",1]],["first",["r",2]],["Box",["r",5]],["int_box",["r",7]],["str_box",["r",8]]]},{"name":"get()","vars":[["self",["r",7]]]},{"name":"get()","vars":[["self",["r",8]]]}],"out":"3 a\n42 текст\n","error":null,"truncated":false},"deep":"`TypeVar` связывает типы внутри одной сигнатуры: `def first(items: list[T]) -> T` говорит проверяльщику «что пришло внутри списка, то и вернётся». Можно ограничить: `T = TypeVar(\"T\", bound=Comparable)` или перечислить допустимые типы.\n\nС Python 3.12 есть новый синтаксис (PEP 695):\n```\ndef first[T](items: list[T]) -> T:\n    return items[0]\nclass Box[T]:\n    def __init__(self, item: T): self.item = item\n```\n\nОбобщённые классы (`Box[int]`) во время работы — те же классы; параметр типа важен только для статической проверки.","pitfalls":["Использовать `Any` там, где нужен TypeVar, — теряется связь между входом и выходом.","Ожидать, что `Box[int]` проверит тип содержимого при выполнении."],"links":["21-1","21-4"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","int"],"answer":0,"why":"Параметр типа не создаёт новый класс во время выполнения: объект — обычный экземпляр Box.","code":"from typing import Generic, TypeVar\nT = TypeVar('T')\nclass Box(Generic[T]):\n    def __init__(self, item: T):\n        self.item = item\nprint(type(Box[int](5)) is Box)"},{"q":"Что выражает сигнатура `def first(items: list[T]) -> T`?","options":["Функция возвращает список","Результат того же типа, что и элементы списка","T — обязательно int","Функция принимает любой тип и возвращает Any"],"answer":1,"why":"TypeVar связывает тип элементов с типом результата."}]},{"title":"TypedDict, Protocol и dataclass в типизации","covers":["TypedDict","Protocol","dataclass"],"text":"`TypedDict` описывает **форму словаря**: какие ключи и какого типа значения. Во время выполнения это обычный `dict`. `Protocol` — описание интерфейса по структуре (подробно в разделах 9–10). `@dataclass` — класс с типизированными полями, для которого Python генерирует методы (подробно в разделе 22).\n\nВместе они дают три способа описать «данные определённой формы».","code":"from typing import TypedDict, Protocol\nfrom dataclasses import dataclass\n\nclass MovieDict(TypedDict):\n    title: str\n    year: int\n\nclass HasTitle(Protocol):\n    title: str\n\n@dataclass\nclass Movie:\n    title: str\n    year: int\n\nm1: MovieDict = {\"title\": \"Матрица\", \"year\": 1999}\nm2 = Movie(\"Интерстеллар\", 2014)\nprint(type(m1).__name__, m1[\"title\"])\nprint(m2)\n\ndef show(x: HasTitle) -> str:\n    return x.title\n\nprint(show(m2))","key":["TypedDict — типизированная форма словаря.","Protocol — интерфейс по структуре.","dataclass — класс для данных с типами полей."],"id":"21-4","narr":{"4":"Форма словаря","8":"Интерфейс: «есть title»","12":"Класс-данные","18":"TypedDict — это просто dict"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0,1],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[0],"o":0},{"l":6,"e":"l","f":[0,2],"h":[1],"o":0},{"l":6,"e":"r","f":[0,2],"h":[2],"o":0,"rv":["p","None"],"fn":"MovieDict"},{"l":8,"e":"l","f":[3],"h":[3],"o":0},{"l":8,"e":"l","f":[3,4],"h":[3],"o":0},{"l":9,"e":"l","f":[3,5],"h":[3,4],"o":0},{"l":9,"e":"r","f":[3,5],"h":[3,5],"o":0,"rv":["p","None"],"fn":"HasTitle"},{"l":11,"e":"l","f":[6],"h":[3,6],"o":0},{"l":12,"e":"l","f":[6],"h":[3,6],"o":0},{"l":11,"e":"l","f":[6,7],"h":[3,6],"o":0},{"l":13,"e":"l","f":[6,8],"h":[3,6,7],"o":0},{"l":14,"e":"l","f":[6,8],"h":[3,6,8],"o":0},{"l":14,"e":"r","f":[6,8],"h":[3,6,9],"o":0,"rv":["p","None"],"fn":"Movie"},{"l":11,"e":"l","f":[6],"h":[3,6],"o":0},{"l":12,"e":"l","f":[6],"h":[3,6],"o":0},{"l":16,"e":"l","f":[9],"h":[3,6,10],"o":0},{"l":17,"e":"l","f":[10],"h":[3,6,10,11],"o":0},{"l":18,"e":"l","f":[11],"h":[3,6,10,11,12],"o":0},{"l":19,"e":"l","f":[11],"h":[3,6,10,11,12],"o":13},{"l":21,"e":"l","f":[11],"h":[3,6,10,11,12],"o":52},{"l":24,"e":"l","f":[12],"h":[3,6,10,11,12,13],"o":52},{"l":22,"e":"l","f":[12,13],"h":[3,6,10,11,12,13],"o":52},{"l":22,"e":"r","f":[12,13],"h":[3,6,10,11,12,13],"o":52,"rv":["p","'Интерстеллар'"],"fn":"show"},{"l":0,"e":"d","f":[12],"h":[3,6,10,11,12,13],"o":65}],"objs":[{"n":1,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]],[["p","'year'"],["p","<класс int>"]]],"more":0},{"n":2,"k":"class","t":"class","name":"MovieDict","bases":["dict"],"attrs":{},"meta":"_TypedDictMeta"},{"n":3,"k":"dict","t":"dict","pairs":[],"more":0},{"n":3,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]]],"more":0},{"n":4,"k":"class","t":"class","name":"HasTitle","bases":["Protocol"],"attrs":{"_is_protocol":["p","True"],"__init__":["p","метод"]},"meta":"_ProtocolMeta"},{"n":5,"k":"dict","t":"dict","pairs":[],"more":0},{"n":5,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]]],"more":0},{"n":5,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]],[["p","'year'"],["p","<класс int>"]]],"more":0},{"n":6,"k":"class","t":"class","name":"Movie","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":7,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","'Матрица'"]],[["p","'year'"],["p","1999"]]],"more":0},{"n":8,"k":"obj","t":"Movie","attrs":{"title":["p","'Интерстеллар'"],"year":["p","2014"]}},{"n":9,"k":"func","t":"function","name":"show","sig":"(x: __main__.HasTitle) -> str"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"MovieDict()","vars":[]},{"name":"тело класса MovieDict","vars":[["__annotations__",["r",1]]]},{"name":"глобальная область","vars":[["MovieDict",["r",2]]]},{"name":"HasTitle()","vars":[]},{"name":"тело класса HasTitle","vars":[["__annotations__",["r",3]]]},{"name":"глобальная область","vars":[["MovieDict",["r",2]],["HasTitle",["r",4]]]},{"name":"Movie()","vars":[]},{"name":"тело класса Movie","vars":[["__annotations__",["r",5]]]},{"name":"глобальная область","vars":[["MovieDict",["r",2]],["HasTitle",["r",4]],["Movie",["r",6]]]},{"name":"глобальная область","vars":[["MovieDict",["r",2]],["HasTitle",["r",4]],["Movie",["r",6]],["m1",["r",7]]]},{"name":"глобальная область","vars":[["MovieDict",["r",2]],["HasTitle",["r",4]],["Movie",["r",6]],["m1",["r",7]],["m2",["r",8]]]},{"name":"глобальная область","vars":[["MovieDict",["r",2]],["HasTitle",["r",4]],["Movie",["r",6]],["m1",["r",7]],["m2",["r",8]],["show",["r",9]]]},{"name":"show()","vars":[["x",["r",8]]]}],"out":"dict Матрица\nMovie(title='Интерстеллар', year=2014)\nИнтерстеллар\n","error":null,"truncated":false},"deep":"Три способа описать «данные определённой формы»:\n- **TypedDict** — для словарей, которые приходят из JSON или API: проверяльщик знает ключи и их типы, а в рантайме это обычный `dict`;\n- **Protocol** — для поведения: «объект с такими методами»;\n- **dataclass** — для собственных классов данных: генерирует методы и хранит поля как атрибуты.\n\n`NotRequired`/`Required` в TypedDict отмечают необязательные ключи. Если нужно проверять данные во время работы (например, ответ сервера), используют библиотеки вроде pydantic — они строят валидацию на основе тех же аннотаций.","pitfalls":["Ждать, что TypedDict проверит ключи во время работы.","Использовать TypedDict для внутренней модели, где удобнее dataclass с методами."],"links":["22-1","9-3","21-3"],"checks":[{"q":"Что напечатает код?","options":["dict","Movie","TypedDict","Ошибка"],"answer":0,"why":"TypedDict создаёт обычный словарь, класс нужен только проверяльщику типов.","code":"from typing import TypedDict\nclass Movie(TypedDict):\n    title: str\nm: Movie = {'title': 'Матрица'}\nprint(type(m).__name__)"},{"q":"Что лучше выбрать для данных из JSON-ответа сервера, которые остаются словарями?","options":["Protocol","TypedDict","ABC","Metaclass"],"answer":1,"why":"TypedDict описывает форму словаря."}]}],"zone":20,"world":{"name":"Сортировочная станция","hue":180,"kind":"port","intro":"Посылки с ярлыками типов проходят сортировку: слоты принимают только то, что указано в ярлыке.","why":"Подсказки типов помогают редактору и проверяльщикам ловить ошибки до запуска программы.","spots":{"type hints":["type hints","Ярлыки на посылках: подсказка, что внутри. Сам Python их не проверяет."],"TypeVar":[null,"Бирка «T»: что положили на вход, того же типа получишь на выходе."],"Generic":[null,"Универсальный контейнер `Box[T]`: одна конструкция для любых грузов."],"Union":[null,"Двойной слот: примет int или str."],"Optional":[null,"Слот с пометкой «или пусто»: значение или None."],"Literal":[null,"Слот с фигурными прорезями: только «light» или «dark»."],"Protocol":[null,"Контроль по умениям: пропускает всё, что умеет нужное."],"TypedDict":[null,"Бланк с полями: словарь заданной формы."],"dataclass":[null,"Аккуратная карточка-класс с типизированными полями."]}}},{"title":"Dataclass","items":["@dataclass","fields","default","frozen","автоматическая генерация методов"],"intro":"Как описать класс для данных в пять строк вместо двадцати.","lessons":[{"title":"@dataclass и автогенерация методов","covers":["@dataclass","fields","автоматическая генерация методов"],"text":"Декоратор `@dataclass` читает **поля** (fields) — аннотированные атрибуты класса — и **автоматически генерирует** `__init__`, `__repr__` и `__eq__`. Тебе не нужно писать `self.x = x` для каждого поля.\n\n`dataclasses.fields(obj)` возвращает описание полей, `asdict(obj)` превращает объект в словарь.","code":"from dataclasses import dataclass, fields, asdict\n\n@dataclass\nclass Book:\n    title: str\n    author: str\n    pages: int\n\nb = Book(\"Мастер и Маргарита\", \"Булгаков\", 480)\nprint(b)\nprint(b == Book(\"Мастер и Маргарита\", \"Булгаков\", 480))\nprint([f.name for f in fields(b)])\nprint(asdict(b))","key":["`@dataclass` генерирует `__init__`, `__repr__`, `__eq__`.","Поля = аннотированные атрибуты класса.","`fields()`, `asdict()` — полезные помощники."],"id":"22-1","narr":{"4":"Поля описываются аннотациями","9":"__init__ сгенерирован","10":"__repr__ сгенерирован","11":"__eq__ сгенерирован"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[0],"o":0},{"l":6,"e":"l","f":[0,2],"h":[1],"o":0},{"l":7,"e":"l","f":[0,2],"h":[2],"o":0},{"l":7,"e":"r","f":[0,2],"h":[3],"o":0,"rv":["p","None"],"fn":"Book"},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":9,"e":"l","f":[3],"h":[4],"o":0},{"l":10,"e":"l","f":[4],"h":[4,5],"o":0},{"l":11,"e":"l","f":[4],"h":[4,5],"o":63},{"l":12,"e":"l","f":[4],"h":[4,5],"o":68},{"l":12,"e":"l","f":[4],"h":[4,5],"o":68},{"l":12,"e":"l","f":[4],"h":[4,5],"o":68},{"l":12,"e":"l","f":[4],"h":[4,5],"o":68},{"l":13,"e":"l","f":[4],"h":[4,5],"o":97},{"l":0,"e":"d","f":[4],"h":[4,5],"o":165}],"objs":[{"n":1,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]],[["p","'author'"],["p","<класс str>"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'title'"],["p","<класс str>"]],[["p","'author'"],["p","<класс str>"]],[["p","'pages'"],["p","<класс int>"]]],"more":0},{"n":2,"k":"class","t":"class","name":"Book","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Book","attrs":{"title":["p","'Мастер и Маргарита'"],"author":["p","'Булгаков'"],"pages":["p","480"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Book()","vars":[]},{"name":"тело класса Book","vars":[["__annotations__",["r",1]]]},{"name":"глобальная область","vars":[["Book",["r",2]]]},{"name":"глобальная область","vars":[["Book",["r",2]],["b",["r",3]]]}],"out":"Book(title='Мастер и Маргарита', author='Булгаков', pages=480)\nTrue\n['title', 'author', 'pages']\n{'title': 'Мастер и Маргарита', 'author': 'Булгаков', 'pages': 480}\n","error":null,"truncated":false},"deep":"`@dataclass` при создании класса читает `__annotations__` в порядке объявления, создаёт объекты `Field` и **генерирует исходный код** методов (`__init__`, `__repr__`, `__eq__`), компилируя их через `exec`. Это обычные методы — их можно посмотреть через `inspect`.\n\nПолезные параметры:\n- `order=True` — добавит `<`, `<=`, `>`, `>=` (сравнение кортежей полей по порядку);\n- `slots=True` (3.10+) — `__slots__` вместо `__dict__`: меньше памяти, нельзя добавить лишний атрибут;\n- `kw_only=True` — все поля только по имени.\n\n`__post_init__` вызывается после сгенерированного `__init__` — там удобно проверять и вычислять поля.","pitfalls":["Атрибут класса без аннотации (`x = 5`) не становится полем dataclass.","Поле без значения по умолчанию после поля со значением — `TypeError`."],"links":["22-2","21-4","11-1"],"checks":[{"q":"Что напечатает код?","options":["['a']","['a', 'b']","['b']","Ошибка"],"answer":0,"why":"Полями становятся только аннотированные атрибуты; `b = 2` без аннотации — обычный атрибут класса.","code":"from dataclasses import dataclass, fields\n@dataclass\nclass P:\n    a: int\n    b = 2\nprint([f.name for f in fields(P)])"},{"q":"Что напечатает код?","options":["True","False","Ошибка","None"],"answer":0,"why":"`order=True` генерирует сравнения, которые сравнивают поля по порядку как кортежи.","code":"from dataclasses import dataclass\n@dataclass(order=True)\nclass V:\n    major: int\n    minor: int\nprint(V(1, 2) < V(1, 10))"}]},{"title":"default и frozen","covers":["default","frozen"],"text":"У поля можно задать **значение по умолчанию**: `qty: int = 1`. Для изменяемых значений (списков, словарей) нужно `field(default_factory=list)` — иначе все объекты делили бы один список.\n\n`@dataclass(frozen=True)` делает объект **неизменяемым**: попытка поменять поле вызовет ошибку. Такие объекты можно класть в `set` и делать ключами словаря.","code":"from dataclasses import dataclass, field, FrozenInstanceError\n\n@dataclass\nclass Order:\n    item: str\n    qty: int = 1\n    tags: list = field(default_factory=list)\n\n@dataclass(frozen=True)\nclass Point:\n    x: int\n    y: int\n\na = Order(\"чай\")\nb = Order(\"кофе\", 2)\na.tags.append(\"срочно\")\nprint(a, b)\np = Point(1, 2)\ntry:\n    p.x = 10\nexcept FrozenInstanceError:\n    print(\"Point заморожен!\")\nprint({p, Point(1, 2)})","key":["`поле: тип = значение` — значение по умолчанию.","Для списков — `field(default_factory=list)`.","`frozen=True` — неизменяемый и хешируемый объект."],"id":"22-2","narr":{"6":"Значение по умолчанию","7":"Для каждого заказа — свой новый список","16":"Меняется только список заказа a","23":"Равные замороженные точки — один элемент множества"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[0],"o":0},{"l":6,"e":"l","f":[0,2],"h":[1],"o":0},{"l":7,"e":"l","f":[0,3],"h":[2],"o":0},{"l":7,"e":"r","f":[0,4],"h":[3,4],"o":0,"rv":["p","None"],"fn":"Order"},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[0],"h":[],"o":0},{"l":9,"e":"l","f":[5],"h":[5],"o":0},{"l":10,"e":"l","f":[5],"h":[5],"o":0},{"l":9,"e":"l","f":[5,6],"h":[5],"o":0},{"l":11,"e":"l","f":[5,7],"h":[5,6],"o":0},{"l":12,"e":"l","f":[5,7],"h":[5,7],"o":0},{"l":12,"e":"r","f":[5,7],"h":[5,8],"o":0,"rv":["p","None"],"fn":"Point"},{"l":9,"e":"l","f":[5],"h":[5],"o":0},{"l":10,"e":"l","f":[5],"h":[5],"o":0},{"l":14,"e":"l","f":[8],"h":[5,9],"o":0},{"l":15,"e":"l","f":[9],"h":[5,9,10,11],"o":0},{"l":16,"e":"l","f":[10],"h":[5,9,10,11,12,13],"o":0},{"l":17,"e":"l","f":[10],"h":[5,9,10,14,12,13],"o":0},{"l":18,"e":"l","f":[10],"h":[5,9,10,14,12,13],"o":77},{"l":19,"e":"l","f":[11],"h":[5,9,10,14,12,13,15],"o":77},{"l":20,"e":"l","f":[11],"h":[5,9,10,14,12,13,15],"o":77},{"l":20,"e":"e","f":[11],"h":[5,9,10,14,12,13,15],"o":77,"ex":"FrozenInstanceError: cannot assign to field 'x'"},{"l":21,"e":"l","f":[11],"h":[5,9,10,14,12,13,15],"o":77},{"l":22,"e":"l","f":[11],"h":[5,9,10,14,12,13,15],"o":77},{"l":23,"e":"l","f":[11],"h":[5,9,10,14,12,13,15],"o":94},{"l":0,"e":"d","f":[11],"h":[5,9,10,14,12,13,15],"o":112}],"objs":[{"n":1,"k":"dict","t":"dict","pairs":[],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'item'"],["p","<класс str>"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'item'"],["p","<класс str>"]],[["p","'qty'"],["p","<класс int>"]]],"more":0},{"n":1,"k":"dict","t":"dict","pairs":[[["p","'item'"],["p","<класс str>"]],[["p","'qty'"],["p","<класс int>"]],[["p","'tags'"],["p","<класс list>"]]],"more":0},{"n":2,"k":"other","t":"Field","r":"Field(name=None,type=None,default=<dataclasses._MISSING_TYPE object>,…"},{"n":3,"k":"class","t":"class","name":"Order","bases":[],"attrs":{"qty":["p","1"],"__init__":["p","метод"]}},{"n":4,"k":"dict","t":"dict","pairs":[],"more":0},{"n":4,"k":"dict","t":"dict","pairs":[[["p","'x'"],["p","<класс int>"]]],"more":0},{"n":4,"k":"dict","t":"dict","pairs":[[["p","'x'"],["p","<класс int>"]],[["p","'y'"],["p","<класс int>"]]],"more":0},{"n":5,"k":"class","t":"class","name":"Point","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":6,"k":"obj","t":"Order","attrs":{"item":["p","'чай'"],"qty":["p","1"],"tags":["r",7]}},{"n":7,"k":"list","t":"list","items":[],"more":0},{"n":8,"k":"obj","t":"Order","attrs":{"item":["p","'кофе'"],"qty":["p","2"],"tags":["r",9]}},{"n":9,"k":"list","t":"list","items":[],"more":0},{"n":7,"k":"list","t":"list","items":[["p","'срочно'"]],"more":0},{"n":10,"k":"obj","t":"Point","attrs":{"x":["p","1"],"y":["p","2"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Order()","vars":[]},{"name":"тело класса Order","vars":[["__annotations__",["r",1]]]},{"name":"тело класса Order","vars":[["__annotations__",["r",1]],["qty",["p","1"]]]},{"name":"тело класса Order","vars":[["__annotations__",["r",1]],["qty",["p","1"]],["tags",["r",2]]]},{"name":"глобальная область","vars":[["Order",["r",3]]]},{"name":"Point()","vars":[]},{"name":"тело класса Point","vars":[["__annotations__",["r",4]]]},{"name":"глобальная область","vars":[["Order",["r",3]],["Point",["r",5]]]},{"name":"глобальная область","vars":[["Order",["r",3]],["Point",["r",5]],["a",["r",6]]]},{"name":"глобальная область","vars":[["Order",["r",3]],["Point",["r",5]],["a",["r",6]],["b",["r",8]]]},{"name":"глобальная область","vars":[["Order",["r",3]],["Point",["r",5]],["a",["r",6]],["b",["r",8]],["p",["r",10]]]}],"out":"Order(item='чай', qty=1, tags=['срочно']) Order(item='кофе', qty=2, tags=[])\nPoint заморожен!\n{Point(x=1, y=2)}\n","error":null,"truncated":false},"deep":"`field(default_factory=list)` вызывает фабрику **при каждом создании объекта**, поэтому у каждого свой список. Обычный изменяемый default dataclass вообще запрещает (`ValueError: mutable default`).\n\n`frozen=True` подменяет `__setattr__` и `__delattr__`, чтобы они бросали `FrozenInstanceError`, и генерирует `__hash__` на основе полей. «Изменить» замороженный объект можно, создав копию: `dataclasses.replace(p, x=10)`.\n\nЗаморозка поверхностная: если поле — список, его содержимое менять можно.","pitfalls":["Писать `tags: list = []` — dataclass бросит `ValueError`.","Ждать глубокой неизменяемости от `frozen=True` при списках внутри."],"links":["22-1","23-4","11-6"],"checks":[{"q":"Что напечатает код?","options":["Point(x=1, y=2) Point(x=10, y=2)","Point(x=10, y=2) Point(x=10, y=2)","Ошибка","Point(x=1, y=2) Point(x=1, y=2)"],"answer":0,"why":"`replace` создаёт новый объект с изменённым полем, исходный остаётся прежним.","code":"from dataclasses import dataclass, replace\n@dataclass(frozen=True)\nclass Point:\n    x: int\n    y: int\np = Point(1, 2)\nprint(p, replace(p, x=10))"},{"q":"Что напечатает код?","options":["ValueError","ok","TypeError","None"],"answer":0,"why":"dataclass запрещает изменяемые значения по умолчанию — нужен default_factory.","code":"from dataclasses import dataclass\ntry:\n    @dataclass\n    class Order:\n        tags: list = []\n    print('ok')\nexcept ValueError:\n    print('ValueError')"}]}],"zone":21,"world":{"name":"Канцелярия","hue":58,"kind":"village","intro":"Машина `@dataclass` по описанию полей сама печатает готовые методы и выдаёт аккуратные карточки.","why":"dataclass избавляет от однообразного кода для классов-данных.","spots":{"@dataclass":[null,"Штамп-машина: по аннотациям полей собирает класс-карточку."],"fields":[null,"Строки бланка: каждое аннотированное поле — графа в карточке."],"default":[null,"Графа, заполненная заранее: значение по умолчанию."],"frozen":[null,"Ламинированная карточка: поля нельзя изменить."],"автоматическая генерация методов":["автогенерация методов","Принтер печатает `__init__`, `__repr__` и `__eq__` за тебя."]}}},{"title":"Память и выполнение","items":["stack","heap","reference","garbage collector","reference counting","mutability","object lifecycle"],"intro":"Что происходит «под капотом»: где живут переменные и объекты, как Python решает, что объект больше не нужен. Визуализатор в каждом уроке и есть модель памяти: слева стек, справа куча.","lessons":[{"title":"Stack и heap","covers":["stack","heap"],"text":"**Стек вызовов** (stack) — стопка кадров: каждый вызов функции кладёт кадр со своими локальными именами, `return` снимает его. В визуализаторе это левая колонка «Имена».\n\n**Куча** (heap) — область, где живут сами объекты: списки, словари, экземпляры, функции. Кадры хранят только **ссылки** на объекты в куче. Поэтому объект может пережить функцию, которая его создала, — если ссылку на него вернули.","code":"def make_list(n):\n    data = list(range(n))\n    return data\n\ndef outer():\n    inner_result = make_list(3)\n    return len(inner_result)\n\nresult = outer()\nsaved = make_list(2)\nprint(result, saved)","key":["Стек — кадры вызовов с именами.","Куча — сами объекты.","Объект живёт, пока на него есть ссылки, а не пока жив кадр."],"id":"23-1","narr":{"2":"Список создаётся в куче, data — ссылка в кадре","3":"Кадр исчезнет, а список останется: на него будет ссылка снаружи","6":"Стек: глобальная → outer → make_list"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":9,"e":"l","f":[2],"h":[0,1],"o":0},{"l":6,"e":"l","f":[2,3],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3,4],"h":[0,1],"o":0},{"l":3,"e":"l","f":[2,3,5],"h":[0,1,2],"o":0},{"l":3,"e":"r","f":[2,3,5],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"make_list"},{"l":7,"e":"l","f":[2,6],"h":[0,1,2],"o":0},{"l":7,"e":"r","f":[2,6],"h":[0,1,2],"o":0,"rv":["p","3"],"fn":"outer"},{"l":10,"e":"l","f":[7],"h":[0,1],"o":0},{"l":2,"e":"l","f":[7,8],"h":[0,1],"o":0},{"l":3,"e":"l","f":[7,9],"h":[0,1,3],"o":0},{"l":3,"e":"r","f":[7,9],"h":[0,1,3],"o":0,"rv":["r",4],"fn":"make_list"},{"l":11,"e":"l","f":[10],"h":[0,1,3],"o":0},{"l":0,"e":"d","f":[10],"h":[0,1,3],"o":9}],"objs":[{"n":1,"k":"func","t":"function","name":"make_list","sig":"(n)"},{"n":2,"k":"func","t":"function","name":"outer","sig":"()"},{"n":3,"k":"list","t":"list","items":[["p","0"],["p","1"],["p","2"]],"more":0},{"n":4,"k":"list","t":"list","items":[["p","0"],["p","1"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["make_list",["r",1]]]},{"name":"глобальная область","vars":[["make_list",["r",1]],["outer",["r",2]]]},{"name":"outer()","vars":[]},{"name":"make_list()","vars":[["n",["p","3"]]]},{"name":"make_list()","vars":[["n",["p","3"]],["data",["r",3]]]},{"name":"outer()","vars":[["inner_result",["r",3]]]},{"name":"глобальная область","vars":[["make_list",["r",1]],["outer",["r",2]],["result",["p","3"]]]},{"name":"make_list()","vars":[["n",["p","2"]]]},{"name":"make_list()","vars":[["n",["p","2"]],["data",["r",4]]]},{"name":"глобальная область","vars":[["make_list",["r",1]],["outer",["r",2]],["result",["p","3"]],["saved",["r",4]]]}],"out":"3 [0, 1]\n","error":null,"truncated":false},"deep":"В CPython есть два стека: **стек вызовов Python** (цепочка объектов-кадров, каждый ссылается на предыдущий через `f_back`) и стек C внутри интерпретатора. В Python 3.11+ кадры хранятся в компактном внутреннем массиве и превращаются в полноценные объекты, только когда их запрашивают (например, для traceback).\n\nВсе объекты живут в **куче**. Для мелких объектов CPython использует свой распределитель `pymalloc`: память берётся крупными блоками («аренами») и нарезается на одинаковые ячейки — это быстрее, чем просить ОС о каждом объекте.\n\n```\nimport sys\ndef depth():\n    f = sys._getframe(); n = 0\n    while f: n += 1; f = f.f_back\n    return n\n```","pitfalls":["Думать, что локальные переменные хранят объекты «в стеке», как в C: в Python они хранят только ссылки.","Глубокая рекурсия — переполнение стека вызовов (`RecursionError`)."],"links":["4-7","23-2","1-6"],"checks":[{"q":"Что напечатает код?","options":["[0, 1, 2]","None","Ошибка: кадр уже уничтожен","[]"],"answer":0,"why":"Кадр функции исчез, но список в куче жив, потому что на него осталась ссылка.","code":"def make():\n    data = [0, 1, 2]\n    return data\nkept = make()\nprint(kept)"},{"q":"Что хранится в кадре функции?","options":["Сами объекты","Ссылки на объекты в куче","Исходный текст функции","Только числа"],"answer":1,"why":"Переменные — это ссылки, объекты живут в куче."}]},{"title":"Reference и reference counting","covers":["reference","reference counting"],"text":"Каждая **ссылка** на объект — имя, элемент списка, атрибут — увеличивает его **счётчик ссылок**. Удалил имя (`del`) или перепривязал его — счётчик уменьшился. Когда счётчик падает до нуля, CPython **сразу** освобождает объект.\n\n`sys.getrefcount(obj)` показывает счётчик (он всегда на 1 больше, ведь сам аргумент функции — тоже ссылка). Следи, как объект исчезает из «кучи» в визуализаторе, когда на него не остаётся ссылок.","code":"import sys\n\ndata = [1, 2, 3]\nprint(sys.getrefcount(data) - 1)\nalias = data\nbox = {\"x\": data}\nprint(sys.getrefcount(data) - 1)\ndel alias\nbox.clear()\nprint(sys.getrefcount(data) - 1)\ndata = None\nprint(\"список удалён из памяти\")","key":["Ссылки: имена, элементы коллекций, атрибуты.","Счётчик = 0 → объект освобождается сразу.","`del x` удаляет имя, а не объект."],"id":"23-2","narr":{"3":"Одна ссылка: имя data","5":"Ещё одна ссылка","6":"И ещё одна — из словаря","8":"Ссылок стало меньше","11":"Последняя ссылка исчезла — список освобождён"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":2},{"l":6,"e":"l","f":[2],"h":[0],"o":2},{"l":7,"e":"l","f":[3],"h":[0,1],"o":2},{"l":8,"e":"l","f":[3],"h":[0,1],"o":4},{"l":9,"e":"l","f":[4],"h":[0,1],"o":4},{"l":10,"e":"l","f":[4],"h":[0,2],"o":4},{"l":11,"e":"l","f":[4],"h":[0,2],"o":6},{"l":12,"e":"l","f":[5],"h":[2],"o":6},{"l":0,"e":"d","f":[5],"h":[2],"o":30}],"objs":[{"n":1,"k":"list","t":"list","items":[["p","1"],["p","2"],["p","3"]],"more":0},{"n":2,"k":"dict","t":"dict","pairs":[[["p","'x'"],["r",1]]],"more":0},{"n":2,"k":"dict","t":"dict","pairs":[],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["data",["r",1]]]},{"name":"глобальная область","vars":[["data",["r",1]],["alias",["r",1]]]},{"name":"глобальная область","vars":[["data",["r",1]],["alias",["r",1]],["box",["r",2]]]},{"name":"глобальная область","vars":[["data",["r",1]],["box",["r",2]]]},{"name":"глобальная область","vars":[["data",["p","None"]],["box",["r",2]]]}],"out":"1\n3\n1\nсписок удалён из памяти\n","error":null,"truncated":false},"deep":"Счётчик ссылок `ob_refcnt` увеличивается при каждой новой ссылке (присваивание, добавление в список, передача аргументом) и уменьшается при её исчезновении. Когда он становится нулём, CPython **сразу** вызывает деаллокатор — поэтому файл, на который не осталось ссылок, закрывается немедленно (в CPython; в PyPy — нет).\n\n`sys.getrefcount(x)` показывает на 1 больше, потому что аргумент функции — временная ссылка. Модуль `weakref` создаёт **слабые ссылки**, которые не увеличивают счётчик — их используют для кэшей, чтобы не удерживать объекты.\n\nС Python 3.12 некоторые объекты (`None`, маленькие числа) стали **бессмертными**: их счётчик не меняется.","pitfalls":["Делать выводы по точному числу из `getrefcount` — оно зависит от реализации.","Полагаться на немедленное закрытие файлов без `with` — в других реализациях Python так не будет."],"links":["23-3","23-1","1-3"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","None"],"answer":0,"why":"Добавление в список создаёт новую ссылку, счётчик растёт.","code":"import sys\nx = object()\nbefore = sys.getrefcount(x)\nbox = [x]\nprint(sys.getrefcount(x) == before + 1)"},{"q":"Что делает `del x`?","options":["Удаляет объект из памяти немедленно","Удаляет имя x; объект удалится, если на него больше нет ссылок","Очищает значение, оставляя имя","Вызывает сборщик мусора"],"answer":1,"why":"`del` убирает ссылку, а не объект."}]},{"title":"Garbage collector и жизненный цикл объекта","covers":["garbage collector","object lifecycle"],"text":"**Жизненный цикл объекта**: создание (`__new__`) → инициализация (`__init__`) → использование → последняя ссылка исчезла → финализация (`__del__`) → освобождение памяти.\n\nСчётчик ссылок не справляется с **циклами**: если A ссылается на B, а B на A, их счётчики никогда не станут нулём. Для этого есть **сборщик мусора** (garbage collector, модуль `gc`): он периодически ищет группы объектов, недоступные из программы, и удаляет их.","code":"import gc\n\nclass Node:\n    def __init__(self, name):\n        self.name = name\n        print(\"создан\", name)\n    def __del__(self):\n        print(\"удалён\", self.name)\n\na = Node(\"A\")\na = None\nb = Node(\"B\")\nc = Node(\"C\")\nb.friend = c\nc.friend = b\nb = c = None\nprint(\"цикл ещё в памяти…\")\ngc.collect()\nprint(\"готово\")","key":["Создание → использование → нет ссылок → удаление.","Reference counting удаляет сразу, но не видит циклы.","`gc` находит и удаляет недоступные циклы."],"id":"23-3","narr":{"7":"Финализатор — вызывается перед уничтожением","11":"Ссылок нет → удаляется сразу (reference counting)","14":"Цикл: B → C → B","16":"Имён нет, но объекты ссылаются друг на друга","18":"Сборщик мусора находит и удаляет цикл"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3," ]}},{"n":6,"k":"obj","t":"Node","attrs":{}},{"n":6,"k":"obj","t":"Node","attrs":{"name":["p","'C'"]}},{"n":5,"k":"obj","t":"Node","attrs":{"name":["p","'B'"],"friend":["r",6]}},{"n":6,"k":"obj","t":"Node","attrs":{"name":["p","'C'"],"friend":["r",5]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Node()","vars":[]},{"name":"тело класса Node","vars":[]},{"name":"тело класса Node","vars":[["__init__",["r",1]]]},{"name":"тело класса Node","vars":[["__init__",["r",1]],["__del__",["r",2]]]},{"name":"глобальная область","vars":[["Node",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]],["name",["p","'A'"]]]},{"name":"глобальная область","vars":[["Node",["r",3]],["a",["r",4]]]},{"name":"глобальная область","vars":[["Node",["r",3]],["a",["p","None"]]]},{"name":"__del__()","vars":[["self",["r",4]]]},{"name":"__init__()","vars":[["self",["r",5]],["name",["p","'B'"]]]},{"name":"глобальная область","vars":[["Node",["r",3]],["a",["p","None"]],["b",["r",5]]]},{"name":"__init__()","vars":[["self",["r",6]],["name",["p","'C'"]]]},{"name":"глобальная область","vars":[["Node",["r",3]],["a",["p","None"]],["b",["r",5]],["c",["r",6]]]},{"name":"глобальная область","vars":[["Node",["r",3]],["a",["p","None"]],["b",["p","None"]],["c",["p","None"]]]},{"name":"__del__()","vars":[["self",["r",5]]]},{"name":"__del__()","vars":[["self",["r",6]]]}],"out":"создан A\nудалён A\nсоздан B\nсоздан C\nцикл ещё в памяти…\nудалён B\nудалён C\nготово\n","error":null,"truncated":false},"deep":"Сборщик мусора в модуле `gc` ищет **циклы**, которые не может удалить счётчик ссылок. Он отслеживает только контейнеры (списки, словари, объекты классов) и делит их на **поколения**: новые объекты проверяются часто, «долгожители» — редко (гипотеза: большинство объектов умирает молодыми).\n\nАлгоритм: для группы объектов вычитаются ссылки изнутри группы; если у объекта не осталось внешних ссылок, он недостижим и удаляется.\n\n`__del__` (финализатор) вызывается перед уничтожением, но момент не гарантирован, а при выходе из программы может не вызваться вовсе. Для освобождения ресурсов используют `with` или `weakref.finalize`.","pitfalls":["Освобождать ресурсы в `__del__` — момент вызова не гарантирован.","Создавать циклы ссылок в горячем коде и удивляться росту памяти между сборками."],"links":["23-2","18-1"],"checks":[{"q":"Что напечатает код?","options":["True","False","Ошибка","None"],"answer":0,"why":"Цикл `a ↔ b` недостижим после удаления имён; `gc.collect()` находит и удаляет его, слабая ссылка становится мёртвой.","code":"import gc, weakref\nclass N: pass\na, b = N(), N()\na.o, b.o = b, a\nr = weakref.ref(a)\ndel a, b\ngc.collect()\nprint(r() is None)"},{"q":"Почему счётчик ссылок не может удалить цикл A ↔ B?","options":["Цикл слишком большой","У каждого объекта цикла остаётся ссылка от другого, счётчик не падает до нуля","Циклы запрещены","Это делает только PyPy"],"answer":1,"why":"Объекты держат друг друга, поэтому нужен отдельный сборщик циклов."}]},{"title":"Mutability — изменяемость","covers":["mutability"],"opts":{"heap_all":true},"text":"**Изменяемые** объекты (list, dict, set, большинство своих классов) можно менять на месте — identity сохраняется. **Неизменяемые** (int, float, str, tuple, frozenset) изменить нельзя: любая «модификация» создаёт **новый объект**.\n\nСмотри на метки: после `nums += [4]` метка списка та же, а после `n += 1` и `s += \"!\"` имена указывают на новые объекты. Отсюда классическая ловушка: изменяемый объект, к которому ведут несколько ссылок.","code":"nums = [1, 2, 3]\nother = nums\nnums += [4]\nn = 10\nm = n\nn += 1\ns = \"hi\"\ns += \"!\"\nprint(other, m, n, s)","key":["Изменяемые меняются на месте, identity не меняется.","Неизменяемые при «изменении» заменяются новым объектом.","Будь осторожен с общими ссылками на изменяемые объекты."],"id":"23-4","narr":{"3":"Список изменён НА МЕСТЕ — метка та же, other видит изменение","6":"int неизменяем: n теперь указывает на НОВЫЙ объект 11, m — на старый 10","8":"Строка тоже неизменяема — новый объект"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0,1,2,3],"o":0},{"l":3,"e":"l","f":[2],"h":[0,1,2,3],"o":0},{"l":4,"e":"l","f":[2],"h":[4,1,2,3,5],"o":0},{"l":5,"e":"l","f":[3],"h":[4,1,2,3,5,6],"o":0},{"l":6,"e":"l","f":[4],"h":[4,1,2,3,5,6],"o":0},{"l":7,"e":"l","f":[5],"h":[4,1,2,3,5,6,7],"o":0},{"l":8,"e":"l","f":[6],"h":[4,1,2,3,5,6,7,8],"o":0},{"l":9,"e":"l","f":[7],"h":[4,1,2,3,5,6,7,9],"o":0},{"l":0,"e":"d","f":[7],"h":[4,1,2,3,5,6,7,9],"o":23}],"objs":[{"n":1,"k":"list","t":"list","items":[["r",2],["r",3],["r",4]],"more":0},{"n":2,"k":"prim","t":"int","v":"1"},{"n":3,"k":"prim","t":"int","v":"2"},{"n":4,"k":"prim","t":"int","v":"3"},{"n":1,"k":"list","t":"list","items":[["r",2],["r",3],["r",4],["r",5]],"more":0},{"n":5,"k":"prim","t":"int","v":"4"},{"n":6,"k":"prim","t":"int","v":"10"},{"n":7,"k":"prim","t":"int","v":"11"},{"n":8,"k":"prim","t":"str","v":"'hi'"},{"n":9,"k":"prim","t":"str","v":"'hi!'"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["nums",["r",1]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["other",["r",1]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["other",["r",1]],["n",["r",6]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["other",["r",1]],["n",["r",6]],["m",["r",6]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["other",["r",1]],["n",["r",7]],["m",["r",6]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["other",["r",1]],["n",["r",7]],["m",["r",6]],["s",["r",8]]]},{"name":"глобальная область","vars":[["nums",["r",1]],["other",["r",1]],["n",["r",7]],["m",["r",6]],["s",["r",9]]]}],"out":"[1, 2, 3, 4] 10 11 hi!\n","error":null,"truncated":false},"deep":"Изменяемость определяет поведение `+=`:\n- для изменяемых (`list`) вызывается `__iadd__` — объект меняется **на месте**, все ссылки видят изменение;\n- для неизменяемых (`int`, `str`, `tuple`) `__iadd__` нет — создаётся **новый объект**, имя перепривязывается.\n\nИзвестная ловушка:\n```\nt = ([1],)\ntry:\n    t[0] += [2]     # список изменился, но присваивание в кортеж упало\nexcept TypeError:\n    pass\nprint(t)            # ([1, 2],)\n```\n\nНеизменяемые объекты можно безопасно делить между частями программы и потоками и использовать как ключи словарей — отсюда популярность `tuple`, `frozenset` и `frozen` dataclass.","pitfalls":["Ждать, что `s += 'x'` изменит строку, на которую ссылаются другие имена.","Делиться изменяемым объектом между частями программы без копии."],"links":["1-3","2-5","22-2"],"checks":[{"q":"Что напечатает код?","options":["([1],)","([1, 2],)","Ошибка без вывода","([2],)"],"answer":1,"why":"`+=` сначала изменил список на месте, а затем упал на присваивании в кортеж — но список уже изменён.","code":"t = ([1],)\ntry:\n    t[0] += [2]\nexcept TypeError:\n    pass\nprint(t)"},{"q":"Что напечатает код?","options":["hi hi!","hi! hi!","hi! hi","Ошибка"],"answer":0,"why":"Строка неизменяема: `+=` создал новую строку для `b`, а `a` осталась прежней.","code":"a = 'hi'\nb = a\nb += '!'\nprint(a, b)"}]}],"zone":22,"world":{"name":"Глубины памяти","hue":252,"kind":"cave","intro":"Под полом программы: башня кадров-стека, куча объектов-кристаллов, канаты ссылок и робот-уборщик.","why":"Модель памяти объясняет баги с общими объектами и помогает писать эффективный код.","spots":{"stack":[null,"Башня тарелок: каждый вызов функции кладёт новый кадр сверху, return снимает его."],"heap":[null,"Пещера с кристаллами: здесь живут сами объекты."],"reference":[null,"Канаты от кадров к кристаллам: в кадрах только ссылки."],"garbage collector":["garbage collector","Робот-уборщик: находит забытые циклы и убирает их."],"reference counting":["reference counting","Счётчик на кристалле: сколько канатов к нему ведёт. Стал 0 — кристалл исчезает."],"mutability":[null,"Глина и камень: глину (list) можно мять на месте, камень (str, int) — только заменить новым."],"object lifecycle":["object lifecycle","Тропа жизни: создание → использование → нет ссылок → уборка."]}}},{"title":"Архитектура кода","items":["separation of concerns","cohesion","coupling","dependency","dependency injection","interface","abstraction layer","modularity"],"intro":"Принципы, которые делают большую программу понятной и легко изменяемой. Код здесь — маленькие модели больших идей.","lessons":[{"title":"Separation of concerns и модульность","covers":["separation of concerns","modularity"],"text":"**Разделение ответственности** (separation of concerns): каждая часть программы занимается **одним делом** — одна читает данные, другая считает, третья показывает результат. Тогда изменение формата вывода не заденет расчёты.\n\n**Модульность** — программа собрана из независимых частей (функций, классов, модулей) с понятными границами. Части можно тестировать и заменять по отдельности.","code":"def load_scores():\n    return {\"Аня\": [5, 4, 5], \"Боря\": [3, 4, 4]}\n\ndef average(values):\n    return round(sum(values) / len(values), 2)\n\ndef render(name, avg):\n    return f\"{name:<5} {avg}\"\n\nfor name, marks in load_scores().items():\n    print(render(name, average(marks)))","key":["Одна часть — одно дело.","Модули с чёткими границами легко менять и тестировать.","Главный код — «клей», соединяющий части."],"id":"24-1","narr":{"1":"Ответственность 1: получить данные","4":"Ответственность 2: посчитать","7":"Ответственность 3: показать","10":"Главный код только соединяет части"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":10,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":2,"e":"l","f":[3,4],"h":[0,1,2],"o":0},{"l":2,"e":"r","f":[3,4],"h":[0,1,2,3,4,5],"o":0,"rv":["r",4],"fn":"load_scores"},{"l":11,"e":"l","f":[5],"h":[0,1,2,4],"o":0},{"l":5,"e":"l","f":[5,6],"h":[0,1,2,4],"o":0},{"l":5,"e":"r","f":[5,6],"h":[0,1,2,4],"o":0,"rv":["p","4.67"],"fn":"average"},{"l":8,"e":"l","f":[5,7],"h":[0,1,2,4],"o":0},{"l":8,"e":"r","f":[5,7],"h":[0,1,2,4],"o":0,"rv":["p","'Аня   4.67'"],"fn":"render"},{"l":10,"e":"l","f":[5],"h":[0,1,2,4],"o":11},{"l":11,"e":"l","f":[8],"h":[0,1,2,5],"o":11},{"l":5,"e":"l","f":[8,9],"h":[0,1,2,5],"o":11},{"l":5,"e":"r","f":[8,9],"h":[0,1,2,5],"o":11,"rv":["p","3.67"],"fn":"average"},{"l":8,"e":"l","f":[8,10],"h":[0,1,2,5],"o":11},{"l":8,"e":"r","f":[8,10],"h":[0,1,2,5],"o":11,"rv":["p","'Боря  3.67'"],"fn":"render"},{"l":10,"e":"l","f":[8],"h":[0,1,2,5],"o":22},{"l":0,"e":"d","f":[8],"h":[0,1,2,5],"o":22}],"objs":[{"n":1,"k":"func","t":"function","name":"load_scores","sig":"()"},{"n":2,"k":"func","t":"function","name":"average","sig":"(values)"},{"n":3,"k":"func","t":"function","name":"render","sig":"(name, avg)"},{"n":4,"k":"dict","t":"dict","pairs":[[["p","'Аня'"],["r",5]],[["p","'Боря'"],["r",6]]],"more":0},{"n":5,"k":"list","t":"list","items":[["p","5"],["p","4"],["p","5"]],"more":0},{"n":6,"k":"list","t":"list","items":[["p","3"],["p","4"],["p","4"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["load_scores",["r",1]]]},{"name":"глобальная область","vars":[["load_scores",["r",1]],["average",["r",2]]]},{"name":"глобальная область","vars":[["load_scores",["r",1]],["average",["r",2]],["render",["r",3]]]},{"name":"load_scores()","vars":[]},{"name":"глобальная область","vars":[["load_scores",["r",1]],["average",["r",2]],["render",["r",3]],["name",["p","'Аня'"]],["marks",["r",5]]]},{"name":"average()","vars":[["values",["r",5]]]},{"name":"render()","vars":[["name",["p","'Аня'"]],["avg",["p","4.67"]]]},{"name":"глобальная область","vars":[["load_scores",["r",1]],["average",["r",2]],["render",["r",3]],["name",["p","'Боря'"]],["marks",["r",6]]]},{"name":"average()","vars":[["values",["r",6]]]},{"name":"render()","vars":[["name",["p","'Боря'"]],["avg",["p","3.67"]]]}],"out":"Аня   4.67\nБоря  3.67\n","error":null,"truncated":false},"deep":"Разделение ответственности часто строят **слоями**:\n- **представление** (ввод/вывод, интерфейс);\n- **предметная логика** (правила задачи, чистые функции);\n- **доступ к данным** (файлы, база, сеть).\n\nЛогику держат «чистой» — без print, input и обращений к сети, — чтобы её было легко тестировать. Внешний мир подключается по краям («функциональное ядро, императивная оболочка»).\n\nМодульность в Python — это функции, классы, модули и пакеты с узким публичным интерфейсом. Признак хорошего модуля: его можно описать одной фразой и протестировать отдельно.","pitfalls":["Смешивать вычисления и print в одной функции — её нельзя переиспользовать и сложно тестировать.","Модуль `utils.py`, куда сваливают всё подряд."],"links":["24-2","15-2","4-1"],"checks":[{"q":"Какая функция легче всего тестируется?","options":["`def report(): print(sum(load()))`","`def total(values): return sum(values)`","`def run(): total = input()`","`def save(): open('x','w').write('1')`"],"answer":1,"why":"Чистая функция без ввода-вывода: вход → выход."},{"q":"Что напечатает код?","options":["Итог: 6","6","None","Ошибка"],"answer":0,"why":"Логика (`total`) и представление (`render`) разделены, главный код их соединяет.","code":"def total(v):\n    return sum(v)\ndef render(t):\n    return f'Итог: {t}'\nprint(render(total([1, 2, 3])))"}]},{"title":"Cohesion и coupling","covers":["cohesion","coupling"],"text":"**Связность** (cohesion) — насколько элементы **внутри** модуля относятся к одной задаче. Высокая связность — хорошо: класс `Cart` занимается только корзиной.\n\n**Сцепление** (coupling) — насколько модули **зависят друг от друга**. Низкое сцепление — хорошо: модули общаются через простой интерфейс и не лезут во внутренности друг друга. Цель: **высокая связность, низкое сцепление**.","code":"class Cart:\n    def __init__(self):\n        self.items = []\n    def add(self, name, price):\n        self.items.append((name, price))\n    def total(self):\n        return sum(p for _, p in self.items)\n\nclass Receipt:\n    def print_for(self, cart):\n        return f\"К оплате: {cart.total()} ₽\"\n\ncart = Cart()\ncart.add(\"книга\", 500)\ncart.add(\"ручка\", 50)\nprint(Receipt().print_for(cart))","key":["Cohesion — единство задачи внутри модуля (чем выше, тем лучше).","Coupling — зависимость между модулями (чем ниже, тем лучше).","Общайтесь через интерфейсы, а не через внутренности."],"id":"24-2","narr":{"1":"Высокая связность: всё про корзину","9":"Низкое сцепление: знает только метод total()"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":6,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"Cart"},{"l":9,"e":"l","f":[6],"h":[3],"o":0},{"l":9,"e":"l","f":[6,7],"h":[3],"o":0},{"l":10,"e":"l","f":[6,8],"h":[3],"o":0},{"l":10,"e":"r","f":[6,9],"h":[3,4],"o":0,"rv":["p","None"],"fn":"Receipt"},{"l":13,"e":"l","f":[10],"h":[3,5],"o":0},{"l":3,"e":"l","f":[10,11],"h":[3,5,6],"o":0},{"l":3,"e":"r","f":[10,11],"h":[3,5,7,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":14,"e":"l","f":[12],"h":[3,5,7,8],"o":0},{"l":5,"e":"l","f":[12,13],"h":[3,5,7,8],"o":0},{"l":5,"e":"r","f":[12,13],"h":[3,5,7,9,10],"o":0,"rv":["p","None"],"fn":"add"},{"l":15,"e":"l","f":[12],"h":[3,5,7,9,10],"o":0},{"l":5,"e":"l","f":[12,14],"h":[3,5,7,9,10],"o":0},{"l":5,"e":"r","f":[12,14],"h":[3,5,7,11,10,12],"o":0,"rv":["p","None"],"fn":"add"},{"l":16,"e":"l","f":[12],"h":[3,5,7,11,10,12],"o":0},{"l":11,"e":"l","f":[12,15],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"l","f":[12,15,16],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"l","f":[12,15,16,17],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"r","f":[12,15,16,18],"h":[3,5,7,11,10,12,13],"o":0,"rv":["p","500"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[12,15,16,18],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e":"r","f":[12,15,16,19],"h":[3,5,7,11,10,12,13],"o":0,"rv":["p","50"],"fn":"<genexpr>"},{"l":7,"e":"l","f":[12,15,16,19],"h":[3,5,7,11,10,12,13],"o":0},{"l":7,"e ",7]]]},{"name":"глобальная область","vars":[["Cart",["r",4]],["Receipt",["r",6]],["cart",["r",7]]]},{"name":"add()","vars":[["self",["r",7]],["name",["p","'книга'"]],["price",["p","500"]]]},{"name":"add()","vars":[["self",["r",7]],["name",["p","'ручка'"]],["price",["p","50"]]]},{"name":"print_for()","vars":[["self",["r",11]],["cart",["r",7]]]},{"name":"total()","vars":[["self",["r",7]]]},{"name":"<genexpr>() ⟳генератор","vars":[]},{"name":"<genexpr>() ⟳генератор","vars":[["_",["p","'книга'"]],["p",["p","500"]]]},{"name":"<genexpr>() ⟳генератор","vars":[["_",["p","'ручка'"]],["p",["p","50"]]]}],"out":"К оплате: 550 ₽\n","error":null,"truncated":false},"deep":"**Связность** (cohesion) — насколько части модуля работают на одну цель. **Сцепление** (coupling) — насколько модули знают друг о друге. Виды сцепления от слабого к сильному: через данные (передали значения) → через интерфейс → через общие глобальные переменные → через внутренности чужого объекта.\n\nЗакон Деметры: «говори только с ближайшими друзьями». Цепочка `order.customer.address.city` сцепляет код со структурой трёх классов; лучше `order.shipping_city()`.\n\nИзменение, которое приходится вносить во множество модулей сразу («shotgun surgery»), — симптом сильного сцепления.","pitfalls":["Длинные цепочки обращений `a.b.c.d` — нарушение закона Деметры.","Общие глобальные переменные как способ общения модулей."],"links":["24-3","24-1","7-5"],"checks":[{"q":"Какой вариант слабее сцеплён со структурой классов?","options":["`order.customer.address.city`","`order.shipping_city()`","`order.__dict__['customer'].address.city`","Одинаково"],"answer":1,"why":"Метод заказа скрывает внутреннюю структуру — закон Деметры."},{"q":"Что означает высокая связность (cohesion) модуля?","options":["Модуль импортирует много других","Всё в модуле работает на одну задачу","Модуль очень большой","Модуль без функций"],"answer":1,"why":"Высокая связность — элементы модуля тесно относятся к общей цели."}]},{"title":"Dependency и dependency injection","covers":["dependency","dependency injection"],"text":"**Зависимость** (dependency) — объект, без которого другой не может работать: сервису уведомлений нужен способ отправки. Если сервис **сам** создаёт `EmailSender()` внутри, он намертво привязан к почте.\n\n**Внедрение зависимостей** (dependency injection) — зависимость передаётся **снаружи**, например через `__init__`. Тогда можно подставить SMS, Telegram или фейковый отправитель для тестов, не меняя код сервиса.","code":"class EmailSender:\n    def send(self, to, text):\n        return f\"email → {to}: {text}\"\n\nclass FakeSender:\n    def __init__(self):\n        self.sent = []\n    def send(self, to, text):\n        self.sent.append(to)\n        return \"fake\"\n\nclass Notifier:\n    def __init__(self, sender):\n        self.sender = sender\n    def welcome(self, user):\n        return self.sender.send(user, \"Добро пожаловать!\")\n\nprint(Notifier(EmailSender()).welcome(\"anna@mail.ru\"))\nfake = FakeSender()\nNotifier(fake).welcome(\"test\")\nprint(fake.sent)","key":["Зависимость — то, что нужно объекту для работы.","DI: передавай зависимости снаружи, а не создавай внутри.","Так код легко тестировать и менять."],"id":"24-3","narr":{"5":"Подделка для тестов","13":"Зависимость приходит СНАРУЖИ","20":"Тот же Notifier, другая зависимость"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"EmailSender"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"l","f":[4,7],"h":[1,2],"o":0},{"l":8,"e":"r","f":[4,8],"h":[1,2,3],"o":0,"rv":["p","None"],"fn":"FakeSender"},{"l":12,"e":"l","f":[9],"h":[1,4],"o":0},{"l":12,"e":"l","f":[9,10],"h":[1,4],"o":0},{"l":13,"e":"l","f":[9,11],"h":[1,4],"o":0},{"l":15,"e":"l","f":[9,12],"h":[1,4,5],"o":0},{"l":15,"e":"r","f":[9,13],"h":[1,4,5,6]," ":[["self",["r",13]],["sender",["r",11]]]},{"name":"welcome()","vars":[["self",["r",13]],["user",["p","'test'"]]]},{"name":"send()","vars":[["self",["r",11]],["to",["p","'test'"]],["text",["p","'Добро пожаловать!'"]]]}],"out":"email → anna@mail.ru: Добро пожаловать!\n['test']\n","error":null,"truncated":false},"deep":"**Инверсия зависимостей** (буква D в SOLID): высокоуровневый код не должен зависеть от низкоуровневых деталей — оба зависят от абстракции. DI — практический способ этого добиться: зависимость передаётся снаружи.\n\nСпособы внедрения:\n- через конструктор (`Notifier(sender)`) — самый явный;\n- через параметр метода (`notify(user, sender)`);\n- через значение по умолчанию (`def __init__(self, sender=None): self.sender = sender or EmailSender()`) — удобно, но прячет зависимость.\n\nМесто, где все объекты создаются и связываются вместе, называют **composition root** — обычно это функция `main()`. В Python DI-контейнеры редко нужны: хватает обычных параметров.","pitfalls":["Создавать зависимости внутри класса (`self.db = PostgresDB()`) — нельзя протестировать без настоящей базы.","Внедрять десятки зависимостей в один класс — признак, что класс делает слишком много."],"links":["24-4","7-4","25-11"],"checks":[{"q":"Что напечатает код?","options":["['anna']","[]","email","Ошибка"],"answer":0,"why":"Notifier не знает, какой отправитель ему дали; в тесте подставили подделку, которая запоминает адресатов.","code":"class Fake:\n    def __init__(self):\n        self.sent = []\n    def send(self, to):\n        self.sent.append(to)\nclass Notifier:\n    def __init__(self, sender):\n        self.sender = sender\n    def hello(self, user):\n        self.sender.send(user)\nf = Fake()\nNotifier(f).hello('anna')\nprint(f.sent)"},{"q":"Главная польза внедрения зависимостей?","options":["Код короче","Зависимость можно подменить (например, в тестах) без изменения класса","Код быстрее","Не нужны классы"],"answer":1,"why":"Класс зависит от интерфейса, а конкретную реализацию передают снаружи."}]},{"title":"Interface и abstraction layer","covers":["interface","abstraction layer"],"text":"**Интерфейс** — договор о том, какие методы есть у объекта. **Слой абстракции** (abstraction layer) — прослойка, которая прячет детали нижнего уровня за простым интерфейсом. Верхний код знает только про `storage.save()` и не знает, файл это, база данных или облако.\n\nХорошие слои позволяют заменить целый нижний уровень, не трогая верхний.","code":"from abc import ABC, abstractmethod\n\nclass Storage(ABC):\n    @abstractmethod\n    def save(self, key, value): ...\n\nclass DictStorage(Storage):\n    def __init__(self):\n        self.data = {}\n    def save(self, key, value):\n        self.data[key] = value\n\nclass PrintStorage(Storage):\n    def save(self, key, value):\n        print(f\"[лог] {key} = {value}\")\n\ndef register(user, storage: Storage):\n    storage.save(user, \"активен\")\n\nfor s in (DictStorage(), PrintStorage()):\n    register(\"anna\", s)","key":["Интерфейс — договор о методах.","Слой абстракции прячет детали реализации.","Верхние слои зависят от интерфейсов, а не от деталей."],"id":"24-4","narr":{"3":"Интерфейс слоя хранения","7":"Одна реализация","13":"Другая реализация","17":"Бизнес-логика знает только интерфейс"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Storage"},{"l":7,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4,5],"h":[1],"o":0},{"l":8,"e":"l","f":[4,6],"h":[1],"o":0},{"l":10,"e":"l","f":[4,7],"h":[1,2],"o":0},{"l":10,"e":"r","f":[4,8],"h":[1,2,3],"o":0,"rv":["p","None"],"fn":"DictStorage"},{"l":13,"e":"l","f":[9],"h":[1,4],"o":0},{"l":13,"e":"l","f":[9,10],"h":[1,4],"o":0},{"l":14,"e":"l","f":[9,11],"h":[1,4],"o":0}, анных объектов"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Truck"},{"l":3,"e":"l","f":[4],"h":[1],"o":0},{"l":3,"e":"l","f":[4,5],"h":[1],"o":0},{"l":4,"e":"l","f":[4,6],"h":[1],"o":0},{"l":4,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Ship"},{"l":6,"e":"l","f":[8],"h":[1,3],"o":0},{"l":9,"e":"l","f":[9],"h":[1,3,4],"o":0},{"l":7,"e":"l","f":[9,10],"h":[1,3,4],"o":0},{"l":7,"e":"r","f":[9,10],"h":[1,3,4,5],"o":0,"rv":["r",6],"fn":"transport_factory"},{"l":4,"e":"l","f":[9,11],"h":[1,3,4,5],"o":0},{"l":4,"e":"r","f":[9,11],"h":[1,3,4,5],"o":0,"rv":["p","'по морю'"],"fn":"deliver"},{"l":11,"e":"l","f":[9],"h":[1,3,4],"o":8},{"l":11,"e":"l","f":[9,12],"h":[1,3,4],"o":8},{"l":12,"e":"l","f":[9,13],"h":[1,3,4],"o":8},{"l":13,"e":"l","f":[9,14],"h":[1,3,4,6],"o":8},{"l":13,"e":"r","f":[9,15],"h":[1,3,4,6,7],"o":8,"rv":["p","None"],"fn":"DarkFactory"},{"l":14,"e":"l","f":[16],"h":[1,3,4,8],"o":8},{"l":14,"e":"l","f":[16,17],"h":[1,3,4,8],"o":8},{"l":15,"e":"l","f":[16,18],"h":[1,3,4,8],"o":8},{"l":16,"e":"l","f":[16,19],"h":[1,3,4,8,9],"o":8},{"l":16,"e":"r","f":[16,20],"h":[1,3,4,8,9,10],"o":8,"rv":["p","None"],"fn":"LightFactory"},{"l":18,"e":"l","f":[21],"h":[1,3,4,8,11],"o":8},{"l":21,"e":"l","f":[22],"h":[1,3,4,8,11,12],"o":8},{"l":19,"e":"l","f":[22,23],"h":[1,3,4,8,11,12,13],"o":8},{"l":13,"e":"l","f":[22,23,24],"h":[1,3,4,8,11,12,13],"o":8},{"l":13,"e":"r","f":[22,23,24],"h":[1,3,4,8,11,12,13],"o":8,"rv":["p","'[тёмное окно]'"],"fn":"window"},{"l":12,"e":"l","f":[22,23,25],"h":[1,3,4,8,11,12,13],"o":8},{"l":12,"e":"r","f":[22,23,25],"h":[1,3,4,8,11,12,13],"o":8,"rv":["p","'[тёмная кнопка]'"],"fn":"button"},{"l":19,"e":"r","f":[22,23],"h":[1,3,4,8,11,12,13],"o":8,"rv":["p","'[тёмное окно] [тёмная кнопка]'"],"fn":"build_ui"},{"l":0,"e":"d","f":[22],"h":[1,3,4,8,11,12],"o":38}],"objs":[{"n":1,"k":"func" ванных объектов, а не один","Работает только с ABC","Создаёт объекты лениво"],"answer":1,"why":"Абстрактная фабрика гарантирует, что объекты одного семейства сочетаются."}]},{"title":"Singleton","covers":["Singleton"],"text":"**Singleton** — у класса может быть **только один экземпляр**, и все получают его. Например, настройки приложения. Реализация через `__new__`: если объект уже создан — вернуть его.\n\nВ Python модуль сам по себе — естественный синглтон (импортируется один раз), поэтому паттерн нужен редко.","code":"class Settings:\n    _instance = None\n\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.theme = \"light\"\n        return cls._instance\n\na = Settings()\nb = Settings()\nb.theme = \"dark\"\nprint(a is b, a.theme)","key":["Один экземпляр на всю программу.","Реализуется через `__new__` или просто модуль."],"id":"25-2","narr":{"5":"Создаём только в первый раз","8":"Дальше всегда возвращаем тот же объект","11":"Новый объект НЕ создаётся"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["r",2],"fn":"Settings"},{"l":10,"e":"l","f":[5],"h":[2],"o":0},{"l":5,"e":"l","f":[5,6],"h":[2],"o":0},{"l":6,"e":"l","f":[5,6],"h":[2],"o":0},{"l":7,"e":"l","f":[5,6],"h":[3,4],"o":0},{"l":8,"e":"l","f":[5,6],"h":[3,5],"o":0},{"l":8,"e":"r","f":[5,6],"h":[3,5],"o":0,"rv":["r",4],"fn":"__new__"},{"l":11,"e":"l","f":[7],"h":[3,5],"o":0},{"l":5,"e":"l","f":[7,6],"h":[3,5],"o":0},{"l":8,"e":"l","f":[7,6],"h":[3,5],"o":0},{"l":8,"e":"r","f":[7,6],"h":[3,5],"o":0,"rv":["r",4],"fn":"__new__"},{"l":12,"e":"l","f":[8],"h":[3,5],"o":0},{"l":13,"e":"l","f":[8],"h":[3,6],"o":0},{"l":0,"e":"d","f":[8],"h":[3,6],"o":10}],"objs":[{"n":1,"k":"func","t":"function","name":"Settings.__new__","sig":"(cls)","cells":{"__class__":["p","<пус mmand превращает действие в объект с методом `execute()` (или `do()`) и часто `undo()`. Такой объект можно:\n- положить в очередь и выполнить позже (очереди задач);\n- записать в историю для отмены и повтора;\n- сериализовать и отправить по сети;\n- объединить несколько команд в макрокоманду.\n\nДля отмены команда должна хранить всё необходимое для обратного действия (например, старое значение). Стек истории — обычный список: `append` после выполнения, `pop()` при отмене.","pitfalls":["Команда без данных для `undo` — отменить нельзя.","Выполнять действие в конструкторе команды, а не в `do()`."],"links":["25-8","25-10"],"checks":[{"q":"Что напечатает код?","options":["['a', 'b']","['a']","[]","['b']"],"answer":1,"why":"Две команды выполнены, затем последняя отменена — остаётся только 'a'.","code":"class Add:\n    def __init__(self, doc, t):\n        self.doc, self.t = doc, t\n    def do(self):\n        self.doc.append(self.t)\n    def undo(self):\n        self.doc.pop()\ndoc, hist = [], []\nfor t in 'ab':\n    c = Add(doc, t); c.do(); hist.append(c)\nhist.pop().undo()\nprint(doc)"},{"q":"Что делает Command удобным для «Отменить»?","options":["Наследование","Действие хранится объектом и умеет выполнять обратную операцию","Кэширование","Метаклассы"],"answer":1,"why":"Команды складываются в историю и отменяются по одной."}]},{"title":"State","covers":["State"],"text":"**State** (состояние) — поведение объекта зависит от его текущего состояния, а каждое состояние — **отдельный класс**. Вместо длинной цепочки `if state == ...` объект делегирует работу своему текущему состоянию, а состояния сами переключают друг друга.","code":"class Off:\n    def press(self, lamp):\n        lamp.state = On()\n        return \"включаю\"\n\nclass On:\n    def press(self, lamp):\n        lamp.state = Off()\n        return \"выключаю\"\n\nclass Lamp:\n    def __init__(self):\n        self.state = Off()\n    def press(self):\n        return self.state.press(self)\n\nlamp = Lamp()\nfor _ in ran n in enumerate(['Анна', 'Борис', 'Антон']):\n    r.add(i, n)\nprint(r.find('Ан'))"},{"q":"Зачем в тестах подменяют репозиторий на хранение в памяти?","options":["Чтобы тесты были медленнее","Чтобы проверять логику быстро и без настоящей базы","Так требует Python","Чтобы не писать модели"],"answer":1,"why":"Бизнес-логика зависит от интерфейса репозитория, а не от базы."}]}],"zone":24,"world":{"name":"Вершина паттернов","hue":0,"kind":"summit","intro":"На вершине — галерея проверенных решений: у каждого паттерна свой символ и своя задача.","why":"Паттерны — общий словарь разработчиков и готовые ответы на типичные задачи проектирования.","spots":{"Factory":[null,"Цех: решает, какой объект выпустить, по заказу."],"Abstract Factory":["Abstract Factory","Два цеха разных стилей: каждый выпускает согласованный набор."],"Singleton":[null,"Одна корона на всё королевство: единственный экземпляр."],"Builder":[null,"Кран складывает объект по этажам, шаг за шагом."],"Adapter":[null,"Переходник для розетки: подгоняет чужой интерфейс."],"Facade":[null,"Фасад здания с одной дверью: простой вход в сложную систему."],"Proxy":[null,"Охранник у двери: тот же вход, но с контролем, кэшем или проверкой."],"Strategy":[null,"Шахматные фигуры: подставляешь нужный ход-алгоритм."],"Observer":[null,"Радиовышка и приёмники: издатель оповещает всех подписчиков."],"Command":[null,"Пульт: действие упаковано в кнопку, его можно отменить."],"State":[null,"Светофор: поведение зависит от текущего состояния."],"Repository":[null,"Склад с полками: коллекция объектов, а как они хранятся — скрыто."]}}}],"zones":[{"name":"Площадь объектов","kind":"village","hue":38,"intro":"Здесь видно, как Python хранит данные: таблички-имена на ниточках ведут к коробкам-объектам.","why":"Это модель, на которой держится весь язык. Пойми её — и остальные разделы станут вариациями."},{"name":"Склад типов","kind":"port","hue":200,"intro":"На складе каждая вещь хранится в таре своего типа: кубики, весы, переключатели, бусы, пое
