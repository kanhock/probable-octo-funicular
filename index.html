,"4-5","20-2"],"checks":[{"q":"Что напечатает код?","options":["1 1","1 2","2 2","0 1"],"answer":1,"why":"Обе вызова `c()` работают с одной ячейкой `count`: 1, потом 2.","code":"def counter():\n    count = 0\n    def inc():\n        nonlocal count\n        count += 1\n        return count\n    return inc\nc = counter()\nprint(c(), c())"},{"q":"Где замыкание хранит захваченные переменные?","options":["В глобальных переменных","В ячейках, доступных через `__closure__`","В кадре внешней функции, который не удаляется","В модуле builtins"],"answer":1,"why":"Захваченные переменные лежат в объектах-ячейках, на которые ссылается функция."}]},{"title":"Рекурсия","covers":["рекурсия"],"text":"Рекурсия — когда функция вызывает **саму себя** для меньшей версии задачи. Обязательно нужен **базовый случай** — условие, при котором функция отвечает сразу, без нового вызова. Иначе вызовы будут бесконечными.\n\nСмотри в визуализаторе на стопку кадров: каждый вызов кладёт новый кадр сверху, а `return` снимает их по одному в обратном порядке.","analogy":"Матрёшка: открываешь, пока не дойдёшь до самой маленькой (базовый случай), а потом собираешь обратно.","code":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\nprint(factorial(4))","key":["Нужен базовый случай.","Каждый вызов — новый кадр в стеке.","Результаты собираются при возврате, снизу вверх."],"id":"4-7","narr":{"2":"Базовый случай — дальше не углубляемся","4":"Вызываем себя с задачей поменьше","6":"4 * 3 * 2 * 1"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2,3],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2,3],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2,3,4],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2,3,4],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2,3,4,5],"h":[0],"o":0},{"l":3,"e":"l","f":[1,2,3,4,5],"h":[0],"o":0},{"l":3,"e":"r","f":[1,2,3,4,5],"h":[0],"o":0,"rv" сть `yield`, она становится **генератором**: вызов не выполняет тело, а возвращает объект-генератор. Каждый `next()` запускает тело до следующего `yield`, отдаёт значение и **ставит функцию на паузу**, сохраняя все локальные переменные.\n\nПодробно — в разделе 19 «Итераторы и генераторы».","code":"def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\ngen = countdown(3)\nprint(next(gen))\nprint(next(gen))\nfor rest in gen:\n    print(\"for:\", rest)","key":["`yield` превращает функцию в генератор.","Генератор помнит, где остановился.","Значения создаются по одному, по запросу."],"id":"4-8","narr":{"3":"Отдаём n и замираем до следующего запроса","6":"Тело ещё не выполнялось — создан объект-генератор","7":"Запускаем до первого yield","8":"Продолжаем с места остановки","9":"for сам вызывает next, пока генератор не закончится"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,3],"h":[0,2],"o":0},{"l":3,"e":"r","f":[2,3],"h":[0,3],"o":0,"rv":["p","3"],"fn":"countdown"},{"l":8,"e":"l","f":[2],"h":[0,3],"o":2},{"l":4,"e":"l","f":[2,3],"h":[0,2],"o":2},{"l":2,"e":"l","f":[2,4],"h":[0,2],"o":2},{"l":3,"e":"l","f":[2,4],"h":[0,2],"o":2},{"l":3,"e":"r","f":[2,4],"h":[0,4],"o":2,"rv":["p","2"],"fn":"countdown"},{"l":9,"e":"l","f":[2],"h":[0,4],"o":4},{"l":4,"e":"l","f":[2,4],"h":[0,2],"o":4},{"l":2,"e":"l","f":[2,5],"h":[0,2],"o":4},{"l":3,"e":"l","f":[2,5],"h":[0,2],"o":4},{"l":3,"e":"r","f":[2,5],"h":[0,5],"o":4,"rv":["p","1"],"fn":"countdown"},{"l":10,"e":"l","f":[6],"h":[0,5],"o":4},{"l":9,"e":"l","f":[6],"h":[0,5],"o":11},{"l":4,"e":"l","f":[6,5],"h":[0,2],"o":11},{"l":2,"e":"l","f":[6,7],"h":[0,2],"o":11},{"l":2,"e":"r","f":[6,7],"h":[0,2],"o":11,"rv":["p","None"],"fn":"countdown"},{"l":0,"e":"d","f":[6],"h":[0,6],"o":11}],"objs":[{"n":1,"k":"func","t":"function","name":"countdown","sig":"(n)"},{"n":2,"k":"gen","t":"generator","name":"countdown","state":"создан, ещё не запускался","locals":{"n":["p","3"]}},{"n":2,"k":"gen","t":"generator","name":"countdown","state":"работает"},{"n":2,"k":"gen","t":"generator","name":"countdown","state":"на паузе (yield)","locals":{"n":["p","3"]},"line":3},{"n":2,"k":"gen","t":"generator","name":"countdown","state":"на паузе (yield)","locals":{"n":["p","2"]},"line":3},{"n":2,"k":"gen","t":"generator","name":"countdown","state":"на паузе (yield)","locals":{"n":["p","1"]},"line":3},{"n":2,"k":"gen","t":"generator","name":"countdown","state":"завершён"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["countdown",["r",1]]]},{"name":"глобальная область","vars":[["countdown",["r",1]],["gen",["r",2]]]},{"name":"countdown() ⟳генератор","vars":[["n",["p","3"]]]},{"name":"countdown() ⟳генератор","vars":[["n",["p","2"]]]},{"name":"countdown() ⟳генератор","vars":[["n",["p","1"]]]},{"name":"глобальная область","vars":[["countdown",["r",1]],["gen",["r",2]],["rest",["p","1"]]]},{"name":"countdown() ⟳генератор","vars":[["n",["p","0"]]]}],"out":"3\n2\nfor: 1\n","error":null,"truncated":false},"deep":"Компилятор видит `yield` в теле и ставит функции флаг генератора. Вызов такой функции не выполняет тело, а создаёт объект-генератор, который хранит **замороженный кадр**: локальные переменные и номер строки. `next()` размораживает кадр до следующего `yield`.\n\n```\ndef g():\n    yield 1\n    yield 2\nit = g()\nprint(list(it))   # [1, 2]\nprint(list(it))   # [] — генератор уже исчерпан\n```","pitfalls":["Ждать, что вызов генераторной функции сразу выполнит её тело.","Перебирать один генератор дважды — второй раз он пуст."],"links":["19-2","19-1"],"checks":[{"q":"Что напечатает код?","options":["[1, 2] [1, 2]","[1, 2] []","[] []","Ошибка"],"answer":1,"why":"Генератор одноразовый: после первого `list` он исчерпан.","code":"def g():\n    yield 1\n    yield 2\nit = g()\nprint(list(it), list(it))"},{"q":"Что возвращает вызов функции, содержащей `yield`?","options":["Первое значение","None","Объект-генератор","Список всех значений"],"answer":2,"why":"Тело не выполняется — создаётся генератор, который будет выдавать значения по запросу."}]},{"title":"Декораторы (кратко)","covers":["декораторы"],"text":"Декоратор — функция, которая принимает функцию и возвращает **новую** функцию-обёртку с дополнительным поведением. Запись `@deco` над `def f` означает `f = deco(f)`.\n\nПодробно — в разделе 20 «Декораторы».","code":"def loud(func):\n    def wrapper(name):\n        return func(name).upper() + \"!!!\"\n    return wrapper\n\n@loud\ndef hello(name):\n    return \"привет, \" + name\n\nprint(hello(\"мир\"))","key":["`@deco` над функцией = `f = deco(f)`.","Декоратор добавляет поведение, не меняя код функции."],"id":"4-9","narr":{"3":"Вызываем оригинал и усиливаем результат","6":"Эквивалентно: hello = loud(hello)","10":"На самом деле вызывается wrapper"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[1,3],"h":[0,1,2],"o":0},{"l":4,"e":"r","f":[1,3],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"loud"},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[4],"h":[0,1,2],"o":0},{"l":3,"e":"l","f":[4,5],"h":[0,1,2],"o":0},{"l":8,"e":"l","f":[4,5,6],"h":[0,1,2],"o":0},{"l":8,"e":"r","f":[4,5,6],"h":[0,1,2],"o":0,"rv":["p","'привет, мир'"],"fn":"hello"},{"l":3,"e":"r","f":[4,5],"h":[0,1,2],"o":0,"rv":["p","'ПРИВЕТ, МИР!!!'"],"fn":"wrapper"},{"l":0,"e":"d","f":[4],"h":[0,1,2],"o":15}],"objs":[{"n":1,"k":"func","t":"function","name":"loud","sig":"(func)"},{"n":2,"k":"func","t":"function","name":"hello","sig":"(name)"},{"n":3,"k":"func","t":"function","name":"loud.<locals>.wrapper","sig":"(name)","cells":{"func":["r",2]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["loud",["r",1]]]},{"name":"loud()","vars":[["func",["r",2]]]},{"name":"loud()","vars":[["func",["r",2]],["wrapper",["r",3]]]},{"name":"глобальная область","vars":[["loud",["r",1]],["hello",["r",3]]]},{"name":"wrapper()","vars":[["name",["p","'мир'"]],["func",["r",2]]]},{"name":"hello()","vars":[["name",["p","'мир'"]]]}],"out":"ПРИВЕТ, МИР!!!\n","error":null,"truncated":false},"deep":"Декоратор применяется **один раз**, при выполнении `def`: результат `deco(func)` записывается под именем функции. Значит, при каждом вызове работает уже обёртка. Декораторы применяются снизу вверх:\n\n```\n@a\n@b\ndef f(): ...\n# то же самое: f = a(b(f))\n```\n\nПодробный разбор — в разделе 20.","pitfalls":["Забыть вернуть обёртку из декоратора — функция превратится в `None`.","Забыть вернуть результат оригинала из обёртки."],"links":["20-2","4-6"],"checks":[{"q":"Что напечатает код?","options":["None","hi","HI","Ошибка"],"answer":0,"why":"Декоратор ничего не вернул, поэтому имя `f` стало `None`, а печатаем мы `f` без вызова.","code":"def deco(func):\n    pass\n@deco\ndef f():\n    return 'hi'\nprint(f)"},{"q":"В каком порядке применяются `@a` и `@b`, записанные друг над другом (a сверху)?","options":["f = a(b(f))","f = b(a(f))","Одновременно","Только верхний"],"answer":0,"why":"Ближайший к функции декоратор применяется первым."}]}],"zone":3,"world":{"name":"Мастерская функций","hue":26,"kind":"workshop","intro":"Функция — станок: в лотки кладут аргументы, внутри работает механизм, в лоток выдачи выходит результат.","why":"Функции дают повторное использование и чёткие границы: что входит, что выходит, что остаётся внутри.","spots":{"def":[null,"Чертёж станка на стене. `def` только описывает станок, работать он начнёт при вызове."],"параметры":[null,"Подписанные приёмные лотки `name` и `greeting` — места, куда что-то положат."],"аргументы":[null,"Конкретные детали, брошенные в лотки при вызове: строка «Аня»."],"return":[null,"Лоток выдачи: готовый результат выходит наружу, и станок останавливается."],"область видимости":["область видимости","Стеклянная кабина станка: переменные внутри видны только внутри."],"local / global":["local / global","Внутри кабины — local, на стене мастерской — global. `global` разрешает менять то, что на стене."],"*args":[null,"Воронка, куда можно высыпать сколько угодно деталей — они соберутся в кортеж."],"**kwargs":[null,"Ящички с ярлыками `ключ=значение` — именованные аргументы собираются в словарь."],"lambda":[null,"Карманный мини-инструмент: функция в одну строку без имени."],"замыкания":[null,"Рюкзак на станке: функция унесла с собой переменные внешней функции."],"рекурсия":[null,"Станок, внутри которого такой же станок поменьше — до самого маленького (базовый случай)."],"генераторы":[null,"Раздатчик с кнопкой «пауза»: выдаёт по одной детали и замирает до следующего запроса."],"декораторы":[null,"Обёрточный стол: функцию заворачивают в обёртку, добавляя поведение до и после."]}}},{"title":"Объектная модель","items":["объект","identity","type","attribute","method","ссылка","пространство имён"],"intro":"Как Python видит мир изнутри: всё — объекты, у объектов есть атрибуты, а имена живут в пространствах имён.","lessons":[{"title":"В Python всё — объект","covers":["объект"],"text":"Числа, строки, списки, функции, классы, модули — **всё** в Python является объектом. Функцию можно положить в список, передать в другую функцию, у класса можно спросить его имя.\n\nПосмотри, как в одном списке лежат число, строка, функция и класс — и у каждого есть тип.","code":"def hello():\n    return \"hi\"\n\nclass Cat:\n    pass\n\nthings = [42, \"текст\", hello, Cat]\nfor t in things:\n    print(type(t).__name__)\nf = things[2]\nprint(f())","key":["Всё — объект: даже функции и классы.","Объекты можно хранить, передавать и возвращать."],"id":"5-1","narr":{"7":"Функция и класс лежат в списке, как обычные данные","9":"У каждого объекта есть тип","10":"Достаём функцию из списка…","11":"…и вызываем её"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{" ","vars":[]}],"out":"int\nstr\nfunction\ntype\nhi\n","error":null,"truncated":false},"deep":"В CPython каждый объект начинается со структуры `PyObject`: счётчик ссылок + указатель на тип. Поэтому функции, классы и модули ничем принципиально не отличаются от чисел: их можно присваивать, передавать и хранить.\n\nФункции и классы называют **объектами первого класса**. На этом построены callbacks, декораторы, фабрики и плагины.\n\n```\nops = {\"двойной\": lambda x: x * 2, \"квадрат\": lambda x: x * x}\nprint(ops[\"квадрат\"](7))   # 49\n```","pitfalls":["Путать вызов и ссылку: `button.on_click(handler())` вызывает обработчик сразу, нужно `on_click(handler)`."],"links":["20-1","14-1"],"checks":[{"q":"Что напечатает код?","options":["function","<class 'function'>","type","def"],"answer":0,"why":"Функция — объект класса `function`.","code":"def f():\n    pass\nprint(type(f).__name__)"},{"q":"Почему функцию можно положить в словарь?","options":["Это особый синтаксис","Функция — обычный объект","Только lambda можно","Нельзя"],"answer":1,"why":"Функции — объекты первого класса, как числа и строки."}]},{"title":"identity и type","covers":["identity","type"],"opts":{"heap_all":true},"text":"**identity** — уникальный номер объекта на время его жизни (`id(obj)`). Оператор `is` сравнивает именно identity. **type** — класс объекта (`type(obj)`); он не меняется после создания.\n\nИнтересный эффект: маленькие числа и короткие строки Python создаёт заранее и **переиспользует**, поэтому `a = 5` и `b = 5` указывают на один объект. А два одинаковых списка — всегда два разных объекта.","code":"a = 5\nb = 5\nprint(a is b, id(a) == id(b))\nx = [1, 2]\ny = [1, 2]\nprint(x == y, x is y)\nprint(type(x), type(a))","key":["`id()` — identity, `type()` — тип.","`is` — тот же объект, `==` — равные значения.","Не используй `is` для сравнения чисел и строк — только для `None`."],"id":"5-2","narr":{"2":"Python переиспользует объект 5 — посмотри на метки","5":"Значения равны, но это два разных объекта","6":"== сравнивает значения, is — identity"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0],"o":0},{"l":4,"e":"l","f":[2],"h":[0],"o":10},{"l":5,"e":"l","f":[3],"h":[0,1,2,3],"o":10},{"l":6,"e":"l","f":[4],"h":[0,1,2,3,4],"o":10},{"l":7,"e":"l","f":[4],"h":[0,1,2,3,4],"o":21},{"l":0,"e":"d","f":[4],"h":[0,1,2,3,4],"o":50}],"objs":[{"n":1,"k":"prim","t":"int","v":"5"},{"n":2,"k":"list","t":"list","items":[["r",3],["r",4]],"more":0},{"n":3,"k":"prim","t":"int","v":"1"},{"n":4,"k":"prim","t":"int","v":"2"},{"n":5,"k":"list","t":"list","items":[["r",3],["r",4]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["a",["r",1]]]},{"name":"глобальная область","vars":[["a",["r",1]],["b",["r",1]]]},{"name":"глобальная область","vars":[["a",["r",1]],["b",["r",1]],["x",["r",2]]]},{"name":"глобальная область","vars":[["a",["r",1]],["b",["r",1]],["x",["r",2]],["y",["r",5]]]}],"out":"True True\nTrue False\n<class 'list'> <class 'int'>\n","error":null,"truncated":false},"deep":"`id(obj)` в CPython — адрес объекта в памяти. Он уникален только **среди живых объектов**: после удаления объекта адрес может достаться новому.\n\nCPython заранее создаёт и переиспользует маленькие числа от −5 до 256 и «интернирует» некоторые строки. Поэтому `a is b` для чисел иногда `True`, иногда `False` — это деталь реализации, на неё нельзя полагаться.\n\n```\na = 256; b = 256; print(a is b)   # True (кэш)\n```\n\nПравило: `is` — только для `None`, `True`, `False` и проверки «тот же объект». Для значений — `==`.","pitfalls":["Сравнивать числа или строки через `is`.","Путать `isinstance(x, T)` (учитывает наследование) и `type(x) is T` (точное совпадение)."],"links":["1-2","23-2"],"checks":[{"q":"Что напечатает код?","options":["True True","True False","False True","False False"],"answer":1,"why":"Списки равны по значению (`==`), но это два разных объекта (`is`).","code":"a = [1]\nb = [1]\nprint(a == b, a is b)"},{"q":"Что напечатает код?","options":["True False","True True","False False","False True"],"answer":0,"why":"`isinstance` учитывает наследование (bool — подкласс int), а `type(...) is int` требует точного типа.","code":"print(isinstance(True, int), type(True) is int)"}]},{"title":"Атрибуты и методы","covers":["attribute","method"],"text":"**Атрибут** — имя, привязанное к объекту и доступное через точку: `obj.name`. **Метод** — атрибут-функция, которая при вызове автоматически получает сам объект первым аргументом (`self`).\n\nКогда пишешь `s.upper()`, Python находит функцию `upper` в типе `str` и вызывает её как `str.upper(s)`. Функции `getattr`, `setattr`, `hasattr` работают с атрибутами по имени-строке.","code":"class Lamp:\n    def __init__(self):\n        self.on = False\n    def toggle(self):\n        self.on = not self.on\n\nlamp = Lamp()\nlamp.toggle()\nprint(lamp.on)\nsetattr(lamp, \"color\", \"red\")\nprint(getattr(lamp, \"color\"), hasattr(lamp, \"size\"))\nprint(\"abc\".upper(), str.upper(\"abc\"))","key":["Атрибут — `obj.имя`.","Метод — функция, получающая объект как `self`.","`obj.method()` = `Type.method(obj)`."],"id":"5-3","narr":{"3":"Атрибут экземпляра","4":"Метод: self — это сама лампа","8":"То же самое, что Lamp.toggle(lamp)","10":"Добавляем атрибут по имени-строке","12":"Две записи одного и того же вызова"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Lamp"},{"l":7,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":3,"e":"r","f":[5,6],"h":[2,4],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":8,"e":"l","f":[7],"h":[2,4],"o":0},{"l":5,"e":"l","f":[7,8],"h":[2,4],"o":0},{"l":5,"e":"r","f":[7,8],"h":[2,5],"o":0,"rv":["p","None"],"fn":"toggle"},{"l":9,"e":"l","f":[7],"h":[2,5],"o":0},{"l":10,"e":"l","f":[7],"h":[2,5],"o":5},{"l":11,"e":"l","f":[7],"h":[2,6],"o":5},{"l":12,"e":"l","f":[7],"h":[2,6],"o":15},{"l":0,"e":"d","f":[7],"h":[2,6],"o":23}],"objs":[{"n":1,"k":"func","t":"function","name":"Lamp.__init__","sig":"(self)"},{"n":2,"k":"func","t":"function","name":"Lamp.toggle","sig":"(self)"},{"n":3,"k":"class","t":"class","name":"Lamp","bases":[],"attrs":{"__init__":["p","метод"],"toggle":["p","метод"]}},{"n":4,"k":"obj","t":"Lamp","attrs":{}},{"n":4,"k":"obj","t":"Lamp","attrs":{"on":["p","False"]}},{"n":4,"k":"obj","t":"Lamp","attrs":{"on":["p","True"]}},{"n":4,"k":"obj","t":"Lamp","attrs":{"on":["p","True"],"color":["p","'red'"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Lamp()","vars":[]},{"name":"тело класса Lamp","vars":[]},{"name":"тело класса Lamp","vars":[["__init__",["r",1]]]},{"name":"тело класса Lamp","vars":[["__init__",["r",1]],["toggle",["r",2]]]},{"name":"глобальная область","vars":[["Lamp",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]]]},{"name":"глобальная область","vars":[["Lamp",["r",3]],["lamp",["r",4]]]},{"name":"toggle()","vars":[["self",["r",4]]]}],"out":"True\nred False\nABC ABC\n","error":null,"truncated":false},"deep":"Когда ты пишешь `obj.attr`, Python вызывает `type(obj).__getattribute__(obj, \"attr\")`. Порядок поиска:\n1. **дескрипторы данных** в классе (например, `property`);\n2. словарь экземпляра `obj.__dict__`;\n3. атрибуты класса и его родителей (по MRO), включая обычные методы;\n4. если не нашлось — `__getattr__`, если он определён.\n\nФункция в классе — дескриптор: при доступе через экземпляр она превращается в **привязанный метод**, который помнит `self`.\n```\nclass A:\n    def hi(self): return \"hi\"\na = A()\nm = a.hi            # bound method\nprint(m.__self__ is a)   # True\n```","pitfalls":["Вызывать метод без скобок: `obj.method` — это объект метода, а не результат.","Опечатка в имени атрибута при присваивании молча создаёт новый атрибут."],"links":["12-1","6-4","8-3"],"checks":[{"q":"Что напечатает код?","options":["True","False","hi","Ошибка"],"answer":0,"why":"Привязанный метод хранит ссылку на объект в `__self__`.","code":"class A:\n    def hi(self):\n        return 'hi'\na = A()\nprint(a.hi.__self__ is a)"},{"q":"Что значит `obj.method(5)` для Python?","options":["method(5)","type(obj).method(obj, 5)","obj(5)","method.obj(5)"],"answer":1,"why":"Метод ищется в классе, а объект передаётся первым аргументом."}]},{"title":"Ссылки и передача в функцию","covers":["ссылка"],"text":"В функцию передаётся **ссылка** на объект, а не его копия. Поэтому если функция изменяет изменяемый объект (список, словарь), изменение видно снаружи.\n\nНо если функция **перепривязывает** параметр (`items = [...]`), это меняет только локальное имя — снаружи ничего не происходит. Посмотри на метки объектов в обоих кадрах.","code":"def add_item(items, x):\n    items.append(x)\n\ndef replace(items):\n    items = [\"новый\"]\n\ncart = [\"хлеб\"]\nadd_item(cart, \"молоко\")\nreplace(cart)\nprint(cart)","key":["Функции получают ссылки на объекты.","Изменение объекта видно всем ссылкам.","Перепривязка имени внутри функции снаружи не видна."],"quiz":{"q":"`def f(d): d['k'] = 1`; `x = {}`; `f(x)`. Что в `x`?","options":["{}","{'k': 1}","None","Ошибка"],"answer":1,"why":"`d` и `x` — ссылки на один словарь, функция его изменяет."},"id":"5-4","narr":{"2":"Меняем сам объект, на который ссылаются оба имени","5":"Перепривязываем ЛОКАЛЬНОЕ имя — внешний список не трогаем","8":"cart и items — ссылки на один список"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":8,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":2,"e":"l","f":[3,4],"h":[0,1,2],"o":0},{"l":2,"e":"r","f":[3,4],"h":[0,1,3],"o":0,"rv":["p","None"],"fn":"add_item"},{"l":9,"e":"l","f":[3],"h":[0,1,3],"o":0},{"l":5,"e":"l","f":[3,5],"h":[0,1,3],"o":0},{"l":5,"e":"r","f":[3,6],"h":[0,1,3,4],"o":0,"rv":["p","None"],"fn":"replace"},{"l":10,"e":"l","f":[3],"h":[0,1,3],"o":0},{"l":0,"e":"d","f":[3],"h":[0,1,3],"o":19}],"objs":[{"n":1,"k":"func","t":"function","name":"add_item","sig":"(items, x)"},{"n":2,"k":"func","t":"function","name":"replace","sig":"(items)"},{"n":3,"k":"list","t":"list","items":[["p","'хлеб'"]],"more":0},{"n":3,"k":"list","t":"list","items":[["p","'хлеб'"],["p","'молоко'"]],"more":0},{"n":4,"k":"list","t":"list","items":[["p","'новый'"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["add_item",["r",1]]]},{"name":"глобальная область","vars":[["add_item",["r",1]],["replace",["r",2]]]},{"name":"глобальная область","vars":[["add_item",["r",1]],["replace",["r",2]],["cart",["r",3]]]},{"name":"add_item()","vars":[["items",["r",3]],["x",["p","'молоко'"]]]},{"name":"replace()","vars":[["items",["r",3]]]},{"name":"replace()","vars":[["items",["r",4]]]}],"out":"['хлеб', 'молоко']\n","error":null,"truncated":false},"deep":"Python передаёт аргументы способом, который называют **«передача по ссылке на объект»** (call by sharing): параметр получает ту же ссылку, что и аргумент. Это не «по значению» (копии нет) и не «по ссылке» в смысле C++ (перепривязка параметра не меняет внешнюю переменную).\n\nОтсюда стиль: функция либо **меняет объект на месте и возвращает `None`** (как `list.sort`), либо **не трогает вход и возвращает новый объект** (как `sorted`). Смешивать эти подходы — путь к багам.","pitfalls":["Неожиданно изменить список, переданный в функцию.","Ждать, что `x = ...` внутри функции изменит переменную вызывающего кода."],"links":["1-3","4-2","23-4"],"checks":[{"q":"Что напечатает код?","options":["[1]","[1, 2]","[2]","[]"],"answer":1,"why":"Параметр `lst` ссылается на тот же список, `append` изменяет его.","code":"def f(lst):\n    lst.append(2)\nx = [1]\nf(x)\nprint(x)"},{"q":"Что напечатает код?","options":["[1]","[0]","[1, 0]","Ошибка"],"answer":0,"why":"Внутри функции перепривязали только локальное имя `lst`, внешний список не изменился.","code":"def f(lst):\n    lst = [0]\nx = [1]\nf(x)\nprint(x)"}]},{"title":"Пространство имён","covers":["пространство имён"],"text":"**Пространство имён** — это словарь «имя → объект». Их много: у модуля (глобальные имена), у каждого вызова функции (локальные), у класса, у каждого объекта (`obj.__dict__`), у встроенных функций (`builtins`).\n\nОдно и то же имя `x` может одновременно существовать в разных пространствах и указывать на разные объекты — конфликта нет. `vars(obj)` показывает пространство имён объекта.","code":"x = \"глобальный\"\n\nclass Box:\n    x = \"в классе\"\n\ndef func():\n    x = \"локальный\"\n    return x\n\nb = Box()\nb.x = \"в объекте\"\nprint(x, Box.x, b.x, func())\nprint(vars(b))","key":["Пространство имён = словарь имя → объект.","У модуля, функции, класса и объекта — свои.","Одинаковые имена в разных пространствах не мешают друг другу."],"id":"5-5","narr":{"4":"Пространство имён класса","7":"Пространство имён вызова функции","11":"Пространство имён экземпляра","12":"Четыре разных x в четырёх пространствах","13":"__dict__ объекта — его личное пространство имён"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1,2],"h":[],"o":0},{"l":4,"e":"l","f":[1,3],"h":[],"o":0},{"l":4,"e":"r","f":[1,4],"h":[],"o":0,"rv":["p","None"],"fn":"Box"},{"l":6,"e":"l","f":[5],"h":[0],"o":0},{"l":10,"e":"l","f":[6],"h":[0,1],"o":0},{"l":11,"e":"l","f":[7],"h":[0,1,2],"o":0},{"l":12,"e":"l","f":[7],"h":[0,1,3],"o":0},{"l":7,"e":"l","f":[7,8],"h":[0,1,3],"o":0},{"l":8,"e":"l","f":[7,9],"h":[0,1,3],"o":0},{"l":8,"e":"r","f":[7,9],"h":[0,1,3],"o":0,"rv":["p","'локальный'"],"fn":"func"},{"l":13,"e":"l","f":[7],"h":[0,1,3],"o":40},{"l":0,"e":"d","f":[7],"h":[0,1,3],"o":59}],"objs":[{"n":1,"k":"class","t":"class","name":"Box","bases":[],"attrs":{"x":["p","'в классе'"]}},{"n":2,"k":"func","t":"function","name":"func","sig":"()"},{"n":3,"k":"obj","t":"Box","attrs":{}},{"n":3,"k":"obj","t":"Box","attrs":{"x":["p","'в объекте'"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]]]},{"name":"Box()","vars":[]},{"name":"тело класса Box","vars":[]},{"name":"тело класса Box","vars":[["x",["p","'в классе'"]]]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]],["Box",["r",1]]]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]],["Box",["r",1]],["func",["r",2]]]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]],["Box",["r",1]],["func",["r",2]],["b",["r",3]]]},{"name":"func()","vars":[]},{"name":"func()","vars":[["x",["p","'локальный'"]]]}],"out":"глобальный в классе в объекте локальный\n{'x': 'в объекте'}\n","error":null,"truncated":false},"deep":"Пространство имён — это словарь. Глобальное — `globals()`, атрибуты объекта — `obj.__dict__`, атрибуты класса — `Cls.__dict__`, встроенные — модуль `builtins`. Локальные переменные функции в CPython хранятся в быстром массиве, а `locals()` выдаёт их снимок.\n\n**Область видимости** (scope) — где имя доступно в тексте программы; **пространство имён** — где оно реально хранится во время работы. Атрибуты (`obj.x`) живут в пространствах имён объектов и ищутся через точку, а не по правилу LEGB.","pitfalls":["Ждать, что атрибут класса виден внутри метода по короткому имени: нужно `self.x` или `Cls.x`.","Затирать встроенные имена (`sum = 0`) в глобальном пространстве."],"links":["4-3","15-1","1-1"],"checks":[{"q":"Что напечатает код?","options":["NameError","10","None","Ошибка AttributeError"],"answer":0,"why":"Атрибут класса не виден в методе по голому имени — нужно `self.size` или `Box.size`.","code":"class Box:\n    size = 10\n    def get(self):\n        try:\n            return size\n        except NameError:\n            return 'NameError'\nprint(Box().get())"},{"q":"Что такое пространство имён?","options":["Список ключевых слов","Отображение имён на объекты (по сути словарь)","Папка с файлами","Тип данных"],"answer":1,"why":"Пространство имён связывает имена с объектами."}]}],"zone":4,"world":{"name":"Музей объектов","hue":280,"kind":"city","intro":"В музее всё — экспонаты-объекты: у каждого паспорт, табличка с типом, бирки-атрибуты и кнопки-методы.","why":"Объектная модель объясняет, почему функции, классы и числа в Python ведут себя одинаково.","spots":{"объект":[null,"Экспонат на постаменте. В Python экспонат — всё: числа, функции, классы, модули."],"identity":[null,"Паспорт с номером id: «тот же самый объект» проверяется оператором `is`."],"type":[null,"Табличка с классом экспоната: `type(obj)` — его класс, он не меняется."],"attribute":[null,"Бирки на экспонате: `obj.color` — данные, привязанные к объекту."],"method":[null,"Кнопка на экспонате: `obj.toggle()` — действие, которое получает сам объект как self."],"ссылка":[null,"Посетители держат ниточки к одному экспонату: несколько имён — один объект."],"пространство имён":["пространство имён","Каталог музея: словарь «имя → экспонат». Свой каталог есть у модуля, функции, класса и объекта."]}}},{"title":"Классы","items":["class","экземпляр","атрибут класса","атрибут экземпляра","метод экземпляра","classmethod","staticmethod","__init__","self","создание объектов"],"intro":"Класс — чертёж, по которому создаются объекты. В визуализаторе ты увидишь сам класс (чертёж) и экземпляры (детали, сделанные по чертежу) как отдельные объекты в памяти.","lessons":[{"title":"class и экземпляр","covers":["class","экземпляр"],"text":"`class Dog:` создаёт **объект-класс** — чертёж. Пока ни одной собаки нет. Вызов `Dog()` создаёт **экземпляр** — конкретный объект по этому чертежу. Экземпляров может быть сколько угодно, и каждый — отдельный объект.\n\nОбрати внимание: тело класса выполняется один раз при определении — визуализатор покажет кадр «тело класса Dog».","analogy":"Класс — форма для печенья, экземпляры — сами печенья. Форма одна, печений много, и откусить можно только от печенья.","code":"class Dog:\n    sound = \"Гав\"\n\nrex = Dog()\nbim = Dog()\nprint(rex is bim, type(rex).__name__)\nprint(rex.sound, bim.sound)","key":["Класс — чертёж, экземпляр — объект по чертежу.","`Класс()` создаёт новый экземпляр.","`type(obj)` возвращает класс объекта."],"id":"6-1","narr":{"1":"Выполняется тело класса, создаётся объект-класс Dog","4":"Создаём первый экземпляр","5":"И второй — это ДРУГОЙ объект","7":"Оба видят атрибут класса"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[],"o":0,"rv":["p","None"],"fn":"Dog"},{"l":4,"e":"l","f":[4],"h":[0],"o":0},{"l":5,"e":"l","f":[5],"h":[0,1],"o":0},{"l":6,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":7,"e":"l","f":[6],"h":[0,1,2],"o":10},{"l":0,"e":"d","f":[6],"h":[0,1,2],"o":18}],"objs":[{"n":1,"k":"class","t":"class","name":"Dog","bases":[],"attrs":{"sound":["p","'Гав'"]}},{"n":2,"k":"obj","t":"Dog","attrs":{}},{"n":3,"k":"obj","t":"Dog","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Dog()","vars":[]},{"name":"тело класса Dog","vars":[]},{"name":"тело класса Dog","vars":[["sound",["p","'Гав'"]]]},{"name":"глобальная область","vars":[["Dog",["r",1]]]},{"name":"глобальная область","vars":[["Dog",["r",1]],["rex",["r",2]]]},{"name":"глобальная область","vars":[["Dog",["r",1]],["rex",["r",2]],["bim",["r",3]]]}],"out":"False Dog\nГав Гав\n","error":null,"truncated":false},"deep":"Инструкция `class Dog:` выполняет тело класса как обычный код в отдельном пространстве имён, собирает получившийся словарь атрибутов и вызывает `type(\"Dog\", bases, namespace)`. Результат — объект-класс, связанный с именем `Dog`.\n\nЭкземпляр знает свой класс через `obj.__class__`. Атрибуты, которых нет у экземпляра, ищутся в классе — поэтому все собаки «видят» общий `sound`, хотя он хранится один раз.\n\n```\nclass Dog:\n    sound = \"Гав\"\nrex = Dog()\nprint(rex.__class__ is Dog, \"sound\" in rex.__dict__)   # True False\n```","pitfalls":["Путать класс и экземпляр: методы экземпляра вызывают у объекта, а не у класса.","Писать код с побочными эффектами прямо в теле класса: он выполнится один раз при определении."],"links":["14-1","6-3","2-8"],"checks":[{"q":"Что напечатает код?","options":["True True","True False","False True","False False"],"answer":1,"why":"Экземпляр знает свой класс, но атрибута `sound` в его собственном `__dict__` нет — он в классе.","code":"class Dog:\n    sound = 'Гав'\nrex = Dog()\nprint(rex.__class__ is Dog, 'sound' in rex.__dict__)"},{"q":"Когда выполняется тело класса?","options":["При каждом создании объекта","Один раз при выполнении инструкции class","При первом вызове метода","Никогда"],"answer":1,"why":"Тело класса выполняется один раз, чтобы собрать атрибуты класса."}]},{"title":"__init__ и self","covers":["__init__","self"],"text":"`__init__` — метод-**инициализатор**. Python вызывает его автоматически сразу после создания объекта и передаёт аргументы из `Класс(...)`.\n\n`self` — это ссылка на **тот самый объект**, который сейчас настраивается или с которым работает метод. Запись `self.name = name` создаёт атрибут внутри объекта. Смотри: в кадре `__init__` переменная `self` указывает на тот же объект, что потом окажется в `cat`.","code":"class Cat:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\ncat = Cat(\"Мурка\", 3)\nprint(cat.name, cat.age)","key":["`__init__` заполняет новый объект данными.","`self` — сам объект, первый параметр каждого метода.","Аргументы `Класс(a, b)` попадают в `__init__(self, a, b)`."],"id":"6-2","narr":{"2":"self — новый, ещё пустой объект","3":"Кладём атрибут name внутрь объекта","6":"Python создаёт объект и вызывает Cat.__init__(объект, \"Мурка\", 3)"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Cat"},{"l":6,"e":"l","f":[4],"h":[1],"o":0},{"l":3,"e":"l","f":[4,5],"h":[1,2],"o":0},{"l":4,"e":"l","f":[4,5],"h":[1,3],"o":0},{"l":4,"e":"r","f":[4,5],"h":[1,4],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":7,"e":"l","f":[6],"h":[1,4],"o":0},{"l":0,"e":"d","f":[6],"h":[1,4],"o":8}],"objs":[{"n":1,"k":"func","t":"function","name":"Cat.__init__","sig":"(self, name, age)"},{"n":2,"k":"class","t":"class","name":"Cat","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Cat","attrs":{}},{"n":3,"k":"obj","t":"Cat","attrs":{"name":["p","'Мурка'"]}},{"n":3,"k":"obj","t":"Cat","attrs":{"name":["p","'Мурка'"],"age":["p","3"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Cat()","vars":[]},{"name":"тело класса Cat","vars":[]},{"name":"тело класса Cat","vars":[["__init__",["r",1]]]},{"name":"глобальная область","vars":[["Cat",["r",2]]]},{"name":"__init__()","vars":[["self",["r",3]],["name",["p","'Мурка'"]],["age",["p","3"]]]},{"name":"глобальная область","vars":[["Cat",["r",2]],["cat",["r",3]]]}],"out":"Мурка 3\n","error":null,"truncated":false},"deep":"`__init__` — не конструктор, а **инициализатор**: объект к моменту его вызова уже создан методом `__new__`. Поэтому `__init__` ничего не возвращает (вернуть не `None` — ошибка).\n\n`self` — не ключевое слово, а обычное имя первого параметра. Python сам подставляет туда объект:\n```\nclass Cat:\n    def __init__(self, name):\n        self.name = name\nc = Cat.__new__(Cat)      # пустой объект\nCat.__init__(c, \"Мурка\")  # ровно то, что делает Cat(\"Мурка\")\nprint(c.name)\n```\n\nВсе атрибуты экземпляра принято создавать в `__init__`: так объект всегда в согласованном состоянии.","pitfalls":["Забыть `self.` — `name = name` создаёт локальную переменную, а не атрибут.","Забыть параметр `self` в определении метода — `TypeError: takes 0 positional arguments but 1 was given`.","Вернуть значение из `__init__` — `TypeError`."],"links":["6-6","5-3"],"checks":[{"q":"Что напечатает код?","options":["Мурка","AttributeError","None","name"],"answer":1,"why":"В `__init__` написано `name = name` без `self.` — атрибут не создан.","code":"class Cat:\n    def __init__(self, name):\n        name = name\ntry:\n    print(Cat('Мурка').name)\nexcept AttributeError:\n    print('AttributeError')"},{"q":"Что такое `self`?","options":["Ключевое слово Python","Имя первого параметра, в который Python передаёт сам объект","Глобальная переменная","Ссылка на класс"],"answer":1,"why":"`self` — соглашение об имени; значение подставляет Python при вызове метода."}]},{"title":"Атрибут класса и атрибут экземпляра","covers":["атрибут класса","атрибут экземпляра"],"text":"**Атрибут класса** объявлен в теле класса и **общий** для всех экземпляров. **Атрибут экземпляра** создаётся через `self.x = ...` и у каждого объекта **свой**.\n\nПри чтении `obj.x` Python сначала ищет `x` в самом объекте, а если не находит — в классе. Ловушка: присваивание `obj.x = ...` всегда создаёт атрибут экземпляра и «заслоняет» атрибут класса.","code":"class Player:\n    count = 0\n\n    def __init__(self, name):\n        self.name = name\n        Player.count += 1\n\na = Player(\"Аня\")\nb = Player(\"Боря\")\nprint(Player.count, a.count, b.count)\na.count = 99\nprint(Player.count, a.count, b.count)","key":["Атрибуты класса общие, атрибуты экземпляра — личные.","Поиск: сначала объект, потом класс.","Меняй общие данные через имя класса."],"id":"6-3","narr":{"2":"Атрибут класса — один на всех","5":"Атрибут экземпляра — у каждого свой","6":"Меняем общий счётчик через класс","10":"Все читают один и тот же атрибут класса","11":"Создаётся атрибут экземпляра у a — он заслоняет классовый"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0],"o":0,"rv":["p","None"],"fn":"Player"},{"l":8,"e":"l","f":[5],"h":[1],"o":0},{"l":5,"e":"l","f":[5,6],"h":[1,2],"o":0},{"l":6,"e":"l","f":[5,6],"h":[1,3],"o":0},{"l":6,"e":"r","f":[5,6],"h":[4,3],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":9,"e":"l","f":[7],"h":[4,3],"o":0},{"l":5,"e":"l","f":[7,8],"h":[4,3,5],"o":0},{"l":6,"e":"l","f":[7,8],"h":[4,3,6],"o":0},{"l":6,"e":"r","f":[7,8],"h":[7,3,6],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":10,"e":"l","f":[9],"h":[7,3,6],"o":0},{"l":11,"e":"l","f":[9],"h":[7,3,6],"o":6},{"l":12,"e":"l","f":[9],"h":[7,8,6],"o":6},{"l":0,"e":"d","f":[9],"h":[7,8,6],"o":13}],"objs":[{"n":1,"k":"func","t":"function","name":"Player.__init__","sig":"(self, name)"},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"count":["p","0"],"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Player","attrs":{}},{"n":3,"k":"obj","t":"Player","attrs":{"name":["p","'Аня'"]}},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"count":["p","1"],"__init__":["p","метод"]}},{"n":4,"k":"obj","t":"Player","attrs":{}},{"n":4,"k":"obj","t":"Player","attrs":{"name":["p","'Боря'"]}},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"count":["p","2"],"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Player","attrs":{"name":["p","'Аня'"],"count":["p","99"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Player()","vars":[]},{"name":"тело класса Player","vars":[]},{"name":"тело класса Player","vars":[["count",["p","0"]]]},{"name":"тело класса Player","vars":[["count",["p","0"]],["__init__",["r",1]]]},{"name":"глобальная область","vars":[["Player",["r",2]]]},{"name":"__init__()","vars":[["self",["r",3]],["name",["p","'Аня'"]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["a",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]],["name",["p","'Боря'"]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["a",["r",3]],["b",["r",4]]]}],"out":"2 2 2\n2 99 2\n","error":null,"truncated":false},"deep":"Чтение `obj.x` ищет сначала в `obj.__dict__`, потом в классе. **Запись** `obj.x = ...` всегда пишет в `obj.__dict__`, создавая атрибут экземпляра, который «заслоняет» классовый.\n\nОпасный случай — изменяемый атрибут класса:\n```\nclass Team:\n    members = []          # общий для всех команд!\na, b = Team(), Team()\na.members.append(\"Аня\")\nprint(b.members)          # ['Аня']\n```\nИзменяемые данные, которые должны быть у каждого своими, создавай в `__init__`.","pitfalls":["Изменяемый атрибут класса (`[]`, `{}`) — общий для всех экземпляров.","Менять общий счётчик через `self.count += 1` — создастся атрибут экземпляра. Нужно `Cls.count += 1`."],"links":["6-1","1-3","5-3"],"checks":[{"q":"Что напечатает код?","options":["[]","['Аня']","Ошибка","None"],"answer":1,"why":"`members` — атрибут класса, один список на всех. `append` через `a` меняет общий объект.","code":"class Team:\n    members = []\na, b = Team(), Team()\na.members.append('Аня')\nprint(b.members)"},{"q":"Что напечатает код?","options":["1 1","0 1","1 0","0 0"],"answer":1,"why":"`self.count += 1` прочитал 0 из класса и записал 1 в экземпляр. Класс остался с 0.","code":"class C:\n    count = 0\n    def inc(self):\n        self.count += 1\nc = C()\nc.inc()\nprint(C.count, c.count)"}]},{"title":"Метод экземпляра","covers":["метод экземпляра"],"text":"Метод экземпляра — функция внутри класса, первым параметром которой идёт `self`. Методы читают и меняют **состояние объекта**.\n\nВызов `account.deposit(50)` Python превращает в `Account.deposit(account, 50)`. Поэтому одна и та же функция работает с разными объектами — с тем, у которого её вызвали.","code":"class Account:\n    def __init__(self, owner):\n        self.owner = owner\n        self.balance = 0\n\n    def deposit(self, amount):\n        self.balance += amount\n        return self.balance\n\na = Account(\"Аня\")\nb = Account(\"Боря\")\na.deposit(100)\nb.deposit(30)\na.deposit(50)\nprint(a.balance, b.balance)","key":["Метод = функция в классе с `self` первым параметром.","`obj.m(x)` → `Class.m(obj, x)`.","Методы меняют состояние именно своего объекта."],"id":"6-4","narr":{"7":"self — тот счёт, у которого вызвали метод","12":"Меняется только a"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Account"},{"l":10,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":4,"e":"l","f":[5,6],"h":[2,4],"o":0},{"l":4,"e":"r","f":[5,6],"h":[2,5],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":11,"e":"l","f":[7],"h":[2,5],"o":0},{"l":3,"e":"l","f":[7,8],"h":[2,5,6],"o":0},{"l":4,"e":"l","f":[7,8],"h":[2,5,7],"o":0},{"l":4,"e":"r","f":[7,8],"h":[2,5,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":12,"e":"l","f":[9],"h":[2,5,8],"o":0},{"l":7,"e":"l","f":[9,10],"h":[2,5,8],"o":0},{"l":8,"e":"l","f":[9,10],"h":[2,9,8],"o":0},{"l":8,"e":"r","f":[9,10],"h":[2,9,8],"o":0,"rv":["p","100"],"fn":"deposit"},{"l":13,"e":"l","f":[9],"h":[2,9,8],"o":0},{"l":7,"e":"l","f":[9,11],"h":[2,9,8],"o":0},{"l":8,"e":"l","f":[9,11],"h":[2,9,10],"o":0},{"l":8,"e":"r","f":[9,11],"h":[2,9,10],"o":0,"rv":["p","30"],"fn":"deposit"},{"l":14,"e":"l","f":[9],"h":[2,9,10],"o":0},{"l":7,"e":"l","f":[9,12],"h":[2,9,10],"o":0},{"l":8,"e":"l","f":[9,12],"h":[2,11,10],"o":0},{"l":8,"e":"r","f":[9,12],"h":[2,11,10],"o":0,"rv":["p","150"],"fn":"deposit"},{"l":15,"e":"l","f":[9],"h":[2,11,10],"o":0},{"l":0,"e":"d","f":[9],"h":[2,11,10],"o":7}],"objs":[{"n":1,"k":"func","t":"function","name":"Account.__init__","sig":"(self, owner)"},{"n":2,"k":"func","t":"function","name":"Account.deposit","sig":"(self, amount)"},{"n":3,"k":"class","t":"class","name":"Account","bases":[],"attrs":{"__init__":["p","метод"],"deposit":["p","метод"]}},{"n":4,"k":"obj","t":"Account","attrs":{}},{"n":4,"k":"obj","t":"Account","attrs":{"owner":["p","'Аня'"]}},{"n":4,"k":"obj","t":"Account","attrs":{"owner":["p","'Аня'"],"balance":["p","0"]}},{"n":5,"k":"obj","t":"Account","attrs":{}},{"n":5,"k":"obj","t":"Account","attrs":{"owner":["p","'Боря'"]}},{"n":5,"k":"obj","t":"Account","attrs":{"owner":["p","'Боря'"],"balance":["p","0"]}},{"n":4,"k":"obj","t":"Account","attrs":{"owner":["p","'Аня'"],"balance":["p","100"]}},{"n":5,"k":"obj","t":"Account","attrs":{"owner":["p","'Боря'"],"balance":["p","30"]}},{"n":4,"k":"obj","t":"Account","attrs":{"owner":["p","'Аня'"],"balance":["p","150"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Account()","vars":[]},{"name":"тело класса Account","vars":[]},{"name":"тело класса Account","vars":[["__init__",["r",1]]]},{"name":"тело класса Account","vars":[["__init__",["r",1]],["deposit",["r",2]]]},{"name":"глобальная область","vars":[["Account",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]],["owner",["p","'Аня'"]]]},{"name":"глобальная область","vars":[["Account",["r",3]],["a",["r",4]]]},{"name":"__init__()","vars":[["self",["r",5]],["owner",["p","'Боря'"]]]},{"name":"глобальная область","vars":[["Account",["r",3]],["a",["r",4]],["b",["r",5]]]},{"name":"deposit()","vars":[["self",["r",4]],["amount",["p","100"]]]},{"name":"deposit()","vars":[["self",["r",5]],["amount",["p","30"]]]},{"name":"deposit()","vars":[["self",["r",4]],["amount",["p","50"]]]}],"out":"150 30\n","error":null,"truncated":false},"deep":"Функция, объявленная в классе, хранится в `Cls.__dict__` как обычная функция. При доступе через экземпляр механизм дескрипторов создаёт **bound method** — объект, который хранит функцию (`__func__`) и экземпляр (`__self__`). Вызов `m(5)` превращается в `__func__(__self__, 5)`.\n\nПоэтому методы можно передавать как callback — они «помнят» свой объект:\n```\nclass Counter:\n    def __init__(self): self.n = 0\n    def tick(self): self.n += 1\nc = Counter()\nfor f in [c.tick, c.tick]: f()\nprint(c.n)   # 2\n```","pitfalls":["Вызывать метод через класс без объекта: `Counter.tick()` → `TypeError`.","Хранить состояние в локальных переменных метода, ожидая, что оно сохранится между вызовами."],"links":["5-3","12-2","6-2"],"checks":[{"q":"Что напечатает код?","options":["0","1","2","Ошибка"],"answer":2,"why":"Привязанный метод `c.tick` помнит объект `c`, оба вызова увеличивают его счётчик.","code":"class Counter:\n    def __init__(self):\n        self.n = 0\n    def tick(self):\n        self.n += 1\nc = Counter()\nf = c.tick\nf(); f()\nprint(c.n)"},{"q":"Чем `obj.method` отличается от `Cls.method`?","options":["Ничем","Первое — привязанный метод с запомненным obj, второе — обычная функция","Второе быстрее","Первое — копия функции"],"answer":1,"why":"Доступ через экземпляр привязывает функцию к объекту."}]},{"title":"classmethod и staticmethod","covers":["classmethod","staticmethod"],"text":"`@classmethod` получает первым аргументом **класс** (`cls`), а не экземпляр. Часто используется как альтернативный «конструктор»: `Date.from_string(\"2024-05-01\")`.\n\n`@staticmethod` не получает ни `self`, ни `cls` — это обычная функция, которая просто логически живёт внутри класса.","code":"class Date:\n    def __init__(self, y, m, d):\n        self.y, self.m, self.d = y, m, d\n\n    @classmethod\n    def from_string(cls, text):\n        y, m, d = map(int, text.split(\"-\"))\n        return cls(y, m, d)\n\n    @staticmethod\n    def is_valid_month(m):\n        return 1 <= m <= 12\n\nday = Date.from_string(\"2024-05-01\")\nprint(day.y, day.m, day.d)\nprint(Date.is_valid_month(13))","key":["`@classmethod` → первый параметр `cls` (класс).","`@staticmethod` → без автоматических параметров.","classmethod часто — фабрика экземпляров."],"id":"6-5","narr":{"6":"cls — это сам класс Date","8":"Создаём экземпляр через cls","11":"Ни self, ни cls — просто функция"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":11,"e":"l","f":[ ate",["r",4]],["day",["r",5]]]},{"name":"is_valid_month()","vars":[["m",["p","13"]]]}],"out":"2024 5 1\nFalse\n","error":null,"truncated":false},"deep":"`classmethod` и `staticmethod` — тоже дескрипторы. `classmethod` при доступе подставляет первым аргументом **класс** — причём тот, через который вызвали. Поэтому фабрика корректно работает в наследниках:\n\n```\nclass Shape:\n    @classmethod\n    def create(cls): return cls()\nclass Circle(Shape): pass\nprint(type(Circle.create()).__name__)   # Circle\n```\n\n`staticmethod` ничего не подставляет. Его используют для вспомогательных функций, логически связанных с классом. Если функции не нужен ни объект, ни класс, часто проще сделать её обычной функцией модуля.","pitfalls":["Хардкодить имя класса в фабрике (`return Shape()` вместо `cls()`) — наследники получат объект родителя.","Ждать доступ к `self` в staticmethod."],"links":["8-1","25-1"],"checks":[{"q":"Что напечатает код?","options":["Shape","Circle","Ошибка","cls"],"answer":1,"why":"`cls` — класс, через который вызвали метод, то есть `Circle`.","code":"class Shape:\n    @classmethod\n    def create(cls):\n        return cls()\nclass Circle(Shape):\n    pass\nprint(type(Circle.create()).__name__)"},{"q":"Что получает первым аргументом `@classmethod`?","options":["Экземпляр","Класс","Ничего","Модуль"],"answer":1,"why":"classmethod получает класс в параметр `cls`."}]},{"title":"Как создаётся объект","covers":["создание объектов"],"text":"`Класс(аргументы)` запускает два шага: 1) `__new__` создаёт пустой объект нужного типа; 2) `__init__` его заполняет. Затем ссылка на готовый объект возвращается и привязывается к имени.\n\n`__new__` переопределяют редко (для неизменяемых типов и паттерна Singleton), но полезно знать, что он есть. В коде ниже оба шага видны благодаря `print`.","code":"class Robot:\n    def __new__(cls, *args):\n        print(\"1) __new__: выделяем объект для\", cls.__name__)\n        obj = super().__new__(cls)\n        return obj\n\n    def __init__(self, model):\n        print(\"2) __init__: настраиваем модель\", model)\n        self.model = model\n\nr = Robot(\"R2\")\nprint(\"3) готово:\", r.model)","key":["Создание = `__new__` (создать) + `__init__` (настроить).","Обычно переопределяют только `__init__`."],"id":"6-6","narr":{"4":"Настоящее создание объекта","9":"Заполняем уже созданный объект","11":"Сначала __new__, потом __init__"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":7,"e":"r","f":[0,4],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"Robot"},{"l":11,"e":"l","f":[5],"h":[3],"o":0},{"l":3,"e":"l","f":[5,6],"h":[3,4],"o":0},{"l":4,"e":"l","f":[5,6],"h":[3,4],"o":38},{"l":5,"e":"l","f":[5,7],"h":[3,4,5],"o":38},{"l":5,"e":"r","f":[5,7],"h":[3,4,5],"o":38,"rv":["r",6],"fn":"__new__"},{"l":8,"e":"l","f":[5,8],"h":[3,5],"o":38},{"l":9,"e":"l","f":[5,8],"h":[3,5],"o":73},{"l":9,"e":"r","f":[5,8],"h":[3,6],"o":73,"rv":["p","None"],"fn":"__init__"},{"l":12,"e":"l","f":[9],"h":[3,6],"o":73},{"l":0,"e":"d","f":[9],"h":[3,6],"o":87}],"objs":[{"n":1,"k":"func","t":"function","name":"Robot.__new__","sig":"(cls, *args)","cells":{"__class__":["p","<пусто>"]}},{"n":2,"k":"func","t":"function","name":"Robot.__init__","sig":"(self, model)"},{"n":3,"k":"other","t":"cell","r":"<cell: empty>"},{"n":4,"k":"class","t":"class","name":"Robot","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":5,"k":"tuple","t":"tuple","items":[["p","'R2'"]],"more":0},{"n":6,"k":"obj","t":"Robot","attrs":{}},{"n":6,"k":"obj","t":"Robot","attrs":{"model":["p","'R2'"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Robot()","vars":[]},{"name":"тело класса Robot","vars":[]},{"name":"тело класса Robot","vars":[["__new__",["r",1]]]},{"name":"тело класса Robot","vars":[["__new__",["r",1]],["__init__",["r",2]],["__classcell__",["r",3]]]},{"name":"глобальная область","vars":[["Robot",["r",4]]]},{"name":"__new__()","vars":[["cls",["r",4]],["args",["r",5]]]},{"name":"__new__()","vars":[["cls",["r",4]],["args",["r",5]],["obj",["r",6]]]},{"name":"__init__()","vars":[["self",["r",6]],["model",["p","'R2'"]]]},{"name":"глобальная область","vars":[["Robot",["r",4]],["r",["r",6]]]}],"out":"1) __new__: выделяем объект для Robot\n2) __init__: настраиваем модель R2\n3) готово: R2\n","error":null,"truncated":false},"deep":"`Cls(...)` — это вызов `type.__call__(Cls, ...)`, который делает:\n1. `obj = Cls.__new__(Cls, ...)` — выделить объект;\n2. если `obj` — экземпляр `Cls`, вызвать `obj.__init__(...)`;\n3. вернуть `obj`.\n\n`__new__` — статический метод, получает класс. Его переопределяют для неизменяемых типов (у `int` или `str` значение задаётся при создании, в `__init__` поздно), для синглтонов и кэширования экземпляров.\n\n```\nclass Upper(str):\n    def __new__(cls, text):\n        return super().__new__(cls, text.upper())\nprint(Upper(\"abc\"))   # ABC\n```","pitfalls":["Пытаться задать значение неизменяемого типа (`str`, `int`) в `__init__` — уже поздно, нужен `__new__`.","Забыть вернуть объект из `__new__` — `__init__` не вызовется, результатом будет `None`."],"links":["6-2","14-2","25-2"],"checks":[{"q":"Что напечатает код?","options":["abc","ABC","Ошибка","Upper"],"answer":1,"why":"Значение строки задаётся в `__new__`, там мы перевели текст в верхний регистр.","code":"class Upper(str):\n    def __new__(cls, text):\n        return super().__new__(cls, text.upper())\nprint(Upper('abc'))"},{"q":"В каком порядке работают `__new__` и `__init__`?","options":["Сначала __init__, потом __new__","Сначала __new__ создаёт объект, потом __init__ его настраивает","Одновременно","Вызывается только один из них"],"answer":1,"why":"`__new__` создаёт и возвращает объект, `__init__` его инициализирует."}]}],"zone":5,"world":{"name":"Чертёжное бюро","hue":214,"kind":"city","intro":"Класс — чертёж на столе, экземпляры — дома, построенные по нему. Бригада обставляет каждый новый дом.","why":"Классы объединяют данные и поведение и позволяют штамповать сколько угодно похожих объектов.","spots":{"class":[null,"Чертёж дома на столе. Пока ни одного дома нет — только описание."],"экземпляр":[null,"Дома, построенные по чертежу. Каждый — отдельный объект."],"атрибут класса":["атрибут класса","Общий фонтан на площади: им пользуются все дома, он один на всех."],"атрибут экземпляра":["атрибут экземпляра","Почтовый ящик с фамилией у каждого дома — у каждого свой."],"метод экземпляра":["метод экземпляра","Выключатель света в доме: действие меняет состояние именно этого дома."],"classmethod":[null,"Штамп-фабрика бюро: получает сам чертёж (cls) и строит новый дом."],"staticmethod":[null,"Ящик с инструментами на столе: полезен бюро, но не знает ни о чертеже, ни о доме."],"__init__":[null,"Бригада, которая обставляет только что построенный дом: заполняет атрибуты."],"self":[null,"Табличка «я» на двери: метод получает ссылку на тот самый дом, с которым работает."],"создание объектов":["создание объектов","Конвейер: `__new__` ставит каркас, `__init__` обставляет, готовый дом получает адрес."]}}},{"title":"ООП","items":["Абстракция","Инкапсуляция","Наследование","Полиморфизм","Композиция","Агрегация","Ассоциация","Делегирование"],"intro":"Объектно-ориентированное программирование — это способ строить программу из объектов, которые хранят данные и умеют действовать. Четыре кита (абстракция, инкапсуляция, наследование, полиморфизм) и виды связей между объектами.","lessons":[{"title":"Абстракция","covers":["Абстракция"],"text":"**Абстракция** — показать наружу только то, что важно, и спрятать детали. Пользователю класса `CoffeeMachine` нужен метод `make(\"латте\")`, а не знание о температуре бойлера и давлении.\n\nХорошая абстракция даёт простые названия сложным действиям.","analogy":"Руль и педали автомобиля — абстракция. Тебе не нужно знать устройство двигателя, чтобы ехать.","code":"class CoffeeMachine:\n    def make(self, drink):\n        self._heat_water()\n        self._grind()\n        return f\"Готов {drink}\"\n\n    def _heat_water(self):\n        self.temp = 92\n\n    def _grind(self):\n        self.ground = True\n\nm = CoffeeMachine()\nprint(m.make(\"латте\"))","key":["Абстракция = простой интерфейс поверх сложной реализации.","Наружу — что делать, внутри — как."],"id":"7-1","narr":{"2":"Простой метод наружу","7":"Детали спрятаны внутри","14":"Пользователь думает только о напитке"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":7,"e":"l","f":[0,3],"h":[0],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":10,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"CoffeeMachine"},{"l":13,"e":"l","f":[6],"h":[3],"o":0},{"l":14,"e":"l","f":[7],"h":[3,4],"o":0},{"l":3,"e":"l","f":[7,8],"h":[3,4],"o":0},{"l":8,"e":"l","f":[7,8,9],"h":[3,4],"o":0},{"l":8,"e":"r","f":[7,8,9],"h":[3,5],"o":0,"rv":["p","None"],"fn":"_heat_water"},{"l":4,"e":"l","f":[7,8],"h":[3,5],"o":0},{"l":11,"e":"l","f":[7,8,10],"h":[3,5],"o":0},{"l":11,"e":"r","f":[7,8,10],"h":[3,6],"o":0,"rv":["p","None"],"fn":"_grind"},{"l":5,"e":"l","f":[7,8],"h":[3,6],"o":0},{"l":5,"e":"r","f":[7,8],"h":[3,6],"o":0,"rv":["p","'Готов латте'"],"fn":"make"},{"l":0,"e":"d","f":[7],"h":[3,6],"o":12}],"objs":[{"n":1,"k":"func","t":"function","name":"CoffeeMachine.make","sig":"(self, drink)"},{"n":2,"k":"func","t":"function","name":"CoffeeMachine._heat_water","sig":"(self)"},{"n":3,"k":"func","t":"function","name":"CoffeeMachine._grind","sig":"(self)"},{"n":4,"k":"class","t":"class","name":"CoffeeMachine","bases":[],"attrs":{"make":["p","метод"],"_heat_water":["p","метод"],"_grind":["p","метод"]}},{"n":5,"k":"obj","t":"CoffeeMachine","attrs":{}},{"n":5,"k":"obj","t":"CoffeeMachine","attrs":{"temp":["p","92"]}},{"n":5,"k":"obj","t":"CoffeeMachine","attrs":{"temp":["p","92"],"ground":["p","True"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"CoffeeMachine()","vars":[]},{"name":"тело класса CoffeeMachine","vars":[]},{"name":"тело класса CoffeeMachine","vars":[["make",["r",1]]]},{"name":"тело класса CoffeeMachine","vars":[["make",["r",1]],["_heat_water",["r",2]]]},{"name":"тело класса CoffeeMachine","vars":[["make",["r",1]],["_heat_water",["r",2]],["_grind",["r",3]]]},{"name":"глобальная область","vars":[["CoffeeMachine",["r",4]]]},{"name":"глобальная область","vars":[["CoffeeMachine",["r",4]],["m",["r",5]]]},{"name":"make()","vars":[["self",["r",5]],["drink",["p","'латте'"]]]},{"name":"_heat_water()","vars":[["self",["r",5]]]},{"name":"_grind()","vars":[["self",["r",5]]]}],"out":"Готов латте\n","error":null,"truncated":false},"deep":"Абстракция — это выбор **уровня детализации**. Хороший интерфейс говорит на языке задачи («сварить латте»), а не на языке реализации («нагреть до 92°»). Признак хорошей абстракции: её можно объяснить одним предложением и использовать, не открывая код.\n\nАбстракции бывают протекающими (leaky): если пользователю всё же приходится знать детали (например, что `CoffeeMachine` нельзя вызывать, пока не прогреется), абстракция неполная. В Python инструментами абстракции служат функции, классы, модули, а для формального описания — ABC и Protocol.","pitfalls":["Слишком ранняя абстракция «на будущее» — усложняет код без пользы.","Методы с именами из реализации (`_heat_water`) торчат наружу без подчёркивания."],"links":["10-1","24-4","7-2"],"checks":[{"q":"Какой интерфейс лучше передаёт абстракцию «отправить письмо»?","options":["`open_socket(); write_bytes(); close()`","`send_email(to, subject, body)`","`smtp_cmd('MAIL FROM')`","`set_port(25)`"],"answer":1,"why":"Хороший интерфейс говорит на языке задачи, а не протокола."},{"q":"Что такое «протекающая» абстракция?","options":["Абстракция с ошибкой памяти","Абстракция, которая заставляет пользователя знать детали реализации","Класс без методов","Абстрактный класс ABC"],"answer":1,"why":"Если без знания деталей пользоваться неудобно или опасно, абстракция протекает."}]},{"title":"Инкапсуляция","covers":["Инкапсуляция"],"text":"**Инкапсуляция** — данные и методы, которые с ними работают, живут вместе, а изменение данных идёт через методы, которые следят за правилами.\n\nВ Python нет строгих «private». Есть договорённость: `_name` — «внутреннее, не трогай», `__name` — Python дополнительно меняет имя на `_Класс__name`, чтобы случайно не перезаписать. В визуализаторе видно это изменённое имя.","code":"class BankAccount:\n    def __init__(self):\n        self.__balance = 0\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"Сумма должна быть > 0\")\n        self.__balance += amount\n\n    def balance(self):\n        return self.__balance\n\nacc = BankAccount()\nacc.deposit(100)\ntry:\n    acc.deposit(-5)\nexcept ValueError as e:\n    print(\"Отказ:\", e)\nprint(acc.balance())","key":["Данные меняются через методы, которые проверяют правила.","`_x` — внутреннее по соглашению, `__x` — с искажением имени."],"id":"7-2","narr":{"3":"Python превратит имя в _BankAccount__balance","6":"Метод следит за правилами"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":10,"e":"l","f":[0,4],"h":[0,1],"o":0},{"l":10,"e":"r","f":[0,5],"h":[0,1,2],"o":0,"rv":["p","None"],"fn":"BankAccount"},{"l":13,"e":"l","f":[6],"h":[3],"o":0},{"l":3,"e":"l","f":[6,7],"h":[3,4],"o":0},{"l":3,"e":"r","f":[6,7],"h":[3,5],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":14,"e":"l","f":[8],"h":[3,5],"o":0},{"l":6,"e":"l","f":[8,9],"h":[3,5],"o":0},{"l":8,"e":"l","f":[8,9],"h":[3,5],"o":0},{"l":8,"e":"r","f":[8,9],"h":[3,6],"o":0,"rv":["p","None"],"fn":"deposit"},{"l":15,"e":"l","f":[8],"h":[3,6],"o":0},{"l":16,"e":"l","f":[8],"h":[3,6],"o":0},{"l":6,"e":"l","f":[8,10],"h":[3,6],"o":0},{"l":7,"e":"l","f":[8,10],"h":[3,6],"o":0},{"l":7,"e":"e","f":[8,10],"h":[3,6],"o":0,"ex":"ValueError: Сумма должна быть > 0"},{"l":7," ,["r",6]]]},{"name":"balance()","vars":[["self",["r",5]]]}],"out":"Отказ: Сумма должна быть > 0\n100\n","error":null,"truncated":false},"deep":"Инкапсуляция защищает **инварианты** — правила, которые всегда должны быть верны (баланс ≥ 0, дата корректна). Состояние меняется только через методы, которые эти правила проверяют.\n\nВ Python нет модификаторов доступа. Двойное подчёркивание включает **name mangling**: `__balance` в классе `Account` превращается в `_Account__balance`. Это защита от случайного конфликта имён при наследовании, а не от злоумышленника.\n\n```\nclass A:\n    def __init__(self): self.__x = 1\nprint(A().__dict__)   # {'_A__x': 1}\n```\n\nДля контролируемого доступа к атрибуту используют `property` (раздел 13).","pitfalls":["Считать `__x` по-настоящему приватным — он доступен как `_Класс__x`.","Делать геттеры и сеттеры «на всякий случай» в стиле Java: в Python начинают с обычного атрибута и при необходимости превращают его в property."],"links":["13-1","7-1"],"checks":[{"q":"Что напечатает код?","options":["{'__x': 1}","{'_A__x': 1}","{}","Ошибка"],"answer":1,"why":"Имена с двумя подчёркиваниями в начале «искажаются»: к ним добавляется `_ИмяКласса`.","code":"class A:\n    def __init__(self):\n        self.__x = 1\nprint(A().__dict__)"},{"q":"Зачем нужна инкапсуляция?","options":["Чтобы код работал быстрее","Чтобы состояние менялось только через методы, сохраняющие правила (инварианты)","Чтобы скрыть код от пользователей","Чтобы уменьшить число классов"],"answer":1,"why":"Главная цель — защищать согласованность данных."}]},{"title":"Наследование и полиморфизм — коротко","covers":["Наследование","Полиморфизм"],"text":"**Наследование** — новый класс берёт всё у существующего и добавляет или меняет своё: `class Dog(Animal)`. **Полиморфизм** — разные объекты отвечают на одинаковый вызов по-своему: `animal.speak()` у собаки даёт «Гав», у кошки — «Мяу».\n\nОба кита подробно разобраны в разделах 8 и 9.","code":"class Animal:\n    def speak(self):\n        return \"...\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Гав\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Мяу\"\n\nfor pet in [Dog(), Cat(), Animal()]:\n    print(pet.speak())","key":["Наследование — повторное использование и уточнение.","Полиморфизм — один интерфейс, разные реализации."],"id":"7-3","narr":{"5":"Dog наследует всё от Animal","14":"Один вызов — разное поведение"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Animal"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":6,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Dog"},{"l":9,"e":"l","f":[8],"h":[1,3],"o":0},{"l":9,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":10,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":10,"e":"r","f":[8,11],"h":[1,3,4],"o":0,"rv":["p","None"],"fn":"Cat"},{"l":13,"e":"l","f":[12],"h":[1,3,5],"o":0},{"l":14,"e":"l","f":[13],"h":[1,3,5,6],"o":0},{"l":7,"e":"l","f":[13,14],"h":[1,3,5,6],"o":0},{"l":7,"e":"r","f":[13,14],"h":[1,3,5,6],"o":0,"rv":["p","'Гав'"],"fn":"speak"},{"l":13,"e":"l","f":[13],"h":[1,3,5,6],"o":4},{"l":14,"e":"l","f":[15],"h":[1,3,5,7],"o":4},{"l":11,"e":"l","f":[15,16],"h":[1,3,5,7],"o":4},{"l":11,"e":"r","f":[15,16],"h":[1,3,5,7],"o":4,"rv":["p","'Мяу'"],"fn":"speak"},{"l":13,"e":"l","f":[15],"h":[1,3,5,7],"o":8},{"l":14,"e":"l","f":[17],"h":[1,3,5,8],"o":8},{"l":3,"e":"l","f":[17,18],"h":[1,3,5,8],"o":8},{"l":3,"e":"r","f":[17,18],"h":[1,3,5,8],"o":8,"rv":["p","'...'"],"fn":"speak"},{"l":13,"e":"l","f":[17],"h":[1,3,5,8],"o":12},{"l":0,"e":"d","f":[17],"h":[1,3,5,8],"o":12}],"objs":[{"n":1,"k":"func","t":"function","name":"Animal.speak","sig":"(self)"},{"n":2,"k":"class","t":"class","name":"Animal","bases":[],"attrs":{"speak":["p","метод"]}},{"n":3,"k":"func","t":"function","name":"Dog.speak","sig":"(s вильно.","pitfalls":["Наследовать ради повторного использования кода, когда нет отношения «является» — лучше композиция.","Переопределять метод так, что он нарушает ожидания родителя (LSP)."],"links":["8-1","9-2","7-4"],"checks":[{"q":"Что напечатает код?","options":["... ...","Гав Мяу","Гав ...","Ошибка"],"answer":1,"why":"Каждый объект отвечает на `speak()` своей реализацией.","code":"class A:\n    def speak(self):\n        return '...'\nclass Dog(A):\n    def speak(self):\n        return 'Гав'\nclass Cat(A):\n    def speak(self):\n        return 'Мяу'\nprint(*[x.speak() for x in (Dog(), Cat())])"},{"q":"Что требует принцип подстановки Лисков?","options":["Наследовать от одного класса","Потомок должен работать везде, где ожидается родитель","Не переопределять методы","Использовать ABC"],"answer":1,"why":"Объекты подклассов должны быть взаимозаменяемы с объектами базового класса."}]},{"title":"Композиция","covers":["Композиция"],"text":"**Композиция** — объект **состоит** из других объектов и сам их создаёт. Части живут, пока жив целый объект. Машина создаёт свой двигатель — без машины этот двигатель не нужен.\n\nПравило дизайна: «предпочитай композицию наследованию» — собирать объекты из частей обычно гибче, чем строить глубокие иерархии.","code":"class Engine:\n    def __init__(self, hp):\n        self.hp = hp\n    def start(self):\n        return f\"Двигатель {self.hp} л.с. запущен\"\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine(150)\n\n    def drive(self):\n        return self.engine.start() + \", едем\"\n\ncar = Car()\nprint(car.drive())","key":["Композиция: «имеет часть», которую сам создаёт.","Жизнь части привязана к жизни целого."],"id":"7-4","narr":{"9":"Машина САМА создаёт свою деталь"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Engine"},{"l
