<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Python схема">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Python по схеме</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky top bar with XP + streak; home = progress dashboard + scheme tree + badges;
   section = lesson path; lesson = text + step visualizer (code / names → arrows → objects / output) + completion sheet. */
:root {
  --bg: #EDF1F4;
  --panel: #FFFFFF;
  --ink: #14202B;
  --muted: #5A6A77;
  --line: #D3DCE3;
  --accent: #2B66CF;
  --accent-ink: #FFFFFF;
  --hl: #FFD43B;
  --hl-soft: #FFF3C2;
  --prev-soft: #E3F1EA;
  --ok: #1E8F62;
  --ok-ink: #FFFFFF;
  --err: #C93F35;
  --err-soft: #FBE7E5;
  --code-bg: #F6F8FA;
  --flame: #F2701D;
  --xp: #7A4DE0;
  --shadow: 0 1px 2px rgb(20 32 43 / .06), 0 6px 20px rgb(20 32 43 / .06);
  --chip-l: 46%;
  --chip-s: 70%;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1318; --panel: #151D25; --ink: #E2E9EF; --muted: #8E9DAA; --line: #26323D;
    --accent: #6FA2FF; --accent-ink: #0D1318; --hl: #FFD43B; --hl-soft: #3A3317; --prev-soft: #16302A;
    --ok: #45C08D; --ok-ink: #0D1318; --err: #FF7B70; --err-soft: #3A1E1D; --code-bg: #10171D; --flame: #FF9248; --xp: #A889FF;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --chip-l: 68%; --chip-s: 75%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1318; --panel: #151D25; --ink: #E2E9EF; --muted: #8E9DAA; --line: #26323D;
  --accent: #6FA2FF; --accent-ink: #0D1318; --hl: #FFD43B; --hl-soft: #3A3317; --prev-soft: #16302A;
  --ok: #45C08D; --ok-ink: #0D1318; --err: #FF7B70; --err-soft: #3A1E1D; --code-bg: #10171D; --flame: #FF9248; --xp: #A889FF;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --chip-l: 68%; --chip-s: 75%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button, a { touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.press { transition: transform .12s ease; }
.press:active { transform: scale(.97); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 9px;
  display: flex; align-items: center; gap: 10px;
}
.bar .back { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px; cursor: pointer; font-weight: 600; }
.bar .crumb { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .crumb b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-code); padding: 4px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 14px; height: 14px; }
.pill.flame { color: var(--flame); }
.pill.flame.cold { color: var(--muted); }
.pill.xp { color: var(--xp); }
.pill.bump { animation: bump .6s ease; }
@keyframes bump { 30% { transform: scale(1.25); } }

main {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 72px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 clamp(24px, 6vw, 34px)/1.15 var(--f-display); letter-spacing: -0.01em; }
h2 { font: 600 17px/1.25 var(--f-display); }
.eyebrow { font: 600 11px var(--f-code); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sh { --c: hsl(var(--sh) var(--chip-s) var(--chip-l)); --c-ink: hsl(var(--sh) var(--chip-s) calc(var(--chip-l) - 10%)); --c-soft: hsl(var(--sh) var(--chip-s) var(--chip-l) / .14); }

/* ---------- dashboard ---------- */
.dash { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.lvl { position: relative; width: 76px; height: 76px; }
.lvl svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.lvl .n { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px var(--f-display); color: var(--xp); }
.lvl .n small { display: block; font: 600 9px var(--f-code); letter-spacing: .1em; color: var(--muted); text-align: center; margin-top: -4px; }
.lvname { font: 700 19px/1.2 var(--f-display); margin: 2px 0 8px; }
.xpbar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xpbar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--xp), var(--accent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.xpmeta { font: 500 12px var(--f-code); color: var(--muted); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.stat .big { display: flex; align-items: center; gap: 6px; font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; }
.stat .big svg { width: 20px; height: 20px; flex: none; }
.stat small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.stat.flame .big { color: var(--flame); }
.stat.flame.cold .big { color: var(--muted); }
.stat.goal .big { color: var(--ok); }
.stat.badges .big { color: var(--xp); }
.nudge { margin-top: 10px; font-size: 13.5px; background: color-mix(in srgb, var(--flame) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--flame) 35%, var(--line)); border-radius: 12px; padding: 8px 12px; }

.cta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-decoration: none; color: var(--ink); background: var(--panel); border: 1.5px solid var(--c); border-radius: 20px; padding: 14px 16px; margin-top: 14px; box-shadow: var(--shadow); }
.cta small { font: 600 11px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }
.cta .t { font: 600 17px/1.3 var(--f-body); grid-column: 1; }
.cta .go { grid-row: 1 / span 3; grid-column: 2; width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: var(--panel); display: grid; place-items: center; font-size: 22px; font-weight: 700; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 8px var(--c-soft); } }
.cta .sub { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.mini { display: flex; gap: 3px; grid-column: 1; margin-top: 4px; }
.mini i { flex: 1; height: 5px; border-radius: 99px; background: var(--line); max-width: 28px; }
.mini i.on { background: var(--c); }
.mini i.cur { background: var(--c); opacity: .45; }

.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-block: 14px 22px; }
.howto div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.howto b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
.howto .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* ---------- scheme tree ---------- */
.tree { font-family: var(--f-code); font-size: 14px; }
.tree .root { font: 700 18px var(--f-display); color: var(--accent); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
.tree .root span { font: 500 12px var(--f-code); color: var(--muted); }
.sec { position: relative; padding-left: 26px; }
.sec::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.sec:last-child::before { bottom: calc(100% - 26px); }
.sec > .head::before { content: ""; position: absolute; left: -19px; top: 25px; width: 16px; border-top: 2px solid var(--line); }
.sec > .head {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-block: 6px; cursor: pointer;
}
.sec.full > .head { background: var(--c-soft); border-color: var(--c); }
.sec > .head .num { font: 700 12px var(--f-code); color: var(--panel); background: var(--c); min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-variant-numeric: tabular-nums; flex: none; }
.sec > .head .nm { flex: 1; min-width: 0; font: 600 14px var(--f-body); }
.sec > .head .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec > .head .ring { width: 26px; height: 26px; flex: none; }
.items { padding-left: 22px; margin-bottom: 6px; position: relative; }
.items a { position: relative; display: flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 5px 6px; border-radius: 8px; font-size: 13.5px; }
.items a::before { content: "├─"; color: var(--line); }
.items a:last-child::before { content: "└─"; }
.items a:hover { background: var(--c-soft); }
.items a .ok { color: var(--c-ink); font-weight: 700; }
.items a .tag { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }

/* ---------- badges ---------- */
.badges-h { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 10px; }
.badges-h span { font: 500 12px var(--f-code); color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 10px; text-align: center; display: grid; justify-items: center; gap: 4px; }
.badge svg { width: 48px; height: 48px; }
.badge b { font-size: 12.5px; line-height: 1.2; }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.25; }
.badge.locked svg { filter: grayscale(1); opacity: .35; }
.badge.locked b { color: var(--muted); }

/* ---------- section path ---------- */
.sec-head { display: grid; gap: 8px; }
.sec-intro { color: var(--muted); margin: 0; max-width: 62ch; }
.secbar { display: flex; align-items: center; gap: 10px; font: 600 12px var(--f-code); color: var(--muted); }
.secbar .xpbar { flex: 1; height: 8px; }
.secbar .xpbar > i { background: var(--c); }
.path { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 0; }
.path li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; position: relative; }
.path li::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: -6px; border-left: 3px solid var(--line); }
.path li.done::before { border-color: var(--c); }
.path li:last-child::before { display: none; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-code); background: var(--panel); border: 3px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
.path li.done .node { background: var(--c); border-color: var(--c); color: var(--panel); }
.path li.next .node { border-color: var(--c); color: var(--c-ink); animation: breathe 2.4s ease-in-out infinite; }
.path a.card { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.path li.next a.card { border-color: var(--c); box-shadow: var(--shadow); }
.path .t { font-weight: 600; }
.path .c { font: 12px var(--f-code); color: var(--muted); margin-top: 2px; }
.path .lbl { font: 600 10px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }

/* ---------- lesson ---------- */
.lhead { display: grid; gap: 8px; }
.lhead .eyebrow { color: var(--c-ink); }
.covers { display: flex; flex-wrap: wrap; gap: 6px; }
.covers span { font: 500 12px var(--f-code); background: var(--c-soft); color: var(--c-ink); border-radius: 99px; padding: 2px 9px; }
.prose { margin-top: 14px; }
.prose p { margin: 0 0 12px; max-width: 65ch; }
.prose code, .key code, .narr code, .quiz code { font: 0.9em var(--f-code); background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.analogy { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--hl-soft); border-radius: var(--r); padding: 12px 14px; margin: 4px 0 18px; font-size: 15px; }
.analogy .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--hl); display: grid; place-items: center; }
.analogy .ic svg { width: 20px; height: 20px; }
.analogy b { font-family: var(--f-display); font-size: 11px; letter-spacing: .08em; display: block; margin-bottom: 2px; }

.viz { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-block: 8px 18px; box-shadow: var(--shadow); }
.viz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; }
.viz-top .eyebrow { color: var(--accent); }
.viz-top .stepno { font: 600 12px var(--f-code); color: var(--muted); font-variant-numeric: tabular-nums; }
.viz-top .vt-r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.viz-top .solved.todo { color: var(--xp); background: color-mix(in srgb, var(--xp) 12%, var(--panel)); }
.viz-top .solved { font: 600 11px var(--f-code); color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); border-radius: 99px; padding: 2px 8px; }
.stepbar { height: 4px; background: var(--line); }
.stepbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .3s ease; }
.codebox { max-height: 42vh; overflow: auto; background: var(--code-bg); border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.code { font: 13px/1.6 var(--f-code); padding: 8px 0; min-width: max-content; }
.ln { display: grid; grid-template-columns: 22px 34px auto; padding-right: 14px; white-space: pre; transition: background .25s ease; }
.ln .ar { text-align: center; font-weight: 700; }
.ln .no { color: var(--muted); text-align: right; padding-right: 10px; opacity: .7; user-select: none; }
.ln.cur { background: var(--hl-soft); box-shadow: inset 3px 0 0 var(--hl); }
.ln.cur .ar { color: var(--ink); }
.ln.cur .ar::before { content: "➜"; }
.ln.prev { background: var(--prev-soft); }
.ln.prev .ar { color: var(--ok); }
.ln.prev .ar::before { content: "✓"; }
.ln.cur.prev .ar::before { content: "➜"; }
.tk-kw { color: #8A3FD1; font-weight: 600; } .tk-str { color: #1B7F4C; } .tk-num { color: #C0561B; } .tk-com { color: var(--muted); font-style: italic; }
.tk-fn { color: var(--accent); } .tk-bi { color: #B0306A; } .tk-dec { color: #B07A00; }
:root[data-theme="dark"] .tk-kw { color: #C79BFF; } :root[data-theme="dark"] .tk-str { color: #7FD6A4; } :root[data-theme="dark"] .tk-num { color: #FFA86B; } :root[data-theme="dark"] .tk-bi { color: #FF8CC0; } :root[data-theme="dark"] .tk-dec { color: #FFD166; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tk-kw { color: #C79BFF; } :root:not([data-theme="light"]) .tk-str { color: #7FD6A4; } :root:not([data-theme="light"]) .tk-num { color: #FFA86B; } :root:not([data-theme="light"]) .tk-bi { color: #FF8CC0; } :root:not([data-theme="light"]) .tk-dec { color: #FFD166; } }

.narr { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: 14.5px; min-height: 70px; }
.narr .nx { display: flex; gap: 8px; animation: rise .3s ease; }
@keyframes rise { from { transform: translateY(4px); opacity: .4; } }
.narr .nx > i { font-style: normal; flex: none; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 7px; display: grid; place-items: center; font: 700 11px var(--f-code); }
.narr .nx.next > i { background: var(--hl); color: #14202B; }
.narr .nx.done > i { background: var(--ok); color: var(--ok-ink); }
.narr .nx.bad > i { background: var(--err); color: var(--panel); }
.narr .nx > span { min-width: 0; }
.narr .chg { color: var(--muted); font-size: 13.5px; display: grid; gap: 2px; }
.narr .chg div::before { content: "• "; color: var(--accent); }
.narr .chg b { color: var(--ink); font-family: var(--f-code); font-weight: 600; }
.narr .hint { color: var(--muted); font-size: 13px; }

.ctrl { display: grid; grid-template-columns: 1fr 1fr 1.6fr 1fr 1fr; gap: 6px; padding: 10px 12px 4px; }
.ctrl button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 11px 0; font-size: 17px; cursor: pointer; transition: transform .12s ease; }
.ctrl button:active { transform: scale(.94); }
.ctrl button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.ctrl button.main.hint { animation: breathe-a 1.8s ease-in-out infinite; }
@keyframes breathe-a { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 22%, transparent); } }
.ctrl button:disabled { opacity: .35; }
.scrub { padding: 6px 14px 10px; }
.scrub input { width: 100%; accent-color: var(--accent); }

.mem { position: relative; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); column-gap: 34px; row-gap: 14px; padding: 14px 26px 16px 14px; border-top: 1px solid var(--line); }
.mem.single { grid-template-columns: minmax(0, 1fr); padding-right: 14px; }
.mem h3 { font: 600 10.5px var(--f-code); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
.arrows path.ln-a { fill: none; stroke-width: 2; stroke-linecap: round; opacity: .8; }
.arrows path.ln-a.draw { animation: draw .6s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.frames, .heap { display: grid; gap: 8px; align-content: start; min-width: 0; position: relative; z-index: 1; }
.frame { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.frame.top { border-color: var(--accent); }
.frame.enter, .obj.enter { animation: enter .35s cubic-bezier(.2,.8,.2,1.2); }
@keyframes enter { from { transform: scale(.92); opacity: .3; } }
.frame .fh { font: 600 11.5px var(--f-code); padding: 5px 9px; background: var(--code-bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; overflow-wrap: anywhere; }
.frame.top .fh { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.frame .empty { padding: 6px 10px; color: var(--muted); font-size: 12px; }
.row { display: grid; grid-template-columns: minmax(36px, max-content) minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 9px; font: 12.5px var(--f-code); border-top: 1px dashed var(--line); }
.row:first-of-type { border-top: 0; }
.row .k { color: var(--muted); overflow-wrap: anywhere; }
.row .v { overflow-wrap: anywhere; min-width: 0; }
.row.flash, .obj.flash { animation: flash 1.1s ease-out; }

<script id="data" type="application/json">{"sections":[{"title":"Базовая модель языка","items":["Переменная","Объект","Значение","Тип","Ссылка","Выражение","Оператор","Инструкция","Блок кода","Состояние"],"intro":"Фундамент: из чего вообще состоит программа на Python и как она «думает». Если понять этот раздел, всё остальное станет вариациями на тему.","lessons":[{"title":"Переменная — это имя-ярлык","covers":["Переменная"],"text":"Переменная в Python — это **имя**, которое привязано к объекту. Сама по себе она ничего не «хранит внутри», она просто указывает на данные.\n\nЗапись `x = 10` читается справа налево: сначала Python вычисляет правую часть (получает объект `10`), потом приклеивает к нему имя `x`. Если потом написать `x = x + 5`, Python посчитает `x + 5`, получит новый объект `15` и переклеит ярлык `x` на него.","analogy":"Объекты — это коробки на складе, а переменная — бумажный ярлык с надписью на верёвочке. Ярлык можно перевязать на другую коробку, а на одну коробку можно повесить несколько ярлыков.","code":"name = \"Аня\"\nage = 17\nage = age + 1\ngreeting = \"Привет, \" + name\nprint(greeting, \"тебе\", age)","key":["`=` — это не «равно», а «назначить имя».","Сначала вычисляется правая часть, потом имя привязывается к результату.","Имя можно перепривязать сколько угодно раз."],"quiz":{"q":"Что окажется в `a` после строк `a = 3`, `a = a * 2`, `a = a - 1`?","options":["3","5","6","Ошибка"],"answer":1,"why":"3 → 3·2 = 6 → 6 − 1 = 5. Каждый раз имя `a` переклеивается на новый результат."},"id":"1-1","narr":{"1":"Создаём строку \"Аня\" и вешаем на неё ярлык name","2":"Новое имя age указывает на число 17","3":"Сначала считается правая часть: 17 + 1 = 18. Потом ярлык age переносится на 18","4":"Склеиваем две строки в новую и называем её greeting","5":"print выводит значения через пробел"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[2],"h":[],"o":0},{"l":4,"e":"l","f":[3],"h":[],"o":0},{"l":5,"e ие мысленно отслеживать состояние — главный навык программиста: так находят ошибки.","analogy":"Шахматная партия: состояние — это расстановка фигур. Каждый ход (инструкция) меняет расстановку.","code":"balance = 100\nhistory = []\nbalance = balance - 30\nhistory.append(-30)\nbalance = balance + 50\nhistory.append(50)\nprint(\"Баланс:\", balance, \"История:\", history)","key":["Состояние = все имена + все объекты + их содержимое.","Каждый шаг программы меняет состояние.","Отладка — это сравнение ожидаемого и реального состояния."],"id":"1-6","narr":{"1":"Состояние: balance = 100","2":"Добавился пустой список history","3":"Покупка: balance меняется на 70","4":"И в истории появилась запись","5":"Пополнение"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[2],"h":[0],"o":0},{"l":4,"e":"l","f":[3],"h":[0],"o":0},{"l":5,"e":"l","f":[3],"h":[1],"o":0},{"l":6,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4],"h":[2],"o":0},{"l":0,"e":"d","f":[4],"h":[2],"o":31}],"objs":[{"n":1,"k":"list","t":"list","items":[],"more":0},{"n":1,"k":"list","t":"list","items":[["p","-30"]],"more":0},{"n":1,"k":"list","t":"list","items":[["p","-30"],["p","50"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["balance",["p","100"]]]},{"name":"глобальная область","vars":[["balance",["p","100"]],["history",["r",1]]]},{"name":"глобальная область","vars":[["balance",["p","70"]],["history",["r",1]]]},{"name":"глобальная область","vars":[["balance",["p","120"]],["history",["r",1]]]}],"out":"Баланс: 120 История: [-30, 50]\n","error":null,"truncated":false}}]},{"title":"Типы данных","items":["int","float","bool","str","None","list","tuple","set","dict","пользовательские типы"],"intro":"Встроенные «кирпичики» данных. Главное деление: неизменяемые (int, float, bool, str, None, tuple) и изменяемые (list, set, dict).","lessons":[{"title":"Числа: int и float","covers":["int","float"],"text":" няется сверху вниз. Конструкции этого раздела позволяют выбирать ветку, повторять и прыгать. Здесь визуализатор особенно полезен: смотри, как жёлтая стрелка скачет по строкам.","lessons":[{"title":"Ветвление: if / elif / else","covers":["if / elif / else"],"text":"`if` проверяет условие. Если оно истинно — выполняется его блок, и остальные ветки пропускаются. Если ложно — Python проверяет следующий `elif`, и так далее. `else` срабатывает, когда ни одно условие не подошло.\n\nПроверки идут **по порядку**, и срабатывает только **первая** подходящая ветка. Посмотри на шагах, как стрелка перепрыгивает через ненужные ветки.","analogy":"Развилка дорог с указателями: идёшь по первой дороге, чей указатель тебе подходит, и больше не оглядываешься.","code":"for score in [95, 72, 40]:\n    if score >= 90:\n        grade = \"отлично\"\n    elif score >= 60:\n        grade = \"хорошо\"\n    else:\n        grade = \"надо подтянуть\"\n    print(score, grade)","key":["Срабатывает только первая истинная ветка.","`elif` проверяется, только если все предыдущие условия ложны.","`else` — «во всех остальных случаях»."],"quiz":{"q":"Что выведет код при `x = 15`: `if x > 10: print('A')` / `elif x > 5: print('B')` / `else: print('C')`?","options":["A","B","A и B","C"],"answer":0,"why":"Первая же подходящая ветка (`x > 10`) срабатывает, остальные пропускаются, хотя `x > 5` тоже правда."},"id":"3-1","narr":{"1":"Проверим три разных балла","2":"Первая проверка","4":"Сюда попадаем, только если первая проверка не прошла","7":"Ни одна проверка не прошла"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":0},{"l":8,"e":"l","f":[2],"h":[],"o":0},{"l":1,"e":"l","f":[2],"h":[],"o":11},{"l":2,"e":"l","f":[3],"h":[],"o":11},{"l":4,"e":"l","f":[3],"h":[],"o":11},{"l":5,"e":"l","f":[3],"h":[],"o":11},{"l":8,"e":"l","f":[4],"h":[],"o":11},{"l":1,"e":"l","f":[4],"h":[],"o":21},{"l":2,"e":"l","f":[5],"h":[],"o":21},{"l":4,"e":"l","f lt\n\nroom = area(3, 4)\nhall = area(2, 5)\nprint(room, hall)","key":["`def` создаёт функцию, вызов `f()` её запускает.","Каждый вызов — новый кадр со своими переменными.","`return` возвращает значение и завершает функцию."],"id":"4-1","narr":{"1":"def создаёт объект-функцию, но тело пока НЕ выполняется","2":"Мы внутри нового кадра area()","3":"Отдаём значение наружу, кадр будет закрыт","5":"Вызов: создаётся кадр, width=3, height=4","6":"Второй вызов — новый, чистый кадр"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":3,"e":"l","f":[1,3],"h":[0],"o":0},{"l":3,"e":"r","f":[1,3],"h":[0],"o":0,"rv":["p","12"],"fn":"area"},{"l":6,"e":"l","f":[4],"h":[0],"o":0},{"l":2,"e":"l","f":[4,5],"h":[0],"o":0},{"l":3,"e":"l","f":[4,6],"h":[0],"o":0},{"l":3,"e":"r","f":[4,6],"h":[0],"o":0,"rv":["p","10"],"fn":"area"},{"l":7,"e":"l","f":[7],"h":[0],"o":0},{"l":0,"e":"d","f":[7],"h":[0],"o":6}],"objs":[{"n":1,"k":"func","t":"function","name":"area","sig":"(width, height)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["area",["r",1]]]},{"name":"area()","vars":[["width",["p","3"]],["height",["p","4"]]]},{"name":"area()","vars":[["width",["p","3"]],["height",["p","4"]],["result",["p","12"]]]},{"name":"глобальная область","vars":[["area",["r",1]],["room",["p","12"]]]},{"name":"area()","vars":[["width",["p","2"]],["height",["p","5"]]]},{"name":"area()","vars":[["width",["p","2"]],["height",["p","5"]],["result",["p","10"]]]},{"name":"глобальная область","vars":[["area",["r",1]],["room",["p","12"]],["hall",["p","10"]]]}],"out":"12 10\n","error":null,"truncated":false}},{"title":"Параметры и аргументы","covers":["параметры","аргументы"],"text":"**Параметры** — имена в определении функции: `def greet(name, greeting=\"Привет\")`. **Аргументы** — конкретные значения при вызове: `greet(\"Аня\")`.\n\nАргументы можно передавать **по позиции** (по порядку) или **по local / global"],"text":"Имена, созданные внутри функции, — **локальные**: они живут только в её кадре и не видны снаружи. Имена в начале файла — **глобальные**.\n\nPython ищет имя по правилу **LEGB**: Local → Enclosing (внешняя функция) → Global → Built-in. Читать глобальное имя внутри функции можно, а чтобы **перепривязать** его, нужно объявить `global name`. Обычно этого лучше избегать и возвращать значения через `return`.","code":"counter = 0\nlabel = \"глоб\"\n\ndef show():\n    label = \"лок\"\n    print(label, counter)\n\ndef increment():\n    global counter\n    counter = counter + 1\n\nshow()\nincrement()\nincrement()\nprint(label, counter)","key":["Присваивание внутри функции создаёт локальное имя.","Поиск имён: Local → Enclosing → Global → Built-in.","`global` позволяет менять глобальное имя, но лучше возвращать значения."],"id":"4-3","narr":{"1":"Глобальное имя","5":"Это НОВОЕ локальное имя, глобальное не трогаем","6":"label найден в локальной области, counter — в глобальной","10":"Из-за «global counter» выше меняется ГЛОБАЛЬНОЕ имя"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[],"o":0},{"l":4,"e":"l","f":[2],"h":[],"o":0},{"l":8,"e":"l","f":[3],"h":[0],"o":0},{"l":12,"e":"l","f":[4],"h":[0,1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[0,1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[0,1],"o":0},{"l":6,"e":"r","f":[4,6],"h":[0,1],"o":6,"rv":["p","None"],"fn":"show"},{"l":13,"e":"l","f":[4],"h":[0,1],"o":6},{"l":10,"e":"l","f":[4,7],"h":[0,1],"o":6},{"l":10,"e":"r","f":[8,7],"h":[0,1],"o":6,"rv":["p","None"],"fn":"increment"},{"l":14,"e":"l","f":[8],"h":[0,1],"o":6},{"l":10,"e":"l","f":[8,7],"h":[0,1],"o":6},{"l":10,"e":"r","f":[9,7],"h":[0,1],"o":6,"rv":["p","None"],"fn":"increment"},{"l":15,"e":"l","f":[9],"h":[0,1],"o":6},{"l":0,"e":"d","f":[9],"h":[0,1],"o":13}],"objs":[{"n":1,"k":"func","t":"function","name":"show","sig":"()"},{"n":2,"k":"func","t":"function","name":"increment","sig":"()"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["counter",["p","0"]]]},{"name":"глобальная область","vars":[["counter",["p","0"]],["label",["p","'глоб'"]]]},{"name":"глобальная область","vars":[["counter",["p","0"]],["label",["p","'глоб'"]],["show",["r",1]]]},{"name":"глобальная область","vars":[["counter",["p","0"]],["label",["p","'глоб'"]],["show",["r",1]],["increment",["r",2]]]},{"name":"show()","vars":[]},{"name":"show()","vars":[["label",["p","'лок'"]]]},{"name":"increment()","vars":[]},{"name":"глобальная область","vars":[["counter",["p","1"]],["label",["p","'глоб'"]],["show",["r",1]],["increment",["r",2]]]},{"name":"глобальная область","vars":[["counter",["p","2"]],["label",["p","'глоб'"]],["show",["r",1]],["increment",["r",2]]]}],"out":"лок 0\nглоб 2\n","error":null,"truncated":false}},{"title":"*args и **kwargs","covers":["*args","**kwargs"],"text":"`*args` собирает все «лишние» позиционные аргументы в **кортеж**. `**kwargs` собирает все «лишние» именованные аргументы в **словарь**. Имена `args` и `kwargs` — традиция, важны звёздочки.\n\nЗвёздочки работают и в обратную сторону: `f(*lst)` распаковывает список в позиционные аргументы, `f(**d)` — словарь в именованные.","code":"def report(title, *args, **kwargs):\n    print(title, args, kwargs)\n    return sum(args)\n\nreport(\"Числа\", 1, 2, 3, unit=\"кг\", note=\"ok\")\ndata = [10, 20]\nopts = {\"unit\": \"м\"}\ntotal = report(\"Распаковка\", *data, **opts)\nprint(total)","key":["`*args` → tuple позиционных аргументов.","`**kwargs` → dict именованных.","`*` и `**` при вызове — распаковка."],"id":"4-4","narr":{"1":"title — обычный параметр","2":"args — кортеж, kwargs — словарь","8":"* и ** распаковывают коллекции в аргументы"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":5,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0,1,2],"o":0},{"l":3,"e":"l","f":[1,2],"h":[0,1,2],"o":45},{"l":3,"e":"r","f":[1,2],"h":[0,1,2],"o":45,"rv":["p","6"],"fn":"report"},{"l":6,"e":"l","f":[1],"h яти.","code":"double = lambda x: x * 2\nprint(double(5))\npeople = [(\"Аня\", 17), (\"Боря\", 25), (\"Вика\", 20)]\nby_age = sorted(people, key=lambda p: p[1])\nprint(by_age)\nevens = list(filter(lambda n: n % 2 == 0, range(7)))\nprint(evens)","key":["`lambda аргументы: выражение`.","Удобна как короткий аргумент для `sorted`, `map`, `filter`.","Если логика длинная — пиши `def`."],"id":"4-5","narr":{"1":"Функция-объект без имени, присвоенная переменной","4":"key говорит sorted, по чему сравнивать","6":"filter оставляет элементы, для которых lambda дала True"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":1,"e":"l","f":[1,2],"h":[0],"o":0},{"l":1,"e":"r","f":[1,2],"h":[0],"o":0,"rv":["p","10"],"fn":"<lambda>"},{"l":3,"e":"l","f":[1],"h":[0],"o":3},{"l":4,"e":"l","f":[3],"h":[0,1,2,3,4],"o":3},{"l":4,"e":"l","f":[3,4],"h":[0,1,2,3,4],"o":3},{"l":4,"e":"r","f":[3,4],"h":[0,1,2,3,4],"o":3,"rv":["p","17"],"fn":"<lambda>"},{"l":4,"e":"l","f":[3,5],"h":[0,1,2,3,4],"o":3},{"l":4,"e":"r","f":[3,5],"h":[0,1,2,3,4],"o":3,"rv":["p","25"],"fn":"<lambda>"},{"l":4,"e":"l","f":[3,6],"h":[0,1,2,3,4],"o":3},{"l":4,"e":"r","f":[3,6],"h":[0,1,2,3,4],"o":3,"rv":["p","20"],"fn":"<lambda>"},{"l":5,"e":"l","f":[7],"h":[0,1,2,3,4,5],"o":3},{"l":6,"e":"l","f":[7],"h":[0,1,2,3,4,5],"o":45},{"l":6,"e":"l","f":[7,8],"h":[0,1,2,3,4,5],"o":45},{"l":6,"e":"r","f":[7,8],"h":[0,1,2,3,4,5],"o":45,"rv":["p","True"],"fn":"<lambda>"},{"l":6,"e":"l","f":[7,9],"h":[0,1,2,3,4,5],"o":45},{"l":6,"e":"r","f":[7,9],"h":[0,1,2,3,4,5],"o":45,"rv":["p","False"],"fn":"<lambda>"},{"l":6,"e":"l","f":[7,10],"h":[0,1,2,3,4,5],"o":45},{"l":6,"e":"r","f":[7,10],"h":[0,1,2,3,4,5],"o":45,"rv":["p","True"],"fn":"<lambda>"},{"l":6,"e":"l","f":[7,11],"h":[0,1,2,3,4,5],"o":45},{"l":6,"e":"r","f":[7,11],"h":[0,1,2,3,4,5],"o":45,"rv":["p","False"],"fn":"<lambda>"},{"l":6,"e":"l","f":[7,12],"h":[0,1,2,3,4,5],"o":45},{"l":6,"e":"r","f":[7,12],"h":[0,1,2,3,4,5],"o":45,"rv":["p","T ":"Функция, созданная внутри другой функции, **запоминает** переменные внешней функции, даже когда та уже завершилась. Такая функция называется **замыканием**.\n\nВ визуализаторе у объекта-функции появляется строка «замыкание: …» — это и есть «рюкзак» с запомненными переменными. `nonlocal` позволяет внутренней функции менять такую переменную.","analogy":"Внутренняя функция уходит из дома (внешней функции) с рюкзаком, в который положила нужные переменные.","code":"def make_counter(start):\n    count = start\n    def step():\n        nonlocal count\n        count = count + 1\n        return count\n    return step\n\nc = make_counter(10)\nprint(c())\nprint(c())\nd = make_counter(100)\nprint(d(), c())","key":["Замыкание = функция + запомненные переменные внешней области.","`nonlocal` — менять переменную внешней функции.","Каждый вызов внешней функции создаёт новое замыкание."],"id":"4-6","narr":{"2":"Переменная внешней функции","5":"Благодаря nonlocal меняем count из «рюкзака» замыкания","7":"Возвращаем саму функцию, а не результат вызова","9":"make_counter завершилась, но count живёт в замыкании","12":"Новый вызов — новый, независимый «рюкзак»"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":9,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0],"o":0},{"l":3,"e":"l","f":[1,3],"h":[0],"o":0},{"l":7,"e":"l","f":[1,4],"h":[0,1],"o":0},{"l":7,"e":"r","f":[1,4],"h":[0,1],"o":0,"rv":["r",2],"fn":"make_counter"},{"l":10,"e":"l","f":[5],"h":[0,1],"o":0},{"l":5,"e":"l","f":[5,6],"h":[0,1],"o":0},{"l":6,"e":"l","f":[5,7],"h":[0,2],"o":0},{"l":6,"e":"r","f":[5,7],"h":[0,2],"o":0,"rv":["p","11"],"fn":"step"},{"l":11,"e":"l","f":[5],"h":[0,2],"o":3},{"l":5,"e":"l","f":[5,7],"h":[0,2],"o":3},{"l":6,"e":"l","f":[5,8],"h":[0,3],"o":3},{"l":6,"e":"r","f":[5,8],"h":[0,3],"o":3,"rv":["p","12"],"fn":"step"},{"l":12,"e":"l","f":[5],"h":[0,3],"o":6},{"l":2,"e":"l","f":[5,9],"h":[0,3],"o":6},{"l":3,"e":"l","f":[5,10],"h":[0,3],"o":6},{"l":7,"e":"l","f":[5,11],"h":[0, ":[{"n":1,"k":"func","t":"function","name":"factorial","sig":"(n)"}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["factorial",["r",1]]]},{"name":"factorial()","vars":[["n",["p","4"]]]},{"name":"factorial()","vars":[["n",["p","3"]]]},{"name":"factorial()","vars":[["n",["p","2"]]]},{"name":"factorial()","vars":[["n",["p","1"]]]}],"out":"24\n","error":null,"truncated":false}},{"title":"Генераторы (кратко)","covers":["генераторы"],"text":"Если в функции есть `yield`, она становится **генератором**: вызов не выполняет тело, а возвращает объект-генератор. Каждый `next()` запускает тело до следующего `yield`, отдаёт значение и **ставит функцию на паузу**, сохраняя все локальные переменные.\n\nПодробно — в разделе 19 «Итераторы и генераторы».","code":"def countdown(n):\n    while n > 0:\n        yield n\n        n -= 1\n\ngen = countdown(3)\nprint(next(gen))\nprint(next(gen))\nfor rest in gen:\n    print(\"for:\", rest)","key":["`yield` превращает функцию в генератор.","Генератор помнит, где остановился.","Значения создаются по одному, по запросу."],"id":"4-8","narr":{"3":"Отдаём n и замираем до следующего запроса","6":"Тело ещё не выполнялось — создан объект-генератор","7":"Запускаем до первого yield","8":"Продолжаем с места остановки","9":"for сам вызывает next, пока генератор не закончится"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":2,"e":"l","f":[2,3],"h":[0,2],"o":0},{"l":3,"e":"l","f":[2,3],"h":[0,2],"o":0},{"l":3,"e":"r","f":[2,3],"h":[0,3],"o":0,"rv":["p","3"],"fn":"countdown"},{"l":8,"e":"l","f":[2],"h":[0,3],"o":2},{"l":4,"e":"l","f":[2,3],"h":[0,2],"o":2},{"l":2,"e":"l","f":[2,4],"h":[0,2],"o":2},{"l":3,"e":"l","f":[2,4],"h":[0,2],"o":2},{"l":3,"e":"r","f":[2,4],"h":[0,4],"o":2,"rv":["p","2"],"fn":"countdown"},{"l":9,"e":"l","f":[2],"h":[0,4],"o":4},{"l":4,"e":"l","f":[2,4],"h":[0,2],"o":4},{"l":2,"e":"l","f":[2,5],"h":[0,2]," (name).upper() + \"!!!\"\n    return wrapper\n\n@loud\ndef hello(name):\n    return \"привет, \" + name\n\nprint(hello(\"мир\"))","key":["`@deco` над функцией = `f = deco(f)`.","Декоратор добавляет поведение, не меняя код функции."],"id":"4-9","narr":{"3":"Вызываем оригинал и усиливаем результат","6":"Эквивалентно: hello = loud(hello)","10":"На самом деле вызывается wrapper"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":6,"e":"l","f":[1],"h":[0],"o":0},{"l":2,"e":"l","f":[1,2],"h":[0,1],"o":0},{"l":4,"e":"l","f":[1,3],"h":[0,1,2],"o":0},{"l":4,"e":"r","f":[1,3],"h":[0,1,2],"o":0,"rv":["r",3],"fn":"loud"},{"l":7,"e":"l","f":[1],"h":[0],"o":0},{"l":10,"e":"l","f":[4],"h":[0,1,2],"o":0},{"l":3,"e":"l","f":[4,5],"h":[0,1,2],"o":0},{"l":8,"e":"l","f":[4,5,6],"h":[0,1,2],"o":0},{"l":8,"e":"r","f":[4,5,6],"h":[0,1,2],"o":0,"rv":["p","'привет, мир'"],"fn":"hello"},{"l":3,"e":"r","f":[4,5],"h":[0,1,2],"o":0,"rv":["p","'ПРИВЕТ, МИР!!!'"],"fn":"wrapper"},{"l":0,"e":"d","f":[4],"h":[0,1,2],"o":15}],"objs":[{"n":1,"k":"func","t":"function","name":"loud","sig":"(func)"},{"n":2,"k":"func","t":"function","name":"hello","sig":"(name)"},{"n":3,"k":"func","t":"function","name":"loud.<locals>.wrapper","sig":"(name)","cells":{"func":["r",2]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["loud",["r",1]]]},{"name":"loud()","vars":[["func",["r",2]]]},{"name":"loud()","vars":[["func",["r",2]],["wrapper",["r",3]]]},{"name":"глобальная область","vars":[["loud",["r",1]],["hello",["r",3]]]},{"name":"wrapper()","vars":[["name",["p","'мир'"]],["func",["r",2]]]},{"name":"hello()","vars":[["name",["p","'мир'"]]]}],"out":"ПРИВЕТ, МИР!!!\n","error":null,"truncated":false}}]},{"title":"Объектная модель","items":["объект","identity","type","attribute","method","ссылка","пространство имён"],"intro":"Как Python видит мир изнутри: всё — объекты, у объектов есть атрибуты, а имена живут в пространствах имён.","lessons":[{"title":"В Python всё — объект","covers":["объект"],"text":"Числа, строки, списки, функции, классы, модули — **всё** в Python является объектом. Функцию можно положить в список, передать в другую функцию, у класса можно спросить его имя.\n\nПосмотри, как в одном списке лежат число, строка, функция и класс — и у каждого есть тип.","code":"def hello():\n    return \"hi\"\n\nclass Cat:\n    pass\n\nthings = [42, \"текст\", hello, Cat]\nfor t in things:\n    print(type(t).__name__)\nf = things[2]\nprint(f())","key":["Всё — объект: даже функции и классы.","Объекты можно хранить, передавать и возвращать."],"id":"5-1","narr":{"7":"Функция и класс лежат в списке, как обычные данные","9":"У каждого объекта есть тип","10":"Достаём функцию из списка…","11":"…и вызываем её"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":4,"e":"l","f":[1,2],"h":[0],"o":0},{"l":5,"e":"l","f":[1,3],"h":[0],"o":0},{"l":5,"e":"r","f":[1,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Cat"},{"l":7,"e":"l","f":[4],"h":[0,1],"o":0},{"l":8,"e":"l","f":[5],"h":[0,1,2],"o":0},{"l":9,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":8,"e":"l","f":[6],"h":[0,1,2],"o":4},{"l":9,"e":"l","f":[7],"h":[0,1,2],"o":4},{"l":8,"e":"l","f":[7],"h":[0,1,2],"o":8},{"l":9,"e":"l","f":[8],"h":[0,1,2],"o":8},{"l":8,"e":"l","f":[8],"h":[0,1,2],"o":17},{"l":9,"e":"l","f":[9],"h":[0,1,2],"o":17},{"l":8,"e":"l","f":[9],"h":[0,1,2],"o":22},{"l":10,"e":"l","f":[9],"h":[0,1,2],"o":22},{"l":11,"e":"l","f":[10],"h":[0,1,2],"o":22},{"l":2,"e":"l","f":[10,11],"h":[0,1,2],"o":22},{"l":2,"e":"r","f":[10,11],"h":[0,1,2],"o":22,"rv":["p","'hi'"],"fn":"hello"},{"l":0,"e":"d","f":[10],"h":[0,1,2],"o":25}],"objs":[{"n":1,"k":"func","t":"function","name":"hello","sig":"()"},{"n":2,"k":"class","t":"class","name":"Cat","bases":[],"attrs":{}},{"n":3,"k":"list","t":"list","items":[["p","42"],["p","'текст'"],["r",1],["r",2]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["hello",["r",1]]]},{"name":"Cat()","vars":[]},{"name":"тело класса Cat","vars":[]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]]]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]],["things",["r",3]]]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]],["things",["r",3]],["t",["p","42"]]]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]],["things",["r",3]],["t",["p","'текст'"]]]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]],["things",["r",3]],["t",["r",1]]]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]],["things",["r",3]],["t",["r",2]]]},{"name":"глобальная область","vars":[["hello",["r",1]],["Cat",["r",2]],["things",["r",3]],["t",["r",2]],["f",["r",1]]]},{"name":"hello()","vars":[]}],"out":"int\nstr\nfunction\ntype\nhi\n","error":null,"truncated":false}},{"title":"identity и type","covers":["identity","type"],"opts":{"heap_all":true},"text":"**identity** — уникальный номер объекта на время его жизни (`id(obj)`). Оператор `is` сравнивает именно identity. **type** — класс объекта (`type(obj)`); он не меняется после создания.\n\nИнтересный эффект: маленькие числа и короткие строки Python создаёт заранее и **переиспользует**, поэтому `a = 5` и `b = 5` указывают на один объект. А два одинаковых списка — всегда два разных объекта.","code":"a = 5\nb = 5\nprint(a is b, id(a) == id(b))\nx = [1, 2]\ny = [1, 2]\nprint(x == y, x is y)\nprint(type(x), type(a))","key":["`id()` — identity, `type()` — тип.","`is` — тот же объект, `==` — равные значения.","Не используй `is` для сравнения чисел и строк — только для `None`."],"id":"5-2","narr":{"2":"Python переиспользует объект 5 — посмотри на метки","5":"Значения равны, но это два разных объекта","6":"== сравнивает значения, is — identity"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":2,"e":"l","f":[1],"h":[0],"o":0},{"l":3,"e":"l","f":[2],"h":[0],"o":0},{"l":4,"e":"l","f":[2],"h":[0],"o":10},{"l":5,"e":"l","f":[3],"h":[0,1,2,3],"o":10},{"l":6,"e":"l","f":[4],"h":[0,1,2,3,4],"o":10},{"l":7,"e":"l","f":[4],"h":[0,1,2,3,4],"o":21},{"l":0,"e":"d","f":[4],"h":[0,1,2,3,4],"o":50}],"objs":[{"n":1,"k":"prim","t":"int","v":"5"},{"n":2,"k":"list","t":"list","items":[["r",3],["r",4]],"more":0},{"n":3,"k":"prim","t":"int","v":"1"},{"n":4,"k":"prim","t":"int","v":"2"},{"n":5,"k":"list","t":"list","items":[["r",3],["r",4]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["a",["r",1]]]},{"name":"глобальная область","vars":[["a",["r",1]],["b",["r",1]]]},{"name":"глобальная область","vars":[["a",["r",1]],["b",["r",1]],["x",["r",2]]]},{"name":"глобальная область","vars":[["a",["r",1]],["b",["r",1]],["x",["r",2]],["y",["r",5]]]}],"out":"True True\nTrue False\n<class 'list'> <class 'int'>\n","error":null,"truncated":false}},{"title":"Атрибуты и методы","covers":["attribute","method"],"text":"**Атрибут** — имя, привязанное к объекту и доступное через точку: `obj.name`. **Метод** — атрибут-функция, которая при вызове автоматически получает сам объект первым аргументом (`self`).\n\nКогда пишешь `s.upper()`, Python находит функцию `upper` в типе `str` и вызывает её как `str.upper(s)`. Функции `getattr`, `setattr`, `hasattr` работают с атрибутами по имени-строке.","code":"class Lamp:\n    def __init__(self):\n        self.on = False\n    def toggle(self):\n        self.on = not self.on\n\nlamp = Lamp()\nlamp.toggle()\nprint(lamp.on)\nsetattr(lamp, \"color\", \"red\")\nprint(getattr(lamp, \"color\"), hasattr(lamp, \"size\"))\nprint(\"abc\".upper(), str.upper(\"abc\"))","key":["Атрибут — `obj.имя`.","Метод — функция, получающая объект как `self`.","`obj.method()` = `Type.method(obj)`."],"id":"5-3","narr":{"3":"Атрибут экземпляра","4":"Метод: self — это сама лампа","8":"То же самое, что Lamp.toggle(lamp)","10":"Добавляем атрибут по имени-строке","12":"Две записи одного и того же вызова"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Lamp"},{"l":7,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3],"o":0},{"l":3,"e":"r","f":[5,6],"h":[2,4],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":8,"e":"l","f":[7],"h":[2,4],"o":0},{"l":5,"e":"l","f":[7,8],"h":[2,4],"o":0},{"l":5,"e":"r","f":[7,8],"h":[2,5],"o":0,"rv":["p","None"],"fn":"toggle"},{"l":9,"e":"l","f":[7],"h":[2,5],"o":0},{"l":10,"e":"l","f":[7],"h":[2,5],"o":5},{"l":11,"e":"l","f":[7],"h":[2,6],"o":5},{"l":12,"e":"l","f":[7],"h":[2,6],"o":15},{"l":0,"e":"d","f":[7],"h":[2,6],"o":23}],"objs":[{"n":1,"k":"func","t":"function","name":"Lamp.__init__","sig":"(self)"},{"n":2,"k":"func","t":"function","name":"Lamp.toggle","sig":"(self)"},{"n":3,"k":"class","t":"class","name":"Lamp","bases":[],"attrs":{"__init__":["p","метод"],"toggle":["p","метод"]}},{"n":4,"k":"obj","t":"Lamp","attrs":{}},{"n":4,"k":"obj","t":"Lamp","attrs":{"on":["p","False"]}},{"n":4,"k":"obj","t":"Lamp","attrs":{"on":["p","True"]}},{"n":4,"k":"obj","t":"Lamp","attrs":{"on":["p","True"],"color":["p","'red'"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Lamp()","vars":[]},{"name":"тело класса Lamp","vars":[]},{"name":"тело класса Lamp","vars":[["__init__",["r",1]]]},{"name":"тело класса Lamp","vars":[["__init__",["r",1]],["toggle",["r",2]]]},{"name":"глобальная область","vars":[["Lamp",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]]]},{"name":"глобальная область","vars":[["Lamp",["r",3]],["lamp",["r",4]]]},{"name":"toggle()","vars":[["self",["r",4]]]}],"out":"True\nred False\nABC ABC\n","error":null,"truncated":false}},{"title":"Ссылки и передача в функцию","covers":["ссылка"],"text":"В функцию передаётся **ссылка** на объект, а не его копия. Поэтому если функция изменяет изменяемый объект (список, словарь), изменение видно снаружи.\n\nНо если функция **перепривязывает** параметр (`items = [...]`), это меняет только локальное имя — снаружи ничего не происходит. Посмотри на метки объектов в обоих кадрах.","code":"def add_item(items, x):\n    items.append(x)\n\ndef replace(items):\n    items = [\"новый\"]\n\ncart = [\"хлеб\"]\nadd_item(cart, \"молоко\")\nreplace(cart)\nprint(cart)","key":["Функции получают ссылки на объекты.","Изменение объекта видно всем ссылкам.","Перепривязка имени внутри функции снаружи не видна."],"quiz":{"q":"`def f(d): d['k'] = 1`; `x = {}`; `f(x)`. Что в `x`?","options":["{}","{'k': 1}","None","Ошибка"],"answer":1,"why":"`d` и `x` — ссылки на один словарь, функция его изменяет."},"id":"5-4","narr":{"2":"Меняем сам объект, на который ссылаются оба имени","5":"Перепривязываем ЛОКАЛЬНОЕ имя — внешний список не трогаем","8":"cart и items — ссылки на один список"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":4,"e":"l","f":[1],"h":[0],"o":0},{"l":7,"e":"l","f":[2],"h":[0,1],"o":0},{"l":8,"e":"l","f":[3],"h":[0,1,2],"o":0},{"l":2,"e":"l","f":[3,4],"h":[0,1,2],"o":0},{"l":2,"e":"r","f":[3,4],"h":[0,1,3],"o":0,"rv":["p","None"],"fn":"add_item"},{"l":9,"e":"l","f":[3],"h":[0,1,3],"o":0},{"l":5,"e":"l","f":[3,5],"h":[0,1,3],"o":0},{"l":5,"e":"r","f":[3,6],"h":[0,1,3,4],"o":0,"rv":["p","None"],"fn":"replace"},{"l":10,"e":"l","f":[3],"h":[0,1,3],"o":0},{"l":0,"e":"d","f":[3],"h":[0,1,3],"o":19}],"objs":[{"n":1,"k":"func","t":"function","name":"add_item","sig":"(items, x)"},{"n":2,"k":"func","t":"function","name":"replace","sig":"(items)"},{"n":3,"k":"list","t":"list","items":[["p","'хлеб'"]],"more":0},{"n":3,"k":"list","t":"list","items":[["p","'хлеб'"],["p","'молоко'"]],"more":0},{"n":4,"k":"list","t":"list","items":[["p","'новый'"]],"more":0}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["add_item",["r",1]]]},{"name":"глобальная область","vars":[["add_item",["r",1]],["replace",["r",2]]]},{"name":"глобальная область","vars":[["add_item",["r",1]],["replace",["r",2]],["cart",["r",3]]]},{"name":"add_item()","vars":[["items",["r",3]],["x",["p","'молоко'"]]]},{"name":"replace()","vars":[["items",["r",3]]]},{"name":"replace()","vars":[["items",["r",4]]]}],"out":"['хлеб', 'молоко']\n","error":null,"truncated":false}},{"title":"Пространство имён","covers":["пространство имён"],"text":"**Пространство имён** — это словарь «имя → объект». Их много: у модуля (глобальные имена), у каждого вызова функции (локальные), у класса, у каждого объекта (`obj.__dict__`), у встроенных функций (`builtins`).\n\nОдно и то же имя `x` может одновременно существовать в разных пространствах и указывать на разные объекты — конфликта нет. `vars(obj)` показывает пространство имён объекта.","code":"x = \"глобальный\"\n\nclass Box:\n    x = \"в классе\"\n\ndef func():\n    x = \"локальный\"\n    return x\n\nb = Box()\nb.x = \"в объекте\"\nprint(x, Box.x, b.x, func())\nprint(vars(b))","key":["Пространство имён = словарь имя → объект.","У модуля, функции, класса и объекта — свои.","Одинаковые имена в разных пространствах не мешают друг другу."],"id":"5-5","narr":{"4":"Пространство имён класса","7":"Пространство имён вызова функции","11":"Пространство имён экземпляра","12":"Четыре разных x в четырёх пространствах","13":"__dict__ объекта — его личное пространство имён"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[1],"h":[],"o":0},{"l":3,"e":"l","f":[1,2],"h":[],"o":0},{"l":4,"e":"l","f":[1,3],"h":[],"o":0},{"l":4,"e":"r","f":[1,4],"h":[],"o":0,"rv":["p","None"],"fn":"Box"},{"l":6,"e":"l","f":[5],"h":[0],"o":0},{"l":10,"e":"l","f":[6],"h":[0,1],"o":0},{"l":11,"e":"l","f":[7],"h":[0,1,2],"o":0},{"l":12,"e":"l","f":[7],"h":[0,1,3],"o":0},{"l":7,"e":"l","f":[7,8],"h":[0,1,3],"o":0},{"l":8,"e":"l","f":[7,9],"h":[0,1,3],"o":0},{"l":8,"e":"r","f":[7,9],"h":[0,1,3],"o":0,"rv":["p","'локальный'"],"fn":"func"},{"l":13,"e":"l","f":[7],"h":[0,1,3],"o":40},{"l":0,"e":"d","f":[7],"h":[0,1,3],"o":59}],"objs":[{"n":1,"k":"class","t":"class","name":"Box","bases":[],"attrs":{"x":["p","'в классе'"]}},{"n":2,"k":"func","t":"function","name":"func","sig":"()"},{"n":3,"k":"obj","t":"Box","attrs":{}},{"n":3,"k":"obj","t":"Box","attrs":{"x":["p","'в объекте'"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]]]},{"name":"Box()","vars":[]},{"name":"тело класса Box","vars":[]},{"name":"тело класса Box","vars":[["x",["p","'в классе'"]]]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]],["Box",["r",1]]]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]],["Box",["r",1]],["func",["r",2]]]},{"name":"глобальная область","vars":[["x",["p","'глобальный'"]],["Box",["r",1]],["func",["r",2]],["b",["r",3]]]},{"name":"func()","vars":[]},{"name":"func()","vars":[["x",["p","'локальный'"]]]}],"out":"глобальный в классе в объекте локальный\n{'x': 'в объекте'}\n","error":null,"truncated":false}}]},{"title":"Классы","items":["class","экземпляр","атрибут класса","атрибут экземпляра","метод экземпляра","classmethod","staticmethod","__init__","self","создание объектов"],"intro":"Класс — чертёж, по которому создаются объекты. В визуализаторе ты увидишь сам класс (чертёж) и экземпляры (детали, сделанные по чертежу) как отдельные объекты в памяти.","lessons":[{"title":"class и экземпляр","covers":["class","экземпляр"],"text":"`class Dog:` создаёт **объект-класс** — чертёж. Пока ни одной собаки нет. Вызов `Dog()` создаёт **экземпляр** — конкретный объект по этому чертежу. Экземпляров может быть сколько угодно, и каждый — отдельный объект.\n\nОбрати внимание: тело класса выполняется один раз при определении — визуализатор покажет кадр «тело класса Dog».","analogy":"Класс — форма для печенья, экземпляры — сами печенья. Форма одна, печений много, и откусить можно только от печенья.","code":"class Dog:\n    sound = \"Гав\"\n\nrex = Dog()\nbim = Dog()\nprint(rex is bim, type(rex).__name__)\nprint(rex.sound, bim.sound)","key":["Класс — чертёж, экземпляр — объект по чертежу.","`Класс()` создаёт новый экземпляр.","`type(obj)` возвращает класс объекта."],"id":"6-1","narr":{"1":"Выполняется тело класса, создаётся объект-класс Dog","4":"Создаём первый экземпляр","5":"И второй — это ДРУГОЙ объект","7":"Оба видят атрибут класса"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[],"o":0,"rv":["p","None"],"fn":"Dog"},{"l":4,"e":"l","f":[4],"h":[0],"o":0},{"l":5,"e":"l","f":[5],"h":[0,1],"o":0},{"l":6,"e":"l","f":[6],"h":[0,1,2],"o":0},{"l":7,"e":"l","f":[6],"h":[0,1,2],"o":10},{"l":0,"e":"d","f":[6],"h":[0,1,2],"o":18}],"objs":[{"n":1,"k":"class","t":"class","name":"Dog","bases":[],"attrs":{"sound":["p","'Гав'"]}},{"n":2,"k":"obj","t":"Dog","attrs":{}},{"n":3,"k":"obj","t":"Dog","attrs":{}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Dog()","vars":[]},{"name":"тело класса Dog","vars":[]},{"name":"тело класса Dog","vars":[["sound",["p","'Гав'"]]]},{"name":"глобальная область","vars":[["Dog",["r",1]]]},{"name":"глобальная область","vars":[["Dog",["r",1]],["rex",["r",2]]]},{"name":"глобальная область","vars":[["Dog",["r",1]],["rex",["r",2]],["bim",["r",3]]]}],"out":"False Dog\nГав Гав\n","error":null,"truncated":false}},{"title":"__init__ и self","covers":["__init__","self"],"text":"`__init__` — метод-**инициализатор**. Python вызывает его автоматически сразу после создания объекта и передаёт аргументы из `Класс(...)`.\n\n`self` — это ссылка на **тот самый объект**, который сейчас настраивается или с которым работает метод. Запись `self.name = name` создаёт атрибут внутри объекта. Смотри: в кадре `__init__` переменная `self` указывает на тот же объект, что потом окажется в `cat`.","code":"class Cat:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\ncat = Cat(\"Мурка\", 3)\nprint(cat.name, cat.age)","key":["`__init__` заполняет новый объект данными.","`self` — сам объект, первый параметр каждого метода.","Аргументы `Класс(a, b)` попадают в `__init__(self, a, b)`."],"id":"6-2","narr":{"2":"self — новый, ещё пустой объект","3":"Кладём атрибут name внутрь объекта","6":"Python создаёт объект и вызывает Cat.__init__(объект, \"Мурка\", 3)"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Cat"},{"l":6,"e":"l","f":[4],"h":[1],"o":0},{"l":3,"e":"l","f":[4,5],"h":[1,2],"o":0},{"l":4,"e":"l","f":[4,5],"h":[1,3],"o":0},{"l":4,"e":"r","f":[4,5],"h":[1,4],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":7,"e":"l","f":[6],"h":[1,4],"o":0},{"l":0,"e":"d","f":[6],"h":[1,4],"o":8}],"objs":[{"n":1,"k":"func","t":"function","name":"Cat.__init__","sig":"(self, name, age)"},{"n":2,"k":"class","t":"class","name":"Cat","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Cat","attrs":{}},{"n":3,"k":"obj","t":"Cat","attrs":{"name":["p","'Мурка'"]}},{"n":3,"k":"obj","t":"Cat","attrs":{"name":["p","'Мурка'"],"age":["p","3"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Cat()","vars":[]},{"name":"тело класса Cat","vars":[]},{"name":"тело класса Cat","vars":[["__init__",["r",1]]]},{"name":"глобальная область","vars":[["Cat",["r",2]]]},{"name":"__init__()","vars":[["self",["r",3]],["name",["p","'Мурка'"]],["age",["p","3"]]]},{"name":"глобальная область","vars":[["Cat",["r",2]],["cat",["r",3]]]}],"out":"Мурка 3\n","error":null,"truncated":false}},{"title":"Атрибут класса и атрибут экземпляра","covers":["атрибут класса","атрибут экземпляра"],"text":"**Атрибут класса** объявлен в теле класса и **общий** для всех экземпляров. **Атрибут экземпляра** создаётся через `self.x = ...` и у каждого объекта **свой**.\n\nПри чтении `obj.x` Python сначала ищет `x` в самом объекте, а если не находит — в классе. Ловушка: присваивание `obj.x = ...` всегда создаёт атрибут экземпляра и «заслоняет» атрибут класса.","code":"class Player:\n    count = 0\n\n    def __init__(self, name):\n        self.name = name\n        Player.count += 1\n\na = Player(\"Аня\")\nb = Player(\"Боря\")\nprint(Player.count, a.count, b.count)\na.count = 99\nprint(Player.count, a.count, b.count)","key":["Атрибуты класса общие, атрибуты экземпляра — личные.","Поиск: сначала объект, потом класс.","Меняй общие данные через имя класса."],"id":"6-3","narr":{"2":"Атрибут класса — один на всех","5":"Атрибут экземпляра — у каждого свой","6":"Меняем общий счётчик через класс","10":"Все читают один и тот же атрибут класса","11":"Создаётся атрибут экземпляра у a — он заслоняет классовый"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0],"o":0,"rv":["p","None"],"fn":"Player"},{"l":8,"e":"l","f":[5],"h":[1],"o":0},{"l":5,"e":"l","f":[5,6],"h":[1,2],"o":0},{"l":6,"e":"l","f":[5,6],"h":[1,3],"o":0},{"l":6,"e":"r","f":[5,6],"h":[4,3],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":9,"e":"l","f":[7],"h":[4,3],"o":0},{"l":5,"e":"l","f":[7,8],"h":[4,3,5],"o":0},{"l":6,"e":"l","f":[7,8],"h":[4,3,6],"o":0},{"l":6,"e":"r","f":[7,8],"h":[7,3,6],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":10,"e":"l","f":[9],"h":[7,3,6],"o":0},{"l":11,"e":"l","f":[9],"h":[7,3,6],"o":6},{"l":12,"e":"l","f":[9],"h":[7,8,6],"o":6},{"l":0,"e":"d","f":[9],"h":[7,8,6],"o":13}],"objs":[{"n":1,"k":"func","t":"function","name":"Player.__init__","sig":"(self, name)"},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"count":["p","0"],"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Player","attrs":{}},{"n":3,"k":"obj","t":"Player","attrs":{"name":["p","'Аня'"]}},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"count":["p","1"],"__init__":["p","метод"]}},{"n":4,"k":"obj","t":"Player","attrs":{}},{"n":4,"k":"obj","t":"Player","attrs":{"name":["p","'Боря'"]}},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"count":["p","2"],"__init__":["p","метод"]}},{"n":3,"k":"obj","t":"Player","attrs":{"name":["p","'Аня'"],"count":["p","99"]}}],"frames":[{"name":"глобальная область","vars":[]},{"name":"Player()","vars":[]},{"name":"тело класса Player","vars":[]},{"name":"тело класса Player","vars":[["count",["p","0"]]]},{"name":"тело класса Player","vars":[["count",["p","0"]],["__init__",["r",1]]]},{"name":"глобальная область","vars":[["Player",["r",2]]]},{"name":"__init__()","vars":[["self",["r",3]],["name",["p","'Аня'"]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["a",["r",3]]]},{"name":"__init__()","vars":[["self",["r",4]],["name",["p","'Боря'"]]]},{"name":"глобальная область","vars":[["Player",["r",2]],["a",["r",3]],["b",["r",4]]]}],"out":"2 2 2\n2 99 2\n","error":null,"truncated":false}},{"title":"Метод экземпляра","covers":["метод экземпляра"],"text":"Метод экземпляра — функция внутри класса, первым параметром которой идёт `self`. Методы читают и меняют **состояние объекта**.\n\nВызов `account.deposit(50)` Python превращает в `Account.deposit(account, 50)`. Поэтому одна и та же функция работает с разными объектами — с тем, у которого её вызвали.","code":"class Account:\n    def __init__(self, owner):\n        self.owner = owner\n        self.balance = 0\n\n    def deposit(self, amount):\n        self.balance += amount\n        return self.balance\n\na = Account(\"Аня\")\nb = Account(\"Боря\")\na.deposit(100)\nb.deposit(30)\na.deposit(50)\nprint(a.balance, b.balance)","key":["Метод = функция в классе с `self` первым параметром.","`obj.m(x)` → `Class.m(obj, x)`.","Методы меняют состояние именно своего объекта."],"id":"6-4","narr":{"7":"self — тот счёт, у которого вызвали метод","12":"Меняется только a"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2," gine(150)\n\n    def drive(self):\n        return self.engine.start() + \", едем\"\n\ncar = Car()\nprint(car.drive())","key":["Композиция: «имеет часть», которую сам создаёт.","Жизнь части привязана к жизни целого."],"id":"7-4","narr":{"9":"Машина САМА создаёт свою деталь"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"l","f":[0,3],"h":[0],"o":0},{"l":4,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Engine"},{"l":7,"e":"l","f":[5],"h":[2],"o":0},{"l":7,"e":"l","f":[5,6],"h":[2],"o":0},{"l":8,"e":"l","f":[5,7],"h":[2],"o":0},{"l":11,"e":"l","f":[5,8],"h":[2,3],"o":0},{"l":11,"e":"r","f":[5,9],"h":[2,3,4],"o":0,"rv":["p","None"],"fn":"Car"},{"l":14,"e":"l","f":[10],"h":[2,5],"o":0},{"l":9,"e":"l","f":[10,11],"h":[2,5,6],"o":0},{"l":3,"e":"l","f":[10,11,12],"h":[2,5,6,7],"o":0},{"l":3,"e":"r","f":[10,11,12],"h":[2,5,6,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":9,"e":"r","f":[10,11],"h":[2,5,9,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":15,"e":"l","f":[13],"h":[2,5,9,8],"o":0},{"l":12,"e":"l","f":[13,14],"h":[2,5,9,8],"o":0},{"l":5,"e":"l","f":[13,14,15],"h":[2,5,9,8],"o":0},{"l":5,"e":"r","f":[13,14,15],"h":[2,5,9,8],"o":0,"rv":["p","'Двигатель 150 л.с. запущен'"],"fn":"start"},{"l":12,"e":"r","f":[13,14],"h":[2,5,9,8],"o":0,"rv":["p","'Двигатель 150 л.с. запущен, едем'"],"fn":"drive"},{"l":0,"e":"d","f":[13],"h":[2,5,9,8],"o":33}],"objs":[{"n":1,"k":"func","t":"function","name":"Engine.__init__","sig":"(self, hp)"},{"n":2,"k":"func","t":"function","name":"Engine.start","sig":"(self)"},{"n":3,"k":"class","t":"class","name":"Engine","bases":[],"attrs":{"__init__":["p","метод"],"start":["p","метод"]}},{"n":4,"k":"func","t":"function","name":"Car.__init__","sig":"(self)"},{"n":5,"k":"func","t":"function","name":"Car.drive","sig":"(self)"},{"n":6,"k":"class","t":"class","name":"Car","bases":[],"attrs":{"__init__":["p","метод"],"drive":["p","метод"]}},{"n ация: держу, но не владею.","Ассоциация: просто использую."],"id":"7-5","narr":{"7":"Агрегация: игроков создали СНАРУЖИ и передали","10":"Ассоциация: тренер просто использует игрока","17":"Команды нет, а игроки живут дальше"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Player"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":6,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Team"},{"l":9,"e":"l","f":[8],"h":[1,3],"o":0},{"l":9,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":10,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":10,"e":"r","f":[8,11],"h":[1,3,4],"o":0,"rv":["p","None"],"fn":"Coach"},{"l":13,"e":"l","f":[12],"h":[1,3,5],"o":0},{"l":3,"e":"l","f":[12,13],"h":[1,3,5,6],"o":0},{"l":3,"e":"r","f":[12,13],"h":[1,3,5,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":14,"e":"l","f":[14],"h":[1,3,5,7],"o":0},{"l":3,"e":"l","f":[14,15],"h":[1,3,5,7,8],"o":0},{"l":3,"e":"r","f":[14,15],"h":[1,3,5,7,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":15,"e":"l","f":[16],"h":[1,3,5,7,9],"o":0},{"l":7,"e":"l","f":[16,17],"h":[1,3,5,7,9,10,11],"o":0},{"l":7,"e":"r","f":[16,17],"h":[1,3,5,7,9,12,11],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":16,"e":"l","f":[18],"h":[1,3,5,7,9,12,11],"o":0},{"l":11,"e":"l","f":[18,19],"h":[1,3,5,7,9,12,11,13],"o":0},{"l":11,"e":"r","f":[18,19],"h":[1,3,5,7,9,12,11,13],"o":0,"rv":["p","'Молодец, Аня'"],"fn":"praise"},{"l":17,"e":"l","f":[18],"h":[1,3,5,7,9,12,11],"o":13},{"l":18,"e":"l","f":[16],"h":[1,3,5,7,9],"o":13},{"l":0,"e":"d","f":[16],"h":[1,3,5,7,9],"o":22}],"objs":[{"n":1,"k":"func","t":"function","name":"Player.__init__","sig":"(self, name)"},{"n":2,"k":"class","t":"class","name":"Player","bases":[],"attrs":{"__init__":["p","метод"]}},{"n":3,"k":"func","t":"function","name":"Team.__init__","sig":"(self, players олодец, Аня\nАня Боря\n","error":null,"truncated":false}},{"title":"Делегирование","covers":["Делегирование"],"text":"**Делегирование** — объект передаёт работу другому объекту вместо того, чтобы делать её сам. В Python для этого есть удобный приём: метод `__getattr__` вызывается, когда атрибут не найден, и может перенаправить запрос внутреннему объекту.","code":"class Logger:\n    def __init__(self, target):\n        self.target = target\n        self.log = []\n\n    def __getattr__(self, name):\n        self.log.append(name)\n        return getattr(self.target, name)\n\nitems = Logger([3, 1, 2])\nitems.append(0)\nitems.sort()\nprint(items.target, items.log)","key":["Делегирование: «пусть это сделает мой помощник».","`__getattr__` — точка перенаправления."],"id":"7-6","narr":{"3":"Объект, которому делегируем работу","6":"Вызывается, если атрибута нет у Logger","8":"Передаём запрос внутреннему объекту","11":"append ищется в Logger, не находится — делегируется списку"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":6,"e":"l","f":[0,3],"h":[0],"o":0},{"l":6,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Logger"},{"l":10,"e":"l","f":[5],"h":[2],"o":0},{"l":3,"e":"l","f":[5,6],"h":[2,3,4],"o":0},{"l":4,"e":"l","f":[5,6],"h":[2,5,4],"o":0},{"l":4,"e":"r","f":[5,6],"h":[2,6,4,7],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":11,"e":"l","f":[7],"h":[2,6,4,7],"o":0},{"l":7,"e":"l","f":[7,8],"h":[2,6,4,7],"o":0},{"l":8,"e":"l","f":[7,8],"h":[2,6,4,8],"o":0},{"l":8,"e":"r","f":[7,8],"h":[2,6,4,8],"o":0,"rv":["p","<встроенная append>"],"fn":"__getattr__"},{"l":12,"e":"l","f":[7],"h":[2,6,9,8],"o":0},{"l":7,"e":"l","f":[7,9],"h":[2,6,9,8],"o":0},{"l":8,"e":"l","f":[7,9],"h":[2,6,9,10],"o":0},{"l":8,"e":"r","f":[7,9],"h":[2,6,9,10],"o":0,"rv":["p","<встроенная sort>"],"fn":"__getattr__"},{"l":13,"e":"l","f":[7],"h":[2,6,11,10],"o":0},{"l":0,"e":"d","f":[7],"h":[2,6,11,10],"o":32} ерний** класс указывает родителя в скобках и автоматически получает все его атрибуты и методы.\n\nКогда ты вызываешь метод у объекта, Python ищет его сначала в классе объекта, потом в родителе, потом в родителе родителя.","code":"class Vehicle:\n    wheels = 4\n    def describe(self):\n        return f\"{type(self).__name__}: колёс {self.wheels}\"\n\nclass Bike(Vehicle):\n    wheels = 2\n\nclass Truck(Vehicle):\n    pass\n\nprint(Bike().describe())\nprint(Truck().describe())\nprint(issubclass(Bike, Vehicle), isinstance(Bike(), Vehicle))","key":["`class Child(Parent)` наследует всё от Parent.","Поиск атрибута идёт от потомка к предкам.","Экземпляр потомка — тоже экземпляр предка."],"id":"8-1","narr":{"1":"Базовый класс","6":"Дочерний класс","7":"Своё значение заслоняет родительское","10":"Ничего своего — всё от родителя","12":"describe найден в Vehicle"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":3,"e":"l","f":[0,3],"h":[],"o":0},{"l":3,"e":"r","f":[0,4],"h":[0],"o":0,"rv":["p","None"],"fn":"Vehicle"},{"l":6,"e":"l","f":[5],"h":[1],"o":0},{"l":6,"e":"l","f":[5,6],"h":[1],"o":0},{"l":7,"e":"l","f":[5,7],"h":[1],"o":0},{"l":7,"e":"r","f":[5,8],"h":[1],"o":0,"rv":["p","None"],"fn":"Bike"},{"l":9,"e":"l","f":[9],"h":[1,2],"o":0},{"l":9,"e":"l","f":[9,10],"h":[1,2],"o":0},{"l":10,"e":"l","f":[9,11],"h":[1,2],"o":0},{"l":10,"e":"r","f":[9,11],"h":[1,2],"o":0,"rv":["p","None"],"fn":"Truck"},{"l":12,"e":"l","f":[12],"h":[1,2,3],"o":0},{"l":4,"e":"l","f":[12,13],"h":[1,2,3,4],"o":0},{"l":4,"e":"r","f":[12,13],"h":[1,2,3,4],"o":0,"rv":["p","'Bike: колёс 2'"],"fn":"describe"},{"l":13,"e":"l","f":[12],"h":[1,2,3],"o":14},{"l":4,"e":"l","f":[12,14],"h":[1,2,3,5],"o":14},{"l":4,"e":"r","f":[12,14],"h":[1,2,3,5],"o":14,"rv":["p","'Truck: колёс 4'"],"fn":"describe"},{"l":14,"e":"l","f":[12],"h":[1,2,3],"o":29},{"l":0,"e":"d","f":[12],"h":[1,2,3],"o":39}],"objs":[{"n":1,"k":"func","t":"func  def info(self):\n        return super().info() + f\", команда: {self.team}\"\n\nm = Manager(\"Ольга\", 5)\nprint(m.info())","key":["Переопределение — тот же метод в потомке.","`super().метод()` — вызвать версию родителя.","В `__init__` потомка почти всегда нужен `super().__init__(...)`."],"id":"8-2","narr":{"10":"Пусть родитель настроит name","11":"А это — своё поле","13":"Переопределяем метод…","14":"…и дополняем версию родителя"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":5,"e":"l","f":[0,3],"h":[0],"o":0},{"l":5,"e":"r","f":[0,4],"h":[0,1],"o":0,"rv":["p","None"],"fn":"Employee"},{"l":8,"e":"l","f":[5],"h":[2],"o":0},{"l":8,"e":"l","f":[5,6],"h":[2],"o":0},{"l":9,"e":"l","f":[5,7],"h":[2],"o":0},{"l":13,"e":"l","f":[5,8],"h":[2,3],"o":0},{"l":13,"e":"r","f":[5,9],"h":[2,3,4,5],"o":0,"rv":["r",6],"fn":"Manager"},{"l":16,"e":"l","f":[10],"h":[2,6],"o":0},{"l":10,"e":"l","f":[10,11],"h":[2,6,7],"o":0},{"l":3,"e":"l","f":[10,11,12],"h":[2,6,7],"o":0},{"l":3,"e":"r","f":[10,11,12],"h":[2,6,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":11,"e":"l","f":[10,11],"h":[2,6,8],"o":0},{"l":11,"e":"r","f":[10,11],"h":[2,6,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":17,"e":"l","f":[13],"h":[2,6,9],"o":0},{"l":14,"e":"l","f":[13,14],"h":[2,6,9],"o":0},{"l":6,"e":"l","f":[13,14,14],"h":[2,6,9],"o":0},{"l":6,"e":"r","f":[13,14,14],"h":[2,6,9],"o":0,"rv":["p","'Сотрудник Ольга'"],"fn":"info"},{"l":14,"e":"r","f":[13,14],"h":[2,6,9],"o":0,"rv":["p","'Сотрудник Ольга, команда: 5'"],"fn":"info"},{"l":0,"e":"d","f":[13],"h":[2,6,9],"o":28}],"objs":[{"n":1,"k":"func","t":"function","name":"Employee.__init__","sig":"(self, name)"},{"n":2,"k":"func","t":"function","name":"Employee.info","sig":"(self)"},{"n":3,"k":"class","t":"class","name":"Employee","bases":[],"attrs":{"__init__":["p","метод"],"info":["p","метод"]}},{"n":4,"k":"func","t":"function","name":"Manager.__init__","sig":"(self ителю», а к **следующему классу в MRO**.","code":"class A:\n    def hello(self):\n        return \"A\"\n\nclass B(A):\n    def hello(self):\n        return \"B → \" + super().hello()\n\nclass C(A):\n    def hello(self):\n        return \"C → \" + super().hello()\n\nclass D(B, C):\n    pass\n\nprint([k.__name__ for k in D.__mro__])\nprint(D().hello())","key":["`class D(B, C)` — множественное наследование.","MRO — порядок поиска методов, смотри `D.__mro__`.","`super()` идёт к следующему классу в MRO."],"quiz":{"q":"Для `class D(B, C)` с общим предком A, где Python будет искать метод сразу после D?","options":["A","B","C","object"],"answer":1,"why":"MRO = D, B, C, A, object. Родители перечисляются слева направо."},"id":"8-3","narr":{"13":"Два родителя","16":"Порядок поиска: D, B, C, A, object","17":"super() в B ведёт к C, а не к A!"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"A"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":6,"e":"r","f":[4,7],"h":[1,2,3],"o":0,"rv":["r",4],"fn":"B"},{"l":9,"e":"l","f":[8],"h":[1,4],"o":0},{"l":9,"e":"l","f":[8,9],"h":[1,4],"o":0},{"l":10,"e":"l","f":[8,10],"h":[1,4],"o":0},{"l":10,"e":"r","f":[8,11],"h":[1,4,5,6],"o":0,"rv":["r",7],"fn":"C"},{"l":13,"e":"l","f":[12],"h":[1,4,7],"o":0},{"l":13,"e":"l","f":[12,13],"h":[1,4,7],"o":0},{"l":14,"e":"l","f":[12,14],"h":[1,4,7],"o":0},{"l":14,"e":"r","f":[12,14],"h":[1,4,7],"o":0,"rv":["p","None"],"fn":"D"},{"l":16,"e":"l","f":[15],"h":[1,4,7,8],"o":0},{"l":16,"e":"l","f":[15],"h":[1,4,7,8],"o":0},{"l":16,"e":"l","f":[15],"h":[1,4,7,8],"o":0},{"l":16,"e":"l","f":[15],"h":[1,4,7,8],"o":0},{"l":16,"e":"l","f":[15],"h":[1,4,7,8],"o":0},{"l":16,"e":"l","f":[15],"h":[1,4,7,8],"o":0},{"l":17,"e":"l","f":[15],"h":[1,4,7,8],"o":31},{"l":7,"e":"l","f":[15,16],"h":[1,4,7,8,9] ()","vars":[["self",["r",10]]]}],"out":"['D', 'B', 'C', 'A', 'object']\nB → C → A\n","error":null,"truncated":false}},{"title":"Mixins","covers":["mixins"],"text":"**Mixin** — маленький класс, который добавляет **одну способность** и не предназначен для самостоятельного использования. Его «подмешивают» через множественное наследование: `class User(JsonMixin, Base)`.\n\nТак одно и то же умение (например, сериализация в JSON или логирование) можно дать разным классам без копирования кода.","code":"import json\n\nclass JsonMixin:\n    def to_json(self):\n        return json.dumps(vars(self), ensure_ascii=False)\n\nclass GreetMixin:\n    def greet(self):\n        return \"Привет, я \" + self.name\n\nclass User(JsonMixin, GreetMixin):\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\nu = User(\"Лена\", 22)\nprint(u.greet())\nprint(u.to_json())","key":["Mixin = одна переиспользуемая способность.","Подключается множественным наследованием.","Сам по себе экземпляров не создаёт."],"id":"8-4","narr":{"3":"Одна способность — превращаться в JSON","11":"Подмешиваем обе способности"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0],"h":[],"o":0},{"l":3,"e":"l","f":[0,1],"h":[],"o":0},{"l":4,"e":"l","f":[0,2],"h":[],"o":0},{"l":4,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"JsonMixin"},{"l":7,"e":"l","f":[4],"h":[1],"o":0},{"l":7,"e":"l","f":[4,5],"h":[1],"o":0},{"l":8,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"r","f":[4,7],"h":[1,2],"o":0,"rv":["p","None"],"fn":"GreetMixin"},{"l":11,"e":"l","f":[8],"h":[1,3],"o":0},{"l":11,"e":"l","f":[8,9],"h":[1,3],"o":0},{"l":12,"e":"l","f":[8,10],"h":[1,3],"o":0},{"l":12,"e":"r","f":[8,11],"h":[1,3,4],"o":0,"rv":["p","None"],"fn":"User"},{"l":16,"e":"l","f":[12],"h":[1,3,5],"o":0},{"l":13,"e":"l","f":[12,13],"h":[1,3,5,6],"o":0},{"l":14,"e":"l","f":[12,13],"h":[1,3,5,7],"o":0},{"l":14,"e":"r","f":[12,13],"h":[1,3,5,8],"o":0,"rv":["p","None"],"fn":"__init__"},{"l"      self.a = a\n    def area(self):\n        return self.a ** 2\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return round(3.14159 * self.r ** 2, 2)\n\nshapes = [Square(3), Circle(1)]\ntotal = sum(s.area() for s in shapes)\nprint(total)","key":["Базовый класс задаёт интерфейс.","Потомки переопределяют методы.","Клиентский код зависит только от интерфейса."],"id":"9-2","narr":{"2":"Общий интерфейс","8":"Своя реализация","18":"Код не знает, какие именно фигуры"},"trace":{"steps":[{"l":1,"e":"l","f":[0],"h":[],"o":0},{"l":1,"e":"l","f":[0,1],"h":[],"o":0},{"l":2,"e":"l","f":[0,2],"h":[],"o":0},{"l":2,"e":"r","f":[0,3],"h":[0],"o":0,"rv":["p","None"],"fn":"Shape"},{"l":5,"e":"l","f":[4],"h":[1],"o":0},{"l":5,"e":"l","f":[4,5],"h":[1],"o":0},{"l":6,"e":"l","f":[4,6],"h":[1],"o":0},{"l":8,"e":"l","f":[4,7],"h":[1,2],"o":0},{"l":8,"e":"r","f":[4,8],"h":[1,2,3],"o":0,"rv":["p","None"],"fn":"Square"},{"l":11,"e":"l","f":[9],"h":[1,4],"o":0},{"l":11,"e":"l","f":[9,10],"h":[1,4],"o":0},{"l":12,"e":"l","f":[9,11],"h":[1,4],"o":0},{"l":14,"e":"l","f":[9,12],"h":[1,4,5],"o":0},{"l":14,"e":"r","f":[9,13],"h":[1,4,5,6],"o":0,"rv":["p","None"],"fn":"Circle"},{"l":17,"e":"l","f":[14],"h":[1,4,7],"o":0},{"l":7,"e":"l","f":[14,15],"h":[1,4,7,8],"o":0},{"l":7,"e":"r","f":[14,15],"h":[1,4,7,9],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":13,"e":"l","f":[14,16],"h":[1,4,7,10],"o":0},{"l":13,"e":"r","f":[14,16],"h":[1,4,7,11],"o":0,"rv":["p","None"],"fn":"__init__"},{"l":18,"e":"l","f":[17],"h":[1,4,7,9,11,12],"o":0},{"l":18,"e":"l","f":[17,18],"h":[1,4,7,9,11,12],"o":0},{"l":9,"e":"l","f":[17,19,20],"h":[1,4,7,9,11,12],"o":0},{"l":9,"e":"r","f":[17,19,20],"h":[1,4,7,9,11,12],"o":0,"rv":["p","9"],"fn":"area"},{"l":18,"e":"r","f":[17,19],"h":[1,4,7,9,11,12],"o":0,"rv":["p","9"],"fn":"<genexpr>"},{"l":18,"e":"l","f":[17,19],"h":[1,4,7,9,11,12],"o":0},{"l":15,"e":"l","f":[17,21,22],"h":[1,4,7,9,11,12],"o":0},{"l":15,"e":"r","f":[17,21,
