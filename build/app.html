<title>Python по схеме</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky top bar with XP + streak; home = progress dashboard + scheme tree + badges;
   section = lesson path; lesson = text + step visualizer (code / names → arrows → objects / output) + completion sheet. */
:root {
  --bg: #EDF1F4;
  --panel: #FFFFFF;
  --ink: #14202B;
  --muted: #5A6A77;
  --line: #D3DCE3;
  --accent: #2B66CF;
  --accent-ink: #FFFFFF;
  --hl: #FFD43B;
  --hl-soft: #FFF3C2;
  --prev-soft: #E3F1EA;
  --ok: #1E8F62;
  --ok-ink: #FFFFFF;
  --err: #C93F35;
  --err-soft: #FBE7E5;
  --code-bg: #F6F8FA;
  --flame: #F2701D;
  --xp: #7A4DE0;
  --zs: 48%; --zl: 89%;
  --hero1: #2B66CF; --hero2: #7A4DE0; --glow1: rgb(43 102 207 / .14); --glow2: rgb(122 77 224 / .12);
  --grass: #E2F1DA; --grass2: #CFE7C4; --road: #74808C; --road-edge: #5C6874; --road-line: #F4F7F9; --trail: #FFD43B;
  --tree: #4FA66C; --tree2: #3C8C57; --trunk: #8A5A3B; --rock: #B7C0C8; --flower: #F27BA6;
  --shadow: 0 1px 2px rgb(20 32 43 / .06), 0 6px 20px rgb(20 32 43 / .06);
  --chip-l: 46%;
  --chip-s: 70%;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1318; --panel: #151D25; --ink: #E2E9EF; --muted: #8E9DAA; --line: #26323D;
    --accent: #6FA2FF; --accent-ink: #0D1318; --hl: #FFD43B; --hl-soft: #3A3317; --prev-soft: #16302A;
    --ok: #45C08D; --ok-ink: #0D1318; --err: #FF7B70; --err-soft: #3A1E1D; --code-bg: #10171D; --flame: #FF9248; --xp: #A889FF; --zs: 26%; --zl: 15%; --sk-s: 30%; --sk-l: 17%; --gr-s: 24%; --gr-l: 22%; --hero1: #24498F; --hero2: #5435A8; --glow1: rgb(111 162 255 / .10); --glow2: rgb(168 137 255 / .09); --grass: #13231A; --grass2: #182C20; --road: #3B4753; --road-edge: #2A343E; --road-line: #C9D3DC; --trail: #FFD43B; --tree: #2F7A4C; --tree2: #266541; --trunk: #6B4630; --rock: #4A5560; --flower: #D9668F;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --chip-l: 68%; --chip-s: 75%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1318; --panel: #151D25; --ink: #E2E9EF; --muted: #8E9DAA; --line: #26323D;
  --accent: #6FA2FF; --accent-ink: #0D1318; --hl: #FFD43B; --hl-soft: #3A3317; --prev-soft: #16302A;
  --ok: #45C08D; --ok-ink: #0D1318; --err: #FF7B70; --err-soft: #3A1E1D; --code-bg: #10171D; --flame: #FF9248; --xp: #A889FF; --zs: 26%; --zl: 15%; --sk-s: 30%; --sk-l: 17%; --gr-s: 24%; --gr-l: 22%; --hero1: #24498F; --hero2: #5435A8; --glow1: rgb(111 162 255 / .10); --glow2: rgb(168 137 255 / .09); --grass: #13231A; --grass2: #182C20; --road: #3B4753; --road-edge: #2A343E; --road-line: #C9D3DC; --trail: #FFD43B; --tree: #2F7A4C; --tree2: #266541; --trunk: #6B4630; --rock: #4A5560; --flower: #D9668F;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --chip-l: 68%; --chip-s: 75%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button, a { touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.press { transition: transform .12s ease; }
.press:active { transform: scale(.97); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 9px;
  display: flex; align-items: center; gap: 10px;
}
.bar .back { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px; cursor: pointer; font-weight: 600; }
.bar .crumb { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .crumb b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-code); padding: 4px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 14px; height: 14px; }
.pill.flame { color: var(--flame); }
.pill.flame.cold { color: var(--muted); }
.pill.xp { color: var(--xp); }
.pill.bump { animation: bump .6s ease; }
@keyframes bump { 30% { transform: scale(1.25); } }

main {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 72px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 clamp(24px, 6vw, 34px)/1.15 var(--f-display); letter-spacing: -0.01em; }
h2 { font: 600 17px/1.25 var(--f-display); }
.eyebrow { font: 600 11px var(--f-code); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sh { --c: hsl(var(--sh) var(--chip-s) var(--chip-l)); --c-ink: hsl(var(--sh) var(--chip-s) calc(var(--chip-l) - 10%)); --c-soft: hsl(var(--sh) var(--chip-s) var(--chip-l) / .14); }

/* ---------- dashboard ---------- */
.dash { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.lvl { position: relative; width: 76px; height: 76px; }
.lvl svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.lvl .n { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px var(--f-display); color: var(--xp); }
.lvl .n small { display: block; font: 600 9px var(--f-code); letter-spacing: .1em; color: var(--muted); text-align: center; margin-top: -4px; }
.lvname { font: 700 19px/1.2 var(--f-display); margin: 2px 0 8px; }
.xpbar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xpbar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--xp), var(--accent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.xpmeta { font: 500 12px var(--f-code); color: var(--muted); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.stat .big { display: flex; align-items: center; gap: 6px; font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; }
.stat .big svg { width: 20px; height: 20px; flex: none; }
.stat small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.stat.flame .big { color: var(--flame); }
.stat.flame.cold .big { color: var(--muted); }
.stat.goal .big { color: var(--ok); }
.stat.badges .big { color: var(--xp); }
.nudge { margin-top: 10px; font-size: 13.5px; background: color-mix(in srgb, var(--flame) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--flame) 35%, var(--line)); border-radius: 12px; padding: 8px 12px; }

.cta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-decoration: none; color: var(--ink); background: var(--panel); border: 1.5px solid var(--c); border-radius: 20px; padding: 14px 16px; margin-top: 14px; box-shadow: var(--shadow); }
.cta small { font: 600 11px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }
.cta .t { font: 600 17px/1.3 var(--f-body); grid-column: 1; }
.cta .go { grid-row: 1 / span 3; grid-column: 2; width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: var(--panel); display: grid; place-items: center; font-size: 22px; font-weight: 700; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 8px var(--c-soft); } }
.cta .sub { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.mini { display: flex; gap: 3px; grid-column: 1; margin-top: 4px; }
.mini i { flex: 1; height: 5px; border-radius: 99px; background: var(--line); max-width: 28px; }
.mini i.on { background: var(--c); }
.mini i.cur { background: var(--c); opacity: .45; }

.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-block: 14px 22px; }
.howto div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.howto b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
.howto .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* ---------- scheme tree ---------- */
.tree { font-family: var(--f-code); font-size: 14px; }
.tree .root { font: 700 18px var(--f-display); color: var(--accent); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
.tree .root span { font: 500 12px var(--f-code); color: var(--muted); }
.sec { position: relative; padding-left: 26px; }
.sec::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.sec:last-child::before { bottom: calc(100% - 26px); }
.sec > .head::before { content: ""; position: absolute; left: -19px; top: 25px; width: 16px; border-top: 2px solid var(--line); }
.sec > .head {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-block: 6px; cursor: pointer;
}
.sec.full > .head { background: var(--c-soft); border-color: var(--c); }
.sec > .head .num { font: 700 12px var(--f-code); color: var(--panel); background: var(--c); min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-variant-numeric: tabular-nums; flex: none; }
.sec > .head .nm { flex: 1; min-width: 0; font: 600 14px var(--f-body); }
.sec > .head .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec > .head .ring { width: 26px; height: 26px; flex: none; }
.items { padding-left: 22px; margin-bottom: 6px; position: relative; }
.items a { position: relative; display: flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 5px 6px; border-radius: 8px; font-size: 13.5px; }
.items a::before { content: "├─"; color: var(--line); }
.items a:last-child::before { content: "└─"; }
.items a:hover { background: var(--c-soft); }
.items a .ok { color: var(--c-ink); font-weight: 700; }
.items a .tag { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }

/* ---------- badges ---------- */
.badges-h { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 10px; }
.badges-h span { font: 500 12px var(--f-code); color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 10px; text-align: center; display: grid; justify-items: center; gap: 4px; }
.badge svg { width: 48px; height: 48px; }
.badge b { font-size: 12.5px; line-height: 1.2; }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.25; }
.badge.locked svg { filter: grayscale(1); opacity: .35; }
.badge.locked b { color: var(--muted); }



/* ---------- app shell: glow, tab bar ---------- */
.glow { position: fixed; inset: 0 0 auto 0; height: 420px; pointer-events: none; z-index: 0;
  background: radial-gradient(60% 70% at 15% 0%, var(--glow1), transparent 70%), radial-gradient(50% 60% at 90% 10%, var(--glow2), transparent 70%); }
main, .bar { position: relative; z-index: 1; }
.bar { position: sticky; }
body.with-tabs main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.boot { padding: 80px 0; text-align: center; color: var(--muted); }
.tabbar { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: min(420px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 6px;
  background: color-mix(in srgb, var(--panel) 78%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 18px; text-decoration: none; color: var(--muted); font: 600 11px var(--f-body); transition: background .2s, color .2s; }
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.on { color: var(--accent-ink); background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: #FFFFFF; }
.page-h { margin: 4px 0 16px; }

/* ---------- avatar ---------- */
.ava { display: inline-grid; place-items: center; border-radius: 50%; flex: none; overflow: hidden; background: color-mix(in srgb, var(--shirt) 24%, var(--panel)); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--shirt) 45%, transparent); }
.ava svg { width: 92%; height: 92%; }
.ava .hero-idle { animation: none; }

/* ---------- home hello card ---------- */
.hello { position: relative; overflow: hidden; color: #FFFFFF; border-radius: 26px; padding: 16px 16px 14px; background: linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow: 0 12px 30px color-mix(in srgb, var(--hero2) 30%, transparent); }
.hello::after { content: ""; position: absolute; right: -40px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: rgb(255 255 255 / .09); }
.hello-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; }
.hello .ava { background: rgb(255 255 255 / .9); box-shadow: none; }
.hello-t { flex: 1; min-width: 0; }
.hello .hi { font: 700 20px/1.2 var(--f-display); }
.hello .lv { font-size: 13.5px; opacity: .9; margin-top: 2px; }
.goal { position: relative; width: 46px; height: 46px; flex: none; }
.goal .ring { width: 46px; height: 46px; }
.goal span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 11px var(--f-code); }
.xpbar.glass { position: relative; z-index: 1; margin-top: 14px; background: rgb(255 255 255 / .25); }
.xpbar.glass > i { background: #FFFFFF; }
.hello-meta { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 8px; font: 500 12px var(--f-code); opacity: .9; margin-top: 6px; }
.roadhead .seg { margin: 0; flex: 1; max-width: 240px; }
.roadhead .seg button { font: 600 14px var(--f-body); border: 0; border-radius: 10px; padding: 7px 8px; }
.roadhead { margin: 18px 0 12px; }

/* ---------- awards ---------- */
.lvcard { display: flex; align-items: center; gap: 16px; color: #FFFFFF; border-radius: 26px; padding: 16px; background: linear-gradient(135deg, var(--hero1), var(--hero2)); }
.lvcard .lvl .n { color: #FFFFFF; }
.lvcard .lvl .n small { color: rgb(255 255 255 / .8); }
.lvcard .lvname { margin: 0; }
.lvcard .xpmeta { color: rgb(255 255 255 / .85); }
.bento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.bento .stat { border-radius: 20px; padding: 14px; }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ladder li { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; color: var(--muted); }
.ladder .ln-n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 12px var(--f-code); background: var(--line); color: var(--muted); }
.ladder li.got { color: var(--ink); }
.ladder li.got .ln-n { background: var(--xp); color: #FFFFFF; }
.ladder li.now { border-color: var(--xp); box-shadow: 0 0 0 2px color-mix(in srgb, var(--xp) 25%, transparent); }
.ladder small { font: 500 12px var(--f-code); }

/* ---------- profile ---------- */
.me { display: flex; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 16px; box-shadow: var(--shadow); }
.me-n { font: 700 20px var(--f-display); }
.me-s { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw-b { width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--sw); cursor: pointer; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px transparent; transition: transform .15s; }
.sw-b.on { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--sw); }
.swatches.big .sw-b { width: 36px; height: 36px; }
.notes { display: grid; gap: 8px; }
.nt { display: grid; gap: 4px; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.nt small { font: 600 11px var(--f-code); color: var(--accent); }
.nt span { font-size: 14px; white-space: pre-wrap; }
.empty-card { background: var(--panel); border: 1px dashed var(--line); border-radius: 16px; padding: 14px; color: var(--muted); font-size: 14px; }
.store { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 6px 14px 14px; }
.store-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.store-row span { color: var(--muted); }
.store-row b { text-align: right; font-weight: 600; }
.store-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.store textarea { width: 100%; margin-top: 10px; font: 12px var(--f-code); border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: var(--code-bg); color: var(--ink); }
.bk-msg { font-size: 13px; color: var(--muted); margin-top: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; padding: 10px 16px; font-weight: 600; cursor: pointer; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn.primary { border: 0; color: #FFFFFF; background: linear-gradient(135deg, var(--hero1), var(--hero2)); }
.btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
.btn.ghost { border: 0; background: transparent; color: var(--accent); }
.btn.wide { width: 100%; padding: 14px; font-size: 16px; }
.fine { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 12px 2px; }
.fine.center { text-align: center; }

/* ---------- lesson note ---------- */
.note-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 16px; }
.nc-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.nc-h h3 { font: 600 13px var(--f-display); }
.nc-h span { font: 500 11px var(--f-code); color: var(--ok); }
.note-card textarea { width: 100%; resize: vertical; min-height: 72px; font: 15px/1.45 var(--f-body); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); color: var(--ink); }

/* ---------- auth ---------- */
.auth { max-width: 420px; margin: 0 auto; padding-top: 8px; }
.auth-hero { position: relative; overflow: hidden; border-radius: 28px; color: #FFFFFF; padding: 18px 18px 20px; background: linear-gradient(135deg, var(--hero1), var(--hero2)); box-shadow: 0 16px 36px color-mix(in srgb, var(--hero2) 32%, transparent); }
.auth-road { position: relative; height: 120px; margin: -6px -18px 4px; }
.auth-road svg:first-child { width: 100%; height: 120px; display: block; }
.auth-road .rd-edge { stroke-width: 26; } .auth-road .rd { stroke-width: 20; }
.auth-walker { position: absolute; left: 50%; top: 2px; width: 56px; height: 70px; transform: translateX(-50%); animation: hop 2.4s ease-in-out infinite; }
@keyframes hop { 50% { transform: translateX(-50%) translateY(-4px); } }
.auth-title { font: 700 26px/1.1 var(--f-display); }
.auth-sub { opacity: .9; font-size: 14px; margin-top: 4px; }
.auth-card { background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: 18px; margin-top: -14px; position: relative; box-shadow: var(--shadow); display: grid; gap: 10px; }
.auth-card h2 { font-size: 18px; text-align: center; }
.fld { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 4px; }
.inp { width: 100%; font: 17px var(--f-body); padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
.inp:focus { outline: none; border-color: var(--accent); }
.auth-err { min-height: 18px; text-align: center; color: var(--err); font-size: 13px; }
.who { display: grid; gap: 8px; }
.who-b { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 18px; padding: 10px 12px; cursor: pointer; }
.who-b .who-t { flex: 1; display: grid; }
.who-b small { color: var(--muted); }
.who-b i { font-style: normal; font-size: 22px; color: var(--muted); }
.dots { display: flex; justify-content: center; gap: 14px; margin: 6px 0 0; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); transition: background .15s, transform .15s; }
.dots i.on { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
.dots.shake { animation: shake .35s ease; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 4px; }
.pkey { border: 0; background: var(--bg); border-radius: 18px; padding: 14px 0; font: 600 24px var(--f-display); cursor: pointer; transition: transform .1s, background .1s; }
.pkey:active { transform: scale(.94); background: var(--line); }
.pkey.txt { font: 600 14px var(--f-body); color: var(--muted); }


/* ---------- zones on the map ---------- */
.z-wall { fill: #F6E7CF; stroke: #B9895A; stroke-width: 1; } .z-roof { fill: #D2553F; } .z-door { fill: #8A5A3B; }
.z-txt { font: 700 8px var(--f-code); text-anchor: middle; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 2.5px; }
.z-txt.dark { fill: var(--ink); stroke: none; } .z-txt.light { fill: #FFFFFF; stroke: none; } .z-txt.big { font-size: 10px; }
.z-txt.dunder { fill: #6E56CF; font-size: 9px; }
.z-dark { fill: #2C3E57; }
.z-gear { fill: #C98A3D; } .z-gear.dark { fill: #6E56CF; } .z-hole { fill: var(--panel); }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; } .spin.rev { animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.z-crate { fill: #C99A5B; stroke: #8A5A3B; stroke-width: 1; } .z-crate-l { stroke: #8A5A3B; stroke-width: 1; fill: none; }
.z-bldg { fill: #5B7DB8; } .z-bldg2 { fill: #F2D9B3; stroke: #B9895A; } .z-win { fill: #FFE27A; } .z-blue { fill: #2B66CF; }
.z-pipe { fill: none; stroke: #8E9DAA; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; } .z-valve { fill: #E5484D; }
.z-cont { stroke: rgb(0 0 0 / .25); stroke-width: 1; } .z-cont.c0 { fill: #E5484D; } .z-cont.c1 { fill: #12A594; } .z-cont.c2 { fill: #F2A33A; }
.z-cont-l { stroke: rgb(0 0 0 / .2); stroke-width: 1; }
.z-crane { fill: none; stroke: #F2A33A; stroke-width: 3; stroke-linecap: round; }
.z-reed { fill: none; stroke: #3C8C57; stroke-width: 2; stroke-linecap: round; }
.z-water { fill: #4C9BE8; opacity: .85; } .z-rail { stroke: #8A5A3B; stroke-width: 4; stroke-linecap: round; }
.z-crystal.c0 { fill: #8E7CF0; } .z-crystal.c1 { fill: #4CC3D9; }
.z-block { fill: #6E56CF; stroke: rgb(255 255 255 / .35); }
.z-pine { fill: #2F7A4C; } .z-mount { fill: #8C96A3; } .z-snow { fill: #FFFFFF; } .z-castle { fill: #B7C0C8; stroke: #6E7B87; stroke-width: 1; }
.rd.lane { stroke-width: 18; } .rd-edge.lane { stroke-width: 23; }
.rd.ring { stroke-width: 12; } .rd-edge.ring { stroke-width: 17; }
.road { background: var(--grass); }
.zgate { position: absolute; left: 10px; right: 10px; z-index: 2; border-radius: 18px; padding: 10px 14px 8px;
  background: color-mix(in srgb, hsl(var(--zh) 60% 50%) 16%, var(--panel)); border: 1.5px solid hsl(var(--zh) 55% 50% / .55); box-shadow: var(--shadow); }
.zgate::before, .zgate::after { content: ""; position: absolute; top: 100%; width: 6px; height: 26px; background: hsl(var(--zh) 40% 40%); border-radius: 0 0 3px 3px; }
.zgate::before { left: 22px; } .zgate::after { right: 22px; }
.zgate b { display: block; font: 700 16px var(--f-display); }
.zgate p { margin: 3px 0 2px; font-size: 13px; line-height: 1.4; color: var(--ink); }
.zgate .zg-more { color: var(--muted); }
.zg-top { display: flex; justify-content: space-between; align-items: center; }
.zg-n { font: 600 10.5px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: hsl(var(--zh) 55% 40%); }
.zg-why { border: 0; background: transparent; color: var(--accent); font: 600 12px var(--f-body); cursor: pointer; padding: 2px 0; }
.zpop { position: fixed; z-index: 40; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%); width: min(380px, calc(100% - 32px));
  display: grid; gap: 2px; padding: 12px 16px; border-radius: 20px; color: #FFFFFF; background: linear-gradient(135deg, hsl(var(--zh) 60% 42%), hsl(calc(var(--zh) + 40) 60% 38%));
  box-shadow: 0 16px 40px rgb(0 0 0 / .3); animation: zin .5s cubic-bezier(.2,.8,.2,1.2), tout .4s ease 3.7s forwards; }
.zpop small { font: 600 10.5px var(--f-code); letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
.zpop b { font: 700 19px var(--f-display); }
.zpop span { font-size: 13.5px; opacity: .95; }
@keyframes zin { from { transform: translateX(-50%) translateY(-20px) scale(.9); opacity: 0; } }

/* ---------- lesson depth ---------- */
.deep { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; }
.deep summary { cursor: pointer; list-style: none; display: block; position: relative; padding: 12px 44px 12px 16px; }
.deep summary small { display: block; margin-top: 2px; }
.deep summary::-webkit-details-marker { display: none; }
.deep summary span { font: 600 14px var(--f-display); }
.deep summary span::before { content: "⚙ "; color: var(--xp); }
.deep summary small { color: var(--muted); font-size: 12px; }
.deep summary::after { content: "+"; position: absolute; right: 16px; top: 12px; font: 600 18px var(--f-code); color: var(--muted); }
.deep[open] summary::after { content: "−"; }
.deep-b { padding: 0 16px 12px; font-size: 15px; }
.deep-b p { margin: 0 0 10px; }
.deep-b code, .pit code, .ck code, .links code, .nx code { font: .9em var(--f-code); background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.code.blk { margin: 4px 0 10px; padding: 8px 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; font: 12.5px/1.55 var(--f-code); overflow-x: auto; white-space: pre; min-width: 0; }
.deep-b ul, .deep-b ol { margin: 0 0 10px; padding-left: 20px; display: grid; gap: 4px; }
.tbl { overflow-x: auto; margin: 4px 0 10px; }
.tbl table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.tbl th { font: 600 11px var(--f-code); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pit { background: var(--err-soft); border-radius: var(--r); padding: 12px 16px; margin-bottom: 14px; }
.pit h3 { font: 600 13px var(--f-display); margin-bottom: 6px; color: var(--err); }
.pit ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 16px; }
.links > span { font: 600 11px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.links a { text-decoration: none; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }

/* ---------- checks & gate ---------- */
.checks { margin-bottom: 14px; display: grid; gap: 10px; }
.ck-h { display: flex; justify-content: space-between; align-items: baseline; }
.ck-h h3 { font: 600 16px var(--f-display); }
.ck-h span { font: 600 12px var(--f-code); color: var(--xp); }
.ck-sub { margin: -4px 0 0; font-size: 13px; color: var(--muted); }
.ck { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.ck.ok { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.ck-q { display: flex; gap: 10px; font-size: 15px; }
.ck-q > div { min-width: 0; }
.ck-n { flex: none; width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font: 700 12px var(--f-code); background: var(--code-bg); border: 1px solid var(--line); }
.ck.ok .ck-n { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
.ck .opts { display: grid; gap: 6px; }
.ck .opts button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; cursor: pointer; font: 14px var(--f-body); color: var(--ink); transition: transform .12s ease; }
.ck .opts button:disabled { cursor: default; }
.ck .opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--panel)); animation: pop .4s ease; }
.ck .opts button.wrong { border-color: var(--err); background: var(--err-soft); animation: shake .35s ease; }
.ck .why { font-size: 14px; }
.ck .why .again { margin-top: 8px; }
.gate { display: grid; gap: 6px; margin-bottom: 10px; }
.gate-h { font: 600 11px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.gate a { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 9px 12px; font-size: 14px; }
.gate a i { font-style: normal; flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--f-code); background: var(--line); }
.gate a.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 50%, var(--line)); color: var(--muted); }
.gate a.ok i { background: var(--ok); color: var(--ok-ink); }
.done-btn:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; }
.done-btn.ready { animation: breathe-ok 1.8s ease-in-out infinite; }
@keyframes breathe-ok { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--ok) 25%, transparent); } }

/* ---------- predictions in the example ---------- */
.narr .nx.ask > i { background: var(--xp); color: #FFFFFF; }
.popts { display: flex; flex-wrap: wrap; gap: 6px; }
.popts button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 8px 14px; font: 600 14px var(--f-code); cursor: pointer; color: var(--ink); }
.popts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--panel)); }
.popts button.wrong { border-color: var(--err); background: var(--err-soft); opacity: .7; }
.popts.shake { animation: shake .35s ease; }
.pwhy { font-size: 13.5px; color: var(--muted); }

/* ---------- review ---------- */
.review-card { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); margin-top: 12px; padding: 12px 16px; border-radius: 20px; background: color-mix(in srgb, var(--xp) 12%, var(--panel)); border: 1.5px solid color-mix(in srgb, var(--xp) 45%, var(--line)); }
.review-card > div { flex: 1; display: grid; gap: 1px; }
.review-card small { font: 600 10.5px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--xp); }
.review-card b { font-size: 16px; }
.review-card span { font-size: 12.5px; color: var(--muted); }
.review-card .go { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--xp); color: #FFFFFF; font-size: 20px; flex: none; }
.rv-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font: 600 12px var(--f-code); color: var(--muted); }
.rv-top .xpbar { flex: 1; }
.ck.rv { padding: 16px; }
.rv-from { font: 600 11px var(--f-code); color: var(--c-ink); text-decoration: none; }
.rv-end { text-align: center; display: grid; gap: 12px; justify-items: center; padding-top: 30px; }
.check.big { width: 90px; height: 90px; } .check.big circle { fill: var(--ok); } .check.big path { fill: none; stroke: var(--ok-ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }


/* ---------- worlds (scenes) ---------- */
:root { --sk-s: 70%; --sk-l: 95%; --gr-s: 42%; --gr-l: 86%; }
.world { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 14px; margin: 16px 0 6px; box-shadow: var(--shadow); }
.world.inl { margin: 14px 0 12px; padding: 12px; }
.w-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.w-h span { font: 600 10.5px var(--f-code); letter-spacing: .1em; text-transform: uppercase; color: hsl(var(--zh) 55% 42%); }
.w-h b { font: 700 18px var(--f-display); text-align: right; }
.world.inl .w-h b { font-size: 14px; }
.w-intro { margin: 6px 0 10px; font-size: 14px; color: var(--muted); }
.scene { position: relative; border-radius: 16px; overflow: hidden; margin-top: 8px; }
.scene svg.sc { display: block; width: 100%; height: auto; }
.spots { position: absolute; inset: 0; }
.sdot { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; padding: 0; border-radius: 50%; border: 2px solid #FFFFFF; cursor: pointer;
  display: grid; place-items: center; font: 700 10px/1 var(--f-code); color: #FFFFFF; background: hsl(var(--zh) 72% 42%); box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
.sdot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid hsl(var(--zh) 72% 45% / .55); animation: dotp 2.4s ease-out infinite; }
@keyframes dotp { from { transform: scale(.6); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
.sdot.done { background: #1E8F62; } .sdot.done::after { border-color: rgb(30 143 98 / .5); }
.sdot.on { background: #14202B; transform: scale(1.25); z-index: 2; }
.sdot.dim { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; opacity: .55; border-width: 1.5px; cursor: default; }
.sdot.dim::after { display: none; }
.slegend { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; margin-top: 10px; }
.slegend:empty { display: none; }
.lg { display: flex; align-items: center; gap: 7px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 6px 8px; cursor: pointer; font: 500 12.5px/1.2 var(--f-body); color: var(--ink); min-width: 0; }
.lg span { min-width: 0; overflow-wrap: anywhere; }
.lg i { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 700 9.5px var(--f-code); font-style: normal; color: #FFFFFF; background: hsl(var(--zh) 72% 42%); }
.lg.done i { background: #1E8F62; }
.lg.on { border-color: hsl(var(--zh) 72% 42%); background: color-mix(in srgb, hsl(var(--zh) 70% 50%) 12%, var(--panel)); }
.si-h b i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; margin-right: 6px; border-radius: 50%; font: 700 9.5px var(--f-code); color: #FFFFFF; background: hsl(var(--zh) 72% 42%); vertical-align: 1px; }
.spill-old { position: absolute; border: 0; cursor: pointer; white-space: nowrap; font: 600 10.5px/1 var(--f-body); color: #14202B; background: rgb(255 255 255 / .94); padding: 5px 8px; border-radius: 99px; box-shadow: 0 2px 8px rgb(0 0 0 / .18), 0 0 0 1px rgb(0 0 0 / .06); transition: transform .12s; }
.spill.done { background: #E3F6EC; color: #145F43; }
.spill.on { background: #14202B; color: #FFFFFF; }
.spill:active { transform: scale(.95); }
.scene.mini .spill { font-size: 11px; }
.sinfo { margin-top: 10px; background: color-mix(in srgb, hsl(var(--zh) 60% 50%) 9%, var(--panel)); border-radius: 16px; padding: 10px 14px; min-height: 52px; font-size: 14.5px; }
.sinfo:empty { display: none; }
.sinfo p { margin: 4px 0; }
.sinfo code { font: .9em var(--f-code); background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.si-hint { color: var(--muted); font-size: 13.5px; }
.si-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.si-h b { font: 600 15px var(--f-code); }
.si-ok { font: 600 11px var(--f-code); color: var(--ok); }
.si-go { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; margin-top: 8px; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.si-go small { font: 600 10.5px var(--f-code); color: var(--muted); }
.si-go span { grid-row: 2; font-weight: 600; font-size: 14px; }
.si-go i { grid-row: 1 / span 2; grid-column: 2; font-style: normal; font-size: 18px; color: var(--accent); }
.w-why { margin-top: 10px; font-size: 14px; }
.w-why summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.w-why p { margin: 6px 0 0; color: var(--muted); }
.road .lbl2.wemb { display: flex; gap: 8px; align-items: center; max-width: calc(64% - 20px); padding: 6px 10px 6px 6px; }
.road .lbl2.r.wemb { flex-direction: row-reverse; padding: 6px 6px 6px 10px; }
.road .lbl2 em { display: block; font: 600 9.5px var(--f-code); font-style: normal; letter-spacing: .04em; color: var(--c-ink); text-transform: uppercase; }
.road .lbl2 .emb { flex: none; border-radius: 10px; }
svg.sc text { font-family: var(--f-code); }
.sc-sky { fill: hsl(var(--zh) var(--sk-s) var(--sk-l)); }
.sc-ground { fill: hsl(var(--zh) var(--gr-s) var(--gr-l)); }
.sc .ink { stroke: #1D2A36; stroke-width: 1.4; stroke-linejoin: round; }
.sc .lite { opacity: .75; } .sc .dark { filter: brightness(.82); }
.sc .tx { fill: #14202B; } .sc .tw { fill: #FFFFFF; } .sc .tm { fill: var(--muted); } .sc .tc { fill: var(--ink); } .sc .tg { fill: #7CF0B0; }
.f-blue { fill: #5B9BF8; } .f-blue2 { fill: #2F6FD8; } .f-green { fill: #3CC48F; } .f-green2 { fill: #1E9C6C; } .f-yellow { fill: #FFCF4D; } .f-orange { fill: #FF9447; }
.f-red { fill: #F2625F; } .f-pink { fill: #F47BB0; } .f-purple { fill: #9479F2; } .f-teal { fill: #34B7C4; } .f-paper { fill: #FFFDF7; } .f-paper2 { fill: #EFE6D6; }
.f-grey { fill: #C9D2DA; } .f-dark { fill: #2C3E57; } .f-wood { fill: #C99A5B; } .f-glass { fill: rgb(180 220 255 / .55); } .f-cloud { fill: rgb(255 255 255 / .85); } .f-sky { fill: #EAF4FF; } .f-skin { fill: #F2C29B; }
.sc .ar { stroke: #E5484D; stroke-width: 2.4; stroke-linecap: round; } .sc .ar-h { fill: #E5484D; }
.sc .brk { fill: none; stroke: #F76B15; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sc .road { fill: none; stroke: #6E7B87; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; } .sc .road-l { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-dasharray: 7 8; }
.sc .ring { fill: none; stroke: #6E7B87; stroke-width: 18; } .sc .ring-l { fill: none; stroke: #FFFFFF; stroke-width: 2; stroke-dasharray: 7 8; }
.sc .pole { stroke: #8A5A3B; stroke-width: 3; stroke-linecap: round; } .sc .pole-thick { fill: none; stroke: #2C3E57; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.sc .ln, .sc .ink-l { stroke: #1D2A36; stroke-width: 1.6; stroke-linecap: round; fill: none; }
.sc .tick { fill: none; stroke: #FFFFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.sc .wave { fill: none; stroke: #F2625F; stroke-width: 1.5; }
.sc .string, .sc .thread, .sc .rope { fill: none; stroke: #8A5A3B; stroke-width: 1.8; stroke-dasharray: 0; }
.sc .thread { stroke: #E5484D; stroke-dasharray: 4 3; } .sc .rope { stroke-dasharray: 5 3; stroke-width: 2.2; }
.sc .nonebox { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 4 3; }
.sc .bp { fill: none; stroke: rgb(255 255 255 / .55); stroke-width: 1.5; stroke-linecap: round; }
.sc .frame { fill: none; stroke: #1D2A36; stroke-width: 1.4; stroke-dasharray: 3 2; }

.sc .ar2 { stroke: #2F6FD8; stroke-width: 2.2; stroke-linecap: round; } .sc .ar2-h { fill: #2F6FD8; }
.sc .edge { stroke: #1D2A36; stroke-width: 2; }

.sc .writeline { stroke: #2F6FD8; stroke-width: 2; stroke-linecap: round; }
.sc .river { fill: none; stroke: #4C9BE8; stroke-width: 26; stroke-linecap: round; } .sc .river-l { fill: none; stroke: #9CCBF5; stroke-width: 2; stroke-dasharray: 10 10; }

/* ---------- road map ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; margin: 4px 0 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.roadhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.roadhead button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 12px; font: 600 12px var(--f-code); cursor: pointer; white-space: nowrap; }
.road { position: relative; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, var(--grass), var(--grass2)); border: 1px solid var(--line); min-height: 200px; }
.road svg.map { display: block; width: 100%; height: auto; }
.rd-edge { fill: none; stroke: var(--road-edge); stroke-width: 34; stroke-linecap: round; }
.rd { fill: none; stroke: var(--road); stroke-width: 28; stroke-linecap: round; }
.rd-line { fill: none; stroke: var(--road-line); stroke-width: 2.5; stroke-dasharray: 9 11; opacity: .75; }
.rd-trail { fill: none; stroke: var(--trail); stroke-width: 7; stroke-linecap: round; opacity: .95; }
.seg-h { fill: none; stroke: none; }
.t-trunk { fill: var(--trunk); } .t-tree { fill: var(--tree); } .t-tree2 { fill: var(--tree2); } .t-rock { fill: var(--rock); } .t-flower { fill: var(--flower); } .t-flower-c { fill: var(--trail); }
.t-pole { stroke: var(--trunk); stroke-width: 3; stroke-linecap: round; }
.t-board { fill: var(--panel); stroke: var(--road-edge); stroke-width: 1.5; }
.t-sign { font: 700 9px var(--f-display); fill: var(--ink); letter-spacing: .06em; }
.t-chk1 { fill: #14202B; } .t-chk2 { fill: #FFFFFF; }
.s-ring { fill: var(--panel); stroke-width: 4; }
.s-todo { fill: var(--panel); stroke: var(--line); stroke-width: 4; }
.s-num { font: 700 13px var(--f-display); text-anchor: middle; dominant-baseline: central; }
.stop-pulse { fill: none; stroke-width: 4; animation: spulse 1.8s ease-in-out infinite; }
@keyframes spulse { 50% { stroke-opacity: .12; stroke-width: 14; } }
.h-shadow { fill: rgb(0 0 0 / .2); }
.h-leg { stroke: #2C3E57; stroke-width: 4.5; stroke-linecap: round; }
.h-pack { fill: #FFD43B; stroke: #C9A21E; stroke-width: 1; }
.h-body { fill: var(--shirt, #3776AB); }
.h-arm { stroke: #F2C29B; stroke-width: 3.6; stroke-linecap: round; }
.h-skin { fill: #F2C29B; } .h-hair { fill: #3B2A20; } .h-eye { fill: #14202B; }
.hero-idle { animation: idle 1.6s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-1.5px); } }
.road .lbl2 { position: absolute; max-width: calc(56% - 20px); text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--panel) 90%, transparent); border-radius: 12px; padding: 6px 10px; box-shadow: var(--shadow); line-height: 1.25; z-index: 2; }
.road .lbl2 b { display: block; font-weight: 600; font-size: 13.5px; }
.road .lbl2 small { display: block; color: var(--muted); font: 500 11px var(--f-code); margin-top: 2px; }
.road .lbl2.r { text-align: right; }
.road .lbl2.cur { box-shadow: 0 0 0 2px var(--c), var(--shadow); }
.road .lbl2.cur small { color: var(--c-ink); }
.road .lbl2.done b::before { content: "✓ "; color: var(--c-ink); }
.road .lbl2.fin { background: var(--ink); color: var(--bg); }
.road .lbl2.fin small { color: var(--bg); opacity: .75; }
.road .herosvg { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; overflow: visible; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .18)); }
.road .stoplink { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; z-index: 2; }
.road .bubble { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--bg); font: 600 12px var(--f-body); padding: 5px 11px; border-radius: 99px; white-space: nowrap; text-decoration: none; box-shadow: var(--shadow); z-index: 4; }

/* ---------- section path ---------- */
.sec-head { display: grid; gap: 8px; }
.sec-intro { color: var(--muted); margin: 0; max-width: 62ch; }
.secbar { display: flex; align-items: center; gap: 10px; font: 600 12px var(--f-code); color: var(--muted); }
.secbar .xpbar { flex: 1; height: 8px; }
.secbar .xpbar > i { background: var(--c); }
.path { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 0; }
.path li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; position: relative; }
.path li::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: -6px; border-left: 3px solid var(--line); }
.path li.done::before { border-color: var(--c); }
.path li:last-child::before { display: none; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-code); background: var(--panel); border: 3px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
.path li.done .node { background: var(--c); border-color: var(--c); color: var(--panel); }
.path li.next .node { border-color: var(--c); color: var(--c-ink); animation: breathe 2.4s ease-in-out infinite; }
.path a.card { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.path li.next a.card { border-color: var(--c); box-shadow: var(--shadow); }
.path .t { font-weight: 600; }
.path .c { font: 12px var(--f-code); color: var(--muted); margin-top: 2px; }
.path .lbl { font: 600 10px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }

/* ---------- lesson ---------- */
.lhead { display: grid; gap: 8px; }
.lhead .eyebrow { color: var(--c-ink); }
.covers { display: flex; flex-wrap: wrap; gap: 6px; }
.covers span { font: 500 12px var(--f-code); background: var(--c-soft); color: var(--c-ink); border-radius: 99px; padding: 2px 9px; }
.prose { margin-top: 14px; }
.prose p { margin: 0 0 12px; max-width: 65ch; }
.prose code, .key code, .narr code, .quiz code { font: 0.9em var(--f-code); background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.analogy { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--hl-soft); border-radius: var(--r); padding: 12px 14px; margin: 4px 0 18px; font-size: 15px; }
.analogy .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--hl); display: grid; place-items: center; }
.analogy .ic svg { width: 20px; height: 20px; }
.analogy b { font-family: var(--f-display); font-size: 11px; letter-spacing: .08em; display: block; margin-bottom: 2px; }

.viz { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-block: 8px 18px; box-shadow: var(--shadow); }
.viz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; }
.viz-top .eyebrow { color: var(--accent); }
.viz-top .stepno { font: 600 12px var(--f-code); color: var(--muted); font-variant-numeric: tabular-nums; }
.viz-top .vt-r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.viz-top .solved.todo { color: var(--xp); background: color-mix(in srgb, var(--xp) 12%, var(--panel)); }
.viz-top .solved { font: 600 11px var(--f-code); color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); border-radius: 99px; padding: 2px 8px; }
.stepbar { height: 4px; background: var(--line); }
.stepbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .3s ease; }
.codebox { max-height: 42vh; overflow: auto; background: var(--code-bg); border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.code { font: 13px/1.6 var(--f-code); padding: 8px 0; min-width: max-content; }
.ln { display: grid; grid-template-columns: 22px 34px auto; padding-right: 14px; white-space: pre; transition: background .25s ease; }
.ln .ar { text-align: center; font-weight: 700; }
.ln .no { color: var(--muted); text-align: right; padding-right: 10px; opacity: .7; user-select: none; }
.ln.cur { background: var(--hl-soft); box-shadow: inset 3px 0 0 var(--hl); }
.ln.cur .ar { color: var(--ink); }
.ln.cur .ar::before { content: "➜"; }
.ln.prev { background: var(--prev-soft); }
.ln.prev .ar { color: var(--ok); }
.ln.prev .ar::before { content: "✓"; }
.ln.cur.prev .ar::before { content: "➜"; }
.tk-kw { color: #8A3FD1; font-weight: 600; } .tk-str { color: #1B7F4C; } .tk-num { color: #C0561B; } .tk-com { color: var(--muted); font-style: italic; }
.tk-fn { color: var(--accent); } .tk-bi { color: #B0306A; } .tk-dec { color: #B07A00; }
:root[data-theme="dark"] .tk-kw { color: #C79BFF; } :root[data-theme="dark"] .tk-str { color: #7FD6A4; } :root[data-theme="dark"] .tk-num { color: #FFA86B; } :root[data-theme="dark"] .tk-bi { color: #FF8CC0; } :root[data-theme="dark"] .tk-dec { color: #FFD166; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tk-kw { color: #C79BFF; } :root:not([data-theme="light"]) .tk-str { color: #7FD6A4; } :root:not([data-theme="light"]) .tk-num { color: #FFA86B; } :root:not([data-theme="light"]) .tk-bi { color: #FF8CC0; } :root:not([data-theme="light"]) .tk-dec { color: #FFD166; } }

.narr { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; font-size: 14.5px; min-height: 70px; }
.narr .nx { display: flex; gap: 8px; animation: rise .3s ease; }
@keyframes rise { from { transform: translateY(4px); opacity: .4; } }
.narr .nx > i { font-style: normal; flex: none; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 7px; display: grid; place-items: center; font: 700 11px var(--f-code); }
.narr .nx.next > i { background: var(--hl); color: #14202B; }
.narr .nx.done > i { background: var(--ok); color: var(--ok-ink); }
.narr .nx.bad > i { background: var(--err); color: var(--panel); }
.narr .nx > span { min-width: 0; }
.narr .chg { color: var(--muted); font-size: 13.5px; display: grid; gap: 2px; }
.narr .chg div::before { content: "• "; color: var(--accent); }
.narr .chg b { color: var(--ink); font-family: var(--f-code); font-weight: 600; }
.narr .hint { color: var(--muted); font-size: 13px; }

.ctrl { display: grid; grid-template-columns: 1fr 1fr 1.6fr 1fr 1fr; gap: 6px; padding: 10px 12px 4px; }
.ctrl button { border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 11px 0; font-size: 17px; cursor: pointer; transition: transform .12s ease; }
.ctrl button:active { transform: scale(.94); }
.ctrl button.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.ctrl button.main.hint { animation: breathe-a 1.8s ease-in-out infinite; }
@keyframes breathe-a { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 22%, transparent); } }
.ctrl button:disabled { opacity: .35; }
.scrub { padding: 6px 14px 10px; }
.scrub input { width: 100%; accent-color: var(--accent); }

.mem { position: relative; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); column-gap: 34px; row-gap: 14px; padding: 14px 26px 16px 14px; border-top: 1px solid var(--line); }
.mem.single { grid-template-columns: minmax(0, 1fr); padding-right: 14px; }
.mem h3 { font: 600 10.5px var(--f-code); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 2; }
.arrows path.ln-a { fill: none; stroke-width: 2; stroke-linecap: round; opacity: .8; }
.arrows path.ln-a.draw { animation: draw .6s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.frames, .heap { display: grid; gap: 8px; align-content: start; min-width: 0; position: relative; z-index: 1; }
.frame { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
.frame.top { border-color: var(--accent); }
.frame.enter, .obj.enter { animation: enter .35s cubic-bezier(.2,.8,.2,1.2); }
@keyframes enter { from { transform: scale(.92); opacity: .3; } }
.frame .fh { font: 600 11.5px var(--f-code); padding: 5px 9px; background: var(--code-bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 6px; overflow-wrap: anywhere; }
.frame.top .fh { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.frame .empty { padding: 6px 10px; color: var(--muted); font-size: 12px; }
.row { display: grid; grid-template-columns: minmax(36px, max-content) minmax(0, 1fr); gap: 8px; align-items: center; padding: 5px 9px; font: 12.5px var(--f-code); border-top: 1px dashed var(--line); }
.row:first-of-type { border-top: 0; }
.row .k { color: var(--muted); overflow-wrap: anywhere; }
.row .v { overflow-wrap: anywhere; min-width: 0; }
.row.flash, .obj.flash { animation: flash 1.1s ease-out; }
@keyframes flash { from { background: var(--hl); } to { background: transparent; } }
.ret { padding: 6px 9px; font: 600 12px var(--f-code); color: var(--ok); border-top: 1px solid var(--line); }

.ref { display: inline-flex; align-items: center; gap: 4px; border: 0; cursor: pointer; padding: 1px 7px 1px 5px; border-radius: 99px; font: 600 11.5px var(--f-code);
  background: hsl(var(--h) var(--chip-s) var(--chip-l) / .16); color: hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 8%)); }
.ref::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--h) var(--chip-s) var(--chip-l)); }

.obj { border: 1.5px solid hsl(var(--h) var(--chip-s) var(--chip-l) / .6); border-radius: 12px; background: var(--panel); overflow: hidden; scroll-margin: 90px; }
.obj.pulse { box-shadow: 0 0 0 4px hsl(var(--h) var(--chip-s) var(--chip-l) / .45); }
.obj .oh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding: 5px 9px; font: 600 11.5px var(--f-code); background: hsl(var(--h) var(--chip-s) var(--chip-l) / .13); }
.obj .oh .id { color: hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 8%)); }
.obj .oh .ty { color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.obj .oh .sub { color: var(--muted); font-weight: 400; font-size: 10.5px; }
.obj.exc { border-color: var(--err); }
.cells { display: flex; flex-wrap: wrap; gap: 4px; padding: 7px 9px; }
.cell { display: grid; justify-items: center; min-width: 30px; max-width: 100%; }
.cell .i { font: 10px var(--f-code); color: var(--muted); }
.cell .b { border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: 12.5px var(--f-code); background: var(--code-bg); max-width: 100%; overflow-wrap: anywhere; }
.obj.set .cell .b { border-radius: 99px; }
.obj.tuple .cell .b { border-style: dashed; }
.obj .note { padding: 6px 9px; font: 12px var(--f-code); color: var(--muted); overflow-wrap: anywhere; }
.obj .emptyc { padding: 6px 9px; font: 12px var(--f-code); color: var(--muted); }

.outwrap { padding: 0 14px 14px; display: grid; gap: 8px; }
.outwrap h3 { font: 600 10.5px var(--f-code); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.out { background: #0F1720; color: #CFE3D8; border-radius: 12px; font: 13px/1.5 var(--f-code); padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 40px; }
.out .new { color: #FFE27A; }
.out .cursor { display: inline-block; width: 7px; height: 14px; background: #CFE3D8; vertical-align: -2px; opacity: .6; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.err { background: var(--err-soft); color: var(--err); border-radius: 10px; padding: 8px 10px; font: 13px var(--f-code); }

.file { background: var(--code-bg); border: 1px dashed var(--line); border-radius: var(--r); margin-bottom: 10px; overflow-x: auto; }
.file .fn { font: 600 12px var(--f-code); padding: 8px 12px 0; }
.file .fn span { color: var(--muted); font-weight: 400; }
.key { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; margin-bottom: 16px; }
.key h3 { font: 600 13px var(--f-display); margin-bottom: 6px; }
.key ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

.quiz { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; }
.quiz h3 { font: 600 13px var(--f-display); margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.quiz h3 span { font: 600 11px var(--f-code); color: var(--xp); }
.quiz .q { margin: 0 0 10px; }
.quiz .opts { display: grid; gap: 6px; }
.quiz .opts button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; cursor: pointer; font: 14px var(--f-code); transition: transform .12s ease; }
.quiz .opts button:active { transform: scale(.98); }
.quiz .opts button.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--panel)); animation: pop .4s ease; }
.quiz .opts button.wrong { border-color: var(--err); background: var(--err-soft); animation: shake .35s ease; }
@keyframes pop { 40% { transform: scale(1.03); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.quiz .why { margin-top: 10px; font-size: 14px; }

.done-btn { width: 100%; border: 0; border-radius: 16px; padding: 15px; font: 600 16px var(--f-body); cursor: pointer; background: var(--ok); color: var(--ok-ink); box-shadow: var(--shadow); transition: transform .12s ease; }
.done-btn:active { transform: scale(.98); }
.done-btn small { display: block; font: 500 12px var(--f-code); opacity: .85; }
.done-btn.on { background: var(--panel); color: var(--ok); border: 1.5px solid var(--ok); box-shadow: none; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pn a { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.pn a small { display: block; color: var(--muted); font-size: 11px; }
.pn a span { display: block; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pn a.nx { text-align: right; grid-column: 2; }

/* ---------- celebration ---------- */
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 55; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 9px 14px 9px 10px; font-size: 14px; box-shadow: 0 10px 30px rgb(0 0 0 / .25); animation: tin .35s cubic-bezier(.2,.8,.2,1.3), tout .3s ease 2.6s forwards; max-width: 100%; }
.toast svg { width: 30px; height: 30px; flex: none; }
.toast b { display: block; font-size: 14px; }
.toast small { opacity: .75; font-size: 12px; }
@keyframes tin { from { transform: translateY(-16px) scale(.95); opacity: 0; } }
@keyframes tout { to { transform: translateY(-10px); opacity: 0; } }
.veil { position: fixed; inset: 0; z-index: 50; background: rgb(8 12 16 / .45); display: grid; align-items: end; justify-items: center; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 520px; background: var(--panel); border-radius: 26px 26px 0 0; padding: 22px max(20px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; text-align: center; animation: up .4s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40%); } }
.sheet .check { width: 78px; height: 78px; justify-self: center; }
.sheet .check circle { fill: var(--ok); }
.sheet .check path { fill: none; stroke: var(--ok-ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s .2s ease-out forwards; }
.sheet h2 { font: 700 22px var(--f-display); }
.sheet .gain { font: 700 30px var(--f-display); color: var(--xp); font-variant-numeric: tabular-nums; }
.sheet .say { color: var(--muted); margin: -6px 0 0; }
.sheet .lvline { display: grid; gap: 6px; text-align: left; }
.sheet .lvline div { display: flex; justify-content: space-between; font: 600 12px var(--f-code); color: var(--muted); }
.sheet .lvup { background: color-mix(in srgb, var(--xp) 14%, var(--panel)); border: 1.5px solid var(--xp); border-radius: 16px; padding: 12px; }
.sheet .lvup b { font: 700 18px var(--f-display); color: var(--xp); display: block; }
.sheet .secp { text-align: left; background: var(--c-soft); border-radius: 16px; padding: 10px 12px; font-size: 14px; }
.sheet .secp .mini i { max-width: none; height: 7px; }
.sheet .streakline { font-size: 14px; color: var(--flame); font-weight: 600; }
.sheet .btns { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; }
.sheet .btns a, .sheet .btns button { display: grid; place-items: center; text-decoration: none; border-radius: 14px; padding: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.sheet .btns .primary { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } .arrows path.ln-a { stroke-dashoffset: 0 !important; } .sheet .check path { stroke-dashoffset: 0; } }
</style>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const app = document.getElementById("app");
  const LESSONS = [];
  DATA.sections.forEach((s, si) => { s.si = si; s.lessons.forEach((l, li) => { l.sec = s; l.si = si; l.li = li; LESSONS.push(l); }); });
  const byId = Object.fromEntries(LESSONS.map(l => [l.id, l]));
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const h = n => (n * 47 + 200) % 360;
  const secHue = si => (205 + si * 137.5) % 360;
  const plural = (n, a, b, c) => { const m = n % 10, k = n % 100; return n + " " + (m === 1 && k !== 11 ? a : m >= 2 && m <= 4 && (k < 12 || k > 14) ? b : c); };

  // ---------- progress & rewards (stored in this browser only) ----------
  // aw: { "l:3-2": "2026-10-15", "q:3-2": …, "v:3-2": … }  l = lesson done, q = quiz right on first try, v = example watched to the end
  const XP = { l: 20, q: 10, v: 5, r: 2 };
  const LEVELS = [[0, "Новичок"], [60, "Исследователь"], [150, "Ученик"], [300, "Кодер"], [500, "Питонист"], [800, "Инженер"], [1200, "Архитектор"], [1700, "Мастер Python"], [2400, "Гуру"]];
  const DAILY_GOAL = 3;
  const blankState = () => ({ aw: {}, tried: {}, ok: {}, box: {}, open: [], view: "road", walk: {} });
  let S = blankState();
  let USER = null, USERS = {}, PROG = {}, NOTES = {};
  const COLORS = ["#3776AB", "#E5484D", "#12A594", "#F76B15", "#8E4EC6", "#D6409F"];

  // ---------- local database: IndexedDB on this device (falls back to localStorage, then memory) ----------
  const DB = (() => {
    const STORES = ["users", "progress", "notes", "meta"];
    let idb = null, mode = "mem";
    const mem = {};
    const lk = (st, k) => "pydb:" + st + ":" + k;
    function useLS() { try { localStorage.setItem("pydb:t", "1"); localStorage.removeItem("pydb:t"); mode = "ls"; } catch (e) { mode = "mem"; } }
    function open() {
      return new Promise(resolve => {
        let fin = false;
        const done = () => { if (!fin) { fin = true; resolve(); } };
        setTimeout(() => { if (!idb) useLS(); done(); }, 2500);
        try {
          const r = indexedDB.open("pyscheme", 1);
          r.onupgradeneeded = () => STORES.forEach(n => { if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); });
          r.onsuccess = () => { if (fin) return; idb = r.result; mode = "idb"; done(); };
          r.onerror = () => { useLS(); done(); };
        } catch (e) { useLS(); done(); }
      });
    }
    function req(st, rw, fn) {
      return new Promise((res, rej) => {
        const t = idb.transaction(st, rw ? "readwrite" : "readonly");
        const r = fn(t.objectStore(st));
        t.oncomplete = () => res(r && r.result);
        t.onerror = () => rej(t.error);
      });
    }
    async function get(st, k) {
      if (mode === "idb") return req(st, false, o => o.get(k));
      if (mode === "ls") { try { const v = localStorage.getItem(lk(st, k)); return v == null ? undefined : JSON.parse(v); } catch (e) { return undefined; } }
      return (mem[st] || {})[k];
    }
    async function put(st, k, v) {
      if (mode === "idb") return req(st, true, o => o.put(v, k));
      if (mode === "ls") { try { localStorage.setItem(lk(st, k), JSON.stringify(v)); } catch (e) {} return; }
      (mem[st] = mem[st] || {})[k] = v;
    }
    async function del(st, k) {
      if (mode === "idb") return req(st, true, o => o.delete(k));
      if (mode === "ls") { try { localStorage.removeItem(lk(st, k)); } catch (e) {} return; }
      if (mem[st]) delete mem[st][k];
    }
    async function all(st) {
      if (mode === "idb") return new Promise((res, rej) => {
        const out = [], t = idb.transaction(st), c = t.objectStore(st).openCursor();
        c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error);
      });
      if (mode === "ls") {
        const out = [], pre = "pydb:" + st + ":";
        try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(pre)) out.push([k.slice(pre.length), JSON.parse(localStorage.getItem(k))]); } } catch (e) {}
        return out;
      }
      return Object.entries(mem[st] || {});
    }
    return { open, get, put, del, all, get mode() { return mode; } };
  })();

  let saveT = null;
  function save() {
    if (!USER) return;
    PROG[USER.id] = S;
    clearTimeout(saveT);
    saveT = setTimeout(() => DB.put("progress", USER.id, S).catch(() => {}), 200);
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden && USER) { clearTimeout(saveT); DB.put("progress", USER.id, S).catch(() => {}); } });

  async function hashPin(salt, pin) {
    const text = salt + ":" + pin;
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
      }
    } catch (e) {}
    let x = 0x811c9dc5;
    for (const ch of text) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619) >>> 0; }
    return "f" + x.toString(16);
  }
  const newId = () => "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  async function login(uid) {
    USER = USERS[uid];
    S = Object.assign(blankState(), PROG[uid] || (await DB.get("progress", uid)) || {});
    NOTES = {};
    (await DB.all("notes")).forEach(([k, v]) => { const [u, lid] = String(k).split("|"); if (u === uid && v && v.text) NOTES[lid] = v; });
    await DB.put("meta", "session", uid);
    if (!location.hash || location.hash === "#") history.replaceState(null, "", "#home");
    render();
  }
  async function logout() { await DB.del("meta", "session"); USER = null; S = blankState(); NOTES = {}; authState = { step: "pick" }; go("home"); render(); }
  async function createUser(name, color, pin) {
    const salt = Math.random().toString(36).slice(2, 10);
    const u = { id: newId(), name, color, salt, pin: await hashPin(salt, pin), created: today() };
    let st = blankState();
    if (!Object.keys(USERS).length) {
      // first profile on this device inherits progress made before profiles existed
      try {
        const raw = localStorage.getItem("pyscheme-v2");
        if (raw) st = Object.assign(st, JSON.parse(raw));
        else JSON.parse(localStorage.getItem("pyscheme-done") || "[]").forEach(id => { st.aw["l:" + id] = today(); });
      } catch (e) {}
    }
    USERS[u.id] = u; PROG[u.id] = st;
    await DB.put("users", u.id, u);
    await DB.put("progress", u.id, st);
    return u;
  }
  async function deleteUser(uid) {
    await DB.del("users", uid); await DB.del("progress", uid);
    for (const [k] of await DB.all("notes")) if (String(k).startsWith(uid + "|")) await DB.del("notes", k);
    delete USERS[uid]; delete PROG[uid];
    if (USER && USER.id === uid) await logout(); else render();
  }
  function today(d) { const x = d || new Date(); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
  const isDone = id => !!S.aw["l:" + id];
  const doneCount = () => LESSONS.filter(l => isDone(l.id)).length;
  function xpTotal(st) { return Object.keys((st || S).aw).reduce((a, k) => a + (XP[k.split(":")[0]] || 0), 0); }
  function levelOf(xp) {
    let i = 0;
    while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
    const lo = LEVELS[i][0], hi = LEVELS[i + 1] ? LEVELS[i + 1][0] : lo;
    return { n: i + 1, name: LEVELS[i][1], lo, hi, next: LEVELS[i + 1] ? LEVELS[i + 1][1] : null, frac: hi > lo ? (xp - lo) / (hi - lo) : 1 };
  }
  function streak() {
    const days = new Set(Object.values(S.aw));
    const d = new Date();
    let n = 0, active = days.has(today(d));
    if (!active) d.setDate(d.getDate() - 1);
    while (days.has(today(d))) { n++; d.setDate(d.getDate() - 1); }
    return { n, active };
  }
  const todayLessons = () => Object.entries(S.aw).filter(([k, v]) => k[0] === "l" && v === today()).length;
  const secDone = s => s.lessons.every(l => isDone(l.id));
  const ACH = [
    { id: "first", t: "Первый шаг", d: "Пройди первый урок", g: "1", ok: () => doneCount() >= 1 },
    { id: "five", t: "Разогрев", d: "5 уроков", g: "5", ok: () => doneCount() >= 5 },
    { id: "sec", t: "Раздел закрыт", d: "Пройди целый раздел", g: "§", ok: () => DATA.sections.some(secDone) },
    { id: "watch", t: "Наблюдатель", d: "Досмотри 10 примеров до конца", g: "▶", ok: () => Object.keys(S.aw).filter(k => k[0] === "v").length >= 10 },
    { id: "quiz", t: "Меткий глаз", d: "5 тестов с первой попытки", g: "◎", ok: () => Object.keys(S.aw).filter(k => k[0] === "q").length >= 5 },
    { id: "s3", t: "Три дня подряд", d: "Серия 3 дня", g: "3", ok: () => streak().n >= 3 },
    { id: "s7", t: "Неделя кода", d: "Серия 7 дней", g: "7", ok: () => streak().n >= 7 },
    { id: "half", t: "Полпути", d: "Половина всех уроков", g: "½", ok: () => doneCount() >= Math.ceil(LESSONS.length / 2) },
    { id: "oop", t: "ООП-мастер", d: "Разделы 6–10", g: "{}", ok: () => [5, 6, 7, 8, 9].every(i => DATA.sections[i] && secDone(DATA.sections[i])) },
    { id: "deep", t: "Под капотом", d: "Разделы 11–14 и 23", g: "⚙", ok: () => [10, 11, 12, 13, 22].every(i => DATA.sections[i] && secDone(DATA.sections[i])) },
    { id: "all", t: "Вся схема", d: "Все уроки пройдены", g: "★", ok: () => doneCount() === LESSONS.length },
  ];
  const unlocked = () => new Set(ACH.filter(a => a.ok()).map(a => a.id));

  // award a key; returns gained xp and side-effects (toasts, level-up) are announced by caller
  function award(key) {
    if (S.aw[key]) return 0;
    S.aw[key] = today();
    save();
    return XP[key.split(":")[0]] || 0;
  }
  function withRewards(fn) {
    const xp0 = xpTotal(), lv0 = levelOf(xp0).n, a0 = unlocked();
    const r = fn();
    const xp1 = xpTotal(), lv1 = levelOf(xp1).n, a1 = unlocked();
    const newAch = ACH.filter(a => a1.has(a.id) && !a0.has(a.id));
    refreshPills(xp1 > xp0);
    return { r, xp0, xp1, gained: xp1 - xp0, levelUp: lv1 > lv0, newAch };
  }

  // ---------- icons ----------
  const ICON = {
    flame: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.6 2.2c.6 3.2 3.4 5 4.6 7.6 1.6 3.4.3 8.6-4.6 9.9-4.3 1.1-8-1.8-8-6 0-2.5 1.3-4.3 2.7-5.6.1 1.7.9 3 2.3 3.6-.5-3.6.8-7 3-9.5z"/></svg>`,
    bolt: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 2 4.5 13.5h6L9.8 22l9-12h-6.2z"/></svg>`,
    target: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>`,
    medal: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2h4l1.5 4L14 2h3l-3.3 7.1A6.5 6.5 0 1 1 9.9 9z" opacity=".55"/><circle cx="12" cy="15" r="5.5" fill="currentColor"/></svg>`,
    road: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M7 3c0 5 10 4 10 9s-10 4-10 9"/><circle cx="17" cy="12" r="2.4" fill="currentColor"/></svg>`,
    user: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4.2" fill="currentColor"/><path fill="currentColor" d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5z"/></svg>`,
    bulb: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#14202B" d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/></svg>`,
  };
  function badgeSVG(a, hue) {
    return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 13.5v21L24 45 6 34.5v-21z" fill="hsl(${hue} 70% 55%)"/><path d="M24 8 37.6 16v16L24 40 10.4 32V16z" fill="hsl(${hue} 80% 68%)"/><text x="24" y="29.5" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="700" font-size="${a.g.length > 1 ? 11 : 14}" fill="#14202B">${esc(a.g)}</text></svg>`;
  }
  function heroMarkup(ids) {
    const id = n => ids ? ` id="${n}"` : "";
    return `<g><g class="hero-idle"><ellipse cx="0" cy="0" rx="11" ry="3.5" class="h-shadow"/><g${id("heroflip")}>
    <line${id("legL")} x1="-3" y1="-15" x2="-3" y2="-1" class="h-leg"/><line${id("legR")} x1="3" y1="-15" x2="3" y2="-1" class="h-leg"/>
    <rect x="-12.5" y="-30" width="8" height="12.5" rx="3" class="h-pack"/><rect x="-7" y="-32" width="14" height="18" rx="6" class="h-body"/>
    <line${id("arm")} x1="1" y1="-27" x2="4" y2="-18" class="h-arm"/><circle cx="0" cy="-39" r="7.5" class="h-skin"/>
    <path d="M-7.6,-39.5 A7.6,7.6 0 0 1 7.6,-40.5 L5,-40 Q-1,-44 -7.6,-39.5 Z" class="h-hair"/><circle cx="3.8" cy="-39" r="1.15" class="h-eye"/></g></g></g>`;
  }
  const avatar = (color, size = 44) => `<span class="ava" style="--shirt:${color};width:${size}px;height:${size}px"><svg viewBox="-22 -50 44 44" aria-hidden="true">${heroMarkup(false)}</svg></span>`;
  function ring(frac, color, size = 26, sw = 3.5, track = "var(--line)") {
