  // ---------- syntax highlight ----------
  const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
  const BI = new Set("print len range list dict set tuple int float str bool type id isinstance issubclass super object iter next open enumerate zip map filter sorted sum min max abs repr hasattr getattr setattr callable vars property classmethod staticmethod any all round input reversed frozenset Exception ValueError TypeError KeyError IndexError ZeroDivisionError StopIteration AttributeError NotImplementedError RuntimeError".split(" "));
  function hl(line) {
    const re = /(#.*$)|("""|'''|f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(@[\w.]+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
    let out = "", m, prevDef = false;
    while ((m = re.exec(line))) {
      const [t, com, str, dec, num, id] = m;
      if (com) out += `<span class="tk-com">${esc(com)}</span>`;
      else if (str) out += `<span class="tk-str">${esc(str)}</span>`;
      else if (dec) out += `<span class="tk-dec">${esc(dec)}</span>`;
      else if (num) out += `<span class="tk-num">${esc(num)}</span>`;
      else if (id) {
        if (prevDef) { out += `<span class="tk-fn">${esc(id)}</span>`; prevDef = false; }
        else if (KW.has(id)) { out += `<span class="tk-kw">${id}</span>`; prevDef = id === "def" || id === "class"; }
        else if (BI.has(id)) out += `<span class="tk-bi">${id}</span>`;
        else out += esc(id);
      } else out += esc(t);
    }
    return out;
  }

  // ---------- values & objects ----------
  function val(c) {
    if (!c) return "";
    if (c[0] === "p") return esc(c[1]);
    return `<button class="ref" style="--h:${h(c[1])}" data-ref="${c[1]}">#${c[1]}</button>`;
  }
  function objHTML(o, state) {
    const cls = `obj ${o.k}${o.exc ? " exc" : ""}${state ? " " + state : ""}`;
    let head = "", body = "";
    const more = o.more ? `<div class="note">… ещё ${o.more}</div>` : "";
    const rows = (pairs) => pairs.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
    switch (o.k) {
      case "list": case "tuple": case "set":
        head = `<span class="ty">${o.t}</span><span class="sub">${o.k === "list" ? "изменяемый" : o.k === "tuple" ? "неизменяемый" : "без порядка и повторов"} · ${o.items.length + (o.more || 0)} эл.</span>`;
        body = o.items.length ? `<div class="cells">${o.items.map((c, i) => `<div class="cell">${o.k === "set" ? "" : `<span class="i">${i}</span>`}<span class="b">${val(c)}</span></div>`).join("")}</div>${more}` : `<div class="emptyc">пусто</div>`;
        break;
      case "dict":
        head = `<span class="ty">dict</span><span class="sub">ключ → значение · ${o.pairs.length + (o.more || 0)} шт.</span>`;
        body = o.pairs.length ? rows(o.pairs.map(([k, v]) => [val(k), val(v)])) + more : `<div class="emptyc">пусто</div>`;
        break;
      case "func":
        head = `<span class="ty">function ${esc(o.name)}${esc(o.sig)}</span>`;
        if (o.cells) body += rows(Object.entries(o.cells).map(([k, v]) => [`замыкание: ${esc(k)}`, val(v)]));
        if (o.wraps) body += rows([["оборачивает", val(o.wraps)]]);
        break;
      case "class":
        head = `<span class="ty">class ${esc(o.name)}${o.bases.length ? "(" + esc(o.bases.join(", ")) + ")" : ""}</span>${o.meta ? `<span class="sub">метакласс ${esc(o.meta)}</span>` : ""}`;
        body = Object.keys(o.attrs).length ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : `<div class="emptyc">нет своих атрибутов</div>`;
        break;
      case "obj":
        head = `<span class="ty">${o.exc ? "исключение" : "экземпляр"} ${esc(o.t)}</span>`;
        body = Object.keys(o.attrs).length ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : `<div class="emptyc">атрибутов нет</div>`;
        if (o.items) body += `<div class="cells">${o.items.map((c, i) => `<div class="cell"><span class="i">${i}</span><span class="b">${val(c)}</span></div>`).join("")}</div>`;
        if (o.pairs) body += rows(o.pairs.map(([k, v]) => [val(k), val(v)]));
        break;
      case "gen":
        head = `<span class="ty">generator ${esc(o.name)}</span><span class="sub">${esc(o.state)}${o.line ? " · строка " + o.line : ""}</span>`;
        if (o.locals) body = rows(Object.entries(o.locals).map(([k, v]) => [esc(k), val(v)]));
        break;
      case "prim":
        head = `<span class="ty">${esc(o.t)}</span><span class="sub">неизменяемый</span>`;
        body = `<div class="cells"><span class="cell"><span class="b">${esc(o.v)}</span></span></div>`;
        break;
      default:
        head = `<span class="ty">${esc(o.t)}</span>`;
        body = `<div class="note">${esc(o.r || "")}</div>` + (o.attrs ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : "");
    }
    return `<div class="${cls}" id="obj-${o.n}" style="--h:${h(o.n)}"><div class="oh"><span class="id">#${o.n}</span>${head}</div>${body}</div>`;
  }

  // ---------- what changed ----------
  function cellText(c) { return c ? (c[0] === "p" ? c[1] : "#" + c[1]) : ""; }
  function describeChange(L, prev, cur) {
    const tr = L.trace, out = [];
    if (!prev) return out;
    const pf = prev.f.map(i => tr.frames[i]), cf = cur.f.map(i => tr.frames[i]);
    if (cf.length > pf.length) out.push(`Вызов <b>${esc(cf[cf.length - 1].name)}</b>: создан новый кадр со своими переменными.`);
    if (cf.length < pf.length) out.push(`Кадр <b>${esc(pf[pf.length - 1].name)}</b> закрыт: его локальные имена исчезли.`);
    const n = Math.min(cf.length, pf.length);
    for (let i = 0; i < n; i++) {
      if (cf[i].name !== pf[i].name) continue;
      const pm = Object.fromEntries(pf[i].vars), cm = Object.fromEntries(cf[i].vars);
      for (const [k, v] of cf[i].vars) {
        if (!(k in pm)) out.push(`Новое имя <b>${esc(k)}</b> = ${esc(cellText(v))}`);
        else if (JSON.stringify(pm[k]) !== JSON.stringify(v)) out.push(`<b>${esc(k)}</b>: ${esc(cellText(pm[k]))} → ${esc(cellText(v))}`);
      }
      for (const k in pm) if (!(k in cm)) out.push(`Имя <b>${esc(k)}</b> удалено`);
    }
    const ph = new Map(prev.h.map(i => [tr.objs[i].n, i]));
    for (const i of cur.h) {
      const o = tr.objs[i];
      if (ph.has(o.n) && ph.get(o.n) !== i) out.push(`Объект <b>#${o.n}</b> (${esc(o.t)}) изменился внутри`);
    }
    for (const [k] of ph) if (!cur.h.some(i => tr.objs[i].n === k)) out.push(`Объект <b>#${k}</b> больше никому не нужен: его уберёт сборщик мусора`);
    if (cur.o > prev.o) out.push(`Напечатано: <b>${esc(tr.out.slice(prev.o, cur.o).trimEnd())}</b>`);
    return out.slice(0, 6);
  }

  // ---------- lesson ----------

        else { delete NOTES[L.id]; await DB.del("notes", key); }

  function completeSheet(L, res) {
    const s = L.sec, sd = s.lessons.filter(l => isDone(l.id)).length, left = s.lessons.length - sd;
    const lv = levelOf(res.xp1), st = streak();

      <div class="btns"><a href="#home" id="sh-map">К карте</a>${nextL ? `<a class="primary" href="#l${nextL.id}" id="sh-next">Дальше: ${esc(nextL.title.length > 22 ? nextL.title.slice(0, 21) + "…" : nextL.title)} →</a>` : `<a class="primary" href="#home">Готово</a>`}</div>

    (function tick(t) { const k = dur ? Math.min(1, (t - t0) / dur) : 1; g.textContent = `+${Math.round(res.gained * k)} XP`; if (k < 1) requestAnimationFrame(tick); })(t0);

  // ---------- mastery: checks gate, predictions, spaced review ----------
  const INTERVALS = [1, 3, 7, 16, 35];
  const lessonQs = L => (L.quiz ? [L.quiz] : []).concat(L.checks || []);
  const qById = qid => { const [lid, k] = qid.split("#"); const L = byId[lid]; return L ? lessonQs(L)[+k] : null; };
  const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return today(d); };
  function schedule(qid, ok) {
    S.box = S.box || {};
    const cur = S.box[qid];
    if (ok) { const b = cur ? Math.min(cur[0] + 1, INTERVALS.length) : 1; S.box[qid] = [b, addDays(INTERVALS[b - 1])]; }
    else S.box[qid] = [1, addDays(1)];
    save();
  }
  const dueList = () => Object.entries(S.box || {}).filter(([q, v]) => v[1] <= today() && qById(q)).map(([q]) => q);
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function mdBlock(text) {
    return String(text).split(/```/).map((part, i) => i % 2
      ? `<pre class="code blk">${part.replace(/^\n/, "").replace(/\n$/, "").split("\n").map(ln => `<div>${hl(ln) || " "}</div>`).join("")}</pre>`
      : part.split(/\n\s*\n/).filter(p => p.trim()).map(p => {
          const ls = p.trim().split("\n");
          if (ls.every(l => l.trim().startsWith("|"))) {
            const rows = ls.filter(l => !/^\|[\s|:-]+\|$/.test(l.trim())).map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => md(c.trim())));
            return `<div class="tbl"><table><thead><tr>${rows[0].map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
          }
          const head = [], items = [];
          let kind = null;
          ls.forEach(l => { const m = l.match(/^\s*(-|\d+\.)\s+(.*)$/); if (m) { kind = kind || (m[1] === "-" ? "ul" : "ol"); items.push(m[2]); } else if (items.length) items[items.length - 1] += " " + l.trim(); else head.push(l); });
          return (head.length ? `<p>${md(head.join(" ").trim())}</p>` : "") + (items.length ? `<${kind}>${items.map(i => `<li>${md(i)}</li>`).join("")}</${kind}>` : "");
        }).join("")).join("");
  }
  function qCard(L, q, k, opts) {
    const qid = L.id + "#" + k, ok = S.ok && S.ok[qid];
    const order = ok ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
    return `<div class="ck${ok ? " ok" : ""}" data-k="${k}"><div class="ck-q"><span class="ck-n">${ok ? "✓" : k + 1}</span><div>${md(q.q)}</div></div>${q.code ? `<pre class="code blk">${q.code.split("\n").map(ln => `<div>${hl(ln) || " "}</div>`).join("")}</pre>` : ""}
      <div class="opts">${order.map(i => `<button data-i="${i}"${ok ? " disabled" : ""} class="${ok && i === q.answer ? "right" : ""}">${md(q.options[i])}</button>`).join("")}</div>
      <div class="why"${ok ? "" : " hidden"}>${ok ? "<b>Верно.</b> " + md(q.why || "") : ""}</div></div>`;
  }
  function checksHTML(L) {
    const Q = lessonQs(L);
    if (!Q.length) return "";
    return `<section class="checks" id="checks"><div class="ck-h"><h3>Проверка понимания</h3><span id="ck-count"></span></div>
      <p class="ck-sub">Чтобы пройти урок, ответь верно на все вопросы. Ошибся — прочитай объяснение и попробуй снова: варианты перемешаются.</p>
      ${Q.map((q, k) => qCard(L, q, k)).join("")}</section>`;
  }
  function wireChecks(L) {
    const Q = lessonQs(L);
    const box = document.getElementById("checks");
    if (!box) return;
    box.addEventListener("click", e => {
      const b = e.target.closest(".opts button"), again = e.target.closest(".again");
      const card = e.target.closest(".ck");
      if (!card) return;
      const k = +card.dataset.k, q = Q[k], qid = L.id + "#" + k;
      if (again) { card.outerHTML = qCard(L, q, k); return; }
      if (!b || b.disabled) return;
      const i = +b.dataset.i, right = i === q.answer;
      S.tried = S.tried || {}; S.ok = S.ok || {};
      const first = !S.tried[qid];
      S.tried[qid] = 1;
      card.querySelectorAll(".opts button").forEach(x => x.disabled = true);
      b.classList.add(right ? "right" : "wrong");
      const why = card.querySelector(".why");
      why.hidden = false;
      if (right) {
        S.ok[qid] = 1;
        if (!S.box || !S.box[qid]) schedule(qid, true);
        card.classList.add("ok"); card.querySelector(".ck-n").textContent = "✓";
        why.innerHTML = "<b>Верно!</b> " + md(q.why || "");
        if (first) { const res = withRewards(() => award("q:" + qid)); if (res.gained) { toast(`<b>+${res.gained} XP</b><small>верно с первой попытки</small>`, `<span class="pill xp">${ICON.bolt}</span>`); announce(res); } }
      } else {
        why.innerHTML = "<b>Не совсем.</b> " + md(q.why || "") + `<div><button class="btn again">Ещё раз</button></div>`;
      }
      save();
      updateGate(L);
    });
  }
  function gateState(L) {
    const Q = lessonQs(L), okN = Q.filter((_, k) => S.ok && S.ok[L.id + "#" + k]).length;
    const ex = !L.code || !!S.aw["v:" + L.id];
    return { ex, okN, total: Q.length, ready: ex && okN === Q.length };
  }
  function updateGate(L) {
    const g = gateState(L), el = document.getElementById("gate"), btn = document.getElementById("donebtn"), cnt = document.getElementById("ck-count");
    if (cnt) cnt.textContent = `${g.okN} / ${g.total}`;
    if (!el || !btn) return;
    if (isDone(L.id)) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="gate-h">Чтобы пройти урок</div>` +
      (L.code ? `<a href="#" data-go="viz" class="${g.ex ? "ok" : ""}"><i>${g.ex ? "✓" : "1"}</i>Разбери пример до конца и ответь на вопросы в нём</a>` : "") +
      (g.total ? `<a href="#" data-go="checks" class="${g.okN === g.total ? "ok" : ""}"><i>${g.okN === g.total ? "✓" : L.code ? "2" : "1"}</i>Ответь верно на все вопросы проверки (${g.okN}/${g.total})</a>` : "");
    el.querySelectorAll("a").forEach(a => a.onclick = e => { e.preventDefault(); document.querySelector(a.dataset.go === "viz" ? ".viz" : "#checks")?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); });
    btn.disabled = !g.ready;
    btn.classList.toggle("ready", g.ready);
    btn.innerHTML = g.ready ? `Урок пройден — забрать награду<small>+${XP.l} XP</small>` : `Сначала докажи, что понял<small>осталось ${(g.ex ? 0 : 1) + (g.total - g.okN)} ${plural((g.ex ? 0 : 1) + (g.total - g.okN), "шаг", "шага", "шагов").replace(/^\d+ /, "")}</small>`;
  }

  // predictions inside the step-by-step example
  function predictPoints(L) {
    const steps = L.trace.steps, fr = L.trace.frames, cand = [], pool = new Map();
    steps.forEach(s => s.f.forEach(fi => fr[fi].vars.forEach(([k, v]) => { if (v[0] === "p") { if (!pool.has(k)) pool.set(k, new Set()); pool.get(k).add(v[1]); } })));
    const all = new Set([].concat(...[...pool.values()].map(s => [...s])));
    const kind = v => /^['"]/.test(v) ? "s" : /^-?\d/.test(v) ? "n" : v;
    for (let i = 1; i < steps.length; i++) {
      const a = steps[i - 1], b = steps[i];
      if (a.e !== "l" || b.e === "d" || a.f.length !== b.f.length) continue;
      const fa = fr[a.f[a.f.length - 1]], fb = fr[b.f[b.f.length - 1]];
      if (fa.name !== fb.name) continue;
      const pa = Object.fromEntries(fa.vars);
      for (const [k, v] of fb.vars) {
        if (v[0] !== "p" || k.startsWith("_") || JSON.stringify(pa[k]) === JSON.stringify(v)) continue;
        const val = v[1], old = pa[k] && pa[k][0] === "p" ? pa[k][1] : null;
        let ds = [];
        if (old !== null && old !== val) ds.push(old);
        [...(pool.get(k) || [])].forEach(x => { if (x !== val && !ds.includes(x)) ds.push(x); });
        shuffle([...all]).forEach(x => { if (x !== val && !ds.includes(x) && kind(x) === kind(val)) ds.push(x); });
        if (/^-?\d+$/.test(val)) [String(+val + 1), String(+val - 1), String(+val * 2)].forEach(x => { if (x !== val && !ds.includes(x)) ds.push(x); });
        if (val === "True" || val === "False") ds = [val === "True" ? "False" : "True"].concat(ds.filter(x => x !== "True" && x !== "False"));
        ds = ds.slice(0, 3);
        if (ds.length >= 1 && val.length <= 40) cand.push({ i, name: k, val, line: a.l, options: shuffle([val, ...ds]) });
        break;
      }
    }
    const picks = [];
    [.3, .7].forEach(f => {
      const target = f * steps.length;
      const c = cand.filter(c => !picks.includes(c)).sort((x, y) => Math.abs(x.i - target) - Math.abs(y.i - target))[0];
      if (c && !picks.some(p => Math.abs(p.i - c.i) < 3)) picks.push(c);
    });
    return picks.sort((a, b) => a.i - b.i);
  }

  // ---------- spaced review ----------
  let RV = null;
  function renderReview() {
    setBar("<b>Повторение</b>", true, null);
    if (!RV) { const due = shuffle(dueList()).slice(0, 8); RV = { list: due, i: 0, right: 0, answered: false }; }
    if (!RV.list.length) { app.innerHTML = `<h1 class="page-h">Повторение</h1><div class="empty-card">Сейчас нечего повторять. Вопросы из пройденных уроков вернутся сюда через 1, 3, 7, 16 и 35 дней.</div><p><a class="btn primary" href="#home">К пути</a></p>`; RV = null; return; }
    if (RV.i >= RV.list.length) {
      const res = RV;
      app.innerHTML = `<section class="rv-end"><svg class="check big" viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="39"/><path d="M22 40l11 11 23-24"/></svg><h1>Повторение готово</h1><p>Верно ${res.right} из ${res.list.length}. Правильные ответы вернутся позже, ошибки — уже завтра.</p><a class="btn primary wide" href="#home">К пути</a></section>`;
      confetti(.8); RV = null; return;
    }
    const qid = RV.list[RV.i], q = qById(qid), L = byId[qid.split("#")[0]];
    const order = shuffle(q.options.map((_, i) => i));
    app.innerHTML = `<div class="rv-top"><div class="xpbar"><i style="width:${100 * RV.i / RV.list.length}%"></i></div><span>${RV.i + 1} / ${RV.list.length}</span></div>
      <section class="ck rv sh" style="--sh:${secHue(L.si)}"><a class="rv-from" href="#l${L.id}">Урок ${L.si + 1}.${L.li + 1} · ${esc(L.title)}</a><div class="ck-q"><div>${md(q.q)}</div></div>${q.code ? `<pre class="code blk">${q.code.split("\n").map(ln => `<div>${hl(ln) || " "}</div>`).join("")}</pre>` : ""}
      <div class="opts">${order.map(i => `<button data-i="${i}">${md(q.options[i])}</button>`).join("")}</div><div class="why" hidden></div><button class="btn primary wide" id="rv-next" hidden>Дальше</button></section>`;
    app.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
      const i = +b.dataset.i, right = i === q.answer;
      app.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === q.answer) x.classList.add("right"); });
      if (!right) b.classList.add("wrong");
      schedule(qid, right);
      if (right) { RV.right++; withRewards(() => award(`r:${qid}:${today()}`)); }
      const why = app.querySelector(".why"); why.hidden = false; why.innerHTML = (right ? "<b>Верно!</b> " : "<b>Не совсем.</b> ") + md(q.why || "");
      const nx = document.getElementById("rv-next"); nx.hidden = false; nx.onclick = () => { RV.i++; renderReview(); window.scrollTo(0, 0); };
    });
  }

  function vizShell(L) {
    return `<section class="viz" aria-label="Пошаговое выполнение">
      <div class="viz-top"><span class="eyebrow">Выполнение по шагам</span><span class="vt-r"><span id="solved">${S.aw["v:" + L.id] ? `<span class="solved">✓ разобран</span>` : `<span class="solved todo">+${XP.v} XP</span>`}</span><span class="stepno" id="stepno"></span></span></div>
      <div class="stepbar"><i id="stepbar"></i></div>
      <div class="codebox" id="codebox"><div class="code" id="code"></div></div>
      <div class="narr" id="narr" aria-live="polite"></div>
      <div class="ctrl">
        <button id="b-first" aria-label="В начало">⏮</button>
        <button id="b-prev" aria-label="Шаг назад">◀</button>
        <button id="b-next" class="main hint" aria-label="Шаг вперёд">▶</button>
        <button id="b-play" aria-label="Автопроигрывание">⏵⏵</button>
        <button id="b-last" aria-label="В конец">⏭</button>
      </div>
      <div class="scrub"><input type="range" id="scrub" min="0" value="0" aria-label="Шаг"></div>
      <div class="mem" id="mem">
        <svg class="arrows" id="arrows" aria-hidden="true"></svg>
        <div><h3>Имена</h3><div class="frames" id="frames"></div></div>
        <div><h3>Объекты в памяти</h3><div class="heap" id="heap"></div></div>
      </div>
      <div class="outwrap"><h3>Вывод программы</h3><div class="out" id="out"></div><div id="errbox"></div></div>
    </section>`;
  }

  // ---------- arrows from names to objects ----------
  function drawArrows(fresh) {
    const mem = document.getElementById("mem"), svg = document.getElementById("arrows");
    if (!mem || !svg) return;
    const mr = mem.getBoundingClientRect();
    svg.setAttribute("width", mr.width); svg.setAttribute("height", mr.height);
    svg.setAttribute("viewBox", `0 0 ${mr.width} ${mr.height}`);
    const single = mem.classList.contains("single");
    let out = "";
    mem.querySelectorAll(".ref").forEach(chip => {
      const n = chip.dataset.ref, t = document.getElementById("obj-" + n);
      if (!t) return;
      const a = chip.getBoundingClientRect(), b = t.getBoundingClientRect();
      const sx = a.right - mr.left - 2, sy = a.top + a.height / 2 - mr.top;
      const ey = b.top - mr.top + 13;
      const col = `hsl(${h(+n)} var(--chip-s) var(--chip-l))`;
      let d, head;
      if (!single && !chip.closest(".heap") && b.left >= a.right) {
        const ex = b.left - mr.left - 1, dx = Math.max(18, (ex - sx) * .5);
        d = `M${sx},${sy} C${sx + dx},${sy} ${ex - dx},${ey} ${ex},${ey}`;
        head = `M${ex},${ey} l-7,-4 l0,8 z`;
      } else {
        const ex = b.right - mr.left + 1, gx = Math.min(mr.width - 4, Math.max(sx, ex) + 16);
        d = `M${sx},${sy} C${gx},${sy} ${gx},${ey} ${ex},${ey}`;
        head = `M${ex},${ey} l7,-4 l0,8 z`;
      }
      const isNew = fresh && fresh.has(n);
      out += `<path class="ln-a${isNew ? " draw" : ""}" d="${d}" stroke="${col}"/><path d="${head}" fill="${col}" opacity=".9"/>`;
    });
    svg.innerHTML = out;
    if (!reduceMotion) svg.querySelectorAll("path.draw").forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  }

  function startPlayer(L) {
    if (player && player.timer) clearInterval(player.timer);
    const tr = L.trace, steps = tr.steps, lines = L.code.split("\n");
    const st = { i: 0, timer: null, solved: new Set(), asking: null };
    player = st;
    const cps = S.aw["v:" + L.id] ? [] : predictPoints(L);
    const $ = id => document.getElementById(id);
    const codeEl = $("code");
    codeEl.innerHTML = lines.map((ln, i) => `<div class="ln" data-l="${i + 1}"><span class="ar"></span><span class="no">${i + 1}</span><span>${hl(ln) || " "}</span></div>`).join("");
    const scrub = $("scrub");
    scrub.max = steps.length - 1;
    const hasHeap = steps.some(s => s.h.length);
    if (!hasHeap) $("mem").classList.add("single");
    if (!hasHeap) $("heap").parentElement.hidden = true;

    function show(i, user) {
      st.i = Math.max(0, Math.min(steps.length - 1, i));
      const cur = steps[st.i], prev = st.i > 0 ? steps[st.i - 1] : null;
      scrub.value = st.i;
      $("stepno").textContent = `${st.i + 1} / ${steps.length}`;
      $("stepbar").style.width = (100 * st.i / Math.max(1, steps.length - 1)) + "%";
      if (st.i > 0) $("b-next").classList.remove("hint");
      codeEl.querySelectorAll(".ln").forEach(el => el.classList.remove("cur", "prev"));
      if (prev && prev.l && prev.e !== "d") codeEl.querySelector(`.ln[data-l="${prev.l}"]`)?.classList.add("prev");
      if (cur.e !== "d") {
        const el = codeEl.querySelector(`.ln[data-l="${cur.l}"]`);
        if (el) {
          el.classList.add("cur");
          const box = $("codebox");
          box.scrollTo({ top: Math.max(0, el.offsetTop - box.clientHeight / 2 + el.clientHeight), behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
      let narr = "";
      if (cur.e === "d") narr += `<div class="nx done"><i>✓</i><span><b>Программа завершилась.</b> Ниже итоговое состояние памяти.</span></div>`;
      else if (cur.e === "r") narr += `<div class="nx done"><i>↩</i><span><b>${esc(cur.fn)}()</b> завершается и возвращает <b>${esc(cellText(cur.rv))}</b>.</span></div>`;
      else if (cur.e === "x") narr += `<div class="nx bad"><i>!</i><span>Исключение <code>${esc(cur.ex)}</code> в строке ${cur.l}. Python ищет подходящий <code>except</code>.</span></div>`;
      else {
        const n = (L.narr || {})[cur.l];
        narr += `<div class="nx next"><i>${cur.l}</i><span>${n ? md(n) : `Python готовится выполнить строку ${cur.l}.`}</span></div>`;
      }
      if (st.i === 0 && cps.length) narr += `<div class="hint">В этом примере ${plural(cps.length, "остановка", "остановки", "остановок")}: перед важной строкой нужно будет предсказать результат.</div>`;
      if (st.i === 0) narr += `<div class="hint">Нажимай ▶. Жёлтая строка выполнится сейчас, зелёная только что выполнилась. Стрелки показывают, на какой объект ссылается имя.</div>`;
      const ch = describeChange(L, prev, cur);
      if (ch.length) narr += `<div class="chg">${ch.map(c => `<div>${c}</div>`).join("")}</div>`;
      $("narr").innerHTML = narr;

      const pfr = prev ? prev.f.map(k => tr.frames[k]) : [];
      const frs = cur.f.map(k => tr.frames[k]);
      const fresh = new Set();
      $("frames").innerHTML = frs.map((f, fi) => {
        const same = pfr[fi] && pfr[fi].name === f.name;
        const pm = same ? Object.fromEntries(pfr[fi].vars) : {};
        const rows = f.vars.length ? f.vars.map(([k, v]) => {
          const changed = prev && JSON.stringify(pm[k]) !== JSON.stringify(v);
          if (changed && v[0] === "r") fresh.add(String(v[1]));
          return `<div class="row${changed ? " flash" : ""}"><span class="k">${esc(k)}</span><span class="v">${val(v)}</span></div>`;
        }).join("") : `<div class="empty">пока нет имён</div>`;
        const isTop = fi === frs.length - 1;
        const ret = isTop && cur.e === "r" ? `<div class="ret">↩ return ${val(cur.rv)}</div>` : "";
        return `<div class="frame${isTop ? " top" : ""}${prev && !same ? " enter" : ""}"><div class="fh"><span>${esc(f.name)}</span>${isTop && frs.length > 1 ? "<span>●</span>" : ""}</div>${rows}${ret}</div>`;
      }).join("") || `<div class="frame"><div class="empty">пусто</div></div>`;

      const ph = new Map(prev ? prev.h.map(k => [tr.objs[k].n, k]) : []);
      $("heap").innerHTML = cur.h.length ? cur.h.map(k => {
        const o = tr.objs[k];
        const state = !prev ? "" : !ph.has(o.n) ? "enter" : ph.get(o.n) !== k ? "flash" : "";
        if (state === "enter") fresh.add(String(o.n));
        return objHTML(o, state);
      }).join("") : `<div class="frame"><div class="empty">Пока пусто. Здесь появятся списки, словари, функции, классы и объекты.</div></div>`;

      const o = tr.out.slice(0, cur.o), po = prev ? Math.min(prev.o, cur.o) : cur.o;
      $("out").innerHTML = (o ? esc(o.slice(0, po)) + `<span class="new">${esc(o.slice(po))}</span>` : "") + `<span class="cursor"></span>`;
      $("errbox").innerHTML = cur.e === "d" && tr.error ? `<div class="err">Программа упала: ${esc(tr.error)}</div>` : "";

      $("b-first").disabled = $("b-prev").disabled = st.i === 0;
      $("b-next").disabled = $("b-last").disabled = st.i === steps.length - 1;
      requestAnimationFrame(() => drawArrows(prev ? fresh : null));
      if (st.i === steps.length - 1) {
        stop();
        if (!S.aw["v:" + L.id] && cps.every(c => st.solved.has(c.i))) {
          const res = withRewards(() => award("v:" + L.id));
          $("solved").innerHTML = `<span class="solved">✓ разобран</span>`;
          toast(`<b>+${res.gained} XP</b><small>пример разобран до конца</small>`, `<span class="pill xp">${ICON.bolt}</span>`);
          announce(res);
          updateGate(L);
        }
      }
    }
    function stop() { if (st.timer) { clearInterval(st.timer); st.timer = null; } $("b-play").textContent = "⏵⏵"; }
    function ask(c) {
      st.asking = c;
      $("narr").innerHTML = `<div class="nx ask"><i>?</i><span><b>Предскажи, прежде чем идти дальше.</b> Сейчас выполнится строка ${c.line}: <code>${esc(lines[c.line - 1].trim())}</code>. Каким станет <code>${esc(c.name)}</code>?</span></div>
        <div class="popts">${c.options.map(o => `<button data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="pwhy" id="pwhy"></div>`;
      $("narr").querySelectorAll(".popts button").forEach(b => b.onclick = () => {
        if (b.dataset.v === c.val) {
          b.classList.add("right"); st.solved.add(c.i); st.asking = null;
          $("pwhy").innerHTML = "<b>Верно!</b> Проверим на шаге.";
          setTimeout(() => { if (player === st) show(c.i, true); }, 650);
        } else {
          b.classList.add("wrong"); b.disabled = true;
          $("pwhy").innerHTML = `Не то. Посмотри на строку ${c.line} и на текущие значения в блоке «Имена»: что получится, если подставить их?`;
        }
      });
      $("narr").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
    }
    function goTo(target, user) {
      if (st.asking) { const o = $("narr").querySelector(".popts"); if (o && !reduceMotion) { o.classList.remove("shake"); void o.offsetWidth; o.classList.add("shake"); } return; }
      const c = cps.find(c => !st.solved.has(c.i) && c.i > st.i && c.i <= target);
      if (c) { stop(); show(c.i - 1, user); ask(c); return; }
      show(target, user);
    }
    $("b-first").onclick = () => { stop(); st.asking = null; show(0, true); };
    $("b-prev").onclick = () => { stop(); st.asking = null; show(st.i - 1, true); };
    $("b-next").onclick = () => { stop(); goTo(st.i + 1, true); };
    $("b-last").onclick = () => { stop(); goTo(steps.length - 1, true); };
    $("b-play").onclick = () => {
      if (st.timer) return stop();
      if (st.i === steps.length - 1) show(0, true);
      $("b-play").textContent = "⏸";
      st.timer = setInterval(() => { if (player !== st || !document.body.contains(scrub)) return clearInterval(st.timer); goTo(st.i + 1, true); }, 1100);
    };
    scrub.oninput = () => { stop(); if (st.asking) { scrub.value = st.i; return; } const c = cps.find(c => !st.solved.has(c.i) && c.i <= +scrub.value); if (c) { show(c.i - 1, false); ask(c); } else show(+scrub.value, false); };
    $("mem").addEventListener("click", onRef);
    $("narr").addEventListener("click", onRef);
    st.redraw = () => drawArrows(null);
    show(0, false);
  }
  function onRef(e) {
    const b = e.target.closest(".ref");
    if (!b) return;
    const o = document.getElementById("obj-" + b.dataset.ref);
    if (!o) return;
    o.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
    o.classList.remove("pulse"); void o.offsetWidth; o.classList.add("pulse");
    setTimeout(() => o.classList.remove("pulse"), 1400);
  }
  let rz;
  let lastW = innerWidth;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
    if (player && player.redraw) player.redraw();
    document.querySelectorAll(".scene").forEach(sc => sc._relayout && sc._relayout());
    if (Math.abs(innerWidth - lastW) > 30 && document.getElementById("road")) { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }
  }, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => player && player.redraw && player.redraw());
  document.addEventListener("keydown", e => {
    if (!player || e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") document.getElementById("b-next")?.click();
    if (e.key === "ArrowLeft") document.getElementById("b-prev")?.click();
  });

  function render() {
    if (player && player.timer) { clearInterval(player.timer); player.timer = null; }
    player = null;
    if (!USER) { renderAuth(); window.scrollTo(0, 0); return; }
    const r = route();
    if (r.type === "lesson") renderLesson(r.id);
    else if (r.type === "sec") { renderSection(r.i); window.scrollTo(0, 0); }
    else if (r.type === "awards") { renderAwards(); window.scrollTo(0, 0); }
    else if (r.type === "profile") { renderProfile(); window.scrollTo(0, 0); }
    else if (r.type === "review") { renderReview(); window.scrollTo(0, 0); }
    else if (r.type === "gallery") { setBar("<b>Миры</b>", true, null); app.innerHTML = DATA.sections.map((s, si) => `<section class="world" style="--zh:${s.world.hue}"><div class="w-h"><span>Мир ${si + 1}</span><b>${esc(s.world.name)}</b></div>${sceneHTML(si)}<div class="sinfo" id="gi${si}"></div></section>`).join(""); DATA.sections.forEach((s, si) => mountScene(app, si, { info: "#gi" + si })); }
    else renderHome();
  }
  async function boot() {
    await DB.open();
    try {
      for (const [k, v] of await DB.all("users")) USERS[k] = v;
      for (const [k, v] of await DB.all("progress")) PROG[k] = v;
    } catch (e) {}
    const sid = await DB.get("meta", "session").catch(() => null);
    if (sid && USERS[sid]) await login(sid); else render();
    if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  boot();
})();
</script>
