<title>Python по схеме</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky top bar with XP + streak; home = progress dashboard + scheme tree + badges;
   section = lesson path; lesson = text + step visualizer (code / names → arrows → objects / output) + completion sheet. */
:root {
  --bg: #EDF1F4;
  --panel: #FFFFFF;
  --ink: #14202B;
  --muted: #5A6A77;
  --line: #D3DCE3;
  --accent: #2B66CF;
  --accent-ink: #FFFFFF;
  --hl: #FFD43B;
  --hl-soft: #FFF3C2;
  --prev-soft: #E3F1EA;
  --ok: #1E8F62;
  --ok-ink: #FFFFFF;
  --err: #C93F35;
  --err-soft: #FBE7E5;
  --code-bg: #F6F8FA;
  --flame: #F2701D;
  --xp: #7A4DE0;
  --grass: #E2F1DA; --grass2: #CFE7C4; --road: #74808C; --road-edge: #5C6874; --road-line: #F4F7F9; --trail: #FFD43B;
  --tree: #4FA66C; --tree2: #3C8C57; --trunk: #8A5A3B; --rock: #B7C0C8; --flower: #F27BA6;
  --shadow: 0 1px 2px rgb(20 32 43 / .06), 0 6px 20px rgb(20 32 43 / .06);
  --chip-l: 46%;
  --chip-s: 70%;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1318; --panel: #151D25; --ink: #E2E9EF; --muted: #8E9DAA; --line: #26323D;
    --accent: #6FA2FF; --accent-ink: #0D1318; --hl: #FFD43B; --hl-soft: #3A3317; --prev-soft: #16302A;
    --ok: #45C08D; --ok-ink: #0D1318; --err: #FF7B70; --err-soft: #3A1E1D; --code-bg: #10171D; --flame: #FF9248; --xp: #A889FF; --grass: #13231A; --grass2: #182C20; --road: #3B4753; --road-edge: #2A343E; --road-line: #C9D3DC; --trail: #FFD43B; --tree: #2F7A4C; --tree2: #266541; --trunk: #6B4630; --rock: #4A5560; --flower: #D9668F;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --chip-l: 68%; --chip-s: 75%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1318; --panel: #151D25; --ink: #E2E9EF; --muted: #8E9DAA; --line: #26323D;
  --accent: #6FA2FF; --accent-ink: #0D1318; --hl: #FFD43B; --hl-soft: #3A3317; --prev-soft: #16302A;
  --ok: #45C08D; --ok-ink: #0D1318; --err: #FF7B70; --err-soft: #3A1E1D; --code-bg: #10171D; --flame: #FF9248; --xp: #A889FF; --grass: #13231A; --grass2: #182C20; --road: #3B4753; --road-edge: #2A343E; --road-line: #C9D3DC; --trail: #FFD43B; --tree: #2F7A4C; --tree2: #266541; --trunk: #6B4630; --rock: #4A5560; --flower: #D9668F;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --chip-l: 68%; --chip-s: 75%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button, a { touch-action: manipulation; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.press { transition: transform .12s ease; }
.press:active { transform: scale(.97); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 9px;
  display: flex; align-items: center; gap: 10px;
}
.bar .back { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px; cursor: pointer; font-weight: 600; }
.bar .crumb { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .crumb b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--f-code); padding: 4px 9px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill svg { width: 14px; height: 14px; }
.pill.flame { color: var(--flame); }
.pill.flame.cold { color: var(--muted); }
.pill.xp { color: var(--xp); }
.pill.bump { animation: bump .6s ease; }
@keyframes bump { 30% { transform: scale(1.25); } }

main {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 72px;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font: 700 clamp(24px, 6vw, 34px)/1.15 var(--f-display); letter-spacing: -0.01em; }
h2 { font: 600 17px/1.25 var(--f-display); }
.eyebrow { font: 600 11px var(--f-code); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sh { --c: hsl(var(--sh) var(--chip-s) var(--chip-l)); --c-ink: hsl(var(--sh) var(--chip-s) calc(var(--chip-l) - 10%)); --c-soft: hsl(var(--sh) var(--chip-s) var(--chip-l) / .14); }

/* ---------- dashboard ---------- */
.dash { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); }
.lvl { position: relative; width: 76px; height: 76px; }
.lvl svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.lvl .n { position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px var(--f-display); color: var(--xp); }
.lvl .n small { display: block; font: 600 9px var(--f-code); letter-spacing: .1em; color: var(--muted); text-align: center; margin-top: -4px; }
.lvname { font: 700 19px/1.2 var(--f-display); margin: 2px 0 8px; }
.xpbar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.xpbar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--xp), var(--accent)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.xpmeta { font: 500 12px var(--f-code); color: var(--muted); margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.stat .big { display: flex; align-items: center; gap: 6px; font: 700 20px var(--f-display); font-variant-numeric: tabular-nums; }
.stat .big svg { width: 20px; height: 20px; flex: none; }
.stat small { font-size: 12px; color: var(--muted); line-height: 1.3; }
.stat.flame .big { color: var(--flame); }
.stat.flame.cold .big { color: var(--muted); }
.stat.goal .big { color: var(--ok); }
.stat.badges .big { color: var(--xp); }
.nudge { margin-top: 10px; font-size: 13.5px; background: color-mix(in srgb, var(--flame) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--flame) 35%, var(--line)); border-radius: 12px; padding: 8px 12px; }

.cta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-decoration: none; color: var(--ink); background: var(--panel); border: 1.5px solid var(--c); border-radius: 20px; padding: 14px 16px; margin-top: 14px; box-shadow: var(--shadow); }
.cta small { font: 600 11px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }
.cta .t { font: 600 17px/1.3 var(--f-body); grid-column: 1; }
.cta .go { grid-row: 1 / span 3; grid-column: 2; width: 46px; height: 46px; border-radius: 50%; background: var(--c); color: var(--panel); display: grid; place-items: center; font-size: 22px; font-weight: 700; animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 8px var(--c-soft); } }
.cta .sub { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.mini { display: flex; gap: 3px; grid-column: 1; margin-top: 4px; }
.mini i { flex: 1; height: 5px; border-radius: 99px; background: var(--line); max-width: 28px; }
.mini i.on { background: var(--c); }
.mini i.cur { background: var(--c); opacity: .45; }

.howto { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-block: 14px 22px; }
.howto div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.howto b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 2px; }
.howto .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* ---------- scheme tree ---------- */
.tree { font-family: var(--f-code); font-size: 14px; }
.tree .root { font: 700 18px var(--f-display); color: var(--accent); padding-bottom: 4px; display: flex; justify-content: space-between; align-items: baseline; }
.tree .root span { font: 500 12px var(--f-code); color: var(--muted); }
.sec { position: relative; padding-left: 26px; }
.sec::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; border-left: 2px solid var(--line); }
.sec:last-child::before { bottom: calc(100% - 26px); }
.sec > .head::before { content: ""; position: absolute; left: -19px; top: 25px; width: 16px; border-top: 2px solid var(--line); }
.sec > .head {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-block: 6px; cursor: pointer;
}
.sec.full > .head { background: var(--c-soft); border-color: var(--c); }
.sec > .head .num { font: 700 12px var(--f-code); color: var(--panel); background: var(--c); min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-variant-numeric: tabular-nums; flex: none; }
.sec > .head .nm { flex: 1; min-width: 0; font: 600 14px var(--f-body); }
.sec > .head .cnt { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sec > .head .ring { width: 26px; height: 26px; flex: none; }
.items { padding-left: 22px; margin-bottom: 6px; position: relative; }
.items a { position: relative; display: flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 5px 6px; border-radius: 8px; font-size: 13.5px; }
.items a::before { content: "├─"; color: var(--line); }
.items a:last-child::before { content: "└─"; }
.items a:hover { background: var(--c-soft); }
.items a .ok { color: var(--c-ink); font-weight: 700; }
.items a .tag { color: var(--muted); font-size: 11px; margin-left: auto; white-space: nowrap; }

/* ---------- badges ---------- */
.badges-h { display: flex; justify-content: space-between; align-items: baseline; margin: 30px 0 10px; }
.badges-h span { font: 500 12px var(--f-code); color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px 10px; text-align: center; display: grid; justify-items: center; gap: 4px; }
.badge svg { width: 48px; height: 48px; }
.badge b { font-size: 12.5px; line-height: 1.2; }
.badge small { font-size: 11px; color: var(--muted); line-height: 1.25; }
.badge.locked svg { filter: grayscale(1); opacity: .35; }
.badge.locked b { color: var(--muted); }


/* ---------- road map ---------- */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; margin: 4px 0 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.roadhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.roadhead button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 12px; font: 600 12px var(--f-code); cursor: pointer; white-space: nowrap; }
.road { position: relative; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, var(--grass), var(--grass2)); border: 1px solid var(--line); min-height: 200px; }
.road svg.map { display: block; width: 100%; height: auto; }
.rd-edge { fill: none; stroke: var(--road-edge); stroke-width: 34; stroke-linecap: round; }
.rd { fill: none; stroke: var(--road); stroke-width: 28; stroke-linecap: round; }
.rd-line { fill: none; stroke: var(--road-line); stroke-width: 2.5; stroke-dasharray: 9 11; opacity: .75; }
.rd-trail { fill: none; stroke: var(--trail); stroke-width: 7; stroke-linecap: round; opacity: .95; }
.seg-h { fill: none; stroke: none; }
.t-trunk { fill: var(--trunk); } .t-tree { fill: var(--tree); } .t-tree2 { fill: var(--tree2); } .t-rock { fill: var(--rock); } .t-flower { fill: var(--flower); } .t-flower-c { fill: var(--trail); }
.t-pole { stroke: var(--trunk); stroke-width: 3; stroke-linecap: round; }
.t-board { fill: var(--panel); stroke: var(--road-edge); stroke-width: 1.5; }
.t-sign { font: 700 9px var(--f-display); fill: var(--ink); letter-spacing: .06em; }
.t-chk1 { fill: #14202B; } .t-chk2 { fill: #FFFFFF; }
.s-ring { fill: var(--panel); stroke-width: 4; }
.s-todo { fill: var(--panel); stroke: var(--line); stroke-width: 4; }
.s-num { font: 700 13px var(--f-display); text-anchor: middle; dominant-baseline: central; }
.stop-pulse { fill: none; stroke-width: 4; animation: spulse 1.8s ease-in-out infinite; }
@keyframes spulse { 50% { stroke-opacity: .12; stroke-width: 14; } }
.h-shadow { fill: rgb(0 0 0 / .2); }
.h-leg { stroke: #2C3E57; stroke-width: 4.5; stroke-linecap: round; }
.h-pack { fill: #FFD43B; stroke: #C9A21E; stroke-width: 1; }
.h-body { fill: #3776AB; }
.h-arm { stroke: #F2C29B; stroke-width: 3.6; stroke-linecap: round; }
.h-skin { fill: #F2C29B; } .h-hair { fill: #3B2A20; } .h-eye { fill: #14202B; }
.hero-idle { animation: idle 1.6s ease-in-out infinite; }
@keyframes idle { 50% { transform: translateY(-1.5px); } }
.road .lbl2 { position: absolute; max-width: calc(56% - 20px); text-decoration: none; color: var(--ink); background: color-mix(in srgb, var(--panel) 90%, transparent); border-radius: 12px; padding: 6px 10px; box-shadow: var(--shadow); line-height: 1.25; z-index: 2; }
.road .lbl2 b { display: block; font-weight: 600; font-size: 13.5px; }
.road .lbl2 small { display: block; color: var(--muted); font: 500 11px var(--f-code); margin-top: 2px; }
.road .lbl2.r { text-align: right; }
.road .lbl2.cur { box-shadow: 0 0 0 2px var(--c), var(--shadow); }
.road .lbl2.cur small { color: var(--c-ink); }
.road .lbl2.done b::before { content: "✓ "; color: var(--c-ink); }
.road .lbl2.fin { background: var(--ink); color: var(--bg); }
.road .lbl2.fin small { color: var(--bg); opacity: .75; }
.road .herosvg { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; overflow: visible; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .18)); }
.road .stoplink { position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; z-index: 2; }
.road .bubble { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--bg); font: 600 12px var(--f-body); padding: 5px 11px; border-radius: 99px; white-space: nowrap; text-decoration: none; box-shadow: var(--shadow); z-index: 4; }

/* ---------- section path ---------- */
.sec-head { display: grid; gap: 8px; }
.sec-intro { color: var(--muted); margin: 0; max-width: 62ch; }
.secbar { display: flex; align-items: center; gap: 10px; font: 600 12px var(--f-code); color: var(--muted); }
.secbar .xpbar { flex: 1; height: 8px; }
.secbar .xpbar > i { background: var(--c); }
.path { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 0; }
.path li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; position: relative; }
.path li::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: -6px; border-left: 3px solid var(--line); }
.path li.done::before { border-color: var(--c); }
.path li:last-child::before { display: none; }
.node { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-code); background: var(--panel); border: 3px solid var(--line); color: var(--muted); position: relative; z-index: 1; }
.path li.done .node { background: var(--c); border-color: var(--c); color: var(--panel); }
.path li.next .node { border-color: var(--c); color: var(--c-ink); animation: breathe 2.4s ease-in-out infinite; }
.path a.card { display: block; text-decoration: none; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.path li.next a.card { border-color: var(--c); box-shadow: var(--shadow); }
.path .t { font-weight: 600; }
.path .c { font: 12px var(--f-code); color: var(--muted); margin-top: 2px; }
.path .lbl { font: 600 10px var(--f-code); letter-spacing: .08em; text-transform: uppercase; color: var(--c-ink); }

/* ---------- lesson ---------- */
.lhead { display: grid; gap: 8px; }
.lhead .eyebrow { color: var(--c-ink); }
.covers { display: flex; flex-wrap: wrap; gap: 6px; }
.covers span { font: 500 12px var(--f-code); background: var(--c-soft); color: var(--c-ink); border-radius: 99px; padding: 2px 9px; }
.prose { margin-top: 14px; }
.prose p { margin: 0 0 12px; max-width: 65ch; }
.prose code, .key code, .narr code, .quiz code { font: 0.9em var(--f-code); background: var(--code-bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
.analogy { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; background: var(--hl-soft); border-radius: var(--r); padding: 12px 14px; margin: 4px 0 18px; font-size: 15px; }
.analogy .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--hl); display: grid; place-items: center; }
.analogy .ic svg { width: 20px; height: 20px; }
.analogy b { font-family: var(--f-display); font-size: 11px; letter-spacing: .08em; display: block; margin-bottom: 2px; }

.viz { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-block: 8px 18px; box-shadow: var(--shadow); }
.viz-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; }
.viz-top .eyebrow { color: var(--accent); }
.viz-top .stepno { font: 600 12px var(--f-code); color: var(--muted); font-variant-numeric: tabular-nums; }
.viz-top .vt-r { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.viz-top .solved.todo { color: var(--xp); background: color-mix(in srgb, var(--xp) 12%, var(--panel)); }
.viz-top .solved { font: 600 11px var(--f-code); color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); border-radius: 99px; padding: 2px 8px; }
.stepbar { height: 4px; background: var(--line); }
.stepbar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); transition: width .3s ease; }
.codebox { max-height: 42vh; overflow: auto; background: var(--code-bg); border-bottom: 1px solid var(--line); -webkit-overflow-scrolling: touch; }
.code { font: 13px/1.6 var(--f-code); padding: 8px 0; min-width: max-content; }
.ln { display: grid; grid-template-columns: 22px 34px auto; padding-right: 14px; white-space: pre; transition: background .25s ease; }
.ln .ar { text-align: center; font-weight: 700; }
.ln .no { color: var(--muted); text-align: right; padding-right: 10px; opacity: .7; user-select: none; }
.ln.cur { background: var(--hl-soft); box-shadow: inset 3px 0 0 var(--hl); }
.ln.cur .ar { color: var(--ink); }
.ln.cur .ar::before { content: "➜"; }
.ln.prev { background: var(--prev-soft); }
.ln.prev .ar { color: var(--ok); }
.ln.prev .ar::before { content: "✓"; }
.ln.cur.prev .ar::before { content: "➜"; }

<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const app = document.getElementById("app");
  const LESSONS = [];

  // ---------- progress & rewards (stored in this browser only) ----------

  const XP = { l: 20, q: 10, v: 5 };
  const LEVELS = [[0, "Новичок"], [60, "Исследователь"], [150, "Ученик"], [300, "Кодер"], [500, "Питонист"], [800, "Инженер"], [1200, "Архитектор"], [1700, "Мастер Python"], [2400, "Гуру"]];

    const raw = localStorage.getItem("pyscheme-v2");
    if (raw) S = Object.assign(S, JSON.parse(raw));

  const ACH = [

    { id: "five", t: "Разогрев", d: "5 уроков", g: "5", ok: () => doneCount() >= 5 },
    { id: "sec", t: "Раздел закрыт", d: "Пройди целый раздел", g: "§", ok: () => DATA.sections.some(secDone) },
    { id: "watch", t: "Наблюдатель", d: "Досмотри 10 примеров до конца", g: "▶", ok: () => Object.keys(S.aw).filter(k => k[0] === "v").length >= 10 },
    { id: "quiz", t: "Меткий глаз", d: "5 тестов с первой попытки", g: "◎", ok: () => Object.keys(S.aw).filter(k => k[0] === "q").length >= 5 },
    { id: "s3", t: "Три дня подряд", d: "Серия 3 дня", g: "3", ok: () => streak().n >= 3 },
    { id: "s7", t: "Неделя кода", d: "Серия 7 дней", g: "7", ok: () => streak().n >= 7 },
    { id: "half", t: "Полпути", d: "Половина всех уроков", g: "½", ok: () => doneCount() >= Math.ceil(LESSONS.length / 2) },
    { id: "oop", t: "ООП-мастер", d: "Разделы 6–10", g: "{}", ok: () => [5, 6, 7, 8, 9].every(i => DATA.sections[i] && secDone(DATA.sections[i])) },
    { id: "deep", t: "Под капотом", d: "Разделы 11–14 и 23", g: "⚙", ok: () => [10, 11, 12, 13, 22].every(i => DATA.sections[i] && secDone(DATA.sections[i])) },
    { id: "all", t: "Вся схема", d: "Все уроки пройдены", g: "★", ok: () => doneCount() === LESSONS.length },
  ];
  const unlocked = () => new Set(ACH.filter(a => a.ok()).map(a => a.id));

    medal: `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2h4l1.5 4L14 2h3l-3.3 7.1A6.5 6.5 0 1 1 9.9 9z" opacity=".55"/><circle cx="12" cy="15" r="5.5" fill="currentColor"/></svg>`,

  // ---------- section path ----------
  function renderSection(si) {
    const s = DATA.sections[si];
    if (!s) return renderHome();
    setBar(`<b>${si + 1}. ${esc(s.title)}</b>`, true);
    const d = s.lessons.filter(l => isDone(l.id)).length;
    const next = s.lessons.find(l => !isDone(l.id));
    let html = `<div class="sh" style="--sh:${secHue(si)}"><div class="sec-head"><div class="eyebrow" style="color:var(--c-ink)">Раздел ${si + 1} из ${DATA.sections.length}</div><h1>${esc(s.title)}</h1>`;
    if (s.intro) html += `<p class="sec-intro">${md(s.intro)}</p>`;
    html += `<div class="secbar"><div class="xpbar"><i style="width:${100 * d / s.lessons.length}%"></i></div>${d}/${s.lessons.length}</div></div>
      <div class="roadhead" style="margin-top:18px"><h2>Путь раздела</h2><button id="findme">Где я?</button></div><div class="road" id="road"></div></div>`;
    app.innerHTML = html;
    const ni = next ? s.lessons.indexOf(next) : s.lessons.length;
    const nextGlobal = next || LESSONS.find(l => !isDone(l.id)) || s.lessons[0];
    const rd = buildRoad(document.getElementById("road"), {
      key: "s" + si, pos: ni, allDone: !next, follow: false, cont: "#l" + nextGlobal.id, finish: si + 1 < DATA.sections.length ? "Дальше: " + DATA.sections[si + 1].title : "Конец схемы",
      stops: s.lessons.map((l, li) => ({ title: l.title, sub: l === next ? `следующий · +${XP.l} XP` : l.covers.join(" · "), href: "#l" + l.id, hue: secHue(si), num: li + 1, state: isDone(l.id) ? "done" : l === next ? "cur" : "" })),
    });
    document.getElementById("findme").onclick = rd.find;
  }

  // ---------- syntax highlight ----------
  const KW = new Set("False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
  const BI = new Set("print len range list dict set tuple int float str bool type id isinstance issubclass super object iter next open enumerate zip map filter sorted sum min max abs repr hasattr getattr setattr callable vars property classmethod staticmethod any all round input reversed frozenset Exception ValueError TypeError KeyError IndexError ZeroDivisionError StopIteration AttributeError NotImplementedError RuntimeError".split(" "));
  function hl(line) {
    const re = /(#.*$)|("""|'''|f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(@[\w.]+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
    let out = "", m, prevDef = false;
    while ((m = re.exec(line))) {
      const [t, com, str, dec, num, id] = m;
      if (com) out += `<span class="tk-com">${esc(com)}</span>`;
      else if (str) out += `<span class="tk-str">${esc(str)}</span>`;
      else if (dec) out += `<span class="tk-dec">${esc(dec)}</span>`;
      else if (num) out += `<span class="tk-num">${esc(num)}</span>`;
      else if (id) {
        if (prevDef) { out += `<span class="tk-fn">${esc(id)}</span>`; prevDef = false; }
        else if (KW.has(id)) { out += `<span class="tk-kw">${id}</span>`; prevDef = id === "def" || id === "class"; }
        else if (BI.has(id)) out += `<span class="tk-bi">${id}</span>`;
        else out += esc(id);
      } else out += esc(t);
    }
    return out;
  }

  // ---------- values & objects ----------
  function val(c) {
    if (!c) return "";
    if (c[0] === "p") return esc(c[1]);
    return `<button class="ref" style="--h:${h(c[1])}" data-ref="${c[1]}">#${c[1]}</button>`;
  }
  function objHTML(o, state) {
    const cls = `obj ${o.k}${o.exc ? " exc" : ""}${state ? " " + state : ""}`;
    let head = "", body = "";
    const more = o.more ? `<div class="note">… ещё ${o.more}</div>` : "";
    const rows = (pairs) => pairs.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
    switch (o.k) {
      case "list": case "tuple": case "set":
        head = `<span class="ty">${o.t}</span><span class="sub">${o.k === "list" ? "изменяемый" : o.k === "tuple" ? "неизменяемый" : "без порядка и повторов"} · ${o.items.length + (o.more || 0)} эл.</span>`;
        body = o.items.length ? `<div class="cells">${o.items.map((c, i) => `<div class="cell">${o.k === "set" ? "" : `<span class="i">${i}</span>`}<span class="b">${val(c)}</span></div>`).join("")}</div>${more}` : `<div class="emptyc">пусто</div>`;
        break;
      case "dict":
        head = `<span class="ty">dict</span><span class="sub">ключ → значение · ${o.pairs.length + (o.more || 0)} шт.</span>`;
        body = o.pairs.length ? rows(o.pairs.map(([k, v]) => [val(k), val(v)])) + more : `<div class="emptyc">пусто</div>`;
        break;
      case "func":
        head = `<span class="ty">function ${esc(o.name)}${esc(o.sig)}</span>`;
        if (o.cells) body += rows(Object.entries(o.cells).map(([k, v]) => [`замыкание: ${esc(k)}`, val(v)]));
        if (o.wraps) body += rows([["оборачивает", val(o.wraps)]]);
        break;
      case "class":
        head = `<span class="ty">class ${esc(o.name)}${o.bases.length ? "(" + esc(o.bases.join(", ")) + ")" : ""}</span>${o.meta ? `<span class="sub">метакласс ${esc(o.meta)}</span>` : ""}`;
        body = Object.keys(o.attrs).length ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : `<div class="emptyc">нет своих атрибутов</div>`;
        break;
      case "obj":
        head = `<span class="ty">${o.exc ? "исключение" : "экземпляр"} ${esc(o.t)}</span>`;
        body = Object.keys(o.attrs).length ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : `<div class="emptyc">атрибутов нет</div>`;
        if (o.items) body += `<div class="cells">${o.items.map((c, i) => `<div class="cell"><span class="i">${i}</span><span class="b">${val(c)}</span></div>`).join("")}</div>`;
        if (o.pairs) body += rows(o.pairs.map(([k, v]) => [val(k), val(v)]));
        break;
      case "gen":
        head = `<span class="ty">generator ${esc(o.name)}</span><span class="sub">${esc(o.state)}${o.line ? " · строка " + o.line : ""}</span>`;
        if (o.locals) body = rows(Object.entries(o.locals).map(([k, v]) => [esc(k), val(v)]));
        break;
      case "prim":
        head = `<span class="ty">${esc(o.t)}</span><span class="sub">неизменяемый</span>`;
        body = `<div class="cells"><span class="cell"><span class="b">${esc(o.v)}</span></span></div>`;
        break;
      default:
        head = `<span class="ty">${esc(o.t)}</span>`;
        body = `<div class="note">${esc(o.r || "")}</div>` + (o.attrs ? rows(Object.entries(o.attrs).map(([k, v]) => [esc(k), val(v)])) : "");
    }
    return `<div class="${cls}" id="obj-${o.n}" style="--h:${h(o.n)}"><div class="oh"><span class="id">#${o.n}</span>${head}</div>${body}</div>`;
  }

  // ---------- what changed ----------
  function cellText(c) { return c ? (c[0] === "p" ? c[1] : "#" + c[1]) : ""; }
  function describeChange(L, prev, cur) {
    const tr = L.trace, out = [];
    if (!prev) return out;
    const pf = prev.f.map(i => tr.frames[i]), cf = cur.f.map(i => tr.frames[i]);
    if (cf.length > pf.length) out.push(`Вызов <b>${esc(cf[cf.length - 1].name)}</b>: создан новый кадр со своими переменными.`);
    if (cf.length < pf.length) out.push(`Кадр <b>${esc(pf[pf.length - 1].name)}</b> закрыт: его локальные имена исчезли.`);
    const n = Math.min(cf.length, pf.length);
    for (let i = 0; i < n; i++) {
      if (cf[i].name !== pf[i].name) continue;
      const pm = Object.fromEntries(pf[i].vars), cm = Object.fromEntries(cf[i].vars);
      for (const [k, v] of cf[i].vars) {
        if (!(k in pm)) out.push(`Новое имя <b>${esc(k)}</b> = ${esc(cellText(v))}`);
        else if (JSON.stringify(pm[k]) !== JSON.stringify(v)) out.push(`<b>${esc(k)}</b>: ${esc(cellText(pm[k]))} → ${esc(cellText(v))}`);
      }
      for (const k in pm) if (!(k in cm)) out.push(`Имя <b>${esc(k)}</b> удалено`);
    }
    const ph = new Map(prev.h.map(i => [tr.objs[i].n, i]));
    for (const i of cur.h) {
      const o = tr.objs[i];
      if (ph.has(o.n) && ph.get(o.n) !== i) out.push(`Объект <b>#${o.n}</b> (${esc(o.t)}) изменился внутри`);
    }
    for (const [k] of ph) if (!cur.h.some(i => tr.objs[i].n === k)) out.push(`Объект <b>#${k}</b> больше никому не нужен: его уберёт сборщик мусора`);
    if (cur.o > prev.o) out.push(`Напечатано: <b>${esc(tr.out.slice(prev.o, cur.o).trimEnd())}</b>`);
    return out.slice(0, 6);
  }

  // ---------- lesson ----------
  let player = null;
  function renderLesson(id) {
    const L = byId[id];
    const s = L.sec;
    setBar(`${L.si + 1}. ${esc(s.title)} · <b>${esc(L.title)}</b>`, true);
    const idx = LESSONS.indexOf(L);
    const prevL = LESSONS[idx - 1], nextL = LESSONS[idx + 1];
    let html = `<div class="sh" style="--sh:${secHue(L.si)}"><div class="lhead"><div class="eyebrow">Урок ${L.si + 1}.${L.li + 1} · ${esc(s.title)}</div><h1>${esc(L.title)}</h1>
      <div class="covers">${L.covers.map(c => `<span>${esc(c)}</span>`).join("")}</div></div>
      <div class="prose">${L.text.split(/\n\s*\n/).map(p => `<p>${md(p.trim())}</p>`).join("")}</div>`;
    if (L.analogy) html += `<div class="analogy"><div class="ic">${ICON.bulb}</div><div><b>ПРЕДСТАВЬ</b>${md(L.analogy)}</div></div>`;
    if (L.files_show) html += Object.entries(L.files_show).map(([fn, src]) => `<div class="file"><div class="fn">файл ${esc(fn)} <span>(лежит рядом, выполняется при import)</span></div><div class="code">${src.replace(/\n$/, "").split("\n").map((ln, i) => `<div class="ln"><span class="ar"></span><span class="no">${i + 1}</span><span>${hl(ln) || " "}</span></div>`).join("")}</div></div>`).join("");
    if (L.code) html += vizShell(L);
    if (L.key && L.key.length) html += `<div class="key"><h3>Запомни</h3><ul>${L.key.map(k => `<li>${md(k)}</li>`).join("")}</ul></div>`;
    if (L.quiz) html += quizHTML(L);
    const dn = isDone(L.id);
    html += `<button class="done-btn ${dn ? "on" : ""}" id="donebtn">${dn ? "✓ Урок пройден<small>нажми, чтобы снять отметку</small>" : `Я понял — урок пройден<small>+${XP.l} XP</small>`}</button>
      <nav class="pn">${prevL ? `<a class="press" href="#l${prevL.id}"><small>← назад</small><span>${esc(prevL.title)}</span></a>` : ""}${nextL ? `<a class="nx press" href="#l${nextL.id}"><small>дальше →</small><span>${esc(nextL.title)}</span></a>` : ""}</nav></div>`;
    app.innerHTML = html;
    document.getElementById("donebtn").addEventListener("click", () => {
      if (isDone(L.id)) { delete S.aw["l:" + L.id]; save(); refreshPills(false); renderLesson(id); return; }
      const res = withRewards(() => award("l:" + L.id));
      renderLesson(id);
      completeSheet(L, res);
    });
    if (L.quiz) wireQuiz(L);
    if (L.code) startPlayer(L);
    window.scrollTo(0, 0);
  }

  function completeSheet(L, res) {
    const s = L.sec, sd = s.lessons.filter(l => isDone(l.id)).length, left = s.lessons.length - sd;
    const lv = levelOf(res.xp1), st = streak();
    const idx = LESSONS.indexOf(L);
    const nextL = LESSONS.slice(idx + 1).find(l => !isDone(l.id)) || LESSONS[idx + 1];
    const v = document.createElement("div");
    v.className = "veil";
    v.innerHTML = `<div class="sheet sh" role="dialog" aria-modal="true" aria-label="Урок пройден" style="--sh:${secHue(L.si)}">
      <svg class="check" viewBox="0 0 78 78" aria-hidden="true"><circle cx="39" cy="39" r="39"/><path d="M22 40l11 11 23-24"/></svg>
      <h2>${left === 0 ? "Раздел пройден целиком!" : "Урок пройден!"}</h2>
      <p class="say">${PRAISE[(Math.random() * PRAISE.length) | 0]}</p>
      <div class="gain" id="gain">+0 XP</div>
      ${res.levelUp ? `<div class="lvup">Новый уровень ${lv.n}<b>${esc(lv.name)}</b></div>` : ""}
      <div class="lvline"><div><span>Ур. ${lv.n} · ${esc(lv.name)}</span><span>${res.xp1}${lv.next ? " / " + lv.hi : ""} XP</span></div><div class="xpbar"><i id="sheetbar" style="width:${res.levelUp ? 0 : Math.round(levelOf(res.xp0).frac * 100)}%"></i></div></div>
      <div class="secp"><b>${esc(s.title)}</b>: ${sd} из ${s.lessons.length}${left ? ` — осталось ${plural(left, "урок", "урока", "уроков")}` : " — все уроки!"}<div class="mini">${s.lessons.map(l => `<i class="${isDone(l.id) ? "on" : ""}"></i>`).join("")}</div></div>
      ${st.n ? `<div class="streakline">${plural(st.n, "день", "дня", "дней")} подряд · сегодня ${Math.min(todayLessons(), DAILY_GOAL)}/${DAILY_GOAL}${todayLessons() === DAILY_GOAL ? " — цель дня выполнена!" : ""}</div>` : ""}
      <div class="btns"><a href="#home" id="sh-map">К карте</a>${nextL ? `<a class="primary" href="#l${nextL.id}" id="sh-next">Дальше: ${esc(nextL.title.length > 22 ? nextL.title.slice(0, 21) + "…" : nextL.title)} →</a>` : `<a class="primary" href="#home">Готово</a>`}</div>
    </div>`;
    document.body.appendChild(v);
    const close = () => v.remove();
    v.addEventListener("click", e => { if (e.target === v || e.target.closest("a")) close(); });
    window.addEventListener("hashchange", close, { once: true });
    confetti(left === 0 || res.levelUp ? 1.6 : 1);
    // count-up XP and fill bar
    const g = v.querySelector("#gain"), t0 = performance.now(), dur = reduceMotion ? 0 : 700;
    (function tick(t) { const k = dur ? Math.min(1, (t - t0) / dur) : 1; g.textContent = `+${Math.round(res.gained * k)} XP`; if (k < 1) requestAnimationFrame(tick); })(t0);
    setTimeout(() => { const b = v.querySelector("#sheetbar"); if (b) b.style.width = Math.round(lv.frac * 100) + "%"; }, 120);
    announce(res);
  }

  function quizHTML(L) {
    const q = L.quiz, gotIt = S.aw["q:" + L.id];
    return `<div class="quiz"><h3>Проверь себя <span>${gotIt ? "✓ +" + XP.q + " XP получено" : "+" + XP.q + " XP с первой попытки"}</span></h3><p class="q">${md(q.q)}</p><div class="opts">${q.options.map((o, i) => `<button data-i="${i}">${md(o)}</button>`).join("")}</div><div class="why" id="why" hidden></div></div>`;
  }
  function wireQuiz(L) {
    const q = L.quiz;
    let first = !S.tried[L.id];
    app.querySelectorAll(".quiz .opts button").forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.i, right = i === q.answer;
      app.querySelectorAll(".quiz .opts button").forEach(x => x.classList.remove("right", "wrong"));
      b.classList.add(right ? "right" : "wrong");
      if (right) b.classList.add("right"); else setTimeout(() => app.querySelector(`.quiz .opts button[data-i="${q.answer}"]`)?.classList.add("right"), 450);
      const why = document.getElementById("why");
      why.hidden = false;
      why.innerHTML = (right ? "<b>Верно!</b> " : "<b>Не совсем.</b> ") + md(q.why || "");
      if (first) {
        first = false; S.tried[L.id] = 1; save();
        if (right) {
          const res = withRewards(() => award("q:" + L.id));
          if (res.gained) { toast(`<b>+${res.gained} XP</b><small>верно с первой попытки</small>`, `<span class="pill xp">${ICON.bolt}</span>`); confetti(.4); announce(res); }
        }
      }
    }));
  }

  function vizShell(L) {
    return `<section class="viz" aria-label="Пошаговое выполнение">
      <div class="viz-top"><span class="eyebrow">Выполнение по шагам</span><span class="vt-r"><span id="solved">${S.aw["v:" + L.id] ? `<span class="solved">✓ разобран</span>` : `<span class="solved todo">+${XP.v} XP</span>`}</span><span class="stepno" id="stepno"></span></span></div>
      <div class="stepbar"><i id="stepbar"></i></div>
      <div class="codebox" id="codebox"><div class="code" id="code"></div></div>
      <div class="narr" id="narr" aria-live="polite"></div>
      <div class="ctrl">
        <button id="b-first" aria-label="В начало">⏮</button>
        <button id="b-prev" aria-label="Шаг назад">◀</button>
        <button id="b-next" class="main hint" aria-label="Шаг вперёд">▶</button>
        <button id="b-play" aria-label="Автопроигрывание">⏵⏵</button>
        <button id="b-last" aria-label="В конец">⏭</button>
      </div>
      <div class="scrub"><input type="range" id="scrub" min="0" value="0" aria-label="Шаг"></div>
      <div class="mem" id="mem">
        <svg class="arrows" id="arrows" aria-hidden="true"></svg>
        <div><h3>Имена</h3><div class="frames" id="frames"></div></div>
        <div><h3>Объекты в памяти</h3><div class="heap" id="heap"></div></div>
      </div>
      <div class="outwrap"><h3>Вывод программы</h3><div class="out" id="out"></div><div id="errbox"></div></div>
    </section>`;
  }

  // ---------- arrows from names to objects ----------
  function drawArrows(fresh) {
    const mem = document.getElementById("mem"), svg = document.getElementById("arrows");
    if (!mem || !svg) return;
    const mr = mem.getBoundingClientRect();
    svg.setAttribute("width", mr.width); svg.setAttribute("height", mr.height);
    svg.setAttribute("viewBox", `0 0 ${mr.width} ${mr.height}`);
    const single = mem.classList.contains("single");
    let out = "";
    mem.querySelectorAll(".ref").forEach(chip => {
      const n = chip.dataset.ref, t = document.getElementById("obj-" + n);
      if (!t) return;
      const a = chip.getBoundingClientRect(), b = t.getBoundingClientRect();
      const sx = a.right - mr.left - 2, sy = a.top + a.height / 2 - mr.top;
      const ey = b.top - mr.top + 13;
      const col = `hsl(${h(+n)} var(--chip-s) var(--chip-l))`;
      let d, head;
      if (!single && !chip.closest(".heap") && b.left >= a.right) {
        const ex = b.left - mr.left - 1, dx = Math.max(18, (ex - sx) * .5);
        d = `M${sx},${sy} C${sx + dx},${sy} ${ex - dx},${ey} ${ex},${ey}`;
        head = `M${ex},${ey} l-7,-4 l0,8 z`;
      } else {
        const ex = b.right - mr.left + 1, gx = Math.min(mr.width - 4, Math.max(sx, ex) + 16);
        d = `M${sx},${sy} C${gx},${sy} ${gx},${ey} ${ex},${ey}`;
        head = `M${ex},${ey} l7,-4 l0,8 z`;
      }
      const isNew = fresh && fresh.has(n);
      out += `<path class="ln-a${isNew ? " draw" : ""}" d="${d}" stroke="${col}"/><path d="${head}" fill="${col}" opacity=".9"/>`;
    });
    svg.innerHTML = out;
    if (!reduceMotion) svg.querySelectorAll("path.draw").forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });
  }

  function startPlayer(L) {
    if (player && player.timer) clearInterval(player.timer);
    const tr = L.trace, steps = tr.steps, lines = L.code.split("\n");
    const st = { i: 0, timer: null };
    player = st;
    const $ = id => document.getElementById(id);
    const codeEl = $("code");
    codeEl.innerHTML = lines.map((ln, i) => `<div class="ln" data-l="${i + 1}"><span class="ar"></span><span class="no">${i + 1}</span><span>${hl(ln) || " "}</span></div>`).join("");
    const scrub = $("scrub");
    scrub.max = steps.length - 1;
    const hasHeap = steps.some(s => s.h.length);
    if (!hasHeap) $("mem").classList.add("single");
    if (!hasHeap) $("heap").parentElement.hidden = true;

    function show(i, user) {
      st.i = Math.max(0, Math.min(steps.length - 1, i));
      const cur = steps[st.i], prev = st.i > 0 ? steps[st.i - 1] : null;
      scrub.value = st.i;
      $("stepno").textContent = `${st.i + 1} / ${steps.length}`;
      $("stepbar").style.width = (100 * st.i / Math.max(1, steps.length - 1)) + "%";
      if (st.i > 0) $("b-next").classList.remove("hint");
      codeEl.querySelectorAll(".ln").forEach(el => el.classList.remove("cur", "prev"));
      if (prev && prev.l && prev.e !== "d") codeEl.querySelector(`.ln[data-l="${prev.l}"]`)?.classList.add("prev");
      if (cur.e !== "d") {
        const el = codeEl.querySelector(`.ln[data-l="${cur.l}"]`);
        if (el) {
          el.classList.add("cur");
          const box = $("codebox");
          box.scrollTo({ top: Math.max(0, el.offsetTop - box.clientHeight / 2 + el.clientHeight), behavior: reduceMotion ? "auto" : "smooth" });
        }
      }
      let narr = "";
      if (cur.e === "d") narr += `<div class="nx done"><i>✓</i><span><b>Программа завершилась.</b> Ниже итоговое состояние памяти.</span></div>`;
      else if (cur.e === "r") narr += `<div class="nx done"><i>↩</i><span><b>${esc(cur.fn)}()</b> завершается и возвращает <b>${esc(cellText(cur.rv))}</b>.</span></div>`;
      else if (cur.e === "x") narr += `<div class="nx bad"><i>!</i><span>Исключение <code>${esc(cur.ex)}</code> в строке ${cur.l}. Python ищет подходящий <code>except</code>.</span></div>`;
      else {
        const n = (L.narr || {})[cur.l];
        narr += `<div class="nx next"><i>${cur.l}</i><span>${n ? md(n) : `Python готовится выполнить строку ${cur.l}.`}</span></div>`;
      }
      if (st.i === 0) narr += `<div class="hint">Нажимай ▶ и следи, как меняются имена, стрелки и объекты.</div>`;
      const ch = describeChange(L, prev, cur);
      if (ch.length) narr += `<div class="chg">${ch.map(c => `<div>${c}</div>`).join("")}</div>`;
      $("narr").innerHTML = narr;

      const pfr = prev ? prev.f.map(k => tr.frames[k]) : [];
      const frs = cur.f.map(k => tr.frames[k]);
      const fresh = new Set();
      $("frames").innerHTML = frs.map((f, fi) => {
        const same = pfr[fi] && pfr[fi].name === f.name;
        const pm = same ? Object.fromEntries(pfr[fi].vars) : {};
        const rows = f.vars.length ? f.vars.map(([k, v]) => {
          const changed = prev && JSON.stringify(pm[k]) !== JSON.stringify(v);
          if (changed && v[0] === "r") fresh.add(String(v[1]));
          return `<div class="row${changed ? " flash" : ""}"><span class="k">${esc(k)}</span><span class="v">${val(v)}</span></div>`;
        }).join("") : `<div class="empty">пока нет имён</div>`;
        const isTop = fi === frs.length - 1;
        const ret = isTop && cur.e === "r" ? `<div class="ret">↩ return ${val(cur.rv)}</div>` : "";
        return `<div class="frame${isTop ? " top" : ""}${prev && !same ? " enter" : ""}"><div class="fh"><span>${esc(f.name)}</span>${isTop && frs.length > 1 ? "<span>●</span>" : ""}</div>${rows}${ret}</div>`;
      }).join("") || `<div class="frame"><div class="empty">пусто</div></div>`;

      const ph = new Map(prev ? prev.h.map(k => [tr.objs[k].n, k]) : []);
      $("heap").innerHTML = cur.h.length ? cur.h.map(k => {
        const o = tr.objs[k];
        const state = !prev ? "" : !ph.has(o.n) ? "enter" : ph.get(o.n) !== k ? "flash" : "";
        if (state === "enter") fresh.add(String(o.n));
        return objHTML(o, state);
      }).join("") : `<div class="frame"><div class="empty">Пока пусто. Здесь появятся списки, словари, функции, классы и объекты.</div></div>`;

      const o = tr.out.slice(0, cur.o), po = prev ? Math.min(prev.o, cur.o) : cur.o;
      $("out").innerHTML = (o ? esc(o.slice(0, po)) + `<span class="new">${esc(o.slice(po))}</span>` : "") + `<span class="cursor"></span>`;
      $("errbox").innerHTML = cur.e === "d" && tr.error ? `<div class="err">Программа упала: ${esc(tr.error)}</div>` : "";

      $("b-first").disabled = $("b-prev").disabled = st.i === 0;
      $("b-next").disabled = $("b-last").disabled = st.i === steps.length - 1;
      requestAnimationFrame(() => drawArrows(prev ? fresh : null));
      if (st.i === steps.length - 1) {
        stop();
        if (user && !S.aw["v:" + L.id]) {
          const res = withRewards(() => award("v:" + L.id));
          $("solved").innerHTML = `<span class="solved">✓ разобран</span>`;
          toast(`<b>+${res.gained} XP</b><small>пример разобран до конца</small>`, `<span class="pill xp">${ICON.bolt}</span>`);
          announce(res);
        }
      }
    }
    function stop() { if (st.timer) { clearInterval(st.timer); st.timer = null; } $("b-play").textContent = "⏵⏵"; }
    $("b-first").onclick = () => { stop(); show(0, true); };
    $("b-prev").onclick = () => { stop(); show(st.i - 1, true); };
    $("b-next").onclick = () => { stop(); show(st.i + 1, true); };
    $("b-last").onclick = () => { stop(); show(steps.length - 1, false); };
    $("b-play").onclick = () => {
      if (st.timer) return stop();
      if (st.i === steps.length - 1) show(0, true);
      $("b-play").textContent = "⏸";
      st.timer = setInterval(() => { if (player !== st || !document.body.contains(scrub)) return clearInterval(st.timer); show(st.i + 1, true); }, 1100);
    };
    scrub.oninput = () => { stop(); show(+scrub.value, false); };
    $("mem").addEventListener("click", onRef);
    $("narr").addEventListener("click", onRef);
    st.redraw = () => drawArrows(null);
    show(0, false);
  }
  function onRef(e) {
    const b = e.target.closest(".ref");
    if (!b) return;
    const o = document.getElementById("obj-" + b.dataset.ref);
    if (!o) return;
    o.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
    o.classList.remove("pulse"); void o.offsetWidth; o.classList.add("pulse");
    setTimeout(() => o.classList.remove("pulse"), 1400);
  }
  let rz;
  let lastW = innerWidth;
  window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
    if (player && player.redraw) player.redraw();
    if (Math.abs(innerWidth - lastW) > 30 && document.getElementById("road")) { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }
  }, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => player && player.redraw && player.redraw());
  document.addEventListener("keydown", e => {
    if (!player || e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") document.getElementById("b-next")?.click();
    if (e.key === "ArrowLeft") document.getElementById("b-prev")?.click();
  });

  function render() {
    if (player && player.timer) { clearInterval(player.timer); player.timer = null; }
    player = null;
    const r = route();
    if (r.type === "lesson") renderLesson(r.id);
    else if (r.type === "sec") { renderSection(r.i); window.scrollTo(0, 0); }
    else renderHome();
  }
  render();
})();
</script>
